ction":"かくじん。人はじん。","why":"かくにんの「にん」と「じん」が違う。意味も「各人」はそれぞれの人。","example":"各人の意見。","zh":"各人的意見。"},{"text":"確忍","meaning":"一般的な語ではない。","connection":"忍はにんとも読むが、かくにんの語は認。","why":"時間を確忍するとは言わない。","example":"確認（かくにん）。","zh":"認。"}],"level":"N4"},{"id":"v65","kind":"vocab","point":"経験（漢字）","group":"kanji","difficulty":3,"stem":"初めて自分（じぶん）で料理（りょうり）した＿＿（けいけん）は忘（わす）れられない。","gloss":"第一次自己做菜的經驗忘不了。選漢字。","answer":"経験","options":[{"text":"経験","meaning":"親身經歷過的事。","connection":"けいけん。経＋験。","why":"自分でした体験の内容は経験。讀音けいけん。","example":"いい経験になった。","zh":"成了很好的經驗。"},{"text":"経歴","meaning":"學歷、工作履歷。","connection":"けいれき。歴はれき。","why":"けいけんではない。一度料理した話は経歴ではない。","example":"職歴（しょくれき）。","zh":"工作經歷讀れき。"},{"text":"敬験","meaning":"一般的な語ではない。","connection":"敬はけいでも、けいけんはこの字ではない。","why":"料理した敬験とは書かない。","example":"尊敬（そんけい）。","zh":"敬是別的詞。"},{"text":"経検","meaning":"験の字が違う。","connection":"検はけんでも、経験の字は験。","why":"けいけんの漢字は経験。","example":"経験（けいけん）。","zh":"験。"}],"level":"N3"},{"id":"v66","kind":"vocab","point":"説明（漢字）","group":"kanji","difficulty":2,"stem":"係（かかり）の人の＿＿（せつめい）がわかりやすかった。","gloss":"工作人員的說明很容易懂。選漢字。","answer":"説明","options":[{"text":"説明","meaning":"說明。","connection":"せつめい。説＋明。","why":"わかりやすく話すのは説明。讀音せつめい。","example":"手順を説明する。","zh":"說明步驟。"},{"text":"証明","meaning":"證明。","connection":"しょうめい。証はしょう。","why":"せつめいではない。証明は証拠を示すこと。","example":"身分を証明する。","zh":"證明身份。"},{"text":"生命","meaning":"生命。","connection":"せいめい。","why":"せつめいではない。わかりやすい生命とは言わない。","example":"生命（せいめい）。","zh":"生命。"},{"text":"釈明","meaning":"辯解。","connection":"しゃくめい。","why":"せつめいではない。","example":"ミスを釈明する。","zh":"為錯誤辯解。"}],"level":"N4"},{"id":"v67","kind":"vocab","point":"準備（漢字）","group":"kanji","difficulty":2,"stem":"面接（めんせつ）の＿＿（じゅんび）に一週間（いっしゅうかん）かかった。","gloss":"面試的準備花了一星期。選漢字。","answer":"準備","options":[{"text":"準備","meaning":"準備。","connection":"じゅんび。準＋備。","why":"前もって整えるのは準備。","example":"旅行の準備。","zh":"旅行準備。"},{"text":"順備","meaning":"順の字。","connection":"順はじゅんでも、準備の字は準。","why":"じゅんびは準備と書く。","example":"順番（じゅんばん）。","zh":"順序的順。"},{"text":"準美","meaning":"備の字が違う。","connection":"美はびではない。備はび。","why":"準美とは書かない。","example":"準備（じゅんび）。","zh":"備。"},{"text":"純美","meaning":"別の読みになる。","connection":"純美はじゅんびではない。","why":"面接の純美とは言わない。","example":"準備（じゅんび）。","zh":"準と備。"}],"level":"N4"},{"id":"v68","kind":"vocab","point":"影響（漢字）","group":"kanji","difficulty":3,"stem":"台風（たいふう）の＿＿（えいきょう）で、電車が止（と）まった。","gloss":"受颱風影響，電車停了。選漢字。","answer":"影響","options":[{"text":"影響","meaning":"影響。","connection":"えいきょう。影＋響。","why":"ほかへ及び結果を出すのは影響。","example":"影響を受ける。","zh":"受到影響。"},{"text":"映響","meaning":"映の字。","connection":"映はえいでも、影響の字は影。","why":"えいきょうは影響。","example":"映画（えいが）。","zh":"映是電影的映。"},{"text":"営業","meaning":"做生意。","connection":"えいぎょう。営はぎょう。","why":"えいきょうではない。颱風の営業では電車が停まる理由にならない。","example":"店を営業する。","zh":"開店營業。"},{"text":"映教","meaning":"教はきょうでも、語が違う。","connection":"宗教（しゅうきょう）のきょう。","why":"台風の映教では電車は止まらない。","example":"影響（えいきょう）。","zh":"響。"}],"level":"N3"},{"id":"v69","kind":"vocab","point":"解決（漢字）","group":"kanji","difficulty":3,"stem":"苦情（くじょう）はその日のうちに＿＿（かいけつ）した。","gloss":"投訴在當天解決了。選漢字。","answer":"解決","options":[{"text":"解決","meaning":"解決。","connection":"かいけつ。解＋決。","why":"問題を片づけるのは解決。","example":"問題を解決する。","zh":"解決問題。"},{"text":"快決","meaning":"快の字。一般語ではない。","connection":"快はかいでも、かいけつは解決。","why":"苦情を快決したとは言わない。","example":"解決（かいけつ）。","zh":"解。"},{"text":"回決","meaning":"回はかい。","connection":"回（かい）。解ではない。","why":"かいけつの漢字は解決。","example":"一回（いっかい）。","zh":"回。"},{"text":"開決","meaning":"開はかい。","connection":"開く。解決の字は解。","why":"開決とは書かない。","example":"開始（かいし）。","zh":"開是開始的開。"}],"level":"N3"},{"id":"v70","kind":"vocab","point":"ぜひ","group":"v-adv","difficulty":2,"stem":"よかったら、＿＿遊（あそ）びに来（き）てください。","gloss":"如果方便，請一定來玩。強烈的邀請。","answer":"ぜひ","options":[{"text":"ぜひ","meaning":"務必、一定。邀請或强烈希望。","connection":"ぜひ＋てください／たい。","why":"對方來是說話人很希望的事。ぜひ来てください。","example":"ぜひ読んでみてください。","zh":"請一定讀讀看。"},{"text":"決して","meaning":"絕不會。後面要否定。","connection":"決して＋ない。","why":"決して来てください不成立。邀請の肯定には使わない。","example":"決して忘れません。","zh":"絕不會忘記。"},{"text":"別に","meaning":"並不。後面要否定。","connection":"別に〜ない。","why":"別に来てください不能邀請。","example":"別に来なくてもいい。","zh":"不來也沒關係。"},{"text":"あまり","meaning":"不太。後面要否定。","connection":"あまり〜ない。","why":"あまり来てください不成立。","example":"あまり来ないでください。","zh":"請不要常來。"}],"level":"N4"},{"id":"v71","kind":"vocab","point":"決して","group":"v-adv","difficulty":3,"stem":"ご恩（おん）は＿＿忘（わす）れません。","gloss":"您的恩情我絕不會忘記。","answer":"決して","options":[{"text":"決して","meaning":"絕不會。說話人的決心，後面是否定。","connection":"決して＋否定。忘れません。","why":"忘記しないと強く言う。決して忘れません。","example":"決して嘘はつきません。","zh":"絕不會說謊。"},{"text":"ぜひ","meaning":"務必。肯定の依頼。","connection":"ぜひ＋てください。","why":"ぜひ忘れませんは、忘れたくない決心の言い方にならない。","example":"ぜひ来てください。","zh":"請一定來。"},{"text":"たぶん","meaning":"大概。不確定。","connection":"たぶん＋だろう。","why":"たぶん忘れませんは「大概不會忘」，決心が弱い。ご恩の文には決して。","example":"たぶん雨だろう。","zh":"大概會下雨。"},{"text":"そろそろ","meaning":"差不多該。","connection":"そろそろ＋動詞。","why":"そろそろ忘れません不自然。時間の近づきではない。","example":"そろそろ帰りましょう。","zh":"差不多該回去了。"}],"level":"N3"},{"id":"v72","kind":"vocab","point":"だんだん","group":"v-adv","difficulty":1,"stem":"九月（くがつ）になると、＿＿涼（すず）しくなる。","gloss":"到了九月，會漸漸變涼。","answer":"だんだん","options":[{"text":"だんだん","meaning":"漸漸。從一個狀態慢慢變成另一個。","connection":"副詞＋變化。だんだん涼しくなる。","why":"九月から涼しさへゆっくり変わる。だんだん。","example":"空がだんだん暗くなった。","zh":"天漸漸黑了。"},{"text":"ますます","meaning":"越來越。本來已有的程度再加深。","connection":"ますます＋すでにその状態。","why":"涼しくない季節から涼しくなる起点の変化はだんだん。ますますは「もともと涼しく、さらに涼しい」。","example":"夜になって、ますます寒くなった。","zh":"到了晚上，越來越冷。"},{"text":"いきなり","meaning":"冷不防，沒有過程。","connection":"副詞。","why":"いきなり涼しくなる是一下子變涼，不是九月のゆるい変化。","example":"いきなり立ち止まった。","zh":"突然站住。"},{"text":"やっと","meaning":"總算。辛苦之後的結果。","connection":"やっと＋可能・完了。","why":"季節の変化にやっとは合わない。","example":"やっと涼しくなった。","zh":"總算變涼了。這是等了很久的解脫。"}],"level":"N5"},{"id":"v73","kind":"vocab","point":"ずっと","group":"v-adv","difficulty":2,"stem":"子供（こども）のときから、＿＿この町（まち）に住（す）んでいる。","gloss":"從小孩時候起，一直住在這個城鎮。","answer":"ずっと","options":[{"text":"ずっと","meaning":"一直。中間沒有斷。也可以是比較的「……得多」。","connection":"ずっと＋継続。子供のときからずっと。","why":"過去から今まで途切れずに住んでいる。ずっと。","example":"午前からずっと雨だ。","zh":"從上午起一直在下雨。"},{"text":"すぐ","meaning":"馬上。時間が短い。","connection":"すぐ＋動詞。","why":"子供のときからすぐ住んでいるは、長い継続にならない。","example":"すぐ行きます。","zh":"馬上去。"},{"text":"もっと","meaning":"更加。","connection":"もっと＋程度。","why":"もっと住んでいるは継続の意味にならない。","example":"もっと大きく書きなさい。","zh":"寫得再大一點。"},{"text":"ときどき","meaning":"有時。斷斷續續。","connection":"ときどき＋動詞。","why":"ときどき住んでいるは「有時住」，從小孩到現在一直住ではない。","example":"ときどき映画を見る。","zh":"有時看電影。"}],"level":"N4"},{"id":"v74","kind":"vocab","point":"すぐ","group":"v-adv","difficulty":1,"stem":"駅（えき）は＿＿そこです。歩（ある）いて三分（さんぷん）です。","gloss":"車站就在那裡。走三分鐘。","answer":"すぐ","options":[{"text":"すぐ","meaning":"馬上、很近。時間も距離も短い。","connection":"すぐそこ、すぐに。","why":"三分は近い。すぐそこです。","example":"すぐに始めます。","zh":"馬上開始。"},{"text":"ずっと","meaning":"一直，或遠得多。","connection":"ずっと＋継続／比較。","why":"ずっとそこですは「一直在那裡」にはなるが、三分という近さの強調はすぐ。","example":"ずっと昔からここにいる。","zh":"從很久以前就在這裡。"},{"text":"そろそろ","meaning":"差不多到時候了。","connection":"そろそろ＋動詞。","why":"場所の近さにそろそろは使わない。","example":"そろそろ出かけよう。","zh":"差不多出發吧。"},{"text":"だんだん","meaning":"漸漸。","connection":"だんだん＋變化。","why":"駅の位置は変化しない。だんだんそこです不成立。","example":"だんだん近くなる。","zh":"漸漸靠近。"}],"level":"N5"},{"id":"v75","kind":"vocab","point":"もっと","group":"v-adv","difficulty":1,"stem":"声（こえ）が小（ちい）さいです。＿＿大（おお）きく話（はな）してください。","gloss":"聲音很小。請說得再大一點。","answer":"もっと","options":[{"text":"もっと","meaning":"更加。現在的程度還不夠。","connection":"もっと＋形容詞・動詞。もっと大きく。","why":"まだ小さいので、程度を上げる。もっと。","example":"もっとゆっくりお願いします。","zh":"請再慢一點。"},{"text":"とても","meaning":"非常。程度が高いという評価。","connection":"とても＋形容詞。","why":"とても大きく話してくださいは「請非常大地說」，不夠を上げる感じが薄い。今小さいから上げるのはもっと。","example":"とても大きい声だ。","zh":"聲音非常大。"},{"text":"ずっと","meaning":"一直，或差得遠。","connection":"ずっと大きく是差一截地更大，比較のとき。","why":"相手の今の声を少し上げてほしい依頼はもっと。ずっと大きくは差の大きさ。","example":"兄のほうがずっと大きい。","zh":"哥哥大得多。"},{"text":"あまり","meaning":"不太。後は否定。","connection":"あまり〜ない。","why":"あまり大きく話してください不成立。","example":"あまり大きくない。","zh":"不太大。"}],"level":"N5"},{"id":"v76","kind":"vocab","point":"とても","group":"v-adv","difficulty":1,"stem":"この問題（もんだい）は＿＿難（むずか）しい。","gloss":"這題非常難。","answer":"とても","options":[{"text":"とても","meaning":"非常。程度が高い。肯定と一緒。","connection":"とても＋形容詞。とても難しい。","why":"難度が高い評価。とても難しい。","example":"今日はとても暑い。","zh":"今天非常熱。"},{"text":"あまり","meaning":"不太。後は否定。","connection":"あまり難しくない。","why":"あまり難しいは、否定がないので「不太難」にならない。","example":"あまり難しくない。","zh":"不太難。"},{"text":"もっと","meaning":"更加。まだ足りない。","connection":"もっと難しい。","why":"もっと難しいは「還要更難」。今の評価「非常に難しい」はとても。","example":"このほうがもっと難しい。","zh":"這個更難。"},{"text":"ぜんぜん","meaning":"完全。後は否定が普通。","connection":"全然難しくない。","why":"全然難しいは肯定と合わない。","example":"全然難しくない。","zh":"完全不難。"}],"level":"N5"},{"id":"v77","kind":"vocab","point":"ときどき","group":"v-adv","difficulty":1,"stem":"忙（いそが）しいので、＿＿しか映画（えいが）を見（み）ません。","gloss":"因為忙，只是偶爾看電影。","answer":"ときどき","options":[{"text":"ときどき","meaning":"有時候。頻率不高。","connection":"ときどき＋動詞。しかと一緒でも「只是偶爾」。","why":"忙しくて頻度が低い。ときどきしか見ません。","example":"ときどき雨が降る。","zh":"有時下雨。"},{"text":"いつも","meaning":"總是。頻率が高い。","connection":"いつも＋動詞。","why":"いつもしか見ません不自然。いつもは「每次都」。忙しい理由と反対。","example":"いつも映画を見る。","zh":"總是看電影。"},{"text":"ずっと","meaning":"一直。","connection":"ずっと見る。","why":"ずっとしか見ませんは頻度の「偶爾」にならない。","example":"休みの日はずっと家にいる。","zh":"假日一直在家。"},{"text":"すぐ","meaning":"馬上。","connection":"すぐ見る。","why":"すぐしか見ません不成立。近さ・速さではない。","example":"すぐ見ます。","zh":"馬上看。"}],"level":"N5"},{"id":"v78","kind":"vocab","point":"しばらく","group":"v-adv","difficulty":2,"stem":"＿＿待（ま）ってください。今、調べ（しら）ます。","gloss":"請稍等一下。我現在查。","answer":"しばらく","options":[{"text":"しばらく","meaning":"一小段時間。不長不短的等待。","connection":"しばらく＋動詞。待ってください。","why":"調べるあいだ待ってほしい。しばらく。","example":"しばらく会っていません。","zh":"有一陣子沒見。"},{"text":"ずっと","meaning":"一直，很長。","connection":"ずっと待つ。","why":"ずっと待ってください是一直等下去。調べる短いあいだにはしばらく。","example":"ここでずっと待っている。","zh":"一直在這裡等。"},{"text":"そろそろ","meaning":"差不多該做了。","connection":"そろそろ＋意志。","why":"そろそろ待ってください不自然。待つ時間の長さではない。","example":"そろそろ始めましょう。","zh":"差不多開始吧。"},{"text":"やっと","meaning":"總算。","connection":"やっと＋完了。","why":"やっと待ってください不成立。","example":"やっと終わった。","zh":"總算結束了。"}],"level":"N4"},{"id":"v79","kind":"vocab","point":"やがて","group":"v-adv","difficulty":4,"stem":"この森（もり）を抜（ぬ）けると、＿＿村（むら）に出（で）る。","gloss":"穿過這片森林，不久就會到村子。","answer":"やがて","options":[{"text":"やがて","meaning":"不久之後。自然にその状態へ進む。","connection":"やがて＋変化・到達。","why":"森の先に村がある、その到達が近い。やがて。","example":"やがて春が来る。","zh":"不久春天就來。"},{"text":"急に","meaning":"忽然。変化が突然。","connection":"急に＋變化。","why":"急に村に出るは、道のりの「そのうち着く」ではなく突然現れる感じが強い。道を進めば着くのはやがて。","example":"急に雨が降り出した。","zh":"忽然下起雨。"},{"text":"ついに","meaning":"終於。長い過程の結末。","connection":"ついに＋結果。","why":"ついに村に出るは長い苦労の末の到着。短い道のりにはやがて。","example":"ついに頂上に着いた。","zh":"終於到了山頂。"},{"text":"いったん","meaning":"暫時、先。","connection":"いったん＋動作。","why":"いったん村に出る是先到村子（之後還有別の動作）。這裡只說會到達。","example":"いったん帰って、また来る。","zh":"先回去，再來。"}],"level":"N3"},{"id":"v80","kind":"vocab","point":"今にも","group":"v-adv","difficulty":3,"stem":"空（そら）が暗（くら）くて、＿＿雨（あめ）が降（ふ）りそうだ。","gloss":"天很暗，眼看就要下雨。","answer":"今にも","options":[{"text":"今にも","meaning":"眼看就要。まだ起きていないが、すぐ起きそう。","connection":"今にも＋ます語幹＋そうだ。降りそうだ。","why":"降りそうだ和今にもは一組。まだ降っていない。","example":"今にも泣き出しそうだ。","zh":"眼看就要哭出來。"},{"text":"すでに","meaning":"已經。","connection":"すでに＋た形が多い。","why":"すでに降りそうだは「已經看起來要下」，即將の今にもと違う。すでに降ったなら過去。","example":"すでに雨は止んだ。","zh":"雨已經停了。"},{"text":"やがて","meaning":"不久之後。もう少し先。","connection":"やがて降る。","why":"やがて降りそうだも言えるが、空が暗い視覚の差し迫りは今にも＋そうだ。","example":"やがて雨になるだろう。","zh":"不久大概會下雨。"},{"text":"とうとう","meaning":"到底還是。結果が起きたあと。","connection":"とうとう＋た形。","why":"とうとう降りそうだは、起きていないことに「最終結果」を使うので合わない。","example":"とうとう雨が降り出した。","zh":"到底還是下起雨來。"}],"level":"N3"},{"id":"v81","kind":"vocab","point":"特に","group":"v-adv","difficulty":3,"stem":"果物（くだもの）は何（なん）でも食（た）べますが、＿＿りんごが好（す）きです。","gloss":"水果什麼都吃，尤其喜歡蘋果。","answer":"特に","options":[{"text":"特に","meaning":"尤其、特別是。多くの中から一つを際立たせる。","connection":"特に＋名詞。","why":"何でも食べる中で、りんごを強調。特に。","example":"色は特に青が好きです。","zh":"顏色尤其喜歡藍色。"},{"text":"別に","meaning":"並不。後は否定。","connection":"別に好きではない。","why":"別にりんごが好きですは肯定の強調にならない。","example":"別に好きではありません。","zh":"也不是特別喜歡。"},{"text":"決して","meaning":"絕不會。後は否定。","connection":"決して〜ない。","why":"決してりんごが好きです不成立。","example":"決して嫌いではありません。","zh":"絕不是討厭。"},{"text":"突然","meaning":"突然。","connection":"突然＋動詞。","why":"突然りんごが好きですは、今急に好きになった話ではない。","example":"突然好きになった。","zh":"突然喜歡上了。"}],"level":"N3"},{"id":"v82","kind":"vocab","point":"実は","group":"v-adv","difficulty":3,"stem":"元気（げんき）なふりをしていましたが、＿＿かなり疲（つか）れています。","gloss":"我裝得很有精神，其實相當累。","answer":"実は","options":[{"text":"実は","meaning":"其實。表に出ていない本当のことを切り出す。","connection":"実は＋本当の内容。","why":"ふりのあとで本音。実は疲れている。","example":"実は、明日国へ帰ります。","zh":"其實我明天回國。"},{"text":"確かに","meaning":"確實。相手の言葉を認めた上で。","connection":"確かに〜。しかし、と続くことが多い。","why":"確かに疲れていますは同意。ここでは隠し事が表に出るので実は。","example":"確かに難しい。しかし、やってみます。","zh":"確實難。不過我會試。"},{"text":"やはり","meaning":"果然、還是。予想どおり。","connection":"やはり＋予想通り。","why":"ふりをしていた本当は、予想の確認だけではない。隠していた事実を出すのは実は。","example":"やはり雨だった。","zh":"果然下雨了。"},{"text":"まさか","meaning":"難道、怎麼會。意外を否定する。","connection":"まさか＋ないだろう。","why":"まさか疲れていますは意外の断定にならない。","example":"まさか嘘ではないでしょうね。","zh":"該不會是謊話吧。"}],"level":"N3"},{"id":"v83","kind":"vocab","point":"確かに","group":"v-adv","difficulty":3,"stem":"＿＿この店（みせ）は安（やす）い。しかし、量（りょう）が少（すく）ない。","gloss":"這家店確實便宜。但是份量少。先承認再轉折。","answer":"確かに","options":[{"text":"確かに","meaning":"的確。對方或一般的見方を一度認める。","connection":"確かに〜。しかし／けれども。","why":"安いことは認めて、量の少なさを後で言う。確かに。","example":"確かに便利だ。ただ、家賃が高い。","zh":"確實方便。只是房租貴。"},{"text":"実は","meaning":"其實。隠れていた事実。","connection":"実は。","why":"実は安いは、安さが秘密だったように聞こえる。ここでは一度認めてから逆の事実を足す。","example":"実は高くない。","zh":"其實不貴。這是掏出真相。"},{"text":"決して","meaning":"絕不會。後は否定。","connection":"決して安くない。","why":"決して安い肯定と合わない。","example":"決して安くはない。","zh":"絕不便宜。"},{"text":"ぜひ","meaning":"務必。","connection":"ぜひ＋依頼。","why":"ぜひ安い不成立。","example":"ぜひ来てください。","zh":"請一定來。"}],"level":"N3"},{"id":"v84","kind":"vocab","point":"関心","group":"v-noun","difficulty":3,"stem":"環境問題（かんきょうもんだい）に＿＿がある。","gloss":"對環境問題有興趣、關注。","answer":"関心","options":[{"text":"関心","meaning":"興趣、關注。心が向いている。","connection":"名詞＋に関心がある。","why":"環境問題に心が向く。関心がある。","example":"政治に関心がある。","zh":"對政治有興趣。"},{"text":"感心","meaning":"佩服。了不起だと思うこと。","connection":"感心する。感心があるとは言わない。","why":"関心と漢字が似ているが、感心があるは言わない。佩服は感心した。","example":"よく頑張ったと感心した。","zh":"佩服他很努力。"},{"text":"感情","meaning":"感情。","connection":"感情がある。","why":"環境問題に感情があるは、関心の言い方ではない。","example":"感情を表す。","zh":"表達感情。"},{"text":"感覚","meaning":"感覺。","connection":"感覚がある。","why":"環境問題に感覚があるは「有一種感覺」，関心の「關注」ではない。","example":"時間の感覚がない。","zh":"沒有時間觀念。"}],"level":"N3"},{"id":"v85","kind":"vocab","point":"適当","group":"v-noun","difficulty":4,"stem":"この仕事（しごと）は＿＿にやったので、やり直（なお）すことになった。","gloss":"這工作做得敷衍，所以要重做。這裡的「適当」不是「合適」。","answer":"適当","options":[{"text":"適当","meaning":"這個句子裡是馬虎、敷衍。","connection":"適当に＋動詞。いい加減。","why":"やり直すのは、丁寧でなかったから。適当にやった。","example":"適当に答えないで、よく考えて。","zh":"不要隨便回答，好好想。"},{"text":"丁寧","meaning":"仔細、有禮貌。","connection":"丁寧に＋動詞。","why":"丁寧にやったのにやり直す、にはならない。丁寧ならやり直さない。","example":"丁寧に説明する。","zh":"仔細說明。"},{"text":"正確","meaning":"正確。","connection":"正確に＋動詞。","why":"正確にやった仕事はやり直す理由にならない。","example":"正確に書く。","zh":"正確地寫。"},{"text":"特別","meaning":"特別。","connection":"特別に＋動詞。","why":"特別にやったは「特地做」，敷衍でやり直す意味にならない。","example":"特別に用意した。","zh":"特別準備了。"}],"level":"N3"},{"id":"v86","kind":"vocab","point":"無駄","group":"v-noun","difficulty":3,"stem":"窓（まど）を開けたままなので、冷房（れいぼう）が＿＿になる。","gloss":"窗開著，冷氣就白費了。","answer":"無駄","options":[{"text":"無駄","meaning":"白費、沒有用。","connection":"無駄になる。","why":"開著窗還開冷氣，涼しさが逃げる。無駄になる。","example":"待った時間が無駄になった。","zh":"等的時間白費了。"},{"text":"無理","meaning":"勉強、辦不到。","connection":"無理だ。無理になるは「變得難以做到」。","why":"冷房が無理になるは、白く費える意味ではない。","example":"その計画は無理だ。","zh":"那個計劃行不通。"},{"text":"無料","meaning":"免費。","connection":"無料だ。","why":"冷房が無料になるは「變免費」，窗を開けた原因と合わない。","example":"入場は無料です。","zh":"入場免費。"},{"text":"無事","meaning":"平安。","connection":"無事だ。","why":"冷房が無事になるは言わない。","example":"無事に着いた。","zh":"平安到達。"}],"level":"N3"},{"id":"v87","kind":"vocab","point":"落ちる","group":"v-verb","difficulty":2,"stem":"本（ほん）が棚（たな）から＿＿。","gloss":"書從架子上掉下來了。書自己落下。","answer":"落ちた","options":[{"text":"落ちた","meaning":"掉落。自動詞。","connection":"が＋落ちる。本が落ちた。","why":"誰が落としかは言っていない。本が主語。落ちた。","example":"コップが床に落ちた。","zh":"杯子掉到地板上。"},{"text":"落とした","meaning":"弄掉。他動詞。","connection":"を＋落とす。主語は人。","why":"本が落としたは、本が何かを落としたことになる。本自身が落ちるなら落ちた。","example":"本を落とした。","zh":"我把書弄掉了。"},{"text":"落ちった","meaning":"存在しない形。","connection":"落ちるのた形は落ちた。","why":"落ちったとは言わない。","example":"落ちた。","zh":"掉了。"},{"text":"降りた","meaning":"下來、雨が降る、乗り物を降りる。","connection":"降りる／降る。","why":"本が棚から降りたは言わない。物が下へ落ちるのは落ちる。","example":"電車を降りた。","zh":"下了電車。"}],"level":"N4"},{"id":"v88","kind":"vocab","point":"慣れる","group":"v-verb","difficulty":3,"stem":"東京（とうきょう）の満員電車（まんいんでんしゃ）に＿＿。","gloss":"我習慣了東京的滿員電車。","answer":"慣れた","options":[{"text":"慣れた","meaning":"習慣了。起初は大変だったが、普通になる。","connection":"に＋慣れる。満員電車に慣れた。","why":"経験を積んで平気になる。慣れた。","example":"新しい仕事に慣れた。","zh":"習慣了新工作。"},{"text":"飽きた","meaning":"厭煩了。","connection":"に＋飽きる。た形は飽きた。","why":"満員電車に飽きた是覺得膩了，不是變得習慣、能夠忍受。習慣は慣れた。","example":"同じ仕事に飽きた。","zh":"對同一份工作感到厭煩。"},{"text":"忘れた","meaning":"忘了。","connection":"を＋忘れる。","why":"満員電車に忘れたは場所の「に」と合わない。忘れるの対象はを。","example":"傘を忘れた。","zh":"忘了傘。"},{"text":"比べた","meaning":"比較了。","connection":"と／を＋比べる。","why":"満員電車に比べたは比較の対象が足りない。習慣の意味もない。","example":"二つの案を比べた。","zh":"比較了兩個方案。"}],"level":"N3"},{"id":"v89","kind":"vocab","point":"断る","group":"v-verb","difficulty":3,"stem":"その日（ひ）は予定（よてい）があるので、誘い（さそい）を＿＿。","gloss":"那天已經有安排，所以拒絕了邀請。","answer":"断った","options":[{"text":"断った","meaning":"拒絕。","connection":"を＋断る。誘いを断った。","why":"行けないので誘いを受けない。断った。","example":"依頼を断った。","zh":"拒絕了委託。"},{"text":"受けた","meaning":"接受。","connection":"を＋受ける。","why":"予定があるのに誘いを受けたは、理由の「ので」と反対。","example":"誘いを受けた。","zh":"接受了邀請。"},{"text":"頼った","meaning":"依靠。","connection":"に＋頼る。","why":"誘いを頼ったは言わない。頼る相手は人に。","example":"友達に頼った。","zh":"依靠了朋友。"},{"text":"取った","meaning":"拿、取得。","connection":"を＋取る。","why":"誘いを取ったは拒否でも受諾でもない。","example":"資格を取った。","zh":"取得了資格。"}],"level":"N3"},{"id":"v90","kind":"vocab","point":"足りる","group":"v-verb","difficulty":2,"stem":"お金（かね）が＿＿ので、この靴（くつ）は買えません。","gloss":"錢不夠，所以這雙鞋買不了。","answer":"足りない","options":[{"text":"足りない","meaning":"不夠。","connection":"が＋足りない。お金が足りない。","why":"買えない理由は不足。足りないので。","example":"時間が足りない。","zh":"時間不夠。"},{"text":"足りた","meaning":"夠了。過去・完了。","connection":"足りた。","why":"足りたので買えないは、理由が反対。夠了卻買不了，にならない。","example":"ちょうど足りた。","zh":"剛剛夠。"},{"text":"余った","meaning":"剩下。","connection":"が＋余る。","why":"お金が余ったので買えないは反対。余るなら買える。","example":"お金が余った。","zh":"錢剩下了。"},{"text":"無駄だ","meaning":"白費。","connection":"が＋無駄だ、はお金が無駄だ。","why":"お金が無駄だので助詞がおかしい。買えない直接の理由は足りない。","example":"その努力は無駄だ。","zh":"那努力白費了。"}],"level":"N4"},{"id":"v91","kind":"vocab","point":"原因","group":"v-noun","difficulty":2,"stem":"事故（じこ）の＿＿は、スピードの出（だ）しすぎだ。","gloss":"事故的原因是速度過快。客觀的原因。","answer":"原因","options":[{"text":"原因","meaning":"客觀上引起結果的原因。","connection":"名詞＋の原因。事故の原因。","why":"スピードの出しすぎが事故を起こした。原因。","example":"火事の原因を調べる。","zh":"調查火災原因。"},{"text":"結果","meaning":"結果。和原因相反。","connection":"名詞。","why":"超速是引起事故的那一邊，不是事故發生之後的結果。","example":"努力の結果、合格した。","zh":"努力的結果，合格了。"},{"text":"感想","meaning":"感想。人的印象。","connection":"說感想。","why":"超速是引起事故的事實，不是某人的感想。","example":"映画の感想を書く。","zh":"寫電影的感想。"},{"text":"目的","meaning":"目的。想達成的事。","connection":"目的是目標。","why":"事故沒有「目的」。超速不是為了達成什麼。","example":"留学の目的。","zh":"留學的目的。"}],"level":"N4"},{"id":"v92","kind":"vocab","point":"丁寧","group":"v-noun","difficulty":2,"stem":"目上（めうえ）の人（ひと）には、＿＿な言葉（ことば）を使（つか）います。","gloss":"對長輩使用丁寧的說法。","answer":"丁寧","options":[{"text":"丁寧","meaning":"仔細、有禮貌。","connection":"丁寧な＋名詞。丁寧な言葉。","why":"目上への言葉遣いは丁寧。","example":"丁寧に説明する。","zh":"仔細說明。"},{"text":"適当","meaning":"この対比では馬虎。","connection":"適当な言葉は、礼儀正しい意味にはならないことが多い。","why":"目上に適当な言葉、は雑に聞こえる。ここでは丁寧。","example":"適当に返事をした。","zh":"隨便回了一句。"},{"text":"無駄","meaning":"白費。","connection":"無駄な言葉。","why":"無駄な言葉は使わないほうがいい、であって、目上への正しい選び方ではない。","example":"無駄な話。","zh":"廢話。"},{"text":"急","meaning":"急。","connection":"急な＋名詞。","why":"急な言葉は目上への丁寧な言い方の種類ではない。急ぎの様子であって、礼儀の言葉遣いではない。","example":"急な用事。","zh":"急事。"}],"level":"N4"},{"id":"v93","kind":"vocab","point":"閉まる","group":"v-verb","difficulty":2,"stem":"風（かぜ）で窓（まど）が＿＿。","gloss":"窗被風弄得自己關上了。沒有人去關。","answer":"閉まった","options":[{"text":"閉まった","meaning":"關上。自動詞。","connection":"が＋閉まる。窓が閉まった。","why":"句子沒有人用を去關，是風讓窗自己關上。閉まった。","example":"ドアが自動的に閉まった。","zh":"門自動關上了。"},{"text":"閉めた","meaning":"人關窗。他動詞。","connection":"を＋閉める。","why":"窓が閉めた會變成窗子去關別的東西。窗自己關上要用閉まった。","example":"私は窓を閉めた。","zh":"我把窗關上了。"},{"text":"落ちた","meaning":"掉下去。","connection":"が＋落ちる。","why":"風で窓が落ちた是窗子掉下去，不是關上。","example":"本が棚から落ちた。","zh":"書從架子上掉下來。"},{"text":"開けた","meaning":"打開。相反。","connection":"開く的過去是開いた。開けた是他動詞。","why":"窓が開けた接不上。而且意思是開，不是關。","example":"窓が開いた。","zh":"窗開了。"}],"level":"N4"},{"id":"v94","kind":"vocab","point":"本（助數詞）","group":"counter","difficulty":1,"stem":"鉛筆（えんぴつ）を三＿＿買（か）いました。","gloss":"買了三枝鉛筆。細長的東西。","answer":"本","options":[{"text":"本","meaning":"枝、瓶、筆等細長物。","connection":"本（ほん）。一本、二本、三本。","why":"鉛筆是細長的。三本。","example":"ビールを二本ください。","zh":"請給我兩瓶啤酒。"},{"text":"枚","meaning":"扁平的東西。紙、襯衫。","connection":"枚（まい）。","why":"鉛筆不是紙，不說三枚鉛筆。","example":"紙を三枚ください。","zh":"請給我三張紙。"},{"text":"冊","meaning":"書本。","connection":"冊（さつ）。","why":"鉛筆は本ではない。三冊は本。","example":"本を三冊買った。","zh":"買了三本書。"},{"text":"台","meaning":"機器、車輛。","connection":"台（だい）。","why":"鉛筆は機械ではない。","example":"車を一台買った。","zh":"買了一輛車。"}],"level":"N5"},{"id":"v95","kind":"vocab","point":"枚","group":"counter","difficulty":1,"stem":"シャツを二＿＿洗（あら）った。","gloss":"洗了兩件襯衫。薄而平的東西。","answer":"枚","options":[{"text":"枚","meaning":"紙、衣服、盤子等扁平物。","connection":"枚（まい）。一枚、二枚。","why":"襯衫按件用枚。二枚。","example":"皿を三枚割った。","zh":"打碎了三個盤子。"},{"text":"本","meaning":"細長物。","connection":"本（ほん）。","why":"襯衫は細長く数えない。","example":"傘を一本持っている。","zh":"帶著一把傘。"},{"text":"冊","meaning":"書本。","connection":"冊（さつ）。","why":"襯衫不是書。二冊は本。","example":"本を二冊買った。","zh":"買了兩本書。"},{"text":"足","meaning":"鞋子、襪子的一雙。","connection":"足（そく）。","why":"襯衫は足ではない。","example":"靴を一足買った。","zh":"買了一雙鞋。"}],"level":"N5"},{"id":"v96","kind":"vocab","point":"冊","group":"counter","difficulty":1,"stem":"図書館（としょかん）で本（ほん）を四＿＿借（か）りた。","gloss":"在圖書館借了四本書。","answer":"冊","options":[{"text":"冊","meaning":"書、筆記本。","connection":"冊（さつ）。四冊。","why":"書用冊。四冊借りた。","example":"雑誌を一冊買った。","zh":"買了一本雜誌。"},{"text":"本","meaning":"細長，或瓶。","connection":"本（ほん）。","why":"書を四本とは言わない。","example":"ペンを四本買った。","zh":"買了四枝筆。"},{"text":"枚","meaning":"紙一張。","connection":"枚（まい）。","why":"とじられた本は枚ではない。","example":"紙を四枚コピーした。","zh":"影印了四張紙。"},{"text":"通","meaning":"信、郵件。","connection":"通（つう）。","why":"本は通ではない。","example":"手紙を一通書いた。","zh":"寫了一封信。"}],"level":"N5"},{"id":"v97","kind":"vocab","point":"匹","group":"counter","difficulty":2,"stem":"猫（ねこ）を一＿＿飼（か）っています。","gloss":"養了一隻貓。小動物。","answer":"匹","options":[{"text":"匹","meaning":"小動物、魚、蟲。","connection":"匹（ひき）。猫、犬。一匹。","why":"貓用匹。一匹。","example":"魚を三匹釣った。","zh":"釣了三條魚。"},{"text":"頭","meaning":"大的動物。","connection":"頭（とう）。牛、馬。","why":"貓不用頭。頭は大きい動物。","example":"馬を一頭見た。","zh":"看到一匹馬。"},{"text":"羽","meaning":"鳥、兔子。","connection":"羽（わ）。","why":"貓不是鳥。羽は鳥。","example":"鳥を二羽見た。","zh":"看到兩隻鳥。"},{"text":"人","meaning":"人。","connection":"人（にん）。","why":"貓不是人。","example":"友達が三人来た。","zh":"來了三個朋友。"}],"level":"N5"},{"id":"v98","kind":"vocab","point":"杯","group":"counter","difficulty":1,"stem":"カフェで、カップのコーヒーを二＿＿注文（ちゅうもん）した。","gloss":"在咖啡店點了兩杯熱咖啡。杯裝用杯。","answer":"杯","options":[{"text":"杯","meaning":"杯、碗裡的飲料或飯。","connection":"杯（はい）。二杯。","why":"咖啡按杯。二杯。","example":"お茶を一杯ください。","zh":"請給我一杯茶。"},{"text":"本","meaning":"瓶、細長物。","connection":"本（ほん）。","why":"瓶裝啤酒才常說一本。杯子裡的咖啡用杯，不用本。","example":"ビールを二本ください。","zh":"請給我兩瓶啤酒。"},{"text":"枚","meaning":"扁平。","connection":"枚。","why":"飲料は枚ではない。","example":"皿を二枚。","zh":"兩個盤子。"},{"text":"個","meaning":"小而圓的固體。","connection":"個（こ）。","why":"コーヒーそのものは個で数えない。","example":"りんごを二個。","zh":"兩個蘋果。"}],"level":"N5"},{"id":"v99","kind":"vocab","point":"回","group":"counter","difficulty":1,"stem":"この映画（えいが）は三＿＿見（み）ました。","gloss":"這部電影看了三次。","answer":"回","options":[{"text":"回","meaning":"次數。","connection":"回（かい）。三回。","why":"看的次數。三回見ました。","example":"二回読みました。","zh":"讀了兩次。"},{"text":"個","meaning":"小而圓的固體。","connection":"個（こ）。","why":"次數不是個。三個見ました會變成看了三個東西。","example":"りんごを三個買った。","zh":"買了三個蘋果。"},{"text":"番","meaning":"順序。","connection":"番（ばん）。三番。","why":"三番見ましたは「第三個看了」，次數の三回ではない。","example":"三番目の映画。","zh":"第三部電影。"},{"text":"階","meaning":"樓層。","connection":"階（かい）と同じ音だが漢字が違う。","why":"映画を三階見ました不成立。","example":"三階に住んでいる。","zh":"住在三樓。"}],"level":"N5"},{"id":"v100","kind":"vocab","point":"階","group":"counter","difficulty":1,"stem":"事務所（じむしょ）は三＿＿にあります。","gloss":"事務所在三樓。","answer":"階","options":[{"text":"階","meaning":"樓層。","connection":"階（かい）。三階。","why":"樓層。三階にあります。","example":"エレベーターで五階へ。","zh":"乘電梯去五樓。"},{"text":"回","meaning":"次數。音同じかい。","connection":"回（かい）。","why":"三回にありますは場所にならない。階と回は漢字で分ける。","example":"三回会った。","zh":"見了三次。"},{"text":"号","meaning":"號碼。","connection":"号（ごう）。","why":"三号は部屋番号など。階ではない。","example":"三号室。","zh":"三號房。"},{"text":"番","meaning":"順序、號。","connection":"番（ばん）。","why":"三番にありますは順番の位置で、建物の階とは限らない。","example":"三番の窓口。","zh":"三號窗口。"}],"level":"N5"},{"id":"v101","kind":"vocab","point":"台","group":"counter","difficulty":2,"stem":"家（いえ）に車（くるま）が一＿＿あります。","gloss":"家里有一輛車。機器、車輛。","answer":"台","options":[{"text":"台","meaning":"車、機器、大型器具。","connection":"台（だい）。一台。","why":"車用台。一台。","example":"パソコンを二台買った。","zh":"買了兩台電腦。"},{"text":"本","meaning":"細長、瓶。","connection":"本。","why":"車を一本とは言わない。","example":"傘を一本。","zh":"一把傘。"},{"text":"枚","meaning":"扁平。","connection":"枚。","why":"車は枚ではない。","example":"切符を一枚。","zh":"一張票。"},{"text":"匹","meaning":"小動物。","connection":"匹。","why":"車は動物ではない。","example":"犬が一匹。","zh":"一隻狗。"}],"level":"N5"},{"id":"v102","kind":"vocab","point":"機械（読み）","group":"kanji","difficulty":3,"stem":"この工場（こうじょう）には新しい機械（＿＿）がある。","gloss":"這工廠有新的機器。不要讀成「機會」。","answer":"きかい","options":[{"text":"きかい","meaning":"機器。","connection":"機（き）＋械（かい）。","why":"工廠裡的機器讀きかい。和「機會」同音，但漢字是機械。","example":"機械が止まった。","zh":"機器停了。"},{"text":"きけい","meaning":"把械讀錯。","connection":"械是かい，不是けい。","why":"不是きけい。","example":"機械はきかい。","zh":"かい。"},{"text":"きがい","meaning":"把械讀成がい。","connection":"械不是がい。害才常讀がい。","why":"きがい不是機械。","example":"危害（きがい）。","zh":"危害。"},{"text":"からくり","meaning":"機關裝置的另一種說法，不是這個音讀。","connection":"機械的音讀是きかい。","why":"空格要的是機械兩個字的讀音，不是からくり。","example":"仕掛け（しかけ）。","zh":"機關不是きかい這個讀法。"}],"level":"N3"},{"id":"v103","kind":"vocab","point":"意見（読み）","group":"kanji","difficulty":2,"stem":"会議（かいぎ）で意見（＿＿）を言（い）った。","gloss":"在會議上說了意見。選讀音。","answer":"いけん","options":[{"text":"いけん","meaning":"意見。","connection":"意（い）＋見（けん）。","why":"說出的看法讀いけん。","example":"反対意見。","zh":"反對意見。"},{"text":"いみ","meaning":"意味。","connection":"意味はイミ。見ではない。","why":"意見をいみとは読まない。","example":"意味（いみ）。","zh":"意思。"},{"text":"しけん","meaning":"試驗、事件的けんを混ぜた形。","connection":"意はい。","why":"しけんは試験。","example":"試験（しけん）。","zh":"考試。"},{"text":"いけんい","meaning":"多了一拍。","connection":"いけんは三拍。","why":"後ろにいを足さない。","example":"意見（いけん）。","zh":"い・け・ん。"}],"level":"N4"},{"id":"v104","kind":"vocab","point":"安全（読み）","group":"kanji","difficulty":2,"stem":"この道（みち）は子供（こども）にも安全（＿＿）です。","gloss":"這條路對小孩也安全。選讀音。","answer":"あんぜん","options":[{"text":"あんぜん","meaning":"安全。","connection":"安（あん）＋全（ぜん）。","why":"危險でないことは安全、讀あんぜん。","example":"安全第一。","zh":"安全第一。"},{"text":"あんせん","meaning":"全をせんと清音にした形。","connection":"全はぜん。濁る。","why":"あんせんではない。","example":"安全はあんぜん。","zh":"ぜん。"},{"text":"やすぜん","meaning":"安の訓を混ぜた形。","connection":"安い（やすい）。安全の安はあん。","why":"やすぜんではない。","example":"安（あん）。","zh":"音讀あん。"},{"text":"あんぜんい","meaning":"多了一拍。","connection":"四拍で終わる。","why":"あんぜんいではない。","example":"安全（あんぜん）。","zh":"あ・ん・ぜ・ん。"}],"level":"N4"},{"id":"v105","kind":"vocab","point":"危険（読み）","group":"kanji","difficulty":3,"stem":"この川（かわ）は危（あぶ）なくて、危険（＿＿）だ。","gloss":"這條河危險。選讀音。","answer":"きけん","options":[{"text":"きけん","meaning":"危險。","connection":"危（き）＋険（けん）。","why":"あぶないの漢語は危険、讀きけん。","example":"危険な場所。","zh":"危險的地方。"},{"text":"きけんい","meaning":"多了一拍。","connection":"きけんは三拍。","why":"きけんいではない。","example":"危険（きけん）。","zh":"き・け・ん。"},{"text":"あぶけん","meaning":"危の訓を混ぜた形。","connection":"危ない（あぶない）。音讀はき。","why":"あぶけんではない。","example":"危（き）。","zh":"音讀き。"},{"text":"きげん","meaning":"機嫌、起源の音。","connection":"険はけん。げんではない。","why":"危険をきげんとは読まない。","example":"機嫌（きげん）。","zh":"心情、機嫌。"}],"level":"N3"},{"id":"v106","kind":"vocab","point":"関係（読み）","group":"kanji","difficulty":3,"stem":"この問題（もんだい）は私（わたし）には関係（＿＿）ありません。","gloss":"這個問題和我沒有關係。選讀音。","answer":"かんけい","options":[{"text":"かんけい","meaning":"關係。","connection":"関（かん）＋係（けい）。","why":"関わりは関係、讀かんけい。","example":"関係がない。","zh":"沒有關係。"},{"text":"かんけ","meaning":"係のいが落ちている。","connection":"けいまで読む。","why":"かんけではない。","example":"関係はかんけい。","zh":"四拍。"},{"text":"せきけい","meaning":"関をせきと読んだ形。","connection":"関わるの関はかん。","why":"せきけいではない。","example":"関（かん）。","zh":"音讀かん。"},{"text":"かんきょう","meaning":"環境の音。","connection":"境はきょう。係はけい。","why":"関係をかんきょうとは読まない。","example":"環境（かんきょう）。","zh":"環境。"}],"level":"N3"},{"id":"v107","kind":"vocab","point":"製品（読み）","group":"kanji","difficulty":3,"stem":"この工場（こうじょう）の製品（＿＿）は海外（かいがい）でも売（う）れている。","gloss":"這工廠的產品在海外也賣。不要讀成「作品」。","answer":"せいひん","options":[{"text":"せいひん","meaning":"產品。工廠做的商品。","connection":"製（せい）＋品（ひん）。","why":"工廠生産的是製品，讀せいひん。","example":"新製品。","zh":"新產品。"},{"text":"さくひん","meaning":"作品。人の創作物。","connection":"作（さく）＋品。","why":"さくひんは芸術や作文。工場の品はせいひん。漢字も製。","example":"作品（さくひん）を発表する。","zh":"發表作品。"},{"text":"せいほん","meaning":"品をほんと読んだ形。","connection":"品はひん。","why":"せいほんではない。","example":"製品はせいひん。","zh":"ひん。"},{"text":"しょうひん","meaning":"商品。","connection":"商（しょう）＋品。","why":"しょうひんは売る品全般の別の語。この漢字製品はせいひん。","example":"商品（しょうひん）。","zh":"商品。"}],"level":"N3"},{"id":"v108","kind":"vocab","point":"最近（読み）","group":"kanji","difficulty":2,"stem":"最近（＿＿）、あまり寝（ね）ていません。","gloss":"最近睡得不多。選讀音。","answer":"さいきん","options":[{"text":"さいきん","meaning":"最近。","connection":"最（さい）＋近（きん）。","why":"このごろは最近、讀さいきん。","example":"最近忙しい。","zh":"最近很忙。"},{"text":"さいご","meaning":"最後。","connection":"後はご。近ではない。","why":"さいごは終わり。","example":"最後（さいご）まで。","zh":"直到最後。"},{"text":"さいしょ","meaning":"最初。","connection":"初はしょ。","why":"さいしょは始まり。","example":"最初（さいしょ）に。","zh":"最初。"},{"text":"ちかきん","meaning":"近の訓を混ぜた形。","connection":"近い（ちかい）。最近の近はきん。","why":"ちかきんではない。","example":"近（きん）。","zh":"音讀きん。"}],"level":"N4"},{"id":"v109","kind":"vocab","point":"研究（読み）","group":"kanji","difficulty":3,"stem":"大学（だいがく）で環境（かんきょう）を研究（＿＿）している。","gloss":"在大學研究環境。選讀音。","answer":"けんきゅう","options":[{"text":"けんきゅう","meaning":"研究。","connection":"研（けん）＋究（きゅう）。","why":"深く調べるのは研究、讀けんきゅう。","example":"研究を続ける。","zh":"繼續研究。"},{"text":"けんきゅうう","meaning":"長音を増やした形。","connection":"きゅうは一拍の長音ですでにある。","why":"けんきゅうのあとにもううを足さない。","example":"研究（けんきゅう）。","zh":"け・ん・きゅ・う。"},{"text":"みがきゅう","meaning":"研の訓を混ぜた形。","connection":"研ぐ（とぐ）。音讀はけん。","why":"みがきゅうではない。","example":"研（けん）。","zh":"音讀けん。"},{"text":"けんきゅ","meaning":"最後のうが落ちている。","connection":"究はきゅう。","why":"けんきゅでは足りない。","example":"研究はけんきゅう。","zh":"四拍。"}],"level":"N3"},{"id":"v110","kind":"vocab","point":"理由（漢字）","group":"kanji","difficulty":2,"stem":"欠席（けっせき）の＿＿（りゆう）を書（か）いてください。","gloss":"請寫缺席的理由。選漢字。","answer":"理由","options":[{"text":"理由","meaning":"為什麼。","connection":"りゆう。理＋由。","why":"缺席要說明為什麼。漢字是理由。","example":"遅れた理由を話す。","zh":"說明遲到的理由。"},{"text":"原因","meaning":"客觀引起結果的原因。","connection":"げんいん。","why":"讀音不是りゆう。缺席時要寫的說明用理由。","example":"事故の原因。","zh":"事故的原因。"},{"text":"由来","meaning":"來歷。","connection":"ゆらい。","why":"りゆうではない。字的順序也不同。","example":"言葉の由来。","zh":"詞語的來歷。"},{"text":"理油","meaning":"由寫錯成油。","connection":"油讀あぶら或ゆ。理由的字是由。","why":"不寫理油。","example":"理由（りゆう）。","zh":"由。"}],"level":"N4"},{"id":"v111","kind":"vocab","point":"間に合う","group":"v-verb","difficulty":2,"stem":"走（はし）れば、始発（しはつ）に＿＿。","gloss":"跑的話就趕得上頭班車。","answer":"間に合う","options":[{"text":"間に合う","meaning":"趕得上。","connection":"に＋間に合う。始発に間に合う。","why":"跑就能趕上。始発に間に合う。","example":"締切に間に合う。","zh":"趕得上截止日期。"},{"text":"間に合わない","meaning":"趕不上。","connection":"否定。","why":"走れば表示趕得上。否定和條件相反。","example":"このままでは間に合わない。","zh":"這樣下去趕不上。"},{"text":"間がある","meaning":"中間有一段時間。","connection":"間がある。","why":"始発に間がある不是「趕得上」。走れば的目的是趕上。","example":"会議までまだ間がある。","zh":"離會議還有一段時間。"},{"text":"届く","meaning":"送到、夠得到。","connection":"に＋届く。","why":"電車に届く不說。人趕上用間に合う。","example":"荷物が届いた。","zh":"行李送到了。"}],"level":"N4"},{"id":"v112","kind":"vocab","point":"壊れる","group":"v-verb","difficulty":2,"stem":"落（お）としたら、時計（とけい）が＿＿。","gloss":"一摔，鐘就壞了。","answer":"壊れた","options":[{"text":"壊れた","meaning":"壞了。自動詞。機器。","connection":"が＋壊れる。時計が壊れた。","why":"鐘自己壞，沒有人當主語去弄壞。壊れた。","example":"パソコンが壊れた。","zh":"電腦壞了。"},{"text":"壊した","meaning":"人弄壞。他動詞。","connection":"を＋壊す。","why":"時計が壊した不成立。人は時計を壊した。","example":"子供がおもちゃを壊した。","zh":"小孩弄壞了玩具。"},{"text":"直った","meaning":"修好了。相反。","connection":"が＋直る。","why":"摔了之後變成修好，不合理。","example":"時計が直った。","zh":"鐘修好了。"},{"text":"割れた","meaning":"碎裂。玻璃、杯子。","connection":"が＋割れる。","why":"鐘的故障用壊れる。不一定碎成片。","example":"コップが割れた。","zh":"杯子碎了。"}],"level":"N4"},{"id":"v113","kind":"vocab","point":"比べる","group":"v-verb","difficulty":3,"stem":"二つの案（あん）を＿＿から、決（き）めよう。","gloss":"比較兩個方案之後再決定。","answer":"比べて","options":[{"text":"比べて","meaning":"比較。","connection":"を＋比べる。て形。比べてから決める。","why":"先比較再決定。比べてから。","example":"値段を比べる。","zh":"比較價格。"},{"text":"忘れて","meaning":"忘記。","connection":"を＋忘れる。","why":"忘れてから決める是忘掉之後再決定，和要比較之後決定相反。","example":"名前を忘れた。","zh":"忘了名字。"},{"text":"違って","meaning":"不同。","connection":"と＋違う。","why":"二つの案を違ってから不成立。","example":"予想と違った。","zh":"和預期不同。"},{"text":"同じで","meaning":"相同。","connection":"と＋同じ。","why":"同じでから、決めよう不自然。沒有比較這個動作。","example":"どちらも同じだ。","zh":"兩個都一樣。"}],"level":"N3"},{"id":"v114","kind":"vocab","point":"自由","group":"v-noun","difficulty":2,"stem":"この部屋（へや）は＿＿に使（つか）っていいです。","gloss":"這個房間可以自由使用。","answer":"自由","options":[{"text":"自由","meaning":"不受限制。","connection":"自由に＋動詞。自由に使っていい。","why":"許可的範圍很寬。自由に使っていいです。","example":"自由な時間。","zh":"可以自由支配的時間。"},{"text":"適当","meaning":"隨便、敷衍。","connection":"適当に使う。","why":"使っていい的禮貌許可用自由に。適当に使っていい聽起來像隨便用。","example":"適当に置いた。","zh":"隨便放了。"},{"text":"無理","meaning":"硬來、辦不到。","connection":"無理に＋動詞。","why":"無理に使っていい和いい衝突。","example":"無理に頼まない。","zh":"不要硬拜託。"},{"text":"無駄","meaning":"白費。","connection":"無駄に＋動詞。","why":"無駄に使っていい不是許可的說法。","example":"時間を無駄にした。","zh":"把時間浪費了。"}],"level":"N4"},{"id":"v115","kind":"vocab","point":"反対","group":"v-noun","difficulty":2,"stem":"その計画（けいかく）には＿＿です。危険（きけん）だからです。","gloss":"我反對那個計劃。因為危險。","answer":"反対","options":[{"text":"反対","meaning":"反對。","connection":"に＋反対です。計画には反対です。","why":"因為危險，所以不同意。反対です。","example":"その意見に反対だ。","zh":"反對那個意見。"},{"text":"賛成","meaning":"贊成。","connection":"に＋賛成。","why":"危險だから和贊成相反。","example":"その案に賛成です。","zh":"贊成那個方案。"},{"text":"関係","meaning":"有關係。","connection":"に＋関係がある。","why":"計画には関係です不成立。","example":"私には関係ない。","zh":"和我無關。"},{"text":"適当","meaning":"合適。","connection":"に＋適当だ。","why":"計画には適当です是計劃合適，和危險だから矛盾。","example":"この仕事に適当な人。","zh":"適合這工作的人。"}],"level":"N4"},{"id":"v116","kind":"vocab","point":"便利","group":"v-noun","difficulty":2,"stem":"駅（えき）に近（ちか）くて、＿＿なアパートです。","gloss":"離車站近，是間方便的公寓。","answer":"便利","options":[{"text":"便利","meaning":"方便。","connection":"便利な＋名詞。近くて便利。","why":"近所以方便。便利なアパートです。","example":"便利な道具。","zh":"方便的工具。"},{"text":"不便","meaning":"不方便。相反。","connection":"不便な。","why":"離車站近却不方便，理由和評價相反。","example":"駅から遠くて不便だ。","zh":"離車站遠，不方便。"},{"text":"無料","meaning":"免費。","connection":"無料の。","why":"近推不出免費。近くて無料なアパートとは言わない。","example":"入場は無料です。","zh":"入場免費。"},{"text":"無駄","meaning":"白費。","connection":"無駄な。","why":"近くて無駄なアパート不自然。","example":"無駄な出費。","zh":"白花的錢。"}],"level":"N4"},{"id":"v117","kind":"vocab","point":"無理","group":"v-noun","difficulty":3,"stem":"一日（いちにち）でこの仕事（しごと）を終（お）わらせるのは＿＿だ。","gloss":"一天做完這件工作是辦不到的。","answer":"無理","options":[{"text":"無理","meaning":"辦不到、太勉強。","connection":"のは＋無理だ。","why":"一天做完超出能力。無理だ。","example":"そんなお願い、無理です。","zh":"那樣的請求辦不到。"},{"text":"自由","meaning":"自由、隨意。","connection":"自由だ。","why":"終わらせるのは自由だ不是能不能做到。","example":"参加は自由だ。","zh":"參加與否隨意。"},{"text":"適当","meaning":"合適。","connection":"適当だ。","why":"適当だ是那樣做合適，不是做不到。","example":"この量なら一日で適当だ。","zh":"這個量的話一天正合適。那是做得到。"},{"text":"当然","meaning":"理所當然。","connection":"当然だ。","why":"当然だ是應該如此，不是不可能。","example":"断るのは当然だ。","zh":"拒絕是當然的。"}],"level":"N3"},{"id":"v118","kind":"vocab","point":"約束","group":"v-noun","difficulty":2,"stem":"友達（ともだち）と三時（さんじ）に会（あ）う＿＿をしました。","gloss":"和朋友約好三點見。","answer":"約束","options":[{"text":"約束","meaning":"和人約定。","connection":"約束をする。会う約束。","why":"和人說定了見面。約束をしました。","example":"約束を守る。","zh":"遵守約定。"},{"text":"予定","meaning":"自己的日程。","connection":"予定がある。","why":"人と取り決めたのは約束。予定は日程に入っていること。","example":"明日は予定がある。","zh":"明天有安排。"},{"text":"予約","meaning":"向店家預約。","connection":"予約をする。","why":"朋友見面用約束。予約是酒店、座位。","example":"ホテルを予約した。","zh":"訂了酒店。"},{"text":"注意","meaning":"提醒、警告。","connection":"注意をする。","why":"会う注意をした不是約會。","example":"先生に注意された。","zh":"被老師提醒了。"}],"level":"N4"},{"id":"v119","kind":"vocab","point":"意味","group":"v-noun","difficulty":2,"stem":"この漢字（かんじ）の＿＿が分（わ）かりません。読み方（かた）は知（し）っています。","gloss":"讀法我知道，但不知道這個漢字的意思。","answer":"意味","options":[{"text":"意味","meaning":"意思。","connection":"の＋意味。漢字の意味。","why":"後句說讀法已經知道，所以空格是意思。意味が分かりません。","example":"言葉の意味を調べる。","zh":"查詞的意思。"},{"text":"理由","meaning":"理由。","connection":"理由。","why":"一個漢字沒有「缺席理由」那種理由。字表示的內容是意味。","example":"欠席の理由。","zh":"缺席的理由。"},{"text":"関係","meaning":"關係。","connection":"関係。","why":"漢字の関係が分かりません不是這個字本身的內容。","example":"二つの関係。","zh":"兩者的關係。"},{"text":"順番","meaning":"順序。","connection":"順番。","why":"漢字の順番が分かりません是字的次序，後句の読み方は知っていると合わない。","example":"順番に並ぶ。","zh":"按順序排。"}],"level":"N4"}]</script>
<script>
const BANK = JSON.parse(document.getElementById("bank").textContent);
const GROUP = JSON.parse(document.getElementById("groups").textContent);
const KEY = "n3-drill-v3";
const app = document.querySelector("#app");

const empty = () => ({ points: {}, recentIds: [], target: 3, rounds: [] });

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return empty();
    const p = JSON.parse(raw);
    return {
      points: p.points || {},
      recentIds: p.recentIds || [],
      target: clamp(p.target ?? 3),
      rounds: p.rounds || [],
    };
  } catch {
    return empty();
  }
}
function save(s) {
  localStorage.setItem(KEY, JSON.stringify(s));
}
function clamp(n) {
  return Math.min(5, Math.max(2, Math.round(n)));
}
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function rng(seed) {
  let a = seed || 1;
  return () => {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(item, salt) {
  const texts = item.options.map((o) => o.text);
  const rand = rng(hash(item.id + salt));
  for (let i = texts.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [texts[i], texts[j]] = [texts[j], texts[i]];
  }
  return texts;
}
function nextTarget(current, correct, total) {
  const acc = total === 0 ? 0 : correct / total;
  if (acc >= 0.8) return clamp(current + 1);
  if (acc <= 0.4) return clamp(current - 1);
  return clamp(current);
}
function buildRound(store) {
  const salt = String(Date.now());
  const recent = new Set(store.recentIds.slice(0, 40));
  const target = store.target;
  const unseenLeft = BANK.some((q) => !store.points[q.point]);
  const scoreOf = (item, reviewSlot) => {
    const stat = store.points[item.point];
    let score = 0;
    if (!stat) score += 10;
    else if (stat.wrong > stat.correct) score += 4;
    else score += 1;
    if (reviewSlot) {
      score += item.difficulty <= target ? 1 : 0;
      score += hash(item.id) % 5;
    } else {
      const dist = Math.abs(item.difficulty - target);
      score += dist === 0 ? 5 : dist === 1 ? 2 : -4;
    }
    if (recent.has(item.id)) score -= 8;
    return score;
  };
  const picked = [];
  const usedPoints = new Set();
  const usedGroups = new Set();
  let weakUsed = 0;
  const pull = (filter, ignoreWeakCap = false) => {
    const item = BANK.filter((q) => {
      if (usedPoints.has(q.point)) return false;
      if (!filter(q)) return false;
      const stat = store.points[q.point];
      const weak = !!stat && stat.wrong > stat.correct;
      if (!ignoreWeakCap && weak && weakUsed >= 2 && unseenLeft) return false;
      return true;
    }).sort((a, b) => {
      const ga = usedGroups.has(a.group) ? -2 : 0;
      const gb = usedGroups.has(b.group) ? -2 : 0;
      return scoreOf(b, ignoreWeakCap) + gb - (scoreOf(a, ignoreWeakCap) + ga) || a.id.localeCompare(b.id);
    })[0];
    if (!item) return false;
    const stat = store.points[item.point];
    if (!ignoreWeakCap && stat && stat.wrong > stat.correct) weakUsed += 1;
    picked.push(item);
    usedPoints.add(item.point);
    usedGroups.add(item.group);
    return true;
  };
  const review = (q) => q.level === "N4" || q.level === "N5";
  pull((q) => review(q) && q.kind === "grammar", true);
  pull((q) => review(q) && q.kind === "vocab", true);
  while (picked.filter(review).length < 2) {
    if (!pull(review, true)) break;
  }
  while (picked.length < 10) {
    const grammar = picked.filter((q) => q.kind === "grammar").length;
    const vocab = picked.filter((q) => q.kind === "vocab").length;
    const prefer = grammar < 7 ? "grammar" : vocab < 3 ? "vocab" : "";
    if (prefer && pull((q) => q.kind === prefer)) continue;
    if (!pull(() => true)) break;
  }
  return picked.map((item) => ({ ...item, order: shuffle(item, salt) }));
}
function commit(store, answers, targetUsed) {
  const points = { ...store.points };
  const now = Date.now();
  for (const ans of answers) {
    const prev = points[ans.point] || { correct: 0, wrong: 0, last: 0 };
    points[ans.point] = {
      correct: prev.correct + (ans.correct ? 1 : 0),
      wrong: prev.wrong + (ans.correct ? 0 : 1),
      last: now,
    };
  }
  const correct = answers.filter((a) => a.correct).length;
  const next = nextTarget(targetUsed, correct, answers.length);
  return {
    points,
    recentIds: [...answers.map((a) => a.id).reverse(), ...store.recentIds].slice(0, 80),
    target: next,
    rounds: [{ correct, total: answers.length, target: targetUsed, at: now }, ...store.rounds].slice(0, 12),
  };
}
function unique(kind) {
  return [...new Set(BANK.filter((q) => q.kind === kind).map((q) => q.point))];
}
function levelCount(store, level) {
  const list = [...new Set(BANK.filter((q) => q.level === level).map((q) => q.point))];
  return { seen: list.filter((p) => store.points[p]).length, total: list.length };
}
function coverage(store) {
  const g = unique("grammar");
  const v = unique("vocab");
  const seen = (list) => list.filter((p) => store.points[p]).length;
  const weak = Object.entries(store.points)
    .filter(([, s]) => s.wrong > s.correct)
    .map(([point]) => point);
  return {
    grammar: { seen: seen(g), total: g.length },
    vocab: { seen: seen(v), total: v.length },
    weak,
    n3: levelCount(store, "N3"),
    n4: levelCount(store, "N4"),
    n5: levelCount(store, "N5"),
  };
}
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}
function rubyInto(node, text) {
  const re = /(\p{Script=Han}+)（([ぁ-んァ-ンー]+)）/gu;
  let last = 0;
  let m;
  while ((m = re.exec(text))) {
    node.append(text.slice(last, m.index));
    const ruby = document.createElement("ruby");
    ruby.append(m[1]);
    const rt = document.createElement("rt");
    rt.textContent = m[2];
    ruby.append(rt);
    node.append(ruby);
    last = m.index + m[0].length;
  }
  node.append(text.slice(last));
}
function optionOf(item, text) {
  return item.options.find((o) => o.text === text);
}

let store = load();
let phase = { name: "home" };

function render() {
  app.replaceChildren();
  const wrap = el("div", "wrap");
  const header = el("header", "top");
  const titles = el("div");
  titles.append(el("p", "kicker", "JLPT N3 · 語言知識"));
  titles.append(el("h1", null, "日檢 N3 題庫"));
  header.append(titles);
  if (phase.name !== "home") {
    const back = el("button", "ghost", "回到範圍");
    back.type = "button";
    back.onclick = () => {
      phase = { name: "home" };
      render();
    };
    header.append(back);
  }
  wrap.append(header);
  if (phase.name === "home") wrap.append(home());
  if (phase.name === "quiz") wrap.append(quiz());
  if (phase.name === "result") wrap.append(result());
  app.append(wrap);
}

function home() {
  const stats = coverage(store);
  const main = el("main");
  const card = el("section", "card");
  card.append(
    el(
      "p",
      "lead",
      "一輪十題，只考文法同語彙。其中約兩題係 N4 或 N5。答完先睇每個選項的接續同點解啱、點解錯。難度跟最近一輪走。高頻句型會換接續或換用法再考，語彙會考讀音、漢字寫法同助數詞，文法會考活用同口語形，唔係永遠同一句。",
    ),
  );
  const row = el("div", "row");
  const start = el("button", "primary", "開始本輪");
  start.type = "button";
  start.onclick = () => {
    phase = {
      name: "quiz",
      questions: buildRound(store),
      index: 0,
      choice: null,
      checked: false,
      answers: [],
      target: store.target,
    };
    render();
  };
  row.append(start);
  const last = store.rounds[0];
  row.append(
    el(
      "p",
      "muted",
      `現時難度 ${store.target} / 5${last ? ` · 上一輪 ${last.correct}/${last.total}` : " · 尚未作答"}`,
    ),
  );
  card.append(row);
  main.append(card);

  const grid = el("section", "grid");
  grid.append(stat("文法點", `${stats.grammar.seen}/${stats.grammar.total}`, "碰過 / 題庫"));
  grid.append(stat("語彙點", `${stats.vocab.seen}/${stats.vocab.total}`, "含漢字讀音"));
  grid.append(stat("題目", String(BANK.length), "每題四個選項都有解釋"));
  main.append(grid);
  main.append(
    el(
      "p",
      "levels",
      `N3 ${stats.n3.seen}/${stats.n3.total} · N4 ${stats.n4.seen}/${stats.n4.total} · N5 ${stats.n5.seen}/${stats.n5.total}`,
    ),
  );

  if (stats.weak.length) {
    const weak = el("section");
    weak.append(el("h2", "label", "尚未站穩"));
    const chips = el("ul", "chips");
    stats.weak.slice(0, 8).forEach((point) => {
      const li = el("li", "chip seal", point);
      chips.append(li);
    });
    weak.append(chips);
    main.append(weak);
  }

  const cover = el("section");
  const h = el("h2", "serif");
  h.textContent = "覆蓋範圍";
  cover.append(h);
  const groups = new Map();
  for (const item of BANK) {
    const list = groups.get(item.group) || [];
    if (!list.some((row) => row.point === item.point)) list.push(item);
    groups.set(item.group, list);
  }
  groups.forEach((points, group) => {
    const seen = points.filter((p) => store.points[p.point]).length;
    const details = document.createElement("details");
    details.className = "card fold";
    const summary = document.createElement("summary");
    summary.append(el("span", null, GROUP[group] || group));
    summary.append(el("span", "muted", `${seen}/${points.length}`));
    details.append(summary);
    const chips = el("ul", "chips");
    points.forEach((p) => {
      const stat = store.points[p.point];
      const tone = !stat ? "paper" : stat.wrong > stat.correct ? "seal" : "moss";
      chips.append(el("li", `chip ${tone}`, p.point));
    });
    details.append(chips);
    cover.append(details);
  });
  main.append(cover);
  return main;
}

function stat(label, value, hint) {
  const box = el("div", "card stat");
  box.append(el("p", "muted", label));
  box.append(el("p", "num", value));
  box.append(el("p", "muted", hint));
  return box;
}

function quiz() {
  const item = phase.questions[phase.index];
  const main = el("main");
  const meta = el("div", "meta");
  meta.append(el("span", null, `${phase.index + 1} / ${phase.questions.length}`));
  meta.append(el("span", null, `${item.level} · ${item.kind === "grammar" ? "文法" : "語彙"} · 難度 ${item.difficulty}`));
  main.append(meta);
  const bar = el("div", "bar");
  const fill = el("div", "fill");
  fill.style.width = `${((phase.index + (phase.checked ? 1 : 0)) / phase.questions.length) * 100}%`;
  bar.append(fill);
  main.append(bar);
  main.append(el("p", "muted", phase.checked ? item.gloss : "選出最自然的一項。答完先睇接續，先至下一題。"));
  const h = el("h2", "stem");
  rubyInto(h, item.stem);
  main.append(h);
  const letters = ["A", "B", "C", "D"];
  item.order.forEach((text, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "opt";
    const selected = phase.choice === text;
    const isAnswer = text === item.answer;
    if (phase.checked && isAnswer) btn.classList.add("good");
    else if (phase.checked && selected && !isAnswer) btn.classList.add("bad");
    else if (selected) btn.classList.add("pick");
    btn.disabled = phase.checked;
    btn.append(el("span", "letter", letters[i]));
    btn.append(el("span", null, text));
    btn.onclick = () => {
      if (phase.checked) return;
      phase.choice = text;
      render();
    };
    main.append(btn);
  });
  if (!phase.checked) {
    const reveal = el("button", "primary wide", "睇解釋");
    reveal.type = "button";
    reveal.disabled = !phase.choice;
    reveal.onclick = () => {
      const correct = phase.choice === item.answer;
      phase.answers = [
        ...phase.answers,
        { id: item.id, point: item.point, choice: phase.choice, correct },
      ];
      phase.checked = true;
      render();
    };
    main.append(reveal);
  } else {
    const ok = phase.choice === item.answer;
    const line = el("p", ok ? "ok" : "no");
    line.append(ok ? "啱。" : `唔啱。正解係「${item.answer}」。`);
    line.append(el("span", "muted", " " + item.point));
    main.append(line);
    phase.questions[phase.index].order.forEach((text) => main.append(explain(item, text)));
    const last = phase.index + 1 === phase.questions.length;
    const next = el("button", "primary wide", last ? "本輪結果" : "下一題");
    next.type = "button";
    next.onclick = () => {
      if (phase.index + 1 < phase.questions.length) {
        phase.index += 1;
        phase.choice = null;
        phase.checked = false;
        render();
        return;
      }
      store = commit(store, phase.answers, phase.target);
      save(store);
      phase = { name: "result", answers: phase.answers, target: phase.target };
      render();
    };
    main.append(next);
  }
  return main;
}

function explain(item, text) {
  const opt = optionOf(item, text);
  const right = text === item.answer;
  const box = el("article", right ? "card good" : "card");
  const head = el("div", "ex-head");
  head.append(el("strong", null, opt.text));
  head.append(el("span", "muted", right ? "正解" : text === phase.choice ? "你的選擇" : "其他選項"));
  box.append(head);
  box.append(row("意思", opt.meaning));
  box.append(row("接續", opt.connection));
  box.append(row(right ? "點解啱" : "點解唔啱", opt.why));
  box.append(row("例句", opt.example));
  box.append(row("譯文", opt.zh));
  return box;
}
function row(term, value) {
  const line = el("div", "dl");
  line.append(el("span", "term", term));
  const dd = el("span");
  rubyInto(dd, value);
  line.append(dd);
  return line;
}

function result() {
  const correct = phase.answers.filter((a) => a.correct).length;
  const missed = phase.answers.filter((a) => !a.correct);
  const moved =
    store.target > phase.target
      ? "下一輪會難一點，多考易混淆的接續。"
      : store.target < phase.target
        ? "下一輪會回到核心句型。"
        : "下一輪維持這個難度，但會換未考過的文法。";
  const main = el("main");
  const card = el("section", "card");
  card.append(el("p", "muted", "本輪"));
  const score = el("p", "score");
  score.append(String(correct));
  score.append(el("span", null, `/${phase.answers.length}`));
  card.append(score);
  card.append(el("p", null, moved));
  card.append(el("p", "muted", `難度 ${phase.target} → ${store.target}。每一輪仍會夾約兩題 N4／N5。這是練習指標，不是官方日檢分數。`));
  const row = el("div", "row");
  const again = el("button", "primary", "再來一輪");
  again.type = "button";
  again.onclick = () => {
    phase = {
      name: "quiz",
      questions: buildRound(store),
      index: 0,
      choice: null,
      checked: false,
      answers: [],
      target: store.target,
    };
    render();
  };
  const homeBtn = el("button", "ghost", "看覆蓋範圍");
  homeBtn.type = "button";
  homeBtn.onclick = () => {
    phase = { name: "home" };
    render();
  };
  row.append(again, homeBtn);
  card.append(row);
  main.append(card);
  if (missed.length) {
    const sec = el("section");
    sec.append(el("h2", "serif", "呢輪錯過"));
    missed.forEach((a) => {
      sec.append(el("p", "card miss", `${a.point} · 你選了「${a.choice}」`));
    });
    main.append(sec);
  }
  return main;
}

render();

</script>
</body>
