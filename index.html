だ。","zh":"因為近，難怪常去。"}],"level":"N3"},{"id":"n301","kind":"grammar","point":"はずだ","group":"modal","difficulty":3,"stem":"鍵（かぎ）は自分（じぶん）で机（つくえ）に置（お）いた。だから、そこにある＿＿。","gloss":"鑰匙是我自己放在桌上的。所以應該在那裡。","answer":"はずだ","options":[{"text":"はずだ","meaning":"按已知事實，理應如此。尚未親眼確認的推測。","connection":"普通形＋はずだ。な形容詞＋なはずだ。名詞＋のはずだ。","why":"鑰匙是自己放的，這個理由推出「應該在桌上」。是邏輯預期，不是事後恍然，也不是傳聞。","example":"九時に出たなら、もう着いているはずだ。","zh":"九點出門的話，應該已經到了。"},{"text":"わけだ","meaning":"難怪、也就是說。已知原因和眼前結果對上了。","connection":"普通形＋わけだ。","why":"桌子上有沒有鑰匙還沒看到。わけだ要用在結果已經明白的時候，這裡只是按理由預測。","example":"自分で置いたから、ここにあるわけだ。","zh":"因為是自己放的，所以當然在這裡。這句要已經看見。"},{"text":"ことだ","meaning":"應該這麼做。忠告。","connection":"辞書形＋ことだ。","why":"「あることだ」不是「應該在」。ことだ勸人做事，不預測東西在哪。","example":"自分で確認することだ。","zh":"應該自己確認。"},{"text":"そうだ","meaning":"樣態要語幹；伝聞要普通形，而且常有消息來源。","connection":"ある＋そうだ會變成傳聞「聽說在」。樣態則是「ありそうだ」。","why":"沒有人告訴你鑰匙在桌上。自己放的這個理由要用はず，不是そうだ。","example":"係りの人によると、鍵はここにあるそうだ。","zh":"據負責人說，鑰匙在這裡。"}],"level":"N3"},{"id":"n302","kind":"grammar","point":"はずがない","group":"modal","difficulty":4,"stem":"あれほど注意（ちゅうい）したのだから、彼（かれ）が忘（わす）れる＿＿。","gloss":"都提醒到那個地步了，他不可能忘記。","answer":"はずがない","options":[{"text":"はずがない","meaning":"按理絕對不會。根據已知事實否定可能性。","connection":"普通形＋はずがない。忘れる＋はずがない。","why":"「あれほど注意した」是證據，所以忘記這件事站不住。用はずがない。","example":"鍵をかけたのだから、開いているはずがない。","zh":"鎖過了，不可能開著。"},{"text":"わけではない","meaning":"並不是。部分否定。","connection":"普通形＋わけではない。","why":"「並不是忘記」太弱，也不合「提醒到那個地步」的強烈否定。","example":"忘れたわけではないが、時間がなかった。","zh":"並不是忘了，是沒有時間。"},{"text":"かもしれない","meaning":"也許會。可能性開放。","connection":"普通形＋かもしれない。","why":"也許忘記和「不可能忘記」方向相反。","example":"忙しいから、忘れるかもしれない。","zh":"因為忙，也許會忘。"},{"text":"ことはない","meaning":"不必、用不著。","connection":"辞書形＋ことはない。","why":"「不必忘記」不成句意。這不是在說有沒有必要，而是按理不可能。","example":"心配することはない。","zh":"不必擔心。"}],"level":"N3"},{"id":"n303","kind":"grammar","point":"かもしれない","group":"modal","difficulty":2,"stem":"空（そら）が暗（くら）い。雨（あめ）が降（ふ）る＿＿から、傘（かさ）を持（も）っていこう。","gloss":"天暗了。也許會下雨，帶把傘去吧。","answer":"かもしれない","options":[{"text":"かもしれない","meaning":"也許。說話人沒有把握，可能性開放。","connection":"普通形＋かもしれない。降る＋かもしれない。","why":"天暗只是不完全的線索，所以帶傘是以防萬一。把握不高，用かもしれない。","example":"道が込むかもしれない。早く出よう。","zh":"路也許會堵。早點出門吧。"},{"text":"に違いない","meaning":"一定是。很強的斷定。","connection":"普通形＋に違いない。","why":"只是天色暗，還不能斷定一定下雨。強度過了。","example":"雷が鳴っている。もうすぐ降るに違いない。","zh":"打雷了。一定快下雨。"},{"text":"はずがない","meaning":"按理不可能。","connection":"普通形＋はずがない。","why":"「不可能下雨」就不必帶傘。和後句相反。","example":"この季節に雪が降るはずがない。","zh":"這個季節不可能下雪。"},{"text":"そうになっている","meaning":"沒有這個接法。","connection":"樣態是語幹＋そうだ：降りそうだ。不接辞書形。","why":"降るそうになっている接不上。看起來要下雨應是「降りそうだ」，而且那是外觀，不是「也許所以帶傘」的保留判斷。","example":"雨が降りそうだ。","zh":"看起來要下雨。"}],"level":"N3"},{"id":"n304","kind":"grammar","point":"に違いない","group":"modal","difficulty":4,"stem":"部屋（へや）の電気（でんき）がついている。田中（たなか）さんはまだ中（なか）にいる＿＿。","gloss":"房間燈還亮着。田中一定還在裡面。","answer":"に違いない","options":[{"text":"に違いない","meaning":"說話人很有自信的判斷：一定是這樣。","connection":"普通形＋に違いない。いる＋に違いない。名詞、な形容詞要加だ：病気だに違いない。","why":"燈亮着被當成充分證據，語氣是確信，不是「也許」也不是別人告訴你。","example":"あの靴は高そうだ。値段は相当だに違いない。","zh":"那雙鞋看起來很貴。價錢一定不低。"},{"text":"かもしれない","meaning":"也許，沒把握。","connection":"普通形＋かもしれない。","why":"燈都亮着還只說也許，弱過這句的判斷。","example":"電気が消えている。もう帰ったかもしれない。","zh":"燈關了。也許已經回去。"},{"text":"そうだ","meaning":"傳聞，或樣態。","connection":"いるそうだ＝聽說在。樣態不接辞書形いる。","why":"沒有消息來源。不是「聽說他在」。確信用に違いない。","example":"管理人によると、まだいるそうだ。","zh":"據管理員說，還在。"},{"text":"わけにはいかない","meaning":"情理上不能做。","connection":"辞書形＋わけにはいかない。","why":"「不能在裡面」和燈亮推出的判斷無關。","example":"今さら帰るわけにはいかない。","zh":"事到如今不能回去。"}],"level":"N3"},{"id":"n305","kind":"grammar","point":"ようだ","group":"modal","difficulty":4,"stem":"この味（あじ）は、母（はは）の料理（りょうり）の＿＿。","gloss":"這個味道像母親做的菜。","answer":"ようだ","options":[{"text":"ようだ","meaning":"好像、像。可以是比喻，也可以是根據觀察的推測。","connection":"名詞＋の＋ようだ。空格前已有「の」，所以接ようだ。動詞・い形容詞則直接接普通形。","why":"味道和母親的菜相似。名詞後面要「の＋ようだ」，空格前的のが正好接上。","example":"まるで雪のようだ。","zh":"簡直像雪。"},{"text":"らしい","meaning":"聽起來像有根據的判斷，或「很有那種典型」。","connection":"名詞直接＋らしい：料理らしい。中間不能再加「の」。","why":"料理のらしい多了「の」。要說「典型的母親味道」應是「母の料理らしい」，不插在の後面。","example":"この味は母の料理らしい。","zh":"這味道就是母親做菜的那個味。前面不加の。"},{"text":"そうだ","meaning":"樣態不接名詞加の；伝聞是「だそうだ」。","connection":"名詞＋だそうだ才是傳聞。名詞＋の＋そうだ不成立。","why":"料理のそうだ接不上。沒有人說「聽說是母親的菜」，句子是在比較味道。","example":"母の料理だそうだ。","zh":"聽說是母親做的菜。"},{"text":"はずだ","meaning":"按理應該。","connection":"名詞＋の＋はずだ。","why":"「按理是母親的菜」需要先有理由。這裡只是味道像，是比喻，用ようだ。","example":"レシピどおりだから、母の料理の味のはずだ。","zh":"照食譜做的，味道理應像母親的菜。"}],"level":"N3"},{"id":"n306","kind":"grammar","point":"べきだ","group":"advice","difficulty":3,"stem":"医者（いしゃ）に言（い）われたのだから、この薬（くすり）は食後（しょくご）に飲（の）む＿＿。","gloss":"既然醫生說了，這個藥就應該飯後吃。","answer":"べきだ","options":[{"text":"べきだ","meaning":"有責任、有義務應該做。","connection":"動詞辞書形＋べきだ。する變成すべきだ或するべきだ，兩者都見，N3 多用すべきだ。飲む是普通動詞，飲むべきだ。","why":"醫生的指示是外來的義務，不是自己突然決定，也不是常理感慨。飲む＋べきだ。","example":"借りた物は返すべきだ。","zh":"借來的東西應該還。"},{"text":"ものだ","meaning":"本來就會；從前常常。","connection":"辞書形＋ものだ。","why":"「藥本來就飯後吃」是常理口吻，沒有用上「醫生說了」這個義務。","example":"薬は指示どおり飲むものだ。","zh":"藥本來就該照指示吃。那是常理，不是這句的義務。"},{"text":"ことにした","meaning":"自己決定。","connection":"辞書形＋ことにする。","why":"不是自己決定飯後吃，是醫生要求。決定者不是主語本人。","example":"私は食後に飲むことにした。","zh":"我決定飯後吃。"},{"text":"わけにはいかない","meaning":"情理上不能。","connection":"辞書形＋わけにはいかない。","why":"「不能飯後吃」和醫囑相反。","example":"運転の前に飲むわけにはいかない。","zh":"開車前不能吃這個。"}],"level":"N3"},{"id":"n307","kind":"grammar","point":"やすい","group":"tendency","difficulty":2,"stem":"このペンは太（ふと）いので、字（じ）が書（か）き＿＿。","gloss":"這支筆很粗，所以字好寫。","answer":"やすい","options":[{"text":"やすい","meaning":"容易做。","connection":"ます語幹＋やすい。書く→書きやすい。","why":"空格在「書き」後面。筆粗造成容易寫。語幹＋やすい。","example":"この道は分かりやすい。","zh":"這條路容易懂。"},{"text":"にくい","meaning":"難做。","connection":"ます語幹＋にくい。","why":"筆粗若是優點，後句應是好寫，不是難寫。にくい方向反了。","example":"この字は読みにくい。","zh":"這個字難讀。"},{"text":"がたい","meaning":"心理上難以。","connection":"ます語幹＋がたい。信じがたい。","why":"好不好寫是操作難度，不是心理上無法接受。書きがたい不形容筆。","example":"認めがたい事実。","zh":"難以承認的事實。"},{"text":"そうだ","meaning":"看起來要。","connection":"語幹＋そうだ。書きそうだ＝看起來快要寫。","why":"不是「看起來要寫」，是筆的特性讓字容易寫成。","example":"今にも書きそうだ。","zh":"眼看就要寫了。"}],"level":"N3"},{"id":"n308","kind":"grammar","point":"にくい","group":"tendency","difficulty":3,"stem":"この説明書（せつめいしょ）は字（じ）が小（ちい）さくて、読（よ）み＿＿。","gloss":"這份說明書字小，難讀。","answer":"にくい","options":[{"text":"にくい","meaning":"做起來費力、不容易。","connection":"ます語幹＋にくい。読む→読みにくい。","why":"字小造成閱讀困難，是操作上的難，不是心理拒絕。読み＋にくい。","example":"暗くて、本が読みにくい。","zh":"太暗，書難讀。"},{"text":"がたい","meaning":"從心裡難以接受、難以做到。書面。","connection":"ます語幹＋がたい。","why":"読みがたい會變成「不忍讀、無法去讀」的心理。字小是眼睛的困難，用にくい。","example":"忘れがたい思い出。","zh":"難忘的回憶。"},{"text":"やすい","meaning":"容易。","connection":"ます語幹＋やすい。","why":"字小不會讓說明書好讀。方向反了。","example":"字が大きいので、読みやすい。","zh":"字大，所以好讀。"},{"text":"っぽい","meaning":"看起來挺……。","connection":"名詞或形容詞語幹＋っぽい。不接ます語幹表示難易。","why":"読みっぽい不表示難讀。","example":"子供っぽい絵だ。","zh":"畫風挺孩子氣。"}],"level":"N3"},{"id":"n309","kind":"grammar","point":"気味","group":"tendency","difficulty":4,"stem":"今日（きょう）は少（すこ）し風邪（かぜ）＿＿なので、早め（はやめ）に帰（かえ）る。","gloss":"今天有點感冒的樣子，所以早點回去。","answer":"気味","options":[{"text":"気味","meaning":"稍微有一點（多半不想要的狀態）。程度輕。","connection":"ます語幹或名詞＋気味。風邪は名詞，風邪気味。","why":"不是發高燒或常年生病，是今天略有感冒。名詞＋気味。","example":"最近、疲れ気味だ。","zh":"最近有點累。"},{"text":"がち","meaning":"往往容易發生。傾向，不是此刻已有的輕微狀態。","connection":"ます語幹・名詞＋がち。","why":"風邪がち會像「很容易感冒的體質」。句子是今天有一點，用気味。","example":"冬は風邪をひきがちだ。","zh":"冬天容易感冒。"},{"text":"そう","meaning":"看起來。要接在動詞或形容詞的語幹。","connection":"語幹＋そうだ。名詞「風邪」不能直接加そう。","why":"風邪そう不成立。名詞的輕微狀態用気味，樣態そう不接名詞。","example":"熱が出そうだ。","zh":"好像要發燒。"},{"text":"すぎ","meaning":"過於。","connection":"動詞・形容詞の語幹＋すぎる。名詞には接けない。","why":"風邪すぎ不成立。而且「少し」是輕微，不是過度。","example":"働きすぎて、倒れた。","zh":"工作過度，倒下了。"}],"level":"N3"},{"id":"n310","kind":"grammar","point":"きる","group":"aspect","difficulty":4,"stem":"三百頁（さんびゃくページ）の本（ほん）を、一日（いちにち）で読（よ）み＿＿。","gloss":"三百頁的書，一天就讀完了。","answer":"きった","options":[{"text":"きった","meaning":"做到底、完全做完。","connection":"ます語幹＋きる。読む→読みきる。た形は読みきった。","why":"一天把三百頁全部讀完。読み＋きった。きる是完了，不是讀到一半。","example":"マラソンを走りきった。","zh":"馬拉松跑完了。"},{"text":"かけた","meaning":"開始做，或做到一半。","connection":"ます語幹＋かける。読みかけた。","why":"読みかけた是還沒讀完。和「一天讀完」相反。","example":"読みかけたまま、寝てしまった。","zh":"讀到一半就睡着了。"},{"text":"始めた","meaning":"開始做。","connection":"ます語幹＋始める。読む→読み始める。た形是読み始めた。","why":"接上之後是「一天就開始讀」，只說起點，三百頁沒有讀完。全部讀完是語幹＋きる的た形：読みきった。","example":"昨日、その本を読み始めた。","zh":"昨天開始讀那本書。"},{"text":"がちだ","meaning":"往往會做。","connection":"ます語幹＋がち。読みがちだ。後面不再用完了的た。","why":"読みがちだ是「往往會讀」，不是這一次讀完。","example":"夜更かししがちだ。","zh":"往往會熬夜。"}],"level":"N3"},{"id":"n311","kind":"grammar","point":"てくる","group":"change","difficulty":3,"stem":"最近（さいきん）、この道（みち）は車（くるま）が増（ふ）えて＿＿。","gloss":"最近這條路的車越來越多了。","answer":"きた","options":[{"text":"きた","meaning":"變化從以前持續到現在。說話人感到已經變成這樣。","connection":"動詞て形＋くる。増える→増えてくる。過去はきた。","why":"「最近」表示直到現在的變化。増えてきた。不是從今以後。","example":"日本語が分かってきた。","zh":"日語漸漸懂了。"},{"text":"いった","meaning":"變化從現在走向將來，離開說話的現在。","connection":"て形＋いく。","why":"最近不能和「往後會變多」的いく搭配。時間方向反了。","example":"これからも増えていくだろう。","zh":"今後也會繼續增加吧。"},{"text":"おいた","meaning":"事先做好。","connection":"て形＋おく。","why":"車變多不是有人事先準備的動作。","example":"席を取っておいた。","zh":"事先佔了位子。"},{"text":"みた","meaning":"試着做。","connection":"て形＋みる。","why":"沒有人試着讓車變多。","example":"乗ってみた。","zh":"試着坐了坐。"}],"level":"N3"},{"id":"n312","kind":"grammar","point":"ていく","group":"change","difficulty":3,"stem":"このままでは、人口（じんこう）は減（へ）って＿＿だろう。","gloss":"這樣下去，人口大概會繼續減少。","answer":"いく","options":[{"text":"いく","meaning":"從現在走向將來，變化會繼續下去。","connection":"動詞て形＋いく。減る→減っていく。","why":"「このままでは」是往後的預測。減っていく。","example":"これからも暖かくなっていく。","zh":"往後還會繼續變暖。"},{"text":"くる","meaning":"變化來到現在。","connection":"て形＋くる。","why":"くる把變化收到現在為止。句子是今後的預測，方向不對。","example":"これまで減ってきた。","zh":"到目前為止減少了。"},{"text":"しまう","meaning":"完了，或後悔。","connection":"て形＋しまう。","why":"しまう是一次性做完，不是持續往未來減少。","example":"予算を使ってしまった。","zh":"把預算用完了。"},{"text":"おく","meaning":"事先做。","connection":"て形＋おく。","why":"人口減少不能事先做好。","example":"資料を読んでおく。","zh":"事先把資料看了。"}],"level":"N3"},{"id":"n313","kind":"grammar","point":"てみる","group":"aspect","difficulty":2,"stem":"この靴（くつ）、サイズが合（あ）うかどうか、はいて＿＿もいいですか。","gloss":"這雙鞋，能不能試穿看看合不合尺寸？","answer":"みて","options":[{"text":"みて","meaning":"試着做做看，確認結果。","connection":"動詞て形＋みる。はく→はいてみる。","why":"還不知道合不合，所以要試。はいてみて。","example":"一口食べてみてください。","zh":"請吃一口看看。"},{"text":"おいて","meaning":"事先做好備用。","connection":"て形＋おく。","why":"試尺寸不是為之後先放着。おいて沒有「看看結果」的意思。","example":"履いておいてください。","zh":"請先穿上（備用）。"},{"text":"しまって","meaning":"做完，或後悔。","connection":"て形＋しまう。","why":"しまって會變成穿完、穿掉了，不是試。","example":"間違えて履いてしまった。","zh":"不小心穿錯了。"},{"text":"きて","meaning":"做了之後來到這邊，或變化至今。","connection":"て形＋くる。","why":"はいてきて是穿過來，或一直穿着到現在，不是試穿。","example":"その靴を履いてきてください。","zh":"請穿着那雙鞋來。"}],"level":"N3"},{"id":"n314","kind":"grammar","point":"ずに","group":"aspect","difficulty":4,"stem":"辞書（じしょ）を引（ひ）か＿＿、新聞（しんぶん）は読めない。","gloss":"不查字典就讀不了報紙。書面說法。","answer":"ずに","options":[{"text":"ずに","meaning":"不去做某事，就……。比ないで書面。","connection":"動詞ない形去掉ない、加ずに。引く→引か＋ずに。不能用來下命令。","why":"空格在「引か」後面，書面的「不查就讀不了」。引かずに。","example":"何も言わずに、帰った。","zh":"什麼都沒說就回去了。"},{"text":"ずして","meaning":"沒有這個接續。","connection":"否定的書面形是ずに，不是ずして。","why":"引かずして不成立。不查字典的書面接法是引かずに。ずして把「ず」和「して」硬接在一起。","example":"見ずに答える。","zh":"不看就回答。"},{"text":"なくて","meaning":"因為沒做，或狀態中頓。","connection":"ない形＋て：引かなくて。","why":"引かなくて後面多是原因「因為沒查所以……」。這裡是方式「不查就無法讀」，用ずに。而且引かなくて的ては原因，不表示伴隨的否定方式。","example":"辞書を引かなくて、意味が分からなかった。","zh":"因為沒查字典，意思不懂。"},{"text":"ない","meaning":"否定本身，後面還要助詞才接得下去。","connection":"引かない＋で／ず。只加ない會變成引かない、新聞は読めない，少連接。","why":"引かない、新聞は読めない兩句斷開，空格需要「不……就」的接續，不是單獨的ない。","example":"辞書を引かない。","zh":"不查字典。"}],"level":"N3"},{"id":"n315","kind":"grammar","point":"ようにする","group":"purpose","difficulty":3,"stem":"寝坊（ねぼう）しない＿＿、目覚ましを二つセットしている。","gloss":"為了不睡過頭，我設了兩個鬧鐘。","answer":"ように","options":[{"text":"ように","meaning":"為了讓某個狀態實現。否定、可能、無意志用ように，不用ために。","connection":"ない形＋ように。しない＋ように。","why":"「不睡過頭」是否定目的，人不能把「不睡過頭」當意志動詞直接＋ために。しないように。","example":"忘れないように、メモする。","zh":"為了不忘，做筆記。"},{"text":"ために","meaning":"為了做成有意志的事。","connection":"意志動詞辞書形＋ために。不接ない形。","why":"しないために鬧鐘，接續不被N3當成標準目的。否定目的要用ように。","example":"早く起きるために、目覚ましをセットする。","zh":"為了早起，設鬧鐘。這是肯定的意志。"},{"text":"ことに","meaning":"決定要做。","connection":"辞書形・ない形＋ことにする。","why":"しないことに鬧鐘不成「為了不睡過頭」。ことに是決定，後面應是「〜ことにしている」，不是目的。","example":"六時に起きることにしている。","zh":"我決定六點起。"},{"text":"そうに","meaning":"看起來要……地。","connection":"語幹＋そうに。","why":"しないそうに接不上。不是「看起來不睡過頭」。","example":"遅れそうに、慌てた。","zh":"眼看要遲到，慌了。"}],"level":"N3"},{"id":"n316","kind":"grammar","point":"とは限らない","group":"modal","difficulty":4,"stem":"有名（ゆうめい）な店（みせ）が、必（かなら）ずしもおいしい＿＿。","gloss":"有名的店未必就好吃。","answer":"とは限らない","options":[{"text":"とは限らない","meaning":"未必、不見得。否定「所有情況都如此」。常和必ずしも一起。","connection":"普通形＋とは限らない。おいしい＋とは限らない。","why":"句中有「必ずしも」，固定搭配就是とは限らない：不是每一家名店都好吃。","example":"高いものが必ずしもいいとは限らない。","zh":"貴的東西未必就好。"},{"text":"わけではない","meaning":"並不是。部分否定，但前面不接「とは」。","connection":"普通形＋わけではない。","why":"おいしいわけではない是「並不好吃」，少了「とは」，也接不上必ずしも這個「未必全都」的句型。","example":"有名だからおいしいわけではない。","zh":"並不是因為有名就好吃。這句沒有必ずしも。"},{"text":"はずがない","meaning":"按理不可能好吃。","connection":"普通形＋はずがない。","why":"會變成名店不可能好吃，否定得太死。句子只是「未必」。","example":"あの店がおいしいはずがない。","zh":"那家店不可能好吃。"},{"text":"ことはない","meaning":"不必。","connection":"辞書形＋ことはない。形容詞おいしい不能這樣接。","why":"おいしいことはない會變成「沒有好吃這回事」，而且ことはない的標準接法是動詞辞書形。","example":"毎回行くことはない。","zh":"不必每次都去。"}],"level":"N3"},{"id":"n317","kind":"grammar","point":"ないことはない","group":"modal","difficulty":5,"stem":"時間（じかん）はかかるが、一人（ひとり）でもでき＿＿。","gloss":"雖然花時間，但一個人也不是做不到。","answer":"ないことはない","options":[{"text":"ないことはない","meaning":"並不是不能。雙重否定，語氣是消極的肯定。","connection":"動詞ない形＋ことはない。できる→できないことはない。空格在でき後面。","why":"花時間，但不是完全沒可能。でき＋ないことはない。","example":"好きではないが、食べないことはない。","zh":"不算喜歡，但也不是完全不吃。"},{"text":"わけにはいかない","meaning":"情理上不能做。","connection":"辞書形＋わけにはいかない。若接でき後面會變成「できわけにはいかない」，少ない。","why":"這是「並非不能」，不是「不能做」。接在でき後面要用ないことはない。","example":"約束があるので、できないわけにはいかない。","zh":"有約，所以不能說不做。那是「不得不做」。"},{"text":"はずがない","meaning":"不可能。","connection":"できないはずがない＝不可能做不到，也就是一定能，語氣過滿。而且空格要整段「ないことはない」。","why":"花時間這個讓步之後，說話人只是勉强說可以，不是「一定能」。","example":"説明を聞けば、できないはずがない。","zh":"聽了說明，不可能做不到。"},{"text":"ことはない","meaning":"不必。前面要辞書形，不是でき。","connection":"できる＋ことはない＝不必做、不會發生。","why":"できことはない接不上。不必做和「不是不能做」意思不同。","example":"全部一人でやることはない。","zh":"不必全部一個人做。"}],"level":"N3"},{"id":"n318","kind":"grammar","point":"ものではない","group":"modal","difficulty":4,"stem":"人（ひと）の失敗（しっぱい）を笑（わら）う＿＿。","gloss":"不該笑別人的失敗。這是常理。","answer":"ものではない","options":[{"text":"ものではない","meaning":"不該做。從一般道理、社會常識來說。","connection":"動詞辞書形＋ものではない。笑う＋ものではない。","why":"笑別人的失敗被當成「不是人該做的事」。是常理，不是某一條個別命令。","example":"食事中にスマホを見るものではない。","zh":"吃飯時不該看手機。"},{"text":"ことはない","meaning":"沒有必要。語氣比ものではない輕。","connection":"辞書形＋ことはない。","why":"「不必笑」只是沒必要，沒有「這樣做不對」的常理。","example":"そこまで怒ることはない。","zh":"不必生那麼大的氣。"},{"text":"わけにはいかない","meaning":"從當下的情理、責任不能做。","connection":"辞書形＋わけにはいかない。","why":"わけにはいかない是這個場合不能，不是「一般來說不該笑人」。","example":"先生の前で笑うわけにはいかない。","zh":"在老師面前不能笑。"},{"text":"はずがない","meaning":"不可能發生。","connection":"辞書形＋はずがない。","why":"「不可能笑」是預測，句子是在說不該笑。","example":"彼が人の失敗を笑うはずがない。","zh":"他不可能笑別人的失敗。"}],"level":"N3"},{"id":"n319","kind":"grammar","point":"ことに","group":"modal","difficulty":4,"stem":"驚（おどろ）いた＿＿、同期（どうき）の山田（やまだ）さんが会社（かいしゃ）を辞（や）めていた。","gloss":"叫人吃驚的是，同期的山田已經辭職了。","answer":"ことに","options":[{"text":"ことに","meaning":"感到……的是。先點出說話人的情緒，再説事實。","connection":"い形容詞、動詞た形、な形容詞＋な＋ことに。驚いた＋ことに。","why":"辭職是已經發生的事實，前面用情緒當評語。驚いたことに。","example":"残念なことに、列車はもう出ていた。","zh":"遺憾的是，列車已經開了。"},{"text":"ところに","meaning":"正在那個時候。","connection":"動詞た／ている＋ところに。","why":"驚いたところに會變成「嚇了一跳的時候」，不是「令人吃驚的是」。","example":"出かけるところに、電話が来た。","zh":"正要出門時，電話來了。"},{"text":"わけで","meaning":"也就是、因為這個道理。","connection":"普通形＋わけで。","why":"不是從理由推出辭職。是先表達吃驚。","example":"急に休むわけで、皆困っている。","zh":"因為突然請假，大家都很為難。"},{"text":"ものに","meaning":"不是這個文法。","connection":"ものだ才是常理。ものに不接驚いた表示評價。","why":"驚いたものに不成立。","example":"よく遅刻したものだ。","zh":"以前常常遲到。"}],"level":"N3"},{"id":"n320","kind":"grammar","point":"に応じて","group":"stance","difficulty":4,"stem":"人数（にんずう）に＿＿、料理（りょうり）の量（りょう）を変（か）える。","gloss":"按照人數，調整菜的份量。","answer":"応じて","options":[{"text":"応じて","meaning":"按照、隨着程度相應改變。","connection":"名詞＋に応じて。後面是跟着變的做法。","why":"人數不同，份量跟着改。に＋応じて。","example":"収入に応じて、税金が決まる。","zh":"稅按收入來定。"},{"text":"対して","meaning":"針對某人、與之相對。","connection":"名詞＋に対して。","why":"不是針對人數發出動作，也不是對比。份量要隨人數變，用応じて。","example":"客に対して、丁寧に説明する。","zh":"對客人客氣地說明。"},{"text":"とって","meaning":"對……而言。","connection":"名詞＋にとって＋評價。","why":"「對人數而言改變份量」不成。にとって後面不該是改變做法。","example":"家族にとって、この部屋は狭い。","zh":"對一家人來說，這房間窄。"},{"text":"よって","meaning":"由於、靠、視情況而不同。","connection":"名詞＋によって。","why":"によって可以說「因人數而不同」，但句子是「主動按照人數去改份量」，對應的做法用に応じて。","example":"人数によって、料金が違う。","zh":"費用因人數而不同。那是差異，不是按着去調整。"}],"level":"N3"},{"id":"n321","kind":"grammar","point":"に基づいて","group":"stance","difficulty":4,"stem":"アンケートの結果（けっか）に＿＿、新しいメニューを作（つく）った。","gloss":"根據問卷結果，做了新菜單。","answer":"基づいて","options":[{"text":"基づいて","meaning":"以資料、事實為根據來做。","connection":"名詞＋に基づいて。","why":"問卷結果是做菜單的根據。に＋基づいて。","example":"法律に基づいて、判断する。","zh":"依據法律來判斷。"},{"text":"応じて","meaning":"按照程度相應調整。","connection":"名詞＋に応じて。","why":"不是「結果越大、菜單越多」的比例，而是拿結果當依據。","example":"年齢に応じて、量を減らす。","zh":"按年齡減少份量。"},{"text":"沿って","meaning":"沿着、遵照既有的方針或路線。","connection":"名詞＋に沿って。","why":"沿って是照着已經有的計劃走。結果是材料，不是要遵守的路線。","example":"方針に沿って、改革する。","zh":"按照方針改革。"},{"text":"比べて","meaning":"和……比較。","connection":"名詞＋に比べて。","why":"不是把菜單和問卷結果比較。","example":"去年に比べて、売上は高い。","zh":"和去年比，銷售更高。"}],"level":"N3"},{"id":"n322","kind":"grammar","point":"に比べて","group":"degree","difficulty":3,"stem":"兄（あに）に＿＿、弟（おとうと）のほうが背（せ）が高（たか）い。","gloss":"和哥哥比，弟弟更高。","answer":"比べて","options":[{"text":"比べて","meaning":"和某基準比較。","connection":"名詞＋に比べて。","why":"哥哥是比較的基準，弟弟更高。に＋比べて。","example":"都会に比べて、田舎は静かだ。","zh":"和城市比，鄉下安靜。"},{"text":"対して","meaning":"針對；相對立的一面。","connection":"名詞＋に対して。","why":"不是對哥哥做一件事，也不是兩面對立的論述。單純比身高用比べて。","example":"兄に対して、弟はよく反抗する。","zh":"弟弟常頂撞哥哥。那是針對人。"},{"text":"とって","meaning":"對……而言。","connection":"名詞＋にとって。","why":"「對哥哥而言弟弟高」不是句子的比較結構。","example":"弟にとって、兄は自慢だ。","zh":"對弟弟來說，哥哥是驕傲。"},{"text":"ついて","meaning":"關於。","connection":"名詞＋について。","why":"「關於哥哥，弟弟更高」接不上比較。","example":"兄について、話したい。","zh":"想談談哥哥。"}],"level":"N3"},{"id":"n323","kind":"grammar","point":"について","group":"stance","difficulty":2,"stem":"来月（らいげつ）の旅行（りょこう）＿＿、意見（いけん）がある人（ひと）は言（い）ってください。","gloss":"關於下個月的旅行，有意見的人請說。","answer":"について","options":[{"text":"について","meaning":"關於、就某題目。","connection":"名詞＋について。","why":"旅行是談論的題目。旅行＋について。","example":"日本の教育について、調べた。","zh":"查了關於日本教育的資料。"},{"text":"に対して","meaning":"對某人、針對。","connection":"名詞＋に対して。後面多是態度或動作的對象。","why":"不是對旅行這件事發出態度，是以它為話題。","example":"計画に対して、反対が多い。","zh":"針對計劃，反對的人很多。"},{"text":"にとって","meaning":"對……而言的評價。","connection":"名詞＋にとって＋難／大切等。","why":"「對旅行而言，有意見的人請說」不成立。","example":"参加者にとって、費用は重要だ。","zh":"對參加者來說，費用很重要。"},{"text":"として","meaning":"作為某種身份。","connection":"名詞＋として。","why":"不是「作為旅行」這個身份。","example":"クラスの行事として、旅行に行く。","zh":"作為班級活動去旅行。"}],"level":"N3"},{"id":"n324","kind":"grammar","point":"をはじめ","group":"addition","difficulty":3,"stem":"校長（こうちょう）＿＿、多くの先生（せんせい）が式（しき）に出席（しゅっせき）した。","gloss":"以校長為首，很多老師出席了儀式。","answer":"をはじめ","options":[{"text":"をはじめ","meaning":"以某代表為首，其他同類也算在內。","connection":"名詞＋をはじめ（として）。","why":"校長是代表，後面還有許多老師。をはじめ。","example":"東京をはじめ、五都市で開催する。","zh":"以東京為首，在五個城市舉辦。"},{"text":"をめぐって","meaning":"圍繞某爭議。","connection":"名詞＋をめぐって。後面多是議論、對立。","why":"不是圍繞校長發生爭論。","example":"予算をめぐって、会議が長引いた。","zh":"圍繞預算，會議拖很長。"},{"text":"をこめて","meaning":"傾注感情。","connection":"名詞＋をこめて。心、願い。","why":"校長をこめて不表示「以校長為首」。","example":"感謝の気持ちをこめて、手紙を書いた。","zh":"懷着感謝寫了信。"},{"text":"をもとに","meaning":"以……為材料。","connection":"名詞＋をもとに。","why":"校長不是製作某物的材料。","example":"体験をもとに、話した。","zh":"根據經歷來講。"}],"level":"N3"},{"id":"n325","kind":"grammar","point":"を通じて","group":"stance","difficulty":4,"stem":"その話（はなし）は、共通（きょうつう）の友人（ゆうじん）＿＿知（し）った。","gloss":"那件事是透過共同的朋友知道的。","answer":"を通じて","options":[{"text":"を通じて","meaning":"透過某個媒介、管道。也可以表示整段期間。","connection":"名詞＋を通じて。","why":"朋友是得知消息的管道。友人＋を通じて＋知った。","example":"一年を通じて、気温が高い。","zh":"全年氣溫都高。這是整段期間的用法。"},{"text":"によって","meaning":"被某人、由於、靠手段。","connection":"名詞＋によって。受身的動作主體也用。","why":"友人によって知った會像「被朋友知道」，媒介的「經由」用を通じて。","example":"地震によって、壁が壊れた。","zh":"由於地震，牆壞了。"},{"text":"にとって","meaning":"對……而言。","connection":"名詞＋にとって。","why":"不是「對朋友而言我知道了」。","example":"友人にとって、その話は初耳だ。","zh":"對朋友來說，那件事是第一次聽說。"},{"text":"に対して","meaning":"針對。","connection":"名詞＋に対して。","why":"不是針對朋友做「知道」。","example":"友人に対して、事実を話した。","zh":"對朋友說了事實。"}],"level":"N3"},{"id":"n326","kind":"grammar","point":"に加えて","group":"addition","difficulty":4,"stem":"家賃（やちん）が高い＿＿、交通費（こうつうひ）もかかる。","gloss":"房租已經高，再加上交通費。","answer":"ことに加えて","options":[{"text":"ことに加えて","meaning":"在原有之外再加一項。兩項是同一方向。","connection":"普通形＋ことに加えて。い形容詞はそのまま：高いことに加えて。名詞＋に加えて。","why":"房租高，還要加交通費。追加負擔。高い＋ことに加えて。","example":"値段が高いことに加えて、待ち時間も長い。","zh":"價錢高，再加上等候時間也長。"},{"text":"わりに","meaning":"跟預期不成比例。","connection":"普通形＋わりに。","why":"交通費不是和房租高不成比例，是另外再加。","example":"高いわりに、狭い。","zh":"挺貴的，卻很窄。"},{"text":"せいで","meaning":"都怪。","connection":"普通形＋せいで＋壞結果。","why":"交通費不是房租高造成的結果。是並列的另一筆錢。","example":"家賃が高いせいで、貯金できない。","zh":"都怪房租高，存不了錢。"},{"text":"うちに","meaning":"趁着。","connection":"普通形＋うちに。","why":"沒有趁房租高的時候付交通費這回事。","example":"高いうちに、契約を見直そう。","zh":"趁還高（或趁這個狀態）重新看合約。"}],"level":"N3"},{"id":"n327","kind":"grammar","point":"から見ると","group":"stance","difficulty":4,"stem":"この数字（すうじ）＿＿、売上（うりあげ）は順調（じゅんちょう）だ。","gloss":"從這些數字來看，銷售順利。","answer":"から見ると","options":[{"text":"から見ると","meaning":"從某材料、某立場來判斷。","connection":"名詞＋から見ると／から見れば。","why":"數字是判斷的材料。数字＋から見ると。","example":"先生から見ると、この答案はまだ足りない。","zh":"從老師看來，這個答案還不夠。"},{"text":"にとって","meaning":"對人或組織而言的價值、難易。","connection":"名詞＋にとって。人・組織が自然。","why":"数字にとって順調，數字不是會評價的人。材料判斷用から見ると。","example":"会社にとって、この数字は重要だ。","zh":"對公司來說，這個數字重要。"},{"text":"として","meaning":"作為身份。","connection":"名詞＋として。","why":"不是「作為數字」。","example":"証拠として、この数字を出した。","zh":"把這個數字當成證據提出。"},{"text":"によって","meaning":"由於、視……而定。","connection":"名詞＋によって。","why":"「由於數字所以順利」或「視數字而定」都不是「從數字看出」。","example":"数字によって、評価が変わる。","zh":"評價因數字而變。"}],"level":"N3"},{"id":"n328","kind":"grammar","point":"次第","group":"time","difficulty":5,"stem":"詳細（しょうさい）が決（き）まり＿＿、メールでお知（し）らせします。","gloss":"詳情一定下來，就用電郵通知。","answer":"次第","options":[{"text":"次第","meaning":"一做完就立刻做下一件。前文是條件，後文多是意志或服務。","connection":"動詞ます語幹＋次第。決まる→決まり＋次第。","why":"空格在「決まり」後面。詳情一決定就通知。語幹＋次第。","example":"着き次第、電話します。","zh":"一到就打電話。"},{"text":"たら","meaning":"如果、之後。","connection":"た形＋ら。決まったら。不接ます語幹。","why":"決まりたら不存在。たら要接在決まった後面。","example":"決まったら、連絡する。","zh":"決定了之後再聯絡。"},{"text":"とたん","meaning":"一……立刻（意外）。","connection":"た形＋とたん。後句不能是意志「知らせます」。","why":"決まりとたん接不上，而且通知是說話人的安排，不是意外。","example":"決まったとたん、反対の声が上がった。","zh":"一決定，反對聲就起來了。"},{"text":"うちに","meaning":"趁着。","connection":"辞書形・ない形＋うちに。","why":"決まりうちに不成立。不是趁決定的狀態。","example":"忘れないうちに、送る。","zh":"趁還沒忘，寄出去。"}],"level":"N3"},{"id":"n329","kind":"grammar","point":"て初めて","group":"time","difficulty":4,"stem":"外国（がいこく）で暮（く）らして＿＿、水（みず）の大切（たいせつ）さが分（わ）かった。","gloss":"到外國生活之後，才第一次明白水的珍貴。","answer":"初めて","options":[{"text":"初めて","meaning":"做了之後才第一次明白、才發生。","connection":"動詞て形＋初めて。暮らす→暮らして初めて。","why":"空格在「暮らして」後。不是單純時間先後，而是這次經驗使人第一次懂。て＋初めて。","example":"病気になって初めて、健康のありがたさが分かった。","zh":"生了病才明白健康的可貴。"},{"text":"から","meaning":"……之後。只排時間順序。","connection":"て形＋から。","why":"暮らしてから只說生活之後，沒有「到那時才第一次明白」的發現。這個發現要用初めて。","example":"暮らしてから、友達ができた。","zh":"生活之後交到了朋友。那只是之後。"},{"text":"以来","meaning":"自……以來一直。","connection":"て形＋以来。後句是持續到現在的狀態。","why":"「明白了」是一次發現，不是自生活以來一直持續的動作。","example":"暮らして以来、一度も帰国していない。","zh":"生活以來一次都沒回國。"},{"text":"たびに","meaning":"每次。","connection":"辞書形＋たびに。不接て形。","why":"暮らしてたびに不成立。也不是每次生活都發現一次。","example":"旅行するたびに、発見がある。","zh":"每次旅行都有發現。"}],"level":"N3"},{"id":"n330","kind":"grammar","point":"くせに","group":"contrast","difficulty":4,"stem":"学生（がくせい）の＿＿、授業（じゅぎょう）にほとんど出（で）ない。","gloss":"明明是學生，課卻幾乎不上。說話人在責備。","answer":"くせに","options":[{"text":"くせに","meaning":"明明是那個身份或狀態，卻不配、帶責備。","connection":"名詞＋の＋くせに。動詞普通形、な形容詞＋な＋くせに。空格前已有「の」。","why":"學生這個身份和不上課矛盾，而且語氣是責備。学生のくせに。","example":"知っているくせに、教えない。","zh":"明明知道卻不教。"},{"text":"のに","meaning":"明明卻。","connection":"名詞要「な＋のに」。不能接在「の」後面。","why":"学生のに、或学生ののに都不對。名詞逆接是「学生なのに」，這裡的の是留給くせに的。","example":"学生なのに、勉強しない。","zh":"明明是學生卻不讀書。"},{"text":"にもかかわらず","meaning":"雖然。","connection":"名詞直接＋にもかかわらず。中間不加「の」。","why":"学生のにもかかわらず多了「の」。名詞的逆接是「学生にもかかわらず」。空格前的のは留給くせに的。","example":"学生にもかかわらず、勉強しない。","zh":"雖然是學生，卻不讀書。"},{"text":"ために","meaning":"因為；為了。","connection":"名詞＋の＋ために。","why":"不上課不是「因為是學生」的自然結果，也不是目的。","example":"試験のために、勉強する。","zh":"為了考試而讀書。"}],"level":"N3"},{"id":"n331","kind":"grammar","point":"てばかり","group":"aspect","difficulty":3,"stem":"弟（おとうと）はゲームをして＿＿、宿題（しゅくだい）をしない。","gloss":"弟弟淨是打遊戲，不做功課。","answer":"ばかり","options":[{"text":"ばかり","meaning":"淨是做、老是做。含不滿。","connection":"動詞て形＋ばかりいる。して＋ばかり。","why":"空格在「して」後。老是打遊戲，所以功課不做。て＋ばかり。","example":"文句を言ってばかりいないで、やってみて。","zh":"別光抱怨，做做看。"},{"text":"だけ","meaning":"只。","connection":"動詞辞書形＋だけ，或「するだけで」。て形後面不直接加だけ。","why":"してだけ不自然。限定動作用辞書形「するだけ」，老是做用てばかり。","example":"ゲームをするだけで、外で遊ばない。","zh":"只打遊戲，不在外面玩。"},{"text":"しか","meaning":"只有，後面要否定。","connection":"て形＋しか＋いない，才是「只做」。空格後不是いない，而是逗號。","why":"してしか、宿題をしない接不上。しか要緊貼否定。","example":"ゲームをしてしかいない。","zh":"除了打遊戲什麼都不做。"},{"text":"ほど","meaning":"程度。","connection":"て形＋ほど表示到某種程度，後句多是結果。","why":"してほど宿題をしない不是「淨是打遊戲」。","example":"ゲームをして、目が痛くなるほどだ。","zh":"打遊戲打到眼睛痛。"}],"level":"N3"},{"id":"n332","kind":"grammar","point":"お〜する","group":"voice","difficulty":4,"stem":"先生（せんせい）、その荷物（にもつ）、私が＿＿。","gloss":"老師，那個行李我來拿吧。謙讓。","answer":"お持ちします","options":[{"text":"お持ちします","meaning":"謙讓。降低自己的動作，對方是老師。","connection":"お＋ます語幹＋する。持つ→お持ちする。動作的人是我。","why":"拿行李的是我，受益或對象是老師。要用謙讓お＋語幹＋する，不是抬高自己。","example":"明日お届けします。","zh":"明天我送去。"},{"text":"お持ちになります","meaning":"尊敬。抬高對方的動作。","connection":"お＋ます語幹＋になる。動作的人必須是值得尊敬的對方。","why":"句子主語是私が。自己的動作不能用になる。那會變成尊敬自己。","example":"先生がお持ちになります。","zh":"老師來拿。"},{"text":"持たれます","meaning":"持つの受身或尊敬れる。","connection":"持つ→持たれる。","why":"私が持たれます不是「我來拿」。れ是被動或尊敬，主語和謙讓不符。","example":"荷物を持たれた。","zh":"行李被人拿走了。"},{"text":"お持ちください","meaning":"請對方拿。尊敬的請求。","connection":"お＋ます語幹＋ください。動作的人是聽話的一方。","why":"私がお持ちください把「我」和「請您做」放在一起，主語打架。這句是我來為老師拿，要用謙讓お持ちします。","example":"先生、荷物はこちらにお持ちください。","zh":"老師，行李請拿到這邊。"}],"level":"N3"},{"id":"n333","kind":"grammar","point":"ごとに","group":"time","difficulty":3,"stem":"この電車（でんしゃ）は一駅（えき）＿＿、乗（の）り降（お）りが多（おお）い。","gloss":"這班電車每一站上下車的人都很多。","answer":"ごとに","options":[{"text":"ごとに","meaning":"每一……都。沒有空掉下一格。","connection":"數量或名詞＋ごとに。一駅ごとに＝每一站。","why":"每一站都有很多人上下。是每一個，不是隔一個。","example":"一時間ごとに、休憩する。","zh":"每一小時休息一次。"},{"text":"おきに","meaning":"每隔、中間空一格。","connection":"數量＋おきに。一駅おき＝隔一站。","why":"隔一站才上下很多，和「每一站」不同。","example":"一駅おきに、急行は止まる。","zh":"急行列車隔一站停。"},{"text":"までに","meaning":"在期限之前。","connection":"時間點＋までに。","why":"一駅までに不是重複的每一站。","example":"次の駅までに、降りる準備をする。","zh":"在下一站之前做好下車準備。"},{"text":"うちに","meaning":"趁着。","connection":"不接「一駅うちに」表示每一。","why":"一駅うちに接續不對。","example":"止まっているうちに、降りる。","zh":"趁停着的時候下車。"}],"level":"N3"},{"id":"n334","kind":"grammar","point":"にしたがって","group":"stance","difficulty":4,"stem":"係（かかり）の人（ひと）の指示（しじ）に＿＿、非常口（ひじょうぐち）へ進（すす）んだ。","gloss":"按照工作人員的指示，走向緊急出口。","answer":"したがって","options":[{"text":"したがって","meaning":"依照指示、規則去做。也可表示隨着變化。","connection":"名詞＋にしたがって。","why":"指示是要遵守的內容。指示＋にしたがって。","example":"マニュアルにしたがって、操作する。","zh":"按照手冊操作。"},{"text":"沿って","meaning":"沿着道路，或遵照方針的方向。","connection":"名詞＋に沿って。道、方針、希望。","why":"現場的具體指示用したがって。沿って多是路線或大方針，不接「係の人の指示」這類当场命令。","example":"この道に沿って、行く。","zh":"沿着這條路走。"},{"text":"基づいて","meaning":"以資料為根據來制定。","connection":"名詞＋に基づいて。","why":"不是拿指示當研究資料來製作東西，是照着指示走。","example":"データに基づいて、決めた。","zh":"根據數據做了決定。"},{"text":"比べて","meaning":"比較。","connection":"名詞＋に比べて。","why":"沒有和指示比較。","example":"前回の指示に比べて、今回は厳しい。","zh":"和上次的指示比，這次更嚴。"}],"level":"N3"},{"id":"n335","kind":"grammar","point":"たとえ〜ても","group":"condition","difficulty":3,"stem":"たとえ雨（あめ）が降（ふ）＿＿、明日（あした）の試合（しあい）は行（おこな）う。","gloss":"就算下雨，明天的比賽也照常舉行。","answer":"っても","options":[{"text":"っても","meaning":"即使。和たとえ呼應。","connection":"動詞て形＋も。降る→降って＋も。たとえ必須和ても一起，不能和たら、ば搭配。","why":"空格在「降」後面。句首有たとえ，所以是降っても。","example":"たとえ失敗しても、やめない。","zh":"就算失敗也不放棄。"},{"text":"ったら","meaning":"如果。","connection":"た形＋ら。降ったら。","why":"降ったら是「如果下雨」。たとえ不能接たら。而且もし的順接不是讓步。","example":"雨が降ったら、中止だ。","zh":"如果下雨就取消。"},{"text":"れば","meaning":"如果，仮定形。","connection":"降る→降れば。","why":"降れば不和たとえ呼應。ば是順接條件。","example":"雨が降れば、道が滑る。","zh":"一下雨路就滑。"},{"text":"ると","meaning":"一……就。","connection":"辞書形＋と。降ると。","why":"降ると是必然結果，後句還不能是「照常舉行」這種安排。たとえ也不接と。","example":"雨が降ると、試合は中止になる。","zh":"一下雨比賽就會取消。"}],"level":"N3"},{"id":"n336","kind":"grammar","point":"こそ","group":"degree","difficulty":4,"stem":"今年（ことし）＿＿、Ｎ３に合格（ごうかく）したい。","gloss":"今年一定要考過 N3。強調就是今年。","answer":"こそ","options":[{"text":"こそ","meaning":"正是、才是。強調非它不可。","connection":"名詞＋こそ。今年こそ＝今年一定要。","why":"說話人把希望壓在今年。今年＋こそ。","example":"あなたこそ、リーダーにふさわしい。","zh":"你才適合當領導。"},{"text":"さえ","meaning":"連、只要。極端或最低條件。","connection":"名詞＋さえ。","why":"今年さえ會變成「連今年都」，常接意外或最低條件，不是「就鎖定今年」。","example":"名前さえ書けば、申し込める。","zh":"只要寫名字就能申請。"},{"text":"しか","meaning":"只有。後面必須否定。","connection":"名詞＋しか＋否定。","why":"合格したい是肯定。今年しか合格したい接不上，因為しか要求否定。","example":"今年しかチャンスがない。","zh":"只有今年有機會。"},{"text":"ほど","meaning":"程度、沒有那麼。","connection":"名詞＋ほど。","why":"今年ほど合格したい不表示「鎖定今年」。","example":"去年ほど難しくない。","zh":"沒有去年那麼難。"}],"level":"N3"},{"id":"n337","kind":"grammar","point":"に対して","group":"stance","difficulty":3,"stem":"お客様（きゃくさま）＿＿、そのような言（い）い方（かた）をしてはいけない。","gloss":"對客人不能用那種說法。","answer":"に対して","options":[{"text":"に対して","meaning":"對某對象採取態度或動作。","connection":"名詞＋に対して。人を対象にするときによく使う。","why":"客人是說話態度的對象。お客様＋に対して。","example":"目上の人に対して、敬語を使う。","zh":"對長輩使用敬語。"},{"text":"について","meaning":"關於某題目。","connection":"名詞＋について。","why":"「關於客人，不能那樣說」變成話題，不是對着客人說話的態度。","example":"接客について、研修がある。","zh":"關於接待客人，有培訓。"},{"text":"にとって","meaning":"對……而言的評價。","connection":"名詞＋にとって。","why":"不是「對客人來說不能那樣說」的評價句。是我們對客人的態度。","example":"客にとって、態度は大事だ。","zh":"對客人來說，態度很重要。"},{"text":"によって","meaning":"因……而異；由於。","connection":"名詞＋によって。","why":"不是因客人不同而禁止，是對客人這個對象。","example":"客によって、話し方を変える。","zh":"視客人不同而改變說法。"}],"level":"N3"},{"id":"n338","kind":"grammar","point":"上で","group":"time","difficulty":5,"stem":"契約（けいやく）するかどうかは、家族（かぞく）と相談（そうだん）した＿＿決（き）めたい。","gloss":"要不要簽約，想先和家人商量之後再決定。","answer":"上で","options":[{"text":"上で","meaning":"先做完前一步，並以它為基礎再做後面的決定。","connection":"動詞た形＋上で。相談した＋上で。","why":"商量不是順便的時間先後，而是決定的前提。した＋上で＋決めたい。","example":"説明を聞いた上で、買いかどうか決める。","zh":"聽完說明之後再決定買不買。"},{"text":"ところ","meaning":"剛剛做完，或結果發現。","connection":"た形＋ところ。","why":"相談したところ決めたい會變成「一商量就想決定」，少了「在那個基礎上」。","example":"相談したところ、反対された。","zh":"商量了一下，結果被反對。"},{"text":"ばかり","meaning":"剛剛。","connection":"た形＋ばかり。","why":"剛剛商量完和「以商量為前提再決定」不同。したばかり決めたい也不成句。","example":"今、相談したばかりだ。","zh":"現在剛商量完。"},{"text":"以来","meaning":"自……以來一直。","connection":"て形＋以来。相談して以来。不接た形。","why":"した以来接續錯。決定也不是從商量以來一直持續的狀態。","example":"相談して以来、連絡がない。","zh":"商量過以後就沒聯絡。"}],"level":"N3"},{"id":"n339","kind":"grammar","point":"っこない","group":"modal","difficulty":5,"stem":"こんな難（むずか）しい問題（もんだい）、私（わたし）には解（と）け＿＿。","gloss":"這麼難的題，我根本不可能解開。","answer":"っこない","options":[{"text":"っこない","meaning":"絕不可能。口語，說話人覺得完全沒希望。","connection":"ます語幹＋っこない。解ける→解け＋っこない。","why":"有「こんな」和「私には」，語氣是根本沒戲。語幹＋っこない。","example":"今から走っても、間に合いっこない。","zh":"現在才跑，根本趕不上。"},{"text":"はずだ","meaning":"按理應該。","connection":"普通形＋はずだ。解ける＋はずだ。ます語幹「解け」後面不能直接加はずだ。","why":"解けはずだ少了る。はずだ不接ます語幹。這句要的也不是「按理解得開」，而是根本沒可能。","example":"公式を知っていれば、解けるはずだ。","zh":"如果知道公式，按理解得開。"},{"text":"がちだ","meaning":"往往會。","connection":"語幹＋がち。","why":"解けがち是「往往解得開」或傾向，和不可能相反，而且解ける的傾向不這麼說。","example":"ミスをしがちだ。","zh":"往往會出錯。"},{"text":"うる","meaning":"有可能。","connection":"ます語幹＋うる。ありうる。","why":"解けうる是「有可能解開」，和「根本不可能」相反。","example":"その誤りは起こりうる。","zh":"那種錯誤有可能發生。"}],"level":"N3"},{"id":"n340","kind":"grammar","point":"てほしい","group":"advice","difficulty":3,"stem":"参加者（さんかしゃ）の皆（みな）さん、明日（あした）は資料（しりょう）を持（も）ってき＿＿んです。忘（わす）れないでください。","gloss":"各位參加者，明天希望你們把資料帶來。請別忘了。","answer":"てほしい","options":[{"text":"てほしい","meaning":"希望對方做某事。","connection":"動詞て形＋ほしい。持ってくる→持ってきて＋ほしい。句尾可以用んです說明這項希望。","why":"後面說「別忘了」，忘的人是參加者。所以是希望他們帶來，不是主辦人自己想帶。持ってきてほしいんです。","example":"もう少しゆっくり話してほしい。","zh":"希望你說慢一點。"},{"text":"たい","meaning":"自己想做。","connection":"ます語幹＋たい。持ってきたい＝說話人自己想帶去。","why":"持ってきたいんです是「我們想帶資料去」。可是下一句叫參加者別忘了，想帶的人就不是說話人。希望對方做要用てほしい。","example":"私も資料を持っていきたい。","zh":"我也想帶資料去。"},{"text":"てください","meaning":"請對方做。命令、請求的句尾。","connection":"て形＋ください。後ろに「んです」は続かない。","why":"持ってきてくださいんですは、くださいで文が終わっているのに、さらにんですを足している。希望を説明すときはてほしいんです。","example":"資料を持ってきてください。","zh":"請把資料帶來。句尾はくださいで止める。"},{"text":"てあげる","meaning":"我為對方做。","connection":"て形＋あげる。方向是說話人給別人好處。","why":"持ってきてあげる是我帶給你，和希望對方帶相反。","example":"資料は私が持っていってあげる。","zh":"資料我給你帶去。"}],"level":"N3"},{"id":"n341","kind":"grammar","point":"てしょうがない","group":"degree","difficulty":3,"stem":"喉（のど）が渇（かわ）いて、水（みず）が飲（の）み＿＿。","gloss":"口渴，想喝水想到受不了。","answer":"たくてしょうがない","options":[{"text":"たくてしょうがない","meaning":"想得不得了。情緒或感覺強到壓不住。","connection":"ます語幹＋たくてしょうがない。飲む→飲み＋たくてしょうがない。い形容詞是くてしょうがない：寒くてしょうがない。","why":"口渴是自己壓不住的感覺，不是普通的「想喝」，也不是第三者的願望。飲みたくてしょうがない。","example":"眠くてしょうがない。","zh":"睏得不得了。"},{"text":"たがらない","meaning":"第三者看起來不想做。","connection":"ます語幹＋たがらない。飲みたがらない。","why":"たがる是從外面看別人的欲望。句子是自己口渴，不能用たがらない。而且「不想喝」和口渴相反。","example":"弟は薬を飲みたがらない。","zh":"弟弟看起來不想喝藥。"},{"text":"すぎない","meaning":"不要做得過度。","connection":"ます語幹＋すぎない。飲みすぎない。","why":"喝太多的否定，不是「想喝到受不了」。すぎる形容過度，不形容欲望的強度。","example":"お酒は飲みすぎないように。","zh":"酒別喝過了頭。"},{"text":"かねない","meaning":"有可能做出不好的事。","connection":"ます語幹＋かねない。しかねない。","why":"飲みかねない是「有可能會喝」，是風險判斷，不是口渴的程度。","example":"放置すると、腐りかねない。","zh":"放著不管的話，有可能會壞。"}],"level":"N3"},{"id":"n342","kind":"grammar","point":"ざるを得ない","group":"modal","difficulty":4,"stem":"上司（じょうし）に命（めい）じられたので、休日出勤（きゅうじつしゅっきん）せ＿＿。","gloss":"因為上司命令，假期只好出勤。","answer":"ざるを得ない","options":[{"text":"ざるを得ない","meaning":"除此之外沒有辦法。外來的情況逼你做，心裡並不想。","connection":"動詞ない形去掉ない＋ざるを得ない。する→せざるを得ない。","why":"空格在「せ」後面，せ是する的未然形。命令來自上司，不是自己想上班。せざるを得ない。","example":"終電がないので、タクシーで帰らざるを得ない。","zh":"沒有末班車，只好坐計程車回去。"},{"text":"ないことには","meaning":"如果不先做，後面就不能。","connection":"ない形＋ことには。しないことには。","why":"せないことには把ない重複，接不上。而且這句沒有「不做就不行」的條件，是被迫要做。","example":"見ないことには、分からない。","zh":"不看的話就不知道。"},{"text":"ようがない","meaning":"沒有方法做。","connection":"ます語幹＋ようがない。する→しようがない。","why":"せようがない不成立。ようがない要接ます語幹「し」，不是未然形「せ」。這句也不是「無法出勤」。","example":"住所が分からず、連絡しようがない。","zh":"不知道地址，沒辦法聯絡。"},{"text":"っこない","meaning":"絕對不可能。","connection":"ます語幹＋っこない。できっこない。する不能說せっこない。","why":"せっこない不存在。而且句意是只好去，不是絕對去不成。","example":"今からでは間に合いっこない。","zh":"現在開始的話絕對趕不上。"}],"level":"N3"},{"id":"n343","kind":"grammar","point":"ずにはいられない","group":"modal","difficulty":5,"stem":"つまらないと言（い）いながら、その曲（きょく）を聞（き）くと口（くち）ずさま＿＿。","gloss":"嘴上說無聊，一聽到那首歌卻忍不住哼出來。","answer":"ずにはいられない","options":[{"text":"ずにはいられない","meaning":"忍不住、不這樣做就待不住。衝動來自自己裡面。","connection":"ない形去掉ない＋ずにはいられない。口ずさむ→口ずさま＋ずにはいられない。","why":"空格在「口ずさま」後面。嘴上否定，身體卻自己哼出來，是壓不住的衝動。","example":"あの話を聞くと、笑わずにはいられない。","zh":"一聽那件事就忍不住笑。"},{"text":"ないではいられない","meaning":"意思和ずにはいられない接近，但接續不同。","connection":"ない形全体＋ではいられない。口ずさまないではいられない。","why":"口ずさま的ま已經是去掉ない的形。再加ないではいられない會變成口ずさまないではいられない，ない重複，不成立。","example":"彼の成功を、祝わないではいられない。","zh":"他的成功，不祝賀就不行。前面是ない形全體。"},{"text":"わけにはいかない","meaning":"情理上不能做。","connection":"辞書形＋わけにはいかない。口ずさむわけにはいかない。","why":"口ずさまわけにはいかない少了む。わけにはいかない不接未然形。這句也不是「不能哼」。","example":"図書館で口ずさむわけにはいかない。","zh":"在圖書館不能哼歌。"},{"text":"てはいられない","meaning":"不能一直這樣下去。","connection":"て形＋はいられない。口ずさんではいられない。","why":"口ずさまてはいられない接不上。て形是口ずさんで。這句也不是「不能繼續哼」。","example":"泣いてはいられない。次の仕事がある。","zh":"不能一直哭。還有下一件工作。"}],"level":"N3"},{"id":"n344","kind":"grammar","point":"ようがない","group":"modal","difficulty":4,"stem":"住所（じゅうしょ）が分（わ）からなくて、連絡（れんらく）し＿＿。","gloss":"不知道地址，沒辦法聯絡。","answer":"ようがない","options":[{"text":"ようがない","meaning":"想做也沒有方法。","connection":"ます語幹＋ようがない。する→し＋ようがない。","why":"空格在「し」後面。不是自己不想聯絡，是沒有地址這條路。しようがない。","example":"言葉が通じず、説明のしようがない。","zh":"語言不通，沒辦法說明。"},{"text":"かねない","meaning":"有可能會做（多半不好）。","connection":"ます語幹＋かねない。しかねない。","why":"しかねない是「有可能聯絡」，和「無法聯絡」相反。","example":"このままだと、誤解されかねない。","zh":"這樣下去，有可能被誤解。"},{"text":"がちだ","meaning":"往往會做。","connection":"ます語幹＋がちだ。しがちだ。","why":"しがちだ是「往往會聯絡」，不是沒有方法。","example":"夜更かししがちだ。","zh":"往往會熬夜。"},{"text":"っこない","meaning":"絕對做不到。口語。","connection":"ます語幹＋っこない。但する不說しっこない，要說できっこない。","why":"しっこない不是「する」的說法。絕對不能做和「沒有方法去做」也不同：前者是能力為零，後者是缺少手段。","example":"彼には勝ちっこない。","zh":"絕對贏不了他。"}],"level":"N3"},{"id":"n345","kind":"grammar","point":"たらいい","group":"advice","difficulty":3,"stem":"切符（きっぷ）はどこで買（か）った＿＿ですか。","gloss":"車票在哪裡買才好？","answer":"らいい","options":[{"text":"らいい","meaning":"怎麼做才好。向人請教做法。","connection":"動詞た形＋らいい。買う→買った＋らいい。常和どう、どこ一起。","why":"空格在「買った」後面。問的是買票的地點該怎麼做。買ったらいいですか。","example":"この漢字は、どう読んだらいいですか。","zh":"這個漢字該怎麼讀？"},{"text":"ことがある","meaning":"有過經驗。","connection":"た形＋ことがある。疑問是ことがありますか，不是ことがあるですか。","why":"買ったことがあるですか多了不自然的だ，而且「在哪裡買過嗎」不是在問該去哪買。","example":"この駅で買ったことがあります。","zh":"在這個車站買過。"},{"text":"ばかりだ","meaning":"剛剛做完。","connection":"た形＋ばかりだ。買ったばかりだ。","why":"どこで買ったばかりですか把「剛剛」和「在哪裡才好」接在一起，問不成。這句是在請教做法。","example":"今、買ったばかりです。","zh":"現在剛買。"},{"text":"つもりだ","meaning":"以為、打算。","connection":"た形＋つもりだ可以是「自以為做過」。","why":"どこで買ったつもりですか是「你以為在哪買的」，質疑對方，不是請教該在哪買。","example":"もう買ったつもりでいた。","zh":"我以為自己已經買了。"}],"level":"N3"},{"id":"n346","kind":"grammar","point":"ことにしている","group":"decision","difficulty":3,"stem":"自分（じぶん）のルールで、夜（よる）は十二時（じゅうにじ）までに寝（ね）る＿＿。","gloss":"按照自己的規矩，晚上十二點前睡。這是一直守着的習慣。","answer":"ことにしている","options":[{"text":"ことにしている","meaning":"自己決定，並且一直照做。習慣。","connection":"動詞辞書形・ない形＋ことにしている。寝る＋ことにしている。","why":"「自分のルール」是自己定的，而且現在還在守。用正在持續的ことにしている。","example":"毎朝、六時に起きることにしている。","zh":"我規定自己每天六點起。"},{"text":"ことになっている","meaning":"規定、日程。決定的人不是自己，或是團體的規則。","connection":"辞書形＋ことになっている。","why":"句首已經說是自己的規則。ことになっている會變成外面規定你十二點前睡。","example":"寮では十二時に寝ることになっている。","zh":"宿舍規定十二點睡。"},{"text":"わけにはいかない","meaning":"情理上不能。","connection":"辞書形＋わけにはいかない。","why":"寝るわけにはいかない是不能睡，和「規定自己去睡」相反。","example":"明日は早いので、遊ぶわけにはいかない。","zh":"明天要早起，不能玩。"},{"text":"ことはない","meaning":"不必。","connection":"辞書形＋ことはない。","why":"寝ることはない是不必睡。和自己定下要睡的規則相反。","example":"毎日同じ店に行くことはない。","zh":"不必每天去同一家店。"}],"level":"N3"},{"id":"n347","kind":"grammar","point":"ないことには","group":"condition","difficulty":4,"stem":"実際（じっさい）に見（み）＿＿、いいか悪（わる）いか分（わ）からない。","gloss":"不實際看過，就不知道好不好。","answer":"ないことには","options":[{"text":"ないことには","meaning":"如果不先做到前一件，後一件就不能成立。後句多是否定。","connection":"動詞ない形＋ことには。見る→見ない＋ことには。","why":"空格在「見」後面。看是知道好壞的必要條件。見ないことには、分からない。","example":"やってみないことには、できるかどうか分からない。","zh":"不試做，就不知道能不能做成。"},{"text":"た上で","meaning":"先做完，並以它為基礎再決定。","connection":"た形＋上で。見た上で。","why":"見た上で、分からない會變成「看完了還是不知道」，和「不看就不知道」的方向相反。","example":"見た上で、買うか決める。","zh":"看完之後再決定買不買。"},{"text":"て以来","meaning":"自……以來一直。","connection":"て形＋以来。見て以来。","why":"見て以来接的是持續到現在的狀態，不是「不看就不成立」的條件。","example":"見て以来、その店が好きだ。","zh":"看過以後就一直喜歡那家店。"},{"text":"たとたん","meaning":"一……立刻。後句多是意外。","connection":"た形＋とたん。見たとたん。","why":"見たとたん是「一看到就」，不是「除非看到」。後句「不知道好壞」也不是看到的瞬間意外。","example":"見たとたん、笑い出した。","zh":"一看到就笑了出來。"}],"level":"N3"},{"id":"n348","kind":"grammar","point":"かのようだ","group":"modal","difficulty":4,"stem":"合格（ごうかく）の知（し）らせを聞（き）いて、まるで夢（ゆめ）を見（み）ている＿＿。","gloss":"聽到合格的消息，簡直像在做夢。","answer":"かのようだ","options":[{"text":"かのようだ","meaning":"簡直像。比喻，不是真的在做那件事。常和まるで一起。","connection":"普通形＋かのようだ。ている＋かのようだ。","why":"空格在「見ている」後面。不是真的睡著在做夢，是像做夢。見ているかのようだ。","example":"彼は何も知らないかのように話した。","zh":"他說得好像什麼都不知道。"},{"text":"かそうだ","meaning":"沒有這個接法。","connection":"様態そうだ接語幹：見ている不能加そうだ。伝聞是見ているそうだ，中間不加か。","why":"見ているかそうだ不成立。比喻的固定形是かのようだ，不是かそうだ。","example":"彼は夢を見ているそうだ。","zh":"聽說他在做夢。那是傳聞。"},{"text":"かはずだ","meaning":"沒有這個接法。","connection":"はずだ接普通形：見ているはずだ。中間不加か。","why":"見ているかはずだ不成立。按理應該在做夢，也不是這句的比喻。","example":"こんな時間なら、寝ているはずだ。","zh":"這個時間按理應該在睡。"},{"text":"わけだ","meaning":"難怪、也就是說。","connection":"普通形＋わけだ。見ているわけだ。","why":"見ているわけだ是「所以是在做夢」，把做夢當成結論。句子有まるで，是比喻，不是把原因和結果對上。","example":"夜中まで起きていたわけだ。眠そうだ。","zh":"難怪半夜還醒着。看起來很睏。"}],"level":"N3"},{"id":"n349","kind":"grammar","point":"がる","group":"tendency","difficulty":3,"stem":"弟（おとうと）は新（あたら）しいゲームを＿＿。","gloss":"弟弟想要新遊戲。欲望是從外面看到的。","answer":"ほしがっている","options":[{"text":"ほしがっている","meaning":"第三者想要。把對方的欲望當成看得出來的行為。","connection":"ほしい→ほしがる。い形容詞去掉い＋がる。現在的狀態用ている。名詞を＋ほしがる。","why":"弟弟是第三者。想要遊戲、而且現在還想要，用ほしがっている。助詞是を。","example":"子供が外に行きたがっている。","zh":"孩子想出去。"},{"text":"ほしいです","meaning":"說話人自己想要。","connection":"名詞が＋ほしい。不接を。","why":"ゲームをほしいです助詞錯了，ほしい要が。而且ほしい是自己的欲望，不能用來陳述弟弟。","example":"私は新しいゲームがほしいです。","zh":"我想要新遊戲。"},{"text":"たがっています","meaning":"想做某個動作。","connection":"動詞ます語幹＋たがる。本身不是「想要東西」。","why":"ゲームをたがっています前面沒有動詞語幹。想要物品用ほしがる，想做動作用たがる。","example":"弟はゲームをやりたがっている。","zh":"弟弟想玩遊戲。"},{"text":"そうです","meaning":"看起來；聽說。","connection":"語幹＋そうです，或普通形＋そうです。","why":"ゲームをそうです接不上。沒有可以加そう的語幹。","example":"弟はゲームがほしそうです。","zh":"弟弟看起來很想要遊戲。那是樣態そう。"}],"level":"N3"},{"id":"n350","kind":"grammar","point":"をこめて","group":"stance","difficulty":3,"stem":"感謝（かんしゃ）の気持（きも）ち＿＿、手紙（てがみ）を書（か）いた。","gloss":"懷着感謝的心情寫了信。","answer":"をこめて","options":[{"text":"をこめて","meaning":"把感情放進動作裡。","connection":"名詞＋をこめて。よく「心、願い、感謝」と一緒に使う。","why":"寫信這個動作裡放了感謝。気持ち＋をこめて。","example":"愛をこめて、歌を歌った。","zh":"懷着愛唱了歌。"},{"text":"をめぐって","meaning":"圍繞某件事議論、對立。","connection":"名詞＋をめぐって。","why":"感謝不是爭執的題目。後面是寫信，不是開會。","example":"予算をめぐって、意見が割れた。","zh":"圍繞預算，意見分裂了。"},{"text":"に基づいて","meaning":"以資料為根據。","connection":"名詞＋に基づいて。","why":"感謝的心情不是製作信件的數據或法條。","example":"事実に基づいて、書いた。","zh":"根據事實寫了。"},{"text":"を問わず","meaning":"不論。","connection":"名詞＋を問わず。","why":"不是「不論是不是感謝都寫信」。","example":"経験を問わず、応募できる。","zh":"不論有沒有經驗都可以應徵。"}],"level":"N3"},{"id":"n351","kind":"grammar","point":"に関して","group":"stance","difficulty":3,"stem":"この規則（きそく）＿＿、質問（しつもん）がある人（ひと）は手（て）を挙（あ）げてください。","gloss":"有關這條規則，有問題的人請舉手。書面的「關於」。","answer":"に関して","options":[{"text":"に関して","meaning":"關於。比について書面，題目多是事情、規則、問題。","connection":"名詞＋に関して。","why":"規則是提問的題目。規則＋に関して。","example":"その事件に関して、報告する。","zh":"就那件事作報告。"},{"text":"をこめて","meaning":"把感情放進去。","connection":"名詞＋をこめて。","why":"規則をこめて質問不成立。規則不是感情。","example":"願いをこめて、祈った。","zh":"懷着心願祈禱。"},{"text":"をきっかけに","meaning":"以某事為開端。","connection":"名詞＋をきっかけに。","why":"不是「以規則為契機開始提問的人生」。只是針對規則這個題目。","example":"その規則をきっかけに、制度を見直した。","zh":"以那條規則為契機，重新看了制度。"},{"text":"のくせに","meaning":"明明卻，帶責備。","connection":"名詞＋の＋くせに。","why":"規則のくせに質問がある不成「關於」。くせに要前後矛盾，這裡沒有。","example":"担当のくせに、規則を知らない。","zh":"明明是負責人，卻不知道規則。"}],"level":"N3"},{"id":"n352","kind":"grammar","point":"くらい","group":"degree","difficulty":3,"stem":"挨拶（あいさつ）＿＿、自分（じぶん）でしなさい。","gloss":"打個招呼這種小事，自己做。把事情說得很輕。","answer":"くらい","options":[{"text":"くらい","meaning":"至少、這種程度的小事。把動作的負擔說低。","connection":"名詞・普通形＋くらい。","why":"打招呼被當成最低限度、很容易的事。挨拶くらい自分でしなさい。","example":"メールくらい、自分で書きなさい。","zh":"一封郵件這種程度，自己寫。"},{"text":"ごろ","meaning":"大約幾點。","connection":"時間＋ごろ。三時ごろ。","why":"挨拶ごろ不表示「至少打個招呼」。ごろ只接時間的大約。","example":"三時ごろ、着きます。","zh":"三點左右到。"},{"text":"ずつ","meaning":"每個各多少。","connection":"數量＋ずつ。一人ずつ。","why":"挨拶ずつ沒有分配的數量。","example":"一人ずつ、挨拶しなさい。","zh":"一個一個地打招呼。"},{"text":"しか","meaning":"只有。後面必須否定。","connection":"名詞＋しか＋否定。","why":"しなさい是肯定的命令。挨拶しかしなさい少了否定，接不上。","example":"挨拶しかしない。","zh":"只會打招呼。"}],"level":"N3"},{"id":"n353","kind":"grammar","point":"さえ","group":"degree","difficulty":3,"stem":"三年（ねん）も日本（にほん）にいるのに、ひらがな＿＿読（よ）めない。","gloss":"在日本都三年了，連平假名都不會讀。極端的例子。","answer":"さえ","options":[{"text":"さえ","meaning":"連……都。舉出最容易、最基本的一項，表示其他更不必說。","connection":"名詞＋さえ。後ろは意外な結果。","why":"平假名是最基礎的，連這個都不會，和「三年」的預期相反。ひらがなさえ読めない。","example":"水さえ飲めなかった。","zh":"連水都喝不了。"},{"text":"こそ","meaning":"正是。強調非它不可。","connection":"名詞＋こそ。","why":"ひらがなこそ読めない會變成「讀不了的正是平假名」，不是「連最基本的都不會」這個極端。","example":"今年こそ、合格したい。","zh":"今年一定要合格。"},{"text":"ずつ","meaning":"各。","connection":"數量＋ずつ。","why":"ひらがなずつ読めない沒有「每個」的數量。","example":"一字ずつ、読む。","zh":"一個字一個字地讀。"},{"text":"ごろ","meaning":"大約的時間。","connection":"時間＋ごろ。","why":"ひらがなごろ不表示程度或極端。","example":"三年ごろ、帰国した。","zh":"大概第三年回國了。時間的大約。"}],"level":"N3"},{"id":"n354","kind":"grammar","point":"上に","group":"addition","difficulty":4,"stem":"この部屋（へや）は狭（せま）い＿＿、日当（ひあ）たりも悪（わる）い。","gloss":"這房間又窄，日照又差。兩項都是缺點。","answer":"上に","options":[{"text":"上に","meaning":"本來就……，再加上。兩項同一方向。","connection":"普通形＋上に。い形容詞はそのまま：狭い上に。","why":"窄和日照差都是不好，是追加，不是轉折。狭い上に。","example":"値段が高い上に、味も悪い。","zh":"價錢又貴，味道又差。"},{"text":"上で","meaning":"先做完再決定；或在某方面。","connection":"た形＋上で，或名詞＋の＋上で。","why":"狭い上で接在い形容詞後面，不成「做完再」。也沒有先後的動作。","example":"調べた上で、借りるか決める。","zh":"查過之後再決定租不租。"},{"text":"反面","meaning":"另一方面卻。前後是相反的評價。","connection":"普通形＋反面。","why":"窄和日照差都是負面，沒有好壞對立。反面要用在一邊好、一邊不好。","example":"狭い反面、駅に近い。","zh":"雖然窄，另一方面卻離車站近。"},{"text":"くせに","meaning":"明明卻，責備人。","connection":"普通形＋くせに。","why":"房間不是該被責備的人。窄和日照差也不是矛盾。","example":"高い家賃のくせに、狭い。","zh":"明明房租貴，卻很窄。那是責備。"}],"level":"N3"},{"id":"n355","kind":"grammar","point":"かと思ったら","group":"time","difficulty":5,"stem":"急（きゅう）に雨（あめ）が降（ふ）り出（だ）した＿＿、すぐにやんだ。","gloss":"雨突然下起來，才這麼想，馬上又停了。剛才的判斷立刻被推翻。","answer":"かと思ったら","options":[{"text":"かと思ったら","meaning":"剛以為是這樣，緊接着就出現相反的事。","connection":"動詞た形＋かと思ったら。後句是意料之外的轉折。","why":"空格在「降り出した」後面。一下雨就停，說話人的預期被推翻。た形＋かと思ったら。","example":"泣いたかと思ったら、もう笑っている。","zh":"才以為在哭，已經又笑了。"},{"text":"ばかりに","meaning":"就因為做了那件事，才有不好的結果。","connection":"た形＋ばかりに。","why":"雨停不是「因為開始下」這個錯誤決定造成的後悔。没有該被責備的行為。","example":"傘を持たなかったばかりに、濡れた。","zh":"就因為沒帶傘，淋濕了。"},{"text":"上で","meaning":"以做完的事為基礎。","connection":"た形＋上で。","why":"降り出した上で、やんだ不是「在下雨的基礎上決定停」。沒有後續的決定。","example":"雨がやんだ上で、出かけよう。","zh":"等雨停了再出門。"},{"text":"次第","meaning":"一……就。","connection":"ます語幹＋次第。降り次第。不接た形。","why":"降り出した次第不成立。次第的後句也多是說話人的安排，不是自然現象自己停。","example":"雨がやみ次第、出発する。","zh":"雨一停就出發。"}],"level":"N3"},{"id":"n356","kind":"grammar","point":"ものなら","group":"condition","difficulty":5,"stem":"時間（じかん）が戻（もど）せる＿＿、子供（こども）のころに戻（もど）りたい。","gloss":"時間要是真能倒流的話，我想回到小時候。實際上幾乎不可能。","answer":"ものなら","options":[{"text":"ものなら","meaning":"假如真能做到那件很難的事。多接可能形，後面是願望。","connection":"可能形＋ものなら。戻せる＋ものなら。","why":"時間倒流幾乎做不到。可能形＋ものなら表示「假如辦得到的話」。","example":"会えるものなら、もう一度会いたい。","zh":"要是還能見到的話，想再見一次。"},{"text":"ものの","meaning":"雖然……但是。","connection":"普通形＋ものの。","why":"戻せるものの、戻りたい會變成「雖然能倒流，但想回去」，轉折不完整，也不是假設。","example":"戻せるものの、戻る勇気がない。","zh":"雖然能回去，卻沒有回去的勇氣。"},{"text":"ものだから","meaning":"因為。解釋、辯解。","connection":"普通形＋ものだから。","why":"想回到小時候不是「因為能倒流」的原因句。後句是願望。","example":"子供のものだから、仕方がない。","zh":"因為是小孩子，所以沒辦法。"},{"text":"ことなら","meaning":"不是假設難以實現的文法。","connection":"可能形後面不接ことなら表示願望。","why":"戻せることなら不成立。難以实现的假設用ものなら。","example":"時間のことなら、私に聞いて。","zh":"如果是時間的事，問我。那是「關於」。"}],"level":"N3"},{"id":"n360","kind":"grammar","point":"てたまらない","group":"degree","difficulty":4,"stem":"合格（ごうかく）の知（し）らせを聞（き）いて、嬉（うれ）しく＿＿。","gloss":"聽到合格的消息，高興得不得了。","answer":"てたまらない","options":[{"text":"てたまらない","meaning":"情緒或身體感覺強到受不了。","connection":"い形容詞は「くてたまらない」。動詞願望はます語幹＋たくてたまらない。嬉しい→嬉しくてたまらない。","why":"合格是讓自己壓不住的高興。空格在「嬉しく」後面，接てたまらない。","example":"眠くてたまらない。","zh":"睏得不得了。"},{"text":"すぎる","meaning":"過於。常含過了頭。","connection":"い形容詞語幹＋すぎる。嬉しい→嬉しすぎる。中間不加く。","why":"嬉しくすぎる不成立。すぎる要接在「嬉し」這個語幹，不是「嬉しく」。而且這句是高興的程度，不是批評「過於高興」。","example":"甘すぎて、飲めない。","zh":"甜得喝不了。"},{"text":"てはいけない","meaning":"禁止。","connection":"て形＋はいけない。","why":"嬉しくてはいけない會變成不准高興。聽到合格沒有這條禁令。","example":"試験中に話してはいけない。","zh":"考試中不准說話。"},{"text":"がち","meaning":"往往容易。","connection":"ます語幹或名詞＋がち。不接「く」。","why":"嬉しくがち不成立。がち說的是傾向，不是這一瞬間壓不住的情緒。","example":"冬は風邪をひきがちだ。","zh":"冬天容易感冒。"}],"level":"N3"},{"id":"n361","kind":"grammar","point":"てならない","group":"degree","difficulty":5,"stem":"息子（むすこ）のことが心配（しんぱい）＿＿、夜（よる）も眠（ねむ）れない。","gloss":"兒子的事讓我擔心得不得了，晚上也睡不着。自發湧上來的情緒。","answer":"でならない","options":[{"text":"でならない","meaning":"某種感情自然湧上來，壓不住。多是擔心、遺憾、在意。","connection":"い形容詞はくてならない。な形容詞・名詞＋でならない。心配でならない。","why":"「兒子的事」讓擔心自己冒出來，後面才睡不着。這是自發的情緒，不是推論「一定是擔心」。心配でならない。","example":"不思議でならない。","zh":"覺得不可思議得不行。"},{"text":"に違いない","meaning":"一定是。說話人的判斷。","connection":"名詞・な形容詞＋に違いない。心配＋に違いない。","why":"心配に違いない是「一定是在擔心」的結論，不是強到睡不着的那種情緒本身。","example":"彼は無事に違いない。","zh":"他一定平安。"},{"text":"そうだ","meaning":"看起來。","connection":"な形容詞語幹＋そうだ。心配そうだ。","why":"心配そうだ是從外面看「一副擔心的樣子」。這句是自己睡不着，不是在形容別人的神情。","example":"弟は心配そうな顔をしている。","zh":"弟弟一臉擔心。"},{"text":"すべきだ","meaning":"應該做。義務、勸告。","connection":"する動詞の辞書形を「すべきだ」にする。心配する→心配すべきだ。","why":"心配すべきだ是「應該擔心」。這句不是勸人去擔心，而是擔心已經強到睡不着。勸告和壓不住的情緒不是同一個意思。","example":"親に連絡すべきだ。","zh":"應該聯絡父母。"}],"level":"N3"},{"id":"n362","kind":"grammar","point":"みたいだ","group":"modal","difficulty":4,"stem":"あの雲（くも）は、まるで竜（りゅう）＿＿。","gloss":"那朵雲簡直像一條龍。比喻、看起來像。","answer":"みたいだ","options":[{"text":"みたいだ","meaning":"好像、像。口語的比喻或外觀判斷。","connection":"名詞直接＋みたいだ。な形容詞語幹＋みたいだ。動詞・い形容詞は普通形＋みたいだ。まるで常和みたいだ、ようだ一起。","why":"雲和龍是比喻。名詞「竜」後面直接接みたいだ，中間不要の。まるで竜みたいだ。","example":"このパン、石みたいに硬い。","zh":"這麵包硬得像石頭。"},{"text":"ようだ","meaning":"好像。書面的比喻。","connection":"名詞＋の＋ようだ。動詞普通形＋ようだ。","why":"竜ようだ少了「の」。ようだ接名詞必須「竜のようだ」。空格前沒有の，所以不能用ようだ。","example":"まるで竜のようだ。","zh":"簡直像龍。名詞要加の。"},{"text":"らしい","meaning":"有根據的推測，或「很有那種典型」。","connection":"名詞直接＋らしい：子供らしい。まるで不和らしい組成比喻。","why":"まるで竜らしい不是比喻句型。らしい要嘛是「有龍的典型」，要嘛是聽到證據後的推測，不拿來形容雲的形狀。","example":"この話は本当らしい。","zh":"這件事好像是真的。有根據的推測。"},{"text":"そうだ","meaning":"樣態或傳聞。","connection":"樣態是語幹＋そうだ。傳聞是普通形＋そうだ：竜だそうだ。","why":"竜そうだ接不上。沒有人說「聽說是龍」，句子有まるで，是比喻。","example":"明日は晴れるそうだ。","zh":"聽說明天會晴。"}],"level":"N3"},{"id":"n363","kind":"grammar","point":"に沿って","group":"stance","difficulty":4,"stem":"この川（かわ）の岸（きし）＿＿歩（ある）いていくと、橋（はし）がある。","gloss":"沿着這條河的岸走，就有一座橋。","answer":"に沿って","options":[{"text":"に沿って","meaning":"沿着路線、岸，或遵照既有方針的方向。","connection":"名詞＋に沿って。道、川、方針、希望。","why":"岸是空間上的一條線，人沿着它走。岸＋に沿って。","example":"この方針に沿って、計画を直す。","zh":"按這個方針修改計劃。"},{"text":"にしたがって","meaning":"依照指示去做，或隨着一方變化另一方也變。","connection":"名詞＋にしたがって。指示、規則。動詞辞書形＋にしたがって。","why":"岸不是要服從的指示，也不是「岸增加、走路也增加」的連動。沿着走用沿って。","example":"係の指示にしたがって、進んだ。","zh":"按照工作人員的指示前進。"},{"text":"に基づいて","meaning":"以資料為根據。","connection":"名詞＋に基づいて。","why":"不是拿河岸當資料來決定什麼，是沿着岸走。","example":"地図に基づいて、歩いた。","zh":"根據地圖走。"},{"text":"に向かって","meaning":"朝向某個方向。","connection":"名詞＋に向かって。","why":"岸に向かって歩く是朝河岸走過去，不是沿着岸走到橋。方向不對。","example":"北に向かって、歩いた。","zh":"朝北走。"}],"level":"N3"},{"id":"n364","kind":"grammar","point":"にあたって","group":"time","difficulty":5,"stem":"開会（かいかい）＿＿、一言（ひとこと）ご挨拶（あいさつ）を申（もう）し上（あ）げます。","gloss":"值此開會之際，請容我說幾句話。重要場合的開始。","answer":"にあたって","options":[{"text":"にあたって","meaning":"在重要的時刻、活動要開始的時候。書面、致辭常用。","connection":"名詞＋にあたって。動詞辞書形＋にあたって。","why":"開會這個場合的開端要致辭。開会＋にあたって。","example":"卒業にあたって、お礼を述べる。","zh":"臨畢業之際致謝。"},{"text":"に沿って","meaning":"沿着、遵照。","connection":"名詞＋に沿って。","why":"開会に沿って挨拶不表示「在開會這個時點」。沿って要有一條方針或路線。","example":"式の進行に沿って、挨拶する。","zh":"按儀式流程致辭。"},{"text":"に基づいて","meaning":"根據資料。","connection":"名詞＋に基づいて。","why":"致辭不是「根據開會」做出的結論。","example":"資料に基づいて、説明した。","zh":"根據資料說明了。"},{"text":"をこめて","meaning":"傾注感情。","connection":"名詞＋をこめて。気持ち、願い。","why":"開会をこめて不成立。こめて的對象是心意，不是「開會」這個場合。","example":"感謝の気持ちをこめて、話した。","zh":"懷着感謝說了話。"}],"level":"N3"},{"id":"n365","kind":"grammar","point":"に際して","group":"time","difficulty":5,"stem":"契約（けいやく）を更新（こうしん）する＿＿、条件（じょうけん）をもう一度確（たし）かめた。","gloss":"在續約之際，把條件又確認了一次。","answer":"に際して","options":[{"text":"に際して","meaning":"在做某件重要的事的時候。時機。","connection":"名詞＋に際して。動詞辞書形＋に際して。更新する＋に際して。","why":"續約是一個重要手續的時點，在那個時候確認條件。辞書形＋に際して。","example":"出国に際して、保険に入った。","zh":"出國之際買了保險。"},{"text":"に沿って","meaning":"遵照。","connection":"名詞＋に沿って。不接辞書形。","why":"更新するに沿って不成立。沿って前面是方針、計劃這類名詞。","example":"契約の方針に沿って、直した。","zh":"按合約方針修改了。"},{"text":"に基づいて","meaning":"根據。","connection":"名詞＋に基づいて。","why":"更新するに基づいて不接動詞辞書形。也不是拿「續約」當證據。","example":"契約書に基づいて、確かめた。","zh":"根據合約確認了。"},{"text":"を通じて","meaning":"透過媒介，或整段期間。","connection":"名詞＋を通じて。","why":"更新するを通じて不成立。確認條件不是「透過續約這個管道」。","example":"代理人を通じて、交渉した。","zh":"透過代理人交涉了。"}],"level":"N3"},{"id":"n366","kind":"grammar","point":"にこたえて","group":"stance","difficulty":5,"stem":"ファンの声援（せいえん）＿＿、選手（せんしゅ）は最後（さいご）まで走（はし）った。","gloss":"回應粉絲的加油，選手跑到了最後。","answer":"にこたえて","options":[{"text":"にこたえて","meaning":"回應期待、要求、聲援，用行動回答。","connection":"名詞＋にこたえて。期待、要望、声援。","why":"聲援是要回應的東西，跑完全程是回答。声援＋にこたえて。","example":"住民の要望にこたえて、公園を作った。","zh":"回應居民的要求，建了公園。"},{"text":"に沿って","meaning":"沿着方針或路線。","connection":"名詞＋に沿って。","why":"聲援不是一條要跟着走的方針。声援に沿って走る不表示「回應加油」。","example":"コーチの方針に沿って、練習した。","zh":"按照教練的方針練習。"},{"text":"に反して","meaning":"與預期相反。","connection":"名詞＋に反して。予想、期待。","why":"會變成和聲援相反，選手卻跑完。句子是因為聲援而跑完，方向反了。","example":"予想に反して、棄権した。","zh":"和預想相反，棄權了。"},{"text":"に加えて","meaning":"再加上。","connection":"名詞＋に加えて。","why":"声援に加えて走った會變成「除了聲援之外還跑了」兩件事並列，不是回應。","example":"声援に加えて、花も贈られた。","zh":"除了加油，還收到了花。"}],"level":"N3"},{"id":"n367","kind":"grammar","point":"に限って","group":"degree","difficulty":5,"stem":"傘（かさ）を忘（わす）れた日（ひ）＿＿、雨（あめ）が降（ふ）る。","gloss":"偏偏在忘了帶傘的那一天，就下雨。出乎意料的正好。","answer":"に限って","options":[{"text":"に限って","meaning":"偏偏是那個時候、那個人。和期待相反的巧。","connection":"名詞＋に限って。〜ときに限って、〜に限って〜ない。","why":"忘了傘的日子和下雨湊在一起，是不湊巧的「偏偏」。日＋に限って。","example":"急いでいるときに限って、電車が来ない。","zh":"偏偏趕時間的時候電車不來。"},{"text":"に対して","meaning":"對某對象。","connection":"名詞＋に対して。","why":"不是對那一天採取態度，是那一天偏偏發生。","example":"客に対して、謝った。","zh":"向客人道了歉。"},{"text":"について","meaning":"關於話題。","connection":"名詞＋について。","why":"「關於忘了傘的那天，下雨」不成偏偏的巧。","example":"天気について、話した。","zh":"談了天氣。"},{"text":"にとって","meaning":"對某人而言的評價。","connection":"名詞＋にとって。人や組織が自然。","why":"「日」不是會評價的人。忘れた日にとって雨が降る不成立。","example":"私にとって、雨の日は不便だ。","zh":"對我來說，下雨天不方便。"}],"level":"N3"},{"id":"n368","kind":"grammar","point":"に限り","group":"degree","difficulty":4,"stem":"先着（せんちゃく）三十名（さんじゅうめい）＿＿、受（う）け付（つ）けます。","gloss":"僅限先到的三十人受理。告示上的範圍限定。","answer":"に限り","options":[{"text":"に限り","meaning":"僅限。把範圍卡在這個名額、這個日子。告示、規則常用。","connection":"名詞＋に限り。本日に限り、会員に限り。","why":"三十人是受理的上限，不是「偏偏這三十人出事」。先着三十名＋に限り。","example":"この券は本日に限り有効です。","zh":"這張券僅限今天有效。"},{"text":"に対して","meaning":"針對對象。","connection":"名詞＋に対して。","why":"三十名に対して受け付けます會變成「針對這三十人受理」，不是「只有這三十個名額」。","example":"応募者に対して、メールを送る。","zh":"向申請者寄信。"},{"text":"について","meaning":"關於。","connection":"名詞＋について。","why":"關於三十人、我們受理，話題不對，也沒有「僅限」的上限。","example":"定員について、説明した。","zh":"說明了名額。"},{"text":"にとって","meaning":"對……而言。","connection":"名詞＋にとって＋評價。","why":"三十名にとって受け付けます後面不是評價句。","example":"参加者にとって、定員は重要だ。","zh":"對參加者來說，名額很重要。"}],"level":"N3"},{"id":"n369","kind":"grammar","point":"ことから","group":"cause","difficulty":5,"stem":"この地方（ちほう）には古（ふる）い方言（ほうげん）が残（のこ）っている＿＿、昔（むかし）は交流（こうりゅう）が少（すく）なかったと考（かんが）えられる。","gloss":"從這個地方還留着古老方言這一點來看，可以認為從前交流很少。","answer":"ことから","options":[{"text":"ことから","meaning":"從某個事實出發，推出判斷。理由是根據，不是責備。","connection":"普通形＋ことから。ている＋ことから。後句常是〜と考えられる、〜が分かる。","why":"方言還在，是推出「從前交流少」的根據。残っている＋ことから。","example":"足跡があることから、誰かが来たと分かった。","zh":"從有腳印這一點，知道有人來過。"},{"text":"ことだから","meaning":"因為是那個人，照他的性格一定會。","connection":"人＋の＋ことだから。","why":"残っていることだから不接在事情後面。ことだから前面該是「田中さんのことだから」這種人。這裡是從事實推論，用ことから。","example":"真面目な彼のことだから、遅れない。","zh":"以他那麼認真，不會遲到。"},{"text":"ものだから","meaning":"因為。個人的藉口、說明，語氣主觀。","connection":"普通形＋ものだから。","why":"後面是「被認為」，是客觀推論，不是自己在辯解為什麼方言還在。","example":"急いでいたものだから、傘を忘れた。","zh":"因為趕時間，所以忘了傘。"},{"text":"せいで","meaning":"都怪。壞結果，含責備。","connection":"普通形＋せいで。","why":"方言還在不是被責備的原因，後句也不是受害，是歷史判斷。因果方向也不是「因為有方言所以從前交流少」。","example":"方言が難しいせいで、聞き取れない。","zh":"都怪方言難，聽不懂。"}],"level":"N3"},{"id":"n370","kind":"grammar","point":"か〜ないかのうちに","group":"time","difficulty":5,"stem":"ベルが鳴（な）るか鳴（な）ら＿＿、生徒（せいと）が教室（きょうしつ）を飛（と）び出（だ）した。","gloss":"鈴聲幾乎才要響、還沒響完，學生就衝出教室。幾乎同時。","answer":"ないかのうちに","options":[{"text":"ないかのうちに","meaning":"做與不做幾乎分不出先後的那一瞬間。","connection":"動詞辞書形＋か＋ない形＋かのうちに。鳴る＋か＋鳴らない＋かのうちに。空格在「鳴ら」後面。","why":"前半已經有「鳴るか」，後半要「ないかのうちに」才成對。鳴るか鳴らないかのうちに。","example":"座るか座らないかのうちに、電車が出た。","zh":"剛要坐下的那一瞬間，電車開了。"},{"text":"ないうちに","meaning":"在還沒發生之前趕緊做。","connection":"ない形＋うちに。鳴らないうちに。","why":"空格若只接ないうちに，整句變成「鳴るか鳴らないうちに」，少了一個か，不成「〜か〜ないか」。而且学生是幾乎同時衝出去，不是「趁還沒響先走」。","example":"雨が降らないうちに、帰ろう。","zh":"趁還沒下雨回去吧。"},{"text":"ない限り","meaning":"只要不、除非。","connection":"ない形＋限り。","why":"鳴ら＋ない限り會變成鳴らない限り，前面的「鳴るか」就多出來，整句接不上。意思也會變成「只要不響，學生就衝出去」。","example":"鳴らない限り、教室にいる。","zh":"只要不響，就待在教室。"},{"text":"ないと","meaning":"如果不。","connection":"ない形＋と。","why":"鳴らないと前面不能再疊「鳴るか」。如果不響就衝出去，和「幾乎同時」相反。","example":"急がないと、遅れる。","zh":"不趕快就會遲到。"}],"level":"N3"},{"id":"n371","kind":"grammar","point":"ところを","group":"time","difficulty":5,"stem":"お忙（いそが）しい＿＿、お時間（じかん）をいただいてすみません。","gloss":"在您忙碌的時候還佔用時間，對不起。打斷對方的場面。","answer":"ところを","options":[{"text":"ところを","meaning":"正處於某個場面時，還來打擾、或被打斷。道歉常用お忙しいところを。","connection":"い形容詞＋ところを。動詞ている＋ところを。","why":"對方正忙，說話人仍佔用時間，所以道歉。忙しい＋ところを。","example":"休んでいるところを、起こされた。","zh":"正在休息的時候被叫起來了。"},{"text":"上で","meaning":"先做完再以此為基礎，或在某個方面。","connection":"た形＋上で。い形容詞不能加い上で表示「正忙的時候」。","why":"忙しい上でお時間をいただく不表示「正忙還來打擾」。","example":"調べた上で、決めたい。","zh":"查過之後再決定。"},{"text":"くせに","meaning":"明明卻，帶責備。","connection":"い形容詞＋くせに。","why":"忙しいくせに會變成責備對方明明忙卻怎樣。這句是道歉，不是怪對方忙。","example":"知っているくせに、教えない。","zh":"明明知道卻不教。"},{"text":"反面","meaning":"另一方面，兩邊相反。","connection":"普通形＋反面。","why":"忙しい反面、すみません沒有對立的兩面，是道歉。","example":"便利な反面、家賃が高い。","zh":"方便，另一方面房租貴。"}],"level":"N3"},{"id":"n372","kind":"grammar","point":"向き","group":"stance","difficulty":4,"stem":"この道（みち）は狭（せま）くて暗（くら）いので、夜間（やかん）の運転（うんてん）＿＿ではない。","gloss":"這條路又窄又暗，不適合夜間開車。說的是適不適合。","answer":"向き","options":[{"text":"向き","meaning":"性質上適合某用途。不是廠商指定的銷售對象。","connection":"名詞＋向き。向かない是否定：夜間の運転向きではない。","why":"路的條件決定它適不適合夜駕。主語是路，不是被生產出來「賣給夜駕的人」。運転＋向き。","example":"この靴は山道向きだ。","zh":"這雙鞋適合山路。"},{"text":"向け","meaning":"為某對象而製作、而準備。","connection":"名詞＋向け。子供向け、初心者向け。","why":"向け是製作者心裡的目標群眾。這條路不是為了「夜間駕駛」這個客群而鋪的商品。狭くて暗い說的是適不適合，用向き。","example":"これは子供向けの番組だ。","zh":"這是給孩子看的節目。"},{"text":"とおり","meaning":"照原樣。","connection":"名詞＋の＋とおり。動詞た形＋とおり。","why":"運転とおりではない少了の，也不表示適合。","example":"説明のとおりに、運転する。","zh":"照說明開車。"},{"text":"最中","meaning":"正在進行中。","connection":"名詞＋の＋最中。","why":"運転最中ではない少了の。而且不是「不是正在開車」。","example":"運転の最中に、電話するな。","zh":"正在開車的時候別打電話。"}],"level":"N3"},{"id":"n373","kind":"grammar","point":"お〜ください","group":"voice","difficulty":4,"stem":"社長（しゃちょう）、どうぞこちらへ＿＿。","gloss":"社長，這邊請。請對方做，同時抬高對方。","answer":"お入りください","options":[{"text":"お入りください","meaning":"請尊長做某動作。尊敬的請求。","connection":"お＋ます語幹＋ください。入る→お入りください。どうぞ和ください一起，是請對方。","why":"進來的人是社長，要抬高他的動作，並用ください提出請求。お入りください。","example":"どうぞお掛けください。","zh":"請坐。"},{"text":"お入りします","meaning":"我來進。謙讓，動作的人是自己。","connection":"お＋ます語幹＋する。說話人的動作。","why":"どうぞ是讓社長進，不是說自己要進去。对自己用します，方向反了。","example":"私がお入りします。","zh":"我進去。謙讓。"},{"text":"入りなさい","meaning":"命令晚輩。","connection":"ます語幹＋なさい。入りなさい。","why":"對社長用なさい是命令下級，沒有尊敬。","example":"早く入りなさい。","zh":"快進去。對小孩說。"},{"text":"お入りになる","meaning":"社長進來。尊敬的陳述。","connection":"お＋ます語幹＋になる。","why":"お入りになる只是說「社長進」，句子有どうぞ，卻沒有請求的ください，邀請沒有說完。請對方用お＋語幹＋ください。","example":"社長がお入りになる。","zh":"社長進來。這是陳述。"}],"level":"N3"},{"id":"n374","kind":"grammar","point":"ないではいられない","group":"modal","difficulty":5,"stem":"この小説（しょうせつ）は面白（おもしろ）くて、最後（さいご）まで読（よ）ま＿＿。","gloss":"這本小說太好看，忍不住要讀到最後。自己心裡壓不住。","answer":"ないではいられない","options":[{"text":"ないではいられない","meaning":"忍不住要做。衝動來自自己。","connection":"動詞ない形＋ではいられない。読む→読まないではいられない。","why":"理由是「好看」，是自己停不下來，不是被命令。読ま＋ないではいられない。","example":"その曲を聞くと、口ずさまないではいられない。","zh":"一聽那首歌就忍不住哼。"},{"text":"ざるを得ない","meaning":"沒有別的辦法，只好做。外力。","connection":"ない形の語幹＋ざるを得ない。読まざるを得ない。","why":"好看不是上司或期限逼你讀完。ざるを得ない要有不想做卻不得不的外在理由。","example":"宿題なので、読まざるを得ない。","zh":"因為是作業，只好讀。"},{"text":"ないことには","meaning":"如果不先做，後面的否定就不能成立。","connection":"ない形＋ことには＋否定。","why":"読まないことには句子在這裡結束，後面沒有「就不行」的另一句。這個句型不能單獨收尾。","example":"読まないことには、批評できない。","zh":"不讀的話就沒辦法評論。"},{"text":"ようがない","meaning":"沒有辦法做。","connection":"ます語幹＋ようがない。読みようがない。","why":"読まようがない接在ない形的語幹上，不成立。ようがない要接「読み」。句意也不是「無法讀」。","example":"ページが破れて、読みようがない。","zh":"頁面破了，沒辦法讀。"}],"level":"N3"},{"id":"n375","kind":"grammar","point":"以上","group":"condition","difficulty":4,"stem":"一度（いちど）引（ひ）き受（う）けた＿＿、最後（さいご）までやる。","gloss":"既然答應了，就要做到最後。","answer":"以上","options":[{"text":"以上","meaning":"既然已經是這樣，後句就是理所當然的責任。","connection":"動詞た形・辞書形＋以上。引き受けた＋以上。名詞＋である以上。","why":"答應這件事已經成立，所以必須做完。た形＋以上。","example":"学生である以上、勉強するのは当然だ。","zh":"既然是學生，讀書是當然的。"},{"text":"上に","meaning":"不僅……而且。同一方向再加一項。","connection":"普通形＋上に。","why":"做完不是「答應」之外再追加的另一個壞處或好處，是從答應推出的責任。","example":"引き受けた上に、材料費も払わされた。","zh":"不但答應了，連材料費也被要求付。"},{"text":"反面","meaning":"另一方面。","connection":"普通形＋反面。兩邊性質相反。","why":"做完和答應不是相反的兩面。","example":"引き受けた反面、準備はしていない。","zh":"雖然答應了，另一方面卻沒準備。那才是反面。"},{"text":"ところを","meaning":"正處於某場面時被打斷。","connection":"た形＋ところを。","why":"引き受けたところを最後までやる不表示「既然答應」。","example":"寝ているところを、起こされた。","zh":"正睡着的時候被叫醒。"}],"level":"N3"},{"id":"n376","kind":"grammar","point":"からすると","group":"stance","difficulty":4,"stem":"この雲行（くもゆ）き＿＿、午後（ごご）は雨（あめ）だろう。","gloss":"從現在這天氣看來，下午大概會下雨。由材料推出一個判斷。","answer":"からすると","options":[{"text":"からすると","meaning":"從某材料、某立場推出判斷。","connection":"名詞＋からすると／からすれば。","why":"雲的樣子是判斷的材料，後面已經有一個結論「會下雨」。雲行き＋からすると。","example":"この成績からすると、合格は難しい。","zh":"從這個成績看來，合格很難。"},{"text":"にとって","meaning":"對某人而言。","connection":"名詞＋にとって＋評價。人・組織が自然。","why":"雲行きにとって雨だろう，雲不是會感到怎樣的人。","example":"農家にとって、雨は必要だ。","zh":"對農家來說，雨是需要的。"},{"text":"によって","meaning":"視……而定，結果可以有好幾種；或由於。","connection":"名詞＋によって。後ろに「違う、さまざまな」が多い。","why":"によって要的是因情況而不同。這句已經斷定下午會下雨，不是「有時下有時不下」。","example":"雲行きによって、中止になることもある。","zh":"視天氣狀況，有時會取消。"},{"text":"として","meaning":"作為某種身份。","connection":"名詞＋として。","why":"不是「作為雲的走向」這個身份。","example":"証拠として、写真を出した。","zh":"把照片當成證據提出。"}],"level":"N3"},{"id":"n377","kind":"grammar","point":"を通して","group":"stance","difficulty":4,"stem":"通訳（つうやく）＿＿、両国（りょうこく）の代表（だいひょう）が話（はな）した。","gloss":"雙方代表透過口譯交談。口譯是媒介。","answer":"を通して","options":[{"text":"を通して","meaning":"透過某人或某個過程。媒介。","connection":"名詞＋を通して。人、経験、通訳。","why":"口譯是兩邊說話的管道。通訳＋を通して。","example":"経験を通して、学ぶ。","zh":"透過經驗學習。"},{"text":"に沿って","meaning":"沿着、遵照。","connection":"名詞＋に沿って。","why":"不是沿着口譯這條路走。","example":"通訳のメモに沿って、確認した。","zh":"按口譯的筆記確認。"},{"text":"に対して","meaning":"對着某人。","connection":"名詞＋に対して。","why":"通訳に対して話した會變成對着口譯員說，不是透過口譯和對方說。","example":"代表に対して、意見を述べた。","zh":"對代表陳述了意見。"},{"text":"をはじめ","meaning":"以某代表為首。","connection":"名詞＋をはじめ。後ろに同類の其他。","why":"口譯不是出席者的代表，後面也沒有「以及其他人」。","example":"議長をはじめ、代表が集まった。","zh":"以議長為首，代表們到了。"}],"level":"N3"},{"id":"n378","kind":"grammar","point":"次第だ","group":"condition","difficulty":4,"stem":"合格（ごうかく）できるかどうかは、本人（ほんにん）の努力（どりょく）＿＿。","gloss":"能不能合格，就看本人的努力。取決於。","answer":"次第だ","options":[{"text":"次第だ","meaning":"取決於前面接的名詞。句尾用だ收束。","connection":"名詞＋次第だ。努力次第だ。","why":"句子到此結束，要說「取決於努力」。努力＋次第だ。這和「一決定就通知」的ます語幹＋次第不同。","example":"成功するかどうかは、準備次第だ。","zh":"成功與否，看準備。"},{"text":"次第で","meaning":"依此而變。後面還要接會變的結果。","connection":"名詞＋次第で＋結果。","why":"努力次第で句子停在で，後面沒有結果。這句的結果「能不能合格」已經在前面，句尾要用次第だ。","example":"努力次第で、結果は変わる。","zh":"結果會因努力而不同。後面有結果。"},{"text":"によって","meaning":"視……而定，或由於。","connection":"名詞＋によって。","why":"努力によって停住，少了「決まる」。によって単独不能把「取決於」說完。","example":"努力によって、結果が決まる。","zh":"結果因努力而決定。要有決まる。"},{"text":"に応じて","meaning":"按照程度調整做法。","connection":"名詞＋に応じて＋做法。","why":"努力に応じて同樣少了後面的做法，句子不完整。","example":"努力に応じて、報酬を決める。","zh":"按努力決定報酬。"}],"level":"N3"},{"id":"n379","kind":"grammar","point":"ばかりか","group":"addition","difficulty":4,"stem":"この製品（せいひん）は国内（こくない）で売（う）れている＿＿、海外（かいがい）でも人気（にんき）だ。","gloss":"這產品不但在國內賣得好，在國外也受歡迎。同一方向再加一項。","answer":"ばかりか","options":[{"text":"ばかりか","meaning":"不但……而且。後項常比前項更進一步。","connection":"普通形＋ばかりか。売れている＋ばかりか。","why":"國內賣得好，再加上國外也受歡迎，方向相同。売れているばかりか。","example":"漢字が読めないばかりか、ひらがなも書けない。","zh":"不但不會讀漢字，平假名也不會寫。"},{"text":"ばかりに","meaning":"就因為……才落得不好的結果。後悔。","connection":"普通形＋ばかりに＋壞結果。","why":"國外受歡迎不是後悔的壞結果。ばかりに的後句不該是好事。","example":"売れたばかりに、生産が追いつかない。","zh":"就因為賣太好，生產趕不上。"},{"text":"上で","meaning":"在做完之後的基礎上，或在某個方面。","connection":"た形＋上で。売れた上で。","why":"売れている上で人気だ不表示「不但而且」。上で不是追加同一方向的事實。","example":"売れた上で、次の製品を考える。","zh":"賣出去之後再想下一個產品。"},{"text":"反面","meaning":"另一方面，性質相反。","connection":"普通形＋反面。","why":"國外受歡迎和國內賣得好是同一方向，不是反面。","example":"国内では売れている反面、海外では知られていない。","zh":"國內賣得好，另一方面國外沒人知道。"}],"level":"N3"},{"id":"n380","kind":"grammar","point":"ものの","group":"contrast","difficulty":4,"stem":"説明（せつめい）は聞（き）いた＿＿、まだ使（つか）い方（かた）が分（わ）からない。","gloss":"說明雖然聽了，用法還是不懂。","answer":"ものの","options":[{"text":"ものの","meaning":"雖然……但是。前句的事做了，後句仍不如預期。","connection":"普通形＋ものの。た形＋もののが多い。聞いた＋ものの。","why":"聽了卻還是不懂，是轉折。聞いたものの。","example":"予約はしたものの、行けなくなった。","zh":"雖然訂了，卻去不成了。"},{"text":"ものだから","meaning":"因為。個人理由。","connection":"普通形＋ものだから。","why":"不懂不是「因為聽了說明」的自然理由。前後是相反的。","example":"初めて聞いたものだから、分からなかった。","zh":"因為是第一次聽，所以不懂。"},{"text":"ものなら","meaning":"如果辦得到的話。多接可能形。","connection":"可能形＋ものなら。","why":"聞いたものなら不表示讓步。ものなら是「若是能」的假設。","example":"戻れるものなら、戻りたい。","zh":"若是回得去，我想回去。"},{"text":"ものではない","meaning":"不該做。常理。","connection":"辞書形＋ものではない。","why":"聞いたものではない會變成「不是該聽的東西」，和「還是不懂」接不上。","example":"人の失敗を笑うものではない。","zh":"不該笑別人的失敗。"}],"level":"N3"},{"id":"n381","kind":"grammar","point":"にしても","group":"contrast","difficulty":4,"stem":"反対（はんたい）する＿＿、もう少（すこ）しまともな理由（りゆう）を言（い）ってほしい。","gloss":"就算要反對，也希望你說出稍微像樣的理由。","answer":"にしても","options":[{"text":"にしても","meaning":"即使承認前句，後句仍有最低的要求。","connection":"動詞辞書形・名詞＋にしても。反対する＋にしても。","why":"先讓步「你要反對也可以」，再要求至少把理由說清楚。する＋にしても。","example":"行くにしても、明日にしてほしい。","zh":"就算要去，也希望改成明天。"},{"text":"にしたら","meaning":"站在某人的立場來看。","connection":"人＋にしたら。","why":"反対するにしたら不接動詞。にしたら前面該是人。","example":"私にしたら、反対する理由がある。","zh":"站在我的立場，有反對的理由。"},{"text":"にしては","meaning":"以那個標準來說，結果出乎意料。","connection":"名詞・普通形＋にしては。","why":"にしては後面該是和標準不相稱的評價，不是「請你說理由」這個要求。","example":"反対するにしては、声が小さい。","zh":"以要反對來說，聲音太小了。那才是不相稱。"},{"text":"にすれば","meaning":"若站在某人立場。","connection":"人＋にすれば。","why":"反対するにすれば不接動詞辞書形表示讓步。","example":"彼にすれば、反対せざるを得ない。","zh":"站在他的立場，只好反對。"}],"level":"N3"},{"id":"n382","kind":"grammar","point":"あまりの〜に","group":"degree","difficulty":4,"stem":"＿＿暑（あつ）さに、外（そと）に出（で）られなかった。","gloss":"因為熱得太厲害，沒能出門。程度過度才引起後面的結果。","answer":"あまりの","options":[{"text":"あまりの","meaning":"因為太……，才導致後面的結果。程度過頭。","connection":"あまりの＋名詞＋に。あまりの暑さに。","why":"熱到出不了門，是過度。句首用あまりの，後面「暑さに」。","example":"あまりの驚きに、声が出なかった。","zh":"因為太驚訝，出不了聲。"},{"text":"わずかの","meaning":"一点点。","connection":"わずかの＋名詞。","why":"一点点熱不會熱到出不了門。程度和結果相反。","example":"わずかの雨なら、出かける。","zh":"如果只是一點點雨，就出門。"},{"text":"ほんの","meaning":"僅僅、微不足道。","connection":"ほんの＋名詞。","why":"微不足道的熱，接不上「出不了門」。","example":"ほんの少しなら、大丈夫だ。","zh":"如果只是一點點，沒問題。"},{"text":"多少の","meaning":"若干、或多或少。","connection":"多少の＋名詞。","why":"多少有點熱，不足以把人困在屋裡。這句的結果是完全出不了門，要用過度的あまりの。","example":"多少の暑さは我慢できる。","zh":"多少有點熱還忍得住。"}],"level":"N3"},{"id":"n383","kind":"grammar","point":"ようとする","group":"aspect","difficulty":4,"stem":"電車（でんしゃ）に乗（の）＿＿、ドアが閉（し）まった。","gloss":"正要上電車的時候，門關了。還沒做成。","answer":"ろうとしたとき","options":[{"text":"ろうとしたとき","meaning":"正要做、試圖做的那一刻。動作還沒完成。","connection":"動詞意向形＋とする。乗る→乗ろう＋としたとき。","why":"人還沒上去，門就關了。空格在「乗」後面，用意向形ろう。乗ろうとしたとき。","example":"出かけようとしたとき、電話が来た。","zh":"正要出門時，電話來了。"},{"text":"ったとたん","meaning":"一做完就。","connection":"た形＋とたん。乗ったとたん。","why":"乗ったとたん是已經上去的那一瞬間。人已經在車上，不是被關在外面。","example":"乗ったとたん、席に座った。","zh":"一上去就坐下了。"},{"text":"りながら","meaning":"一邊乘車一邊。","connection":"ます語幹＋ながら。乗りながら。","why":"已經在乘車，門才關，和「沒上去」相反。","example":"乗りながら、本を読む。","zh":"一邊乘車一邊看書。"},{"text":"れるうちに","meaning":"在還能做的期間。","connection":"可能形＋うちに。乗れるうちに。","why":"乗れるうちにドアが閉まった會變成「在還上得去的時候門關了」，不是「正要上的那一下」。うちに要的是趁那段時間做完別的事。","example":"乗れるうちに、荷物を置いた。","zh":"趁還上得去，把行李放了。"}],"level":"N3"},{"id":"n384","kind":"grammar","point":"つつ","group":"contrast","difficulty":5,"stem":"体（からだ）に悪（わる）いと知（し）り＿＿、夜中（よなか）にまた食（た）べてしまった。","gloss":"明明知道對身體不好，半夜還是又吃了。同一個人的矛盾。","answer":"つつ","options":[{"text":"つつ","meaning":"雖然知道、雖然做着，卻。書面。主語必須相同。","connection":"ます語幹＋つつ。知る→知り＋つつ。","why":"知道和還是吃的是同一個人。空格在「知り」後面。知りつつ。","example":"悪いと知りつつ、嘘をついた。","zh":"明知不好，還是說了謊。"},{"text":"つつある","meaning":"變化正在進行。","connection":"ます語幹＋つつある。知りつつある＝正逐漸明白。","why":"知りつつある是「正在明白的過程」，不是「明知卻還做」。後面的「還是吃了」對不上進行中的變化。","example":"危険だと知りつつある。","zh":"正逐漸明白那是危險的。"},{"text":"てから","meaning":"做完之後。","connection":"て形＋から。知ってから。","why":"知りてから不成立。知る的て形是知って，不是知りて。而且「知道之後才吃」沒有「明知不該」的矛盾。","example":"知ってから、やめた。","zh":"知道之後就停了。"},{"text":"たびに","meaning":"每次。","connection":"辞書形＋たびに。知るたびに。","why":"知りたびに不成立。たびに不接ます語幹。","example":"食べるたびに、後悔する。","zh":"每次吃都後悔。"}],"level":"N3"},{"id":"n385","kind":"grammar","point":"つつある","group":"change","difficulty":5,"stem":"景気（けいき）は、少（すこ）しずつ回復（かいふく）し＿＿。","gloss":"景氣正在一點點恢復。變化還在進行。","answer":"つつある","options":[{"text":"つつある","meaning":"某變化正在一點點發生。書面。","connection":"ます語幹＋つつある。回復する→回復し＋つつある。","why":"「少しずつ」表示過程還在走，不是已經恢復完，也不是「往往會恢復」。回復しつつある。","example":"人口は減りつつある。","zh":"人口正在減少。"},{"text":"がちだ","meaning":"往往會。傾向。","connection":"ます語幹＋がちだ。回復しがちだ。","why":"がち是容易發生的傾向，不是「現在正在恢復」這個進行中的變化。","example":"不況のあとでも、回復しがちだとは限らない。","zh":"不景氣之後，也不見得往往就會恢復。"},{"text":"っぱなし","meaning":"做了就放着不管。","connection":"ます語幹＋っぱなし。","why":"回復しっぱなし不說。景氣不是一扇被打開後沒關的窗。","example":"窓を開けっぱなしにした。","zh":"窗一直開着沒關。"},{"text":"きり","meaning":"做了之後就停在那、沒有下文。","connection":"ます語幹＋きり。但「しきり」不是回復する的完了形。","why":"回復しきり不成立。完全恢復完要用回復しきった。きり是「之後就沒再」。","example":"言ったきり、連絡がない。","zh":"說了之後就沒聯絡。"}],"level":"N3"},{"id":"n386","kind":"grammar","point":"に反して","group":"contrast","difficulty":4,"stem":"専門家（せんもんか）は負（ま）けると言（い）っていた。その予想（よそう）＿＿、彼（かれ）は勝（か）った。","gloss":"專家說他會輸。和那個預想相反，他贏了。","answer":"に反して","options":[{"text":"に反して","meaning":"和預想、規則、期待相反。","connection":"名詞＋に反して。予想、期待、意思。","why":"前句說專家預測會輸，後句他贏了，和預測相反。予想＋に反して。","example":"予想に反して、雨は降らなかった。","zh":"和預想相反，沒下雨。"},{"text":"どおり","meaning":"和……一樣。","connection":"名詞＋どおり。予想どおり。","why":"予想どおり勝った會變成照專家說的那樣贏了。但專家說的是輸，和前句矛盾。","example":"予想どおり、彼は負けた。","zh":"正如預想，他輸了。"},{"text":"に沿って","meaning":"沿着、遵照。","connection":"名詞＋に沿って。","why":"沿着「會輸」的預測，結果卻贏，方向對不上。沿って不是相反。","example":"予想に沿って、対策を立てた。","zh":"按預測定了對策。"},{"text":"に基づいて","meaning":"根據。","connection":"名詞＋に基づいて。","why":"他不是「根據會輸的預測」才贏的。","example":"予想に基づいて、賭けた。","zh":"根據預測下了注。"}],"level":"N3"},{"id":"n387","kind":"grammar","point":"を中心に","group":"addition","difficulty":4,"stem":"このサークルは、山田（やまだ）さん＿＿活動（かつどう）している。","gloss":"這個社團以山田為中心在活動。","answer":"を中心に","options":[{"text":"を中心に","meaning":"以某人、某地為中心展開。","connection":"名詞＋を中心に。人、都市。","why":"活動圍繞山田進行。山田さん＋を中心に。","example":"駅を中心に、店が並んでいる。","zh":"店舖以車站為中心排列。"},{"text":"を問わず","meaning":"不論。","connection":"名詞＋を問わず。年齢、性別。","why":"山田さんを問わず活動している不成立。問わず要接的是可以分成兩邊的範圍，不是一個人名當中心。","example":"年齢を問わず、参加できる。","zh":"不論年齡都能參加。"},{"text":"を通じて","meaning":"透過某人。","connection":"名詞＋を通じて。","why":"透過山田來活動，是山田當媒介，不是大家以他為中心。","example":"山田さんを通じて、会場を借りた。","zh":"透過山田租了場地。"},{"text":"に対して","meaning":"對山田採取態度。","connection":"名詞＋に対して。","why":"サークルは山田さんに対して活動している會變成社團針對山田做活動，不是以他為核心運作。","example":"山田さんに対して、礼を言った。","zh":"向山田道了謝。"}],"level":"N3"},{"id":"n388","kind":"grammar","point":"かと思うと","group":"time","difficulty":5,"stem":"晴（は）れた＿＿、もう雨（あめ）が降（ふ）り出（だ）した。","gloss":"剛以為放晴了，馬上又下起雨。突然轉向。","answer":"かと思うと","options":[{"text":"かと思うと","meaning":"剛出現一種情況，立刻變成相反的情況。","connection":"動詞た形＋かと思うと。晴れた＋かと思うと。","why":"放晴和下雨接得很近，而且是反過來。晴れたかと思うと。","example":"泣いたかと思うと、もう笑っている。","zh":"剛哭了，馬上又在笑。"},{"text":"ばかりに","meaning":"就因為……才倒霉。","connection":"た形＋ばかりに＋壞結果，中間的因果要說得通。","why":"晴れたばかりに雨が降り出した，放晴不是下雨的原因。沒有後悔的因果。","example":"晴れたばかりに、洗濯を出して濡らした。","zh":"就因為放晴把衣服晾了，結果淋濕了。那才是ばかりに。"},{"text":"上で","meaning":"在那個基礎上再做。","connection":"た形＋上で。","why":"晴れた上で雨が降り出した不表示瞬間逆轉。","example":"晴れた上で、出かけるか決める。","zh":"看放晴了再決定出不出門。"},{"text":"次第","meaning":"一做完就。","connection":"ます語幹＋次第。晴れ次第。不接た形。","why":"晴れた次第接不上。次第是「一放晴就（按計劃做下一件）」，不是晴雨突然對調。","example":"晴れ次第、出発する。","zh":"一放晴就出發。"}],"level":"N3"},{"id":"n389","kind":"grammar","point":"てはならない","group":"advice","difficulty":4,"stem":"試験中（しけんちゅう）、隣（となり）の人（ひと）の答案（とうあん）を見（み）＿＿。","gloss":"考試中，不可以看旁邊的人的答案。書面的禁止。","answer":"てはならない","options":[{"text":"てはならない","meaning":"不准做。規則、書面，語氣比てはいけない硬。","connection":"動詞て形＋はならない。見る→見て＋はならない。空格在「見」後面。","why":"考試規則禁止看別人的答案。見てはならない。","example":"この情報を外に話してはならない。","zh":"這項資料不准外傳。"},{"text":"てならない","meaning":"感情湧上來，受不了。","connection":"動詞て形＋てならないとは言わない。心配でならないのように感情語に付く。","why":"見てならない不表示禁止，也不是「看得受不了」的標準說法。禁止要用てはならない，中間有は。","example":"気になってならない。","zh":"在意得不得了。"},{"text":"なければならない","meaning":"必須做。","connection":"ない形＋なければならない。見なければならない。","why":"見なければならない會變成考試時必須看別人的答案，和規則相反。","example":"名前を書かなければならない。","zh":"必須寫名字。"},{"text":"てもよい","meaning":"可以做。許可。","connection":"て形＋もよい。見てもよい。","why":"見てもよい是允許看答案，和考試規則相反。","example":"辞書を見てもよい。","zh":"可以看字典。那是另一條允許的規則。"}],"level":"N3"},{"id":"n390","kind":"grammar","point":"ないといけない","group":"advice","difficulty":3,"stem":"締（し）め切（き）りなので、この書類（しょるい）は今日中（きょうじゅう）に出（だ）さ＿＿。","gloss":"因為截止，這份文件今天之內必須交。口語的義務。","answer":"ないといけない","options":[{"text":"ないといけない","meaning":"不這樣做不行。口語的義務，和なければならない接近。","connection":"動詞ない形＋といけない。出す→出さない＋といけない。空格在「出さ」後面。","why":"截止日期是外在義務。出さないといけない。","example":"もう行かないといけない。","zh":"必須走了。"},{"text":"なくてもいい","meaning":"不必做。","connection":"ない形＋なくてもいい。出さなくてもいい。","why":"不必交和「截止日期」相反。","example":"明日でも出さなくてもいい。","zh":"明天不交也可以。那和截止矛盾。"},{"text":"ずにはいられない","meaning":"忍不住要做。衝動在自己。","connection":"ない形の語幹＋ずにはいられない。出さずにはいられない。","why":"截止是外面的期限，不是自己忍不住非交不可的衝動。外在義務用ないといけない。","example":"面白くて、読まずにはいられない。","zh":"太好看，忍不住要讀。"},{"text":"ないことには","meaning":"如果不先做，後句就不能。","connection":"ない形＋ことには＋後句の否定。","why":"出さないことには句子到此結束，後面沒有「就來不及」這一句，句型不完整。","example":"出さないことには、審査が始まらない。","zh":"不交的話，審查就不會開始。"}],"level":"N3"},{"id":"n401","kind":"grammar","point":"なければならない","group":"advice","difficulty":2,"stem":"明日（あした）は試験（しけん）だから、今夜（こんや）は勉強（べんきょう）＿＿。","gloss":"明天有考試，所以今晚必須讀書。","answer":"しなければならない","options":[{"text":"しなければならない","meaning":"必須做。義務。","connection":"動詞ない形＋なければならない。する→しなければならない。","why":"考試在明天，今晚讀書是義務，不是「可以不讀」。","example":"薬は毎日飲まなければならない。","zh":"藥必須每天吃。"},{"text":"しなくてもいい","meaning":"不必做。","connection":"ない形＋なくてもいい。","why":"有考試還說不必讀，和「だから」的理由相反。","example":"今日は休んでもいい。","zh":"今天可以休息。"},{"text":"してはいけない","meaning":"禁止。","connection":"て形＋はいけない。","why":"勉強してはいけない會變成不准讀書。","example":"ここで話してはいけない。","zh":"不准在這裡說話。"},{"text":"することができる","meaning":"有能力做。","connection":"辞書形＋ことができる。","why":"可以讀只是能力，不是今晚的義務。","example":"一人で勉強することができる。","zh":"能夠一個人讀書。"}],"level":"N4"},{"id":"n402","kind":"grammar","point":"なくてもいい","group":"advice","difficulty":2,"stem":"この欄（らん）は、書（か）か＿＿です。空欄（くうらん）のままで出（だ）してください。","gloss":"這一欄可以不填。空着交就可以。","answer":"なくてもいい","options":[{"text":"なくてもいい","meaning":"不做也可以。許可、不必。","connection":"ない形＋なくてもいい。書く→書かなくてもいい。","why":"後句說空着交。所以不是必須填，是可以不填。","example":"明日は来なくてもいい。","zh":"明天可以不來。"},{"text":"なければならない","meaning":"必須。","connection":"ない形＋なければならない。","why":"必須填和「空着交」矛盾。","example":"名前は書かなければならない。","zh":"名字必須寫。"},{"text":"ないではいけない","meaning":"不準不做，也就是必須。","connection":"ない形＋ではいけない。","why":"書かないではいけない＝必須寫。和空欄指示相反。","example":"申請書を出さないではいけない。","zh":"申請書必須交。"},{"text":"ないでください","meaning":"請不要做。請求。","connection":"ない形＋でください。","why":"書かないでください是請別寫，語氣是禁止請求，不是「可以空白」。而且空格在書か後面，書か＋ないでください＝書かないでください，但句尾已有です，ないでくださいです不成立。","example":"ここには書かないでください。","zh":"請不要寫在這裡。"}],"level":"N4"},{"id":"n403","kind":"grammar","point":"てはいけない","group":"advice","difficulty":2,"stem":"図書館（としょかん）では、大（おお）きな声（こえ）で話（はな）し＿＿。","gloss":"在圖書館不准大聲說話。","answer":"てはいけない","options":[{"text":"てはいけない","meaning":"禁止。","connection":"動詞て形＋はいけない。話す→話して＋はいけない。","why":"圖書館的規則是不准。話してはいけない。","example":"教室で食べてはいけない。","zh":"不准在教室吃東西。"},{"text":"てもいい","meaning":"可以做。許可。","connection":"て形＋もいい。","why":"可以大聲說和圖書館規則相反。","example":"相談してもいい。","zh":"可以商量。"},{"text":"なければならない","meaning":"必須。","connection":"ない形＋なければならない。不接て形。","why":"話してなければならない接不上。必須說也不是規則。","example":"静かにしなければならない。","zh":"必須保持安靜。"},{"text":"てもかまわない","meaning":"做了也沒關係。許可，和てもいい接近。","connection":"て形＋もかまわない。","why":"沒關係＝允許。圖書館不是允許大聲說話。","example":"辞書を見てもかまわない。","zh":"看字典也沒關係。"}],"level":"N4"},{"id":"n404","kind":"grammar","point":"ことができる","group":"modal","difficulty":2,"stem":"弟（おとうと）は漢字（かんじ）を三百（さんびゃく）＿＿。","gloss":"弟弟能夠寫三百個漢字。","answer":"書くことができる","options":[{"text":"書くことができる","meaning":"有能力做。","connection":"動詞辞書形＋ことができる。","why":"三百漢字是能力，不是義務，也不是經驗的次數。書くことができる。","example":"一人で駅まで行くことができる。","zh":"能夠一個人走到車站。"},{"text":"書いたことがある","meaning":"曾經做過。經驗。","connection":"た形＋ことがある。","why":"曾經寫過三百個，不等于現在有這個能力。句子沒有「以前」的經驗語感。","example":"この漢字を書いたことがある。","zh":"這個漢字曾經寫過。"},{"text":"書かなければならない","meaning":"必須寫。","connection":"ない形＋なければならない。","why":"沒有人要求弟弟必須會三百個。是能力。","example":"宿題で三百書かなければならない。","zh":"作業規定必須寫三百個。"},{"text":"書こうと思う","meaning":"想要寫。意志。","connection":"意向形＋と思う。","why":"想寫是打算，不是已經具備的能力。","example":"明日、書こうと思う。","zh":"我想明天寫。"}],"level":"N4"},{"id":"n405","kind":"grammar","point":"つもり","group":"decision","difficulty":2,"stem":"夏休み（なつやすみ）に、北海道（ほっかいどう）へ行（い）く＿＿だ。","gloss":"暑假打算去北海道。","answer":"つもり","options":[{"text":"つもり","meaning":"打算。說話人已有的計劃。","connection":"動詞辞書形・ない形＋つもりだ。行く＋つもりだ。","why":"暑假去北海道是自己的打算。行くつもりだ。","example":"今年は車を買わないつもりだ。","zh":"今年打算不買車。"},{"text":"ところ","meaning":"正要、正在、剛剛。","connection":"辞書形＋ところだ＝正要。行くところだ。","why":"行くところだ是正要去，不是暑假的打算。打算用つもり。","example":"今から行くところだ。","zh":"現在正要去。"},{"text":"こと","meaning":"事情。","connection":"辞書形＋ことだ是忠告，或こと本身是名詞化。","why":"行くことだ會變成「應該去」，不是暑假的打算。","example":"早く寝ることにしている。","zh":"決定早睡。這是ことにする。"},{"text":"はず","meaning":"按理應該。","connection":"辞書形＋はずだ。","why":"應該去是推測，不是自己的計劃。","example":"彼も行くはずだ。","zh":"他按理也會去。"}],"level":"N4"},{"id":"n406","kind":"grammar","point":"たことがある","group":"aspect","difficulty":2,"stem":"私（わたし）は一度（いちど）も寿司（すし）を食（た）べ＿＿。","gloss":"我一次壽司都沒吃過。","answer":"たことがない","options":[{"text":"たことがない","meaning":"沒有過該經驗。","connection":"動詞た形＋ことがない。食べる→食べた＋ことがない。一度も呼應否定。","why":"「一度も」必須接否定的經驗。食べたことがない。","example":"富士山に登ったことがない。","zh":"沒有爬過富士山。"},{"text":"たことがある","meaning":"有過經驗。肯定。","connection":"た形＋ことがある。","why":"ことがある是肯定，和一度も矛盾。","example":"寿司を食べたことがある。","zh":"吃過壽司。"},{"text":"ることがある","meaning":"有時會。","connection":"辞書形＋ことがある。","why":"食べることがある是有時吃。空格前若是食べ，會變成食べることがある，但選項是ることがある，句子是食べ＿＿。食べ＋ることがある＝食べることがある，少了た，變成「有時吃」，而且一度も對不上。","example":"朝はパンを食べることがある。","zh":"早上有時吃麵包。"},{"text":"たいことがない","meaning":"不是經驗的說法。","connection":"たい＋ことがない不表示沒吃過。","why":"吃的欲望和「沒有這次經驗」不是同一個文法。","example":"今は食べたくない。","zh":"現在不想吃。"}],"level":"N4"},{"id":"n407","kind":"grammar","point":"た方がいい","group":"advice","difficulty":2,"stem":"熱（ねつ）があるなら、学校（がっこう）を休（やす）ん＿＿。","gloss":"如果發燒，最好請假不上學。","answer":"だ方がいい","options":[{"text":"だ方がいい","meaning":"最好做。建議。","connection":"動詞た形＋方がいい。休む→休んだ＋方がいい。空格在休ん後面，撥音便是休んだ。","why":"發燒是理由，建議請假。休んだ方がいい。","example":"早く寝た方がいい。","zh":"最好早點睡。"},{"text":"でない方がいい","meaning":"最好不要。","connection":"ない形＋方がいい。休まない方がいい。","why":"休んでない方がいい或休まない。空格在休ん後接でない方，會變成休んでない方がいい，意思是最好沒有在休息，和發燒的建議相反。","example":"無理をしない方がいい。","zh":"最好不要硬撐。"},{"text":"うと思う","meaning":"想要做。意志。","connection":"動詞意向形＋と思う。休む→休もう＋と思う。意向形不接在撥音便「休ん」後面。","why":"休んうと思う不成立。想休息要說休もうと思う，不能把「う」接在て形的ん後面。而且這句是建議「最好」，不是說自己的打算。","example":"明日は休もうと思う。","zh":"我想明天休息。"},{"text":"ことができる","meaning":"有能力做。","connection":"動詞辞書形＋ことができる。休むことができる。","why":"休んことができる少了「だ」，撥音便後面不能直接加ことができる。會不會請假也不是能力問題。","example":"一人で休むことができる。","zh":"能夠自己休息。"}],"level":"N4"},{"id":"n408","kind":"grammar","point":"てから","group":"time","difficulty":2,"stem":"手（て）を洗（あら）っ＿＿、食事（しょくじ）をしてください。","gloss":"請洗完手再吃飯。","answer":"てから","options":[{"text":"てから","meaning":"做完前一件，再做後一件。順序。","connection":"動詞て形＋から。洗う→洗って＋から。空格在洗っ後面。","why":"先洗手，之後才吃飯。洗ってから。","example":"宿題をしてから、遊ぶ。","zh":"做完功課再玩。"},{"text":"ている","meaning":"正在做。","connection":"て形＋いる。洗っている。","why":"洗っている是正在洗，後面「然後吃飯」接不上先後順序。先做完用てから。","example":"手を洗っている。","zh":"正在洗手。"},{"text":"ながら","meaning":"一邊……一邊。","connection":"ます語幹＋ながら。洗いながら。","why":"洗っながら不成立。一邊洗手一邊吃飯也不是這句的順序。","example":"音楽を聞きながら、食事する。","zh":"一邊聽音樂一邊吃飯。"},{"text":"前に","meaning":"在……之前。","connection":"辞書形＋前に。洗う前に。","why":"洗っ前に不成立。而且「吃飯之前洗手」若用前に，前に要接在吃飯上，不是接在洗っ後面。","example":"食事の前に、手を洗う。","zh":"吃飯前洗手。"}],"level":"N4"},{"id":"n409","kind":"grammar","point":"前に","group":"time","difficulty":1,"stem":"出（で）かける＿＿、窓（まど）を閉（し）めた。","gloss":"出門之前，把窗關上了。","answer":"前に","options":[{"text":"前に","meaning":"在做某事之前。","connection":"動詞辞書形＋前に。出かける＋前に。名詞＋の＋前に。","why":"先關窗，之後才出門。辞書形＋前に。","example":"寝る前に、歯を磨く。","zh":"睡覺前刷牙。"},{"text":"後で","meaning":"在……之後。","connection":"た形＋後で，或名詞＋の後で。","why":"出かける後で不接辞書形。之後的話窗已經該在出門前關好，順序反了。","example":"出かけた後で、鍵を確認した。","zh":"出門之後確認了鎖。"},{"text":"てから","meaning":"做完再做。","connection":"て形＋から。出かけてから。","why":"出かけるてから不成立。出かけてから閉めた會變成出門之後才關窗，順序反了。","example":"窓を閉めてから、出かける。","zh":"關窗之後再出門。"},{"text":"たびに","meaning":"每次。","connection":"辞書形＋たびに。","why":"出かけるたびに閉めた會變成每次出門都關了窗，不是「出門之前」這一次的順序。","example":"出かけるたびに、窓を確認する。","zh":"每次出門都確認窗戶。"}],"level":"N5"},{"id":"n410","kind":"grammar","point":"ながら（同時）","group":"time","difficulty":2,"stem":"音楽（おんがく）を聞（き）き＿＿、宿題（しゅくだい）をしている。","gloss":"一邊聽音樂，一邊做功課。","answer":"ながら","options":[{"text":"ながら","meaning":"一邊做，一邊做。兩個動作同時，主語相同。","connection":"ます語幹＋ながら。聞く→聞き＋ながら。","why":"聽音樂和做功課是同一個人同時做。聞きながら。","example":"歩きながら、電話するのは危ない。","zh":"一邊走一邊打電話很危險。"},{"text":"てから","meaning":"做完再做。","connection":"て形＋から。聞いてから。","why":"聞きてから不成立。順序完成不是同時。","example":"音楽を聞いてから、宿題を始める。","zh":"聽完音樂再開始功課。"},{"text":"たり","meaning":"列舉動作。","connection":"た形＋り。聞いたり。","why":"聞きたり不成立。たり要兩個以上的列舉，這裡是同時。","example":"聞いたり、話したりする。","zh":"又聽又說。"},{"text":"後","meaning":"之後。","connection":"た形＋後。","why":"聞き後不成立。","example":"聞いた後、宿題をした。","zh":"聽完之後做了功課。"}],"level":"N4"},{"id":"n411","kind":"grammar","point":"かどうか","group":"speech","difficulty":2,"stem":"その店（みせ）が日曜（にちよう）も開（あ）いている＿＿、電話（でんわ）で聞（き）いた。","gloss":"那家店星期天開不開，我打電話問了。","answer":"かどうか","options":[{"text":"かどうか","meaning":"是不是、做不做。不確定的內容。","connection":"普通形＋かどうか。ている＋かどうか。","why":"星期天開不開還不知道，所以才問。開いているかどうか。","example":"来るかどうか、まだ分からない。","zh":"來不來還不知道。"},{"text":"と","meaning":"引用一句肯定的話。","connection":"普通形＋と＋言う／聞く。","why":"開いていると聞いた會變成「我聽說是開着的」，已經知道答案，不是在問開不開。","example":"開いていると聞いた。","zh":"我聽說是開着的。"},{"text":"か","meaning":"疑問詞的問句可以只用か。沒有疑問詞時，正反要用かどうか。","connection":"疑問詞＋か：いつ行くか。","why":"開いているか聞いた口語有時說，但沒有疑問詞的正反問，N4的標準形是かどうか。只加か不夠完整。","example":"いつ開くか、聞いた。","zh":"問了幾點開。"},{"text":"のを","meaning":"把句子名詞化。","connection":"普通形＋のを。","why":"開いているのを聞いた是聽到「開着」這件事，不是問開不開。","example":"開いているのを見て、入った。","zh":"看到開着就進去了。"}],"level":"N4"},{"id":"n412","kind":"grammar","point":"と言う","group":"speech","difficulty":2,"stem":"田中（たなか）さんは、明日（あした）は来（こ）ない＿＿言（い）っていた。","gloss":"田中說了，明天不來。"
