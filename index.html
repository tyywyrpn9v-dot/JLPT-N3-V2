n":"辞書形＋ことはない。","why":"歩くことはない是不必走。但沒有末班車，不是不必。","example":"心配することはない。","zh":"不必擔心。"},{"text":"はずがない","meaning":"按理不會。","connection":"辞書形＋はずがない。","why":"歩くはずがない是否定走路這件事會發生。","example":"こんな近くて、タクシーに乗るはずがない。","zh":"這麼近，按理不會坐計程車。"}],"level":"N3"},{"id":"n643","kind":"grammar","point":"得ない","group":"modal","difficulty":4,"stem":"彼（かれ）が嘘（うそ）をつくなんて、あり＿＿。","gloss":"他怎麼可能說謊。不可能。","answer":"得ない","options":[{"text":"得ない","meaning":"不可能發生。","connection":"ます語幹＋得る的否定。ある→あり＋得ない。","why":"なんて表示不敢相信。あり得ない。","example":"そんなミスはあり得ない。","zh":"不可能有那種錯誤。"},{"text":"かねない","meaning":"有可能發生壞事。","connection":"ます語幹＋かねない。ありかねない。","why":"ありかねない是「有可能發生」。和「怎麼可能」的否定相反。","example":"事故になりかねない。","zh":"有可能出事。"},{"text":"得る","meaning":"可能。肯定。","connection":"あり得る。","why":"あり得る是「有可能」。句子要的是不可能。","example":"そういうこともあり得る。","zh":"那種事也有可能。"},{"text":"かねる","meaning":"難以、婉拒。","connection":"ます語幹＋かねる。","why":"ありかねる不是「不可能有」。かねる不和ある組成「絕無可能」。","example":"お受けしかねます。","zh":"難以接受。"}],"level":"N3"},{"id":"n644","kind":"grammar","point":"から言うと","group":"stance","difficulty":4,"stem":"専門家（せんもんか）の立場（たちば）＿＿、その計画（けいかく）は危険（きけん）だ。","gloss":"從專家的立場來說，那個計劃很危險。","answer":"から言うと","options":[{"text":"から言うと","meaning":"從某個立場、觀點來判斷。","connection":"名詞＋から言うと。立場から言うと。","why":"判斷的出發點是專家立場。立場から言うと。","example":"利用者の立場から言うと、不便だ。","zh":"從使用者的立場來說，不方便。"},{"text":"からには","meaning":"既然。後面是應該做的事。","connection":"普通形＋からには。","why":"立場からには不接名詞表示觀點。後面「危險」也不是義務。","example":"言うからには、責任を取る。","zh":"既然說了，就要負責。"},{"text":"からといって","meaning":"雖說……也不能。","connection":"普通形＋からといって。","why":"立場からといって接不上，也沒有「不能因此就……」的後句。","example":"高いからといって、買わないわけにはいかない。","zh":"雖說貴，也不能不買。"},{"text":"にとって","meaning":"對某人來說。","connection":"人＋にとって。","why":"立場にとって不自然。にとって前面應是人：専門家にとって。","example":"専門家にとって、その計画は危険だ。","zh":"對專家來說，那個計劃危險。這句沒有立場。"}],"level":"N3"},{"id":"n645","kind":"grammar","point":"と言われている","group":"speech","difficulty":3,"stem":"この寺（てら）は千年（せんねん）の歴史（れきし）がある＿＿。","gloss":"據說這座寺有一千年歷史。大家這麼說。","answer":"と言われている","options":[{"text":"と言われている","meaning":"一般人們都這麼說。傳聞，不是某一個我認識的人。","connection":"普通形＋と言われている。ある＋と言われている。","why":"寺院的歷史是世間的說法。あると言われている。","example":"この泉の水は体にいいと言われている。","zh":"據說這泉水對身體好。"},{"text":"ことにしている","meaning":"自己定的習慣。","connection":"辞書形＋ことにしている。","why":"寺が歴史があることにしている不成立。也不是說話人的習慣。","example":"夜は早く寝ることにしている。","zh":"我習慣晚上早睡。"},{"text":"ものか","meaning":"哪會。強烈否定。","connection":"普通形＋ものか。","why":"あるものか會變成哪有什麼歷史。和句子的肯定傳聞相反。","example":"負けるものか。","zh":"我才不會輸。"},{"text":"ようがない","meaning":"沒辦法。","connection":"ます語幹＋ようがない。","why":"あるようがない不接辞書形。没法子做「有歷史」也不通。","example":"行きようがない。","zh":"沒辦法去。"}],"level":"N3"},{"id":"n646","kind":"grammar","point":"ことなく","group":"aspect","difficulty":4,"stem":"彼（かれ）は一度（いちど）も休（やす）む＿＿、走（はし）り続けた。","gloss":"他一次也沒休息，一直跑下去。","answer":"ことなく","options":[{"text":"ことなく","meaning":"沒有做某事就繼續。書面。","connection":"辞書形＋ことなく。休むことなく。","why":"沒有休息這個動作，跑步繼續。休むことなく。","example":"諦めることなく、挑戦した。","zh":"沒有放棄，繼續挑戰。"},{"text":"ことだから","meaning":"因為某人一向如此。","connection":"名詞＋の＋ことだから。","why":"休むことだから接在動詞後面，不是「田中さんのことだから」那種預測。","example":"真面目な彼のことだから、休まない。","zh":"他一向認真，所以不會休息。"},{"text":"ことに","meaning":"決定，或感到。","connection":"辞書形＋ことにする。","why":"休むことに、走り続けた會變成決定休息卻又一直跑，前後打架。","example":"休むことにした。","zh":"決定休息。"},{"text":"ところで","meaning":"即便做了也沒用，或剛做完的時點。","connection":"た形＋ところで。","why":"休むところで不接辞書形表示「沒有休息」。","example":"休んだところで、疲れは取れない。","zh":"就算休息了，疲勞也消除不了。"}],"level":"N3"},{"id":"n647","kind":"grammar","point":"に限る","group":"advice","difficulty":4,"stem":"疲（つか）れたときは、早（はや）く寝（ね）る＿＿。","gloss":"累的時候，最好早點睡。","answer":"に限る","options":[{"text":"に限る","meaning":"這就是最好的做法。","connection":"辞書形＋に限る。寝るに限る。","why":"在累的時候，早睡是最佳選擇。寝るに限る。","example":"寒い日は鍋に限る。","zh":"冷天最好吃火鍋。"},{"text":"に限って","meaning":"偏偏。","connection":"名詞＋に限って。","why":"寝るに限って不表示「最好」。限って是例外的那一次。","example":"大切な日に限って、寝不足だ。","zh":"偏偏重要的日子睡眠不足。"},{"text":"に限り","meaning":"僅限。公告。","connection":"名詞＋に限り。","why":"寝るに限り不是建議，而是「只限睡覺」的告示，接不上。","example":"本日に限り、半額です。","zh":"僅限今天半價。"},{"text":"に限らず","meaning":"不限於。","connection":"名詞＋に限らず。","why":"寝るに限らず後面要再舉其他東西。這句沒有。","example":"寝るに限らず、休むことも大切だ。","zh":"不只睡覺，休息也很重要。這要另一個後句。"}],"level":"N3"},{"id":"n648","kind":"grammar","point":"もかまわず","group":"stance","difficulty":4,"stem":"人（ひと）の迷惑（めいわく）＿＿、大（おお）きな声（こえ）で話（はな）している。","gloss":"也不管別人討不討厭，大聲說話。","answer":"もかまわず","options":[{"text":"もかまわず","meaning":"不顧、不在乎。","connection":"名詞＋もかまわず。迷惑もかまわず。","why":"知道會打擾別人仍繼續。迷惑もかまわず。","example":"雨もかまわず、出かけた。","zh":"也不管下雨，出門了。"},{"text":"はもちろん","meaning":"……自不必說。","connection":"名詞＋はもちろん。後面還要更進一步的東西。","why":"迷惑はもちろん、大きな声で話している少了第二項，也不是「不在乎」。","example":"日本語はもちろん、英語も話せる。","zh":"日語不必說，英語也會。"},{"text":"どころか","meaning":"哪裡是，根本相反。","connection":"名詞＋どころか。","why":"迷惑どころか會期待後面翻轉，不是直接大聲說。","example":"迷惑どころか、感謝された。","zh":"不但沒添麻煩，反而被感謝。"},{"text":"に反して","meaning":"與某事相反。","connection":"名詞＋に反して。","why":"迷惑に反して不是「不顧打擾」。反して要有一個預期被推翻。","example":"予想に反して、静かだった。","zh":"和預期相反，很安靜。"}],"level":"N3"},{"id":"n649","kind":"grammar","point":"てよかった","group":"modal","difficulty":2,"stem":"来（き）て＿＿。景色（けしき）がきれいだ。","gloss":"來得好。景色真美。對自己的行動感到慶幸。","answer":"よかった","options":[{"text":"よかった","meaning":"做了之後覺得很好。","connection":"て形＋よかった。来てよかった。","why":"看見美景，慶幸自己來了。来てよかった。","example":"参加してよかった。","zh":"參加得對了。"},{"text":"しまった","meaning":"做了但後悔，或做完。","connection":"て形＋しまう。","why":"来てしまった是不該來卻來了。和景色がきれい的正面評價相反。","example":"来てしまった。もう帰れない。","zh":"還是來了。已經回不去。"},{"text":"はいけない","meaning":"不准。","connection":"て形＋はいけない。","why":"来てはいけない是禁止來。和慶幸來看風景相反。","example":"ここに来てはいけない。","zh":"不准來這裡。"},{"text":"ばかりだ","meaning":"淨是、一個勁。","connection":"て形＋ばかりだ。","why":"来てばかりだ是老是來。這句是對這一次來感到慶幸。","example":"最近、ここへ来てばかりだ。","zh":"最近老是來這裡。"}],"level":"N4"},{"id":"n650","kind":"grammar","point":"くて（原因）","group":"cause","difficulty":1,"stem":"この靴（くつ）は高＿＿、買（か）えなかった。","gloss":"這雙鞋很貴，所以沒買成。","answer":"くて","options":[{"text":"くて","meaning":"い形容詞的原因，連接後面的結果。","connection":"い形容詞去い＋くて。高い→高く＋て。","why":"貴是買不成的原因。高くて、買えなかった。","example":"重くて、持てなかった。","zh":"太重，拿不起來。"},{"text":"く","meaning":"連用，後面多是副詞用法或する。","connection":"高く＋動詞。","why":"高く買えなかった會變成「沒能以高價買」，不是「因為貴」。中間的原因停頓要用くて。","example":"高く売る。","zh":"以高價賣。"},{"text":"いに","meaning":"沒有這個接法。","connection":"い形容詞不能高いに。","why":"高いに、買えなかった不成立。","example":"高いのに、買った。","zh":"明明貴，還是買了。這要用のに。"},{"text":"かったで","meaning":"過去＋錯誤的で。","connection":"高かったので才是原因。","why":"高かったで不成立。過去的原因是高かったので，不是かったで。","example":"高かったので、やめた。","zh":"因為貴，作罷了。"}],"level":"N5"},{"id":"n651","kind":"grammar","point":"ほしい","group":"advice","difficulty":1,"stem":"暑（あつ）い。冷（つめ）たい水（みず）が＿＿。","gloss":"好熱。想要冷水。","answer":"ほしい","options":[{"text":"ほしい","meaning":"想要東西。","connection":"名詞＋がほしい。水がほしい。","why":"想要的是水這個名詞，不是想做某個動作。水がほしい。","example":"新しい靴がほしい。","zh":"想要新鞋。"},{"text":"たい","meaning":"想做動作。","connection":"ます語幹＋たい。飲みたい。","why":"水がたい不成立。想喝要說水が飲みたい。","example":"冷たい水が飲みたい。","zh":"想喝冷水。"},{"text":"たがる","meaning":"別人想做。","connection":"動詞語幹＋たがる。","why":"水がたがる不成立。","example":"弟は水を飲みたがっている。","zh":"弟弟想喝水。"},{"text":"てもいい","meaning":"可以做。","connection":"て形＋もいい。","why":"水がてもいい接不上。","example":"水を飲んでもいい。","zh":"可以喝水。"}],"level":"N5"},{"id":"n652","kind":"grammar","point":"一番","group":"degree","difficulty":1,"stem":"スポーツの中（なか）で、水泳（すいえい）が＿＿好（す）きです。","gloss":"運動裡面，我最喜歡游泳。","answer":"一番","options":[{"text":"一番","meaning":"最。三者以上的頂點。","connection":"一番＋形容詞。中で和一番一起。","why":"很多運動裡最喜歡游泳。水泳が一番好きです。","example":"この中で、この店が一番安い。","zh":"這裡面這家店最便宜。"},{"text":"より","meaning":"比。要有比較的另一方。","connection":"ＡよりＢ。","why":"水泳がより好きです少了比的對象。中で的最高級用一番。","example":"走るより、泳ぐほうが好きです。","zh":"比起跑步，更喜歡游泳。"},{"text":"ほど","meaning":"程度。否定時表示沒有到那個地步。","connection":"ほど＋否定が典型。","why":"水泳がほど好きです不成立。","example":"水泳ほど好きなスポーツはない。","zh":"沒有比游泳更喜歡的運動。"},{"text":"しか","meaning":"只有。後面要否定。","connection":"しか＋ない。","why":"水泳がしか好きです少了否定，語序也不對。","example":"水泳しか好きではありません。","zh":"只喜歡游泳。"}],"level":"N5"},{"id":"n653","kind":"grammar","point":"てくる（接近）","group":"aspect","difficulty":3,"stem":"向（む）こうから知（し）らない人（ひと）が走（はし）って＿＿。","gloss":"對面有不認識的人跑過來。朝說話人的方向。","answer":"きた","options":[{"text":"きた","meaning":"向說話人這裡移動。","connection":"て形＋くる。走って＋きた。向こうから和くる。","why":"從對面跑到這邊。走ってきた。","example":"子供が走ってきた。","zh":"小孩跑過來了。"},{"text":"いった","meaning":"離開說話人，往遠處。","connection":"て形＋いく。","why":"走っていった是跑著離開。和向こうから「從那邊過來」的方向相反。","example":"駅のほうへ走っていった。","zh":"朝車站跑去了。"},{"text":"おいた","meaning":"事先做。","connection":"て形＋おく。","why":"知らない人が走っておいた沒有「事先跑好」的意思。","example":"先に走っておいた。","zh":"我先跑了。這才用おく。"},{"text":"みた","meaning":"試著做。","connection":"て形＋みる。","why":"走ってみた是試著跑，沒有朝這裡來的方向。","example":"少し走ってみた。","zh":"試著跑了一下。"}],"level":"N4"},{"id":"n654","kind":"grammar","point":"か（選擇）","group":"particle","difficulty":1,"stem":"コーヒー＿＿紅茶（こうちゃ）、どちらにしますか。","gloss":"咖啡還是紅茶，你選哪個？","answer":"か","options":[{"text":"か","meaning":"或者。兩個裡選一個。","connection":"名詞＋か＋名詞。コーヒーか紅茶。後ろにどちら。","why":"要選一個。コーヒーか紅茶。","example":"電車かバスで行きます。","zh":"坐電車或者巴士去。"},{"text":"や","meaning":"舉例，後面還有別的。","connection":"名詞＋や＋名詞＋など。","why":"どちら是兩個裡哪一個。や表示除此之外還有，和「二選一」不合。","example":"コーヒーや紅茶などがあります。","zh":"有咖啡、紅茶之類。"},{"text":"も","meaning":"也。","connection":"名詞＋も。","why":"コーヒーも紅茶、どちらにしますか助詞疊錯，也不是選擇。","example":"コーヒーも紅茶も好きです。","zh":"咖啡和紅茶都喜歡。"},{"text":"の","meaning":"的。","connection":"名詞＋の＋名詞。","why":"コーヒーの紅茶會變成咖啡的紅茶。不是二選一。","example":"紅茶のカップ。","zh":"紅茶的杯子。"}],"level":"N5"},{"id":"n660","kind":"grammar","point":"いる（人・動物）","group":"aspect","difficulty":1,"stem":"教室（きょうしつ）に学生（がくせい）が＿＿。","gloss":"教室裡有學生。人的存在。","answer":"います","options":[{"text":"います","meaning":"人或動物的存在。","connection":"場所に＋人・動物が＋いる。","why":"學生是人。学生がいます。","example":"庭に猫がいます。","zh":"院子裡有貓。"},{"text":"あります","meaning":"東西、植物的存在。","connection":"無生物が＋ある。","why":"学生があります把人當成物品。人不說ある。","example":"教室に机があります。","zh":"教室裡有桌子。"},{"text":"します","meaning":"做。","connection":"名詞＋をする。","why":"学生がします沒有做的內容。存在不用する。","example":"勉強をします。","zh":"學習。"},{"text":"なります","meaning":"變成。","connection":"に＋なる。","why":"学生がなります不是「有學生」。","example":"春になります。","zh":"到了春天。"}],"level":"N5"},{"id":"n661","kind":"grammar","point":"で（手段）","group":"particle","difficulty":2,"stem":"学校（がっこう）までバス＿＿行（い）きます。","gloss":"坐巴士去學校。手段。","answer":"で","options":[{"text":"で","meaning":"手段、工具。","connection":"名詞＋で＋動作。バスで行きます。","why":"巴士是去的方法。バスで。","example":"ペンで書きます。","zh":"用筆寫。"},{"text":"に","meaning":"到達點或存在場所。","connection":"場所＋に＋行く，可是巴士不是目的地。","why":"バスに行きます會變成去巴士那裡，不是坐巴士。坐交通工具用で。","example":"学校に行きます。","zh":"去學校。目的地才用に。"},{"text":"を","meaning":"賓語，或經過的地方。","connection":"を＋移動で「通過」。","why":"バスを行きます不表示乘坐。","example":"道を歩きます。","zh":"沿著路走。"},{"text":"へ","meaning":"方向。","connection":"場所＋へ＋行く。","why":"バスへ行きます是往巴士的方向，不是乘車的手段。","example":"学校へ行きます。","zh":"往學校去。"}],"level":"N5"},{"id":"n662","kind":"grammar","point":"まで（持續）","group":"time","difficulty":2,"stem":"この店（みせ）は夜（よる）九時（くじ）＿＿開（あ）いています。","gloss":"這家店營業到晚上九點。持續到那個時刻。","answer":"まで","options":[{"text":"まで","meaning":"一直持續到這個時刻。","connection":"時刻＋まで＋状態。九時まで開いています。","why":"開門這個狀態維持到九點。九時まで。","example":"五時まで働きます。","zh":"工作到五點。"},{"text":"までに","meaning":"在那個時刻之前完成。","connection":"時刻＋までに＋動作の完了。","why":"九時までに開いています會變成九點之前要完成「開著」這個點，不是一直開到九點。","example":"九時までに出てください。","zh":"請在九點前離開。"},{"text":"から","meaning":"從那個時刻開始。","connection":"時刻＋から。","why":"九時から開いています是九點開始營業，不是到九點為止。","example":"九時から開きます。","zh":"九點開始營業。"},{"text":"ごろ","meaning":"大約那個時候。","connection":"時刻＋ごろ。","why":"九時ごろ開いています是大約九點是開著的，沒有「直到」的終點。","example":"三時ごろ着きます。","zh":"大約三點到。"}],"level":"N5"},{"id":"n663","kind":"grammar","point":"ごろ","group":"time","difficulty":1,"stem":"会議（かいぎ）は三時（さんじ）＿＿始（はじ）まります。","gloss":"會議大約三點開始。不是準點的期限。","answer":"ごろ","options":[{"text":"ごろ","meaning":"大約。時刻的大概。","connection":"時刻＋ごろ。三時ごろ。後ろににを付けない。","why":"不是準確的三點整，是左右。三時ごろ。","example":"夜十時ごろ寝ます。","zh":"晚上十點左右睡。"},{"text":"までに","meaning":"在那之前必須完成。","connection":"三時までに。","why":"三時までに始まります是三點前要開始完，語氣是期限，不是大約。","example":"三時までに来てください。","zh":"請三點前到。"},{"text":"しか","meaning":"只有。後面要否定。","connection":"三時しか始まらない。","why":"三時しか始まります少了否定，也不是大約。","example":"三時にしか始まりません。","zh":"只有三點才開始。"},{"text":"ほど","meaning":"程度。","connection":"三時ほど始まります不成立。","why":"時刻の大約はごろ。ほどは程度。","example":"三時間ほどかかります。","zh":"大約要三小時。這是長度，用ほど。"}],"level":"N5"},{"id":"n664","kind":"grammar","point":"くない","group":"conj","difficulty":1,"stem":"このコーヒーは熱（あつ）＿＿です。","gloss":"這咖啡不燙。い形容詞的否定。","answer":"くない","options":[{"text":"くない","meaning":"い形容詞的否定。","connection":"い形容詞去い＋くない。熱い→熱く＋ない。","why":"空格前是語幹熱。熱くないです。","example":"この問題は難しくないです。","zh":"這題不難。"},{"text":"じゃない","meaning":"な形容詞・名詞的否定。","connection":"語幹＋じゃない。静かじゃない。","why":"熱じゃない少了く。い形容詞不能直接加じゃない。","example":"この部屋は静かじゃない。","zh":"這房間不安靜。"},{"text":"くなかった","meaning":"否定的過去。","connection":"く＋なかった。","why":"熱くなかった是剛才不燙。句尾是です，說的是現在。時制が違う。","example":"朝は熱くなかったです。","zh":"早上不燙。"},{"text":"くなく","meaning":"中間形，句子還沒完。","connection":"くなく＋て。","why":"熱くなくです不成立。終止要用くない。","example":"熱くなくて、飲めます。","zh":"不燙，所以喝得了。"}],"level":"N5"},{"id":"n665","kind":"grammar","point":"じゃない","group":"conj","difficulty":1,"stem":"この部屋（へや）は静（しず）か＿＿です。","gloss":"這個房間不安靜。な形容詞的否定。","answer":"じゃない","options":[{"text":"じゃない","meaning":"な形容詞・名詞的否定。","connection":"な形容詞語幹＋じゃない。静かな→静か＋じゃない。","why":"語幹のあとになを入れず、じゃない。静かじゃないです。","example":"ここは便利じゃないです。","zh":"這裡不方便。"},{"text":"くない","meaning":"い形容詞的否定。","connection":"語幹＋くない。","why":"静かくない不存在。な形容詞不用く。","example":"うるさくないです。","zh":"不吵。前面是い形容詞。"},{"text":"ない","meaning":"動詞・い形容詞くないのない。","connection":"静か＋ない。","why":"静かないです不成立。中間要じゃない。","example":"静かにしない。","zh":"不讓它安靜。這是動詞。"},{"text":"くなかった","meaning":"い形容詞否定の過去。","connection":"静かくなかったとは言わない。","why":"な形容詞の過去否定はじゃなかった。","example":"静かじゃなかったです。","zh":"當時不安靜。"}],"level":"N5"},{"id":"n666","kind":"grammar","point":"て形（行く）","group":"conj","difficulty":2,"stem":"学校（がっこう）へ行＿＿、友（とも）達に会（あ）った。","gloss":"去了學校，見到朋友。行く的て形不規則。","answer":"って","options":[{"text":"って","meaning":"行く・来る・する以外のう段，以及行く的特殊て形。","connection":"行く→行って。促音便。","why":"行く的て形不是行いて。行って、会った。","example":"銀行へ行って、お金を下ろした。","zh":"去了銀行，取了錢。"},{"text":"いて","meaning":"く段的て形。書く→書いて。","connection":"行いては言わない。","why":"行くだけが例外で、いてにならない。","example":"手紙を書いて、出した。","zh":"寫了信，寄出去。"},{"text":"んで","meaning":"ぬ・ぶ・む段。飲む→飲んで。","connection":"行んでは言わない。","why":"行くは促音便のって。","example":"薬を飲んで、寝た。","zh":"吃了藥，睡了。"},{"text":"て","meaning":"一段動詞的て形。","connection":"見る→見て。五段の行くには付けない。","why":"行ては不存在。行く要用って。","example":"映画を見て、分かった。","zh":"看了電影就明白了。"}],"level":"N5"},{"id":"n667","kind":"grammar","point":"て形（飲む）","group":"conj","difficulty":2,"stem":"薬（くすり）を飲＿＿、寝（ね）ました。","gloss":"吃了藥，然後睡了。む段的て形。","answer":"んで","options":[{"text":"んで","meaning":"む・ぶ・ぬ段は撥音便＋で。","connection":"飲む→飲んで。","why":"先吃藥再睡。飲んで、寝ました。","example":"本を読んで、返した。","zh":"看完書，還了。"},{"text":"って","meaning":"う・つ・る段，以及行く。","connection":"飲っては言わない。","why":"飲むはんで。","example":"買って、帰った。","zh":"買了就回去。"},{"text":"いて","meaning":"く段。","connection":"飲いては言わない。","why":"書く→書いて。飲むではない。","example":"聞いて、メモした。","zh":"聽了，做了筆記。"},{"text":"て","meaning":"一段。","connection":"飲ては音が足りない。","why":"飲むは五段なので、てだけでは足りない。","example":"見て、寝た。","zh":"看了就睡。"}],"level":"N5"},{"id":"n668","kind":"grammar","point":"ない形（書く）","group":"conj","difficulty":2,"stem":"ここに名前（なまえ）を書＿＿でください。","gloss":"請不要把名字寫在這裡。か段的ない形。","answer":"かない","options":[{"text":"かない","meaning":"五段ない形はあ段＋ない。","connection":"書く→書かない。書か＋ないでください。","why":"禁止寫。書かないでください。","example":"ここでタバコを吸かないでください。","zh":"請不要在這裡抽煙。"},{"text":"かなく","meaning":"否定的中間形。","connection":"書かなく＋て。","why":"書かなくでください不成立。請求の否定はないでください。","example":"書かなくて、困った。","zh":"沒寫，所以傷腦筋。"},{"text":"きない","meaning":"ます語幹にないを付けた形。","connection":"書きないとは言わない。","why":"ない形はあ段。書かない。","example":"書きます。","zh":"寫。丁寧形才用書き。"},{"text":"かな","meaning":"ないのいが落ちている。","connection":"書かなでください不成立。","why":"書かないまで言う。","example":"書かないでください。","zh":"請不要寫。"}],"level":"N5"},{"id":"n669","kind":"grammar","point":"て形（する）","group":"conj","difficulty":2,"stem":"もう一度（いちど）、説明（せつめい）＿＿ください。","gloss":"請再說明一次。する的て形。","answer":"して","options":[{"text":"して","meaning":"する的て形是して，不是して以外の音便。","connection":"する→して＋ください。","why":"請求再說明。説明してください。","example":"勉強してください。","zh":"請學習。"},{"text":"した","meaning":"過去。","connection":"した＋ください。","why":"説明したください不成立。請求はて形。","example":"説明した。","zh":"說明了。這是過去，後面不加ください。"},{"text":"する","meaning":"辞書形。","connection":"する＋ください。","why":"説明するください不成立。くださいの前はて形。","example":"説明することができます。","zh":"能夠說明。"},{"text":"し","meaning":"ます語幹。","connection":"し＋ます。","why":"説明しください不成立。しとくださいの間にてが要る。","example":"説明します。","zh":"我來說明。"}],"level":"N5"},{"id":"n670","kind":"grammar","point":"普通形＋と思う","group":"speech","difficulty":3,"stem":"明日（あした）は雨（あめ）が＿＿と思（おも）う。","gloss":"我想明天會下雨。引用自己的判斷時用普通形。","answer":"降る","options":[{"text":"降る","meaning":"普通形。思考、引用的內容不用ます。","connection":"辞書形＋と思う。降る＋と思う。","why":"自己的判斷。雨が降ると思う。","example":"彼は来ないと思う。","zh":"我想他不會來。"},{"text":"降ります","meaning":"丁寧形。","connection":"ます形はと思うの前に置かない。","why":"降りますと思う不成立。丁寧にしたいなら文の最後：降ると思います。","example":"雨が降ると思います。","zh":"我想會下雨。です・ますは文末。"},{"text":"降り","meaning":"ます語幹。","connection":"降り＋ます。","why":"降りと思う不成立。","example":"雨が降ります。","zh":"會下雨。"},{"text":"降って","meaning":"て形。","connection":"降って＋いる。","why":"降ってと思う不成立。と思うの前は普通形の文。","example":"雨が降っていると思う。","zh":"我想正在下雨。這才是普通形。"}],"level":"N4"},{"id":"n671","kind":"grammar","point":"ちゃう","group":"aspect","difficulty":3,"stem":"お菓子（かし）を全部（ぜんぶ）食（た）べ＿＿。","gloss":"点心全吃光了。てしまう的口語。","answer":"ちゃった","options":[{"text":"ちゃった","meaning":"てしまう的口語。做完，或覺得不該做卻做了。","connection":"一段：食べ＋ちゃった。五段う段は買っちゃった。","why":"全部吃光。食べちゃった。","example":"電車に乗っちゃった。","zh":"不小心上了電車。"},{"text":"とく","meaning":"ておく的口語。事先做。","connection":"食べとく。","why":"食べとく是先吃好留著，不是已經全部吃完。","example":"昼ごはんを食べとく。","zh":"先把午飯吃了。"},{"text":"なきゃ","meaning":"なければならない的口語。","connection":"食べなきゃ。","why":"食べなきゃ是必須吃，還沒吃完。句子是已經全部吃了。","example":"野菜を食べなきゃ。","zh":"必須吃蔬菜。"},{"text":"なくちゃ","meaning":"同樣是必須。口語。","connection":"食べなくちゃ。","why":"食べなくちゃ也是必須吃，不是吃光了。","example":"宿題をやらなくちゃ。","zh":"必須做功課。"}],"level":"N4"},{"id":"n672","kind":"grammar","point":"とく","group":"aspect","difficulty":3,"stem":"明日（あした）のために、食べ物（もの）を買＿＿。","gloss":"為了明天，先把食物買好。ておく的口語。","answer":"っとく","options":[{"text":"っとく","meaning":"ておく的口語。事先做好。","connection":"買う→買っておく→買っとく。う段はっとく。","why":"為了明天先買。買っとく。","example":"切符を取っとく。","zh":"先把票訂了。"},{"text":"ちゃった","meaning":"てしまう的口語。","connection":"買っちゃった。","why":"買っちゃった是買了（常帶不該買），不是為了明天事先準備。而且空格前是買，不是買っ。買ちゃった也不對，要買っちゃった。","example":"つい買っちゃった。","zh":"不小心買了。"},{"text":"なきゃ","meaning":"必須。","connection":"買わなきゃ。","why":"買なきゃ少了わ。必須買是買わなきゃ，而且這句是事先準備的とく。","example":"買わなきゃ。","zh":"必須買。"},{"text":"んどく","meaning":"む・ぶ・ぬ段的とく。","connection":"読む→読んどく。","why":"買んどく不存在。買うはっとく。","example":"本を読んどく。","zh":"先把書看了。"}],"level":"N4"},{"id":"n673","kind":"grammar","point":"なきゃ","group":"advice","difficulty":3,"stem":"もう行（い）か＿＿。電車（でんしゃ）が来（く）る。","gloss":"必須走了。電車要來了。なければならない的口語。","answer":"なきゃ","options":[{"text":"なきゃ","meaning":"必須。口語。","connection":"ない形のいを取って＋きゃ，或ない形＋きゃ。行く→行かなきゃ。","why":"電車要來，不能不走。行かなきゃ。","example":"もう寝なきゃ。","zh":"必須睡了。"},{"text":"なくても","meaning":"即使不。","connection":"行かなくても。","why":"行かなくても是即使不去。和電車が来る的催促相反。","example":"行かなくてもいい。","zh":"可以不去。"},{"text":"なかったら","meaning":"如果沒去。","connection":"行かなかったら。","why":"行かなかったら是假設沒去。這句是現在必須去。","example":"行かなかったら、間に合わない。","zh":"如果沒去，就來不及。"},{"text":"ないで","meaning":"不要做，或不做地。","connection":"行かないで。","why":"行かないで是請別走，或不走就做別的。和必須走相反。","example":"行かないでください。","zh":"請不要走。"}],"level":"N4"},{"id":"n674","kind":"grammar","point":"終わる","group":"aspect","difficulty":3,"stem":"この本（ほん）はもう読（よ）み＿＿。","gloss":"這本書已經讀完了。","answer":"終わった","options":[{"text":"終わった","meaning":"做到最後、完成。","connection":"ます語幹＋終わる。読む→読み＋終わった。","why":"もう表示已經完成。読み終わった。","example":"レポートを書き終わった。","zh":"報告寫完了。"},{"text":"続けた","meaning":"持續。","connection":"読み続けた。","why":"もう読み続けた不是「已經讀完」。持續和完成相反。","example":"三時間読み続けた。","zh":"連續讀了三小時。"},{"text":"出した","meaning":"突然開始。","connection":"読み出した。","why":"読み出した是開始讀。もう和完成の終わったが合う。","example":"急に読み出した。","zh":"忽然開始讀。"},{"text":"かけた","meaning":"讀到一半。","connection":"読みかけた。","why":"読みかけた是還沒讀完。もう「已經完成」と反対。","example":"読みかけたまま寝た。","zh":"讀到一半就睡了。"}],"level":"N4"},{"id":"n675","kind":"grammar","point":"ないで（不做地）","group":"aspect","difficulty":3,"stem":"何（なに）も言（い）わ＿＿、部屋（へや）を出（で）た。","gloss":"什麼都沒說就離開了房間。","answer":"ないで","options":[{"text":"ないで","meaning":"沒做前一件事，就做了後一件。","connection":"ない形＋で。言わないで、出た。","why":"離開時沒有說話這個伴隨動作。言わないで出た。","example":"朝ごはんを食べないで、学校へ行った。","zh":"沒吃早飯就去學校。"},{"text":"なくて","meaning":"因為沒做，所以產生結果。原因。","connection":"言わなくて、困った。","why":"言わなくて出た會變成因為沒說才離開。這句只是離開時沒說話，不是原因。","example":"何も言わなくて、誤解された。","zh":"因為什麼都沒說，被誤解了。"},{"text":"ないので","meaning":"因為不。說明原因。","connection":"言わないので。","why":"言わないので、出た是原因。空格要的是「不說地離開」。","example":"時間がないので、帰った。","zh":"因為沒時間，回去了。"},{"text":"なければ","meaning":"如果不。","connection":"言わなければ。","why":"言わなければ出た不成立。仮定の後は結果の文が要る。","example":"言わなければ、伝わらない。","zh":"如果不說，就傳不到。"}],"level":"N4"},{"id":"n676","kind":"grammar","point":"の（形式名詞）","group":"speech","difficulty":3,"stem":"私（わたし）は泳（およ）ぐ＿＿が好（す）きです。","gloss":"我喜歡游泳。把動詞當成一件事。","answer":"の","options":[{"text":"の","meaning":"把動詞變成名詞。口語常用。","connection":"辞書形＋の＋が好き。泳ぐのが好き。","why":"喜歡的是游泳這件事。泳ぐのが好きです。","example":"歌うのが上手です。","zh":"很會唱歌。"},{"text":"もの","meaning":"具體的東西。","connection":"辞書形＋もの。","why":"泳ぐものが好き會變成喜歡會游泳的東西，不是喜歡游泳這件事。","example":"泳ぐものが魚です。","zh":"會游泳的是魚。這不是愛好。"},{"text":"わけ","meaning":"道理。","connection":"泳ぐわけが好き不成立。","why":"わけは結論や理由。好きの対象にはしない。","example":"だから泳ぐわけだ。","zh":"所以才游泳。"},{"text":"はず","meaning":"按理。","connection":"泳ぐはずが好き不成立。","why":"はずは推測。","example":"泳げるはずだ。","zh":"按理應該會游。"}],"level":"N4"},{"id":"n677","kind":"grammar","point":"だらけ","group":"tendency","difficulty":4,"stem":"この作文（さくぶん）は間違（まちが）い＿＿だ。","gloss":"這篇作文滿是錯誤。","answer":"だらけ","options":[{"text":"だらけ","meaning":"滿是、淨是。負面的東西蓋滿表面。","connection":"名詞＋だらけ。間違いだらけ。","why":"錯誤多到鋪滿。間違いだらけだ。","example":"この部屋はほこりだらけだ。","zh":"這房間滿是灰塵。"},{"text":"がち","meaning":"往往會。","connection":"ます語幹・名詞＋がち。","why":"作文は間違いがちだ不自然。がち的主語多是人：彼は間違いがちだ。","example":"彼は忘れがちだ。","zh":"他往往會忘。"},{"text":"っぽい","meaning":"看起來像。","connection":"名詞＋っぽい。","why":"間違いっぽい作文とは、滿是錯誤のだらけとは違う。っぽいは性質の雰囲気。","example":"子供っぽい。","zh":"孩子氣。"},{"text":"気味","meaning":"有一點那種傾向。","connection":"名詞＋気味。","why":"間違い気味は「有點錯誤的傾向」，程度比だらけ弱，而且作文は間違い気味だとも言いにくい。","example":"疲れ気味だ。","zh":"有點累。"}],"level":"N3"},{"id":"n678","kind":"grammar","point":"ようでは","group":"condition","difficulty":4,"stem":"毎朝（まいあさ）こんなに遅（おく）れる＿＿、試験（しけん）には受（う）からない。","gloss":"要是每天早上都遲到成這樣，考試不會合格。","answer":"ようでは","options":[{"text":"ようでは","meaning":"如果這種不好的狀態繼續，後面是壞結果。","connection":"普通形＋ようでは。遅れるようでは。","why":"每天都遲到成這樣，合格就沒了。遅れるようでは、受からない。","example":"この成績では、合格は難しい。","zh":"以這個成績，合格很難。名詞用では，動詞用ようでは。"},{"text":"ためには","meaning":"為了。","connection":"辞書形＋ためには。","why":"遅れるためには受からない會變成為了遲到才不合格。目的と反対。","example":"受かるためには、遅れないことだ。","zh":"為了合格，就不能遲到。"},{"text":"ことには","meaning":"令人感到。或ないことには。","connection":"驚いたことには。","why":"遅れることには受からない不成立。","example":"困ったことには、遅れてしまった。","zh":"傷腦筋的是，遲到了。"},{"text":"ものなら","meaning":"如果真能。多接可能形。","connection":"遅れられるものなら。","why":"遅れるものなら受からない不是「要是能遲到」。這句是壞習慣繼續下去。","example":"戻れるものなら、戻りたい。","zh":"要是回得去，我想回去。"}],"level":"N3"},{"id":"n679","kind":"grammar","point":"ようにも〜ない","group":"modal","difficulty":5,"stem":"名前（なまえ）を忘（わす）れ＿＿、忘（わす）れられない。","gloss":"想忘也忘不掉。","answer":"ようにも","options":[{"text":"ようにも","meaning":"想做也做不到。後面是否定。","connection":"意向形＋にも＋可能の否定。忘れ＋ようにも＋忘れられない。","why":"想忘，可是不能。忘れようにも忘れられない。","example":"行こうにも、行けない。","zh":"想去也去不了。"},{"text":"ように","meaning":"為了，或間接命令。","connection":"忘れように忘れられない少了も。","why":"もがないと「想做也無法」にならない。","example":"忘れないように、メモした。","zh":"為了不忘，做了筆記。"},{"text":"ようが","meaning":"無論想不想。","connection":"忘れようが、忘れまいが。","why":"忘れようが忘れられないは、後に「でも」類が要る。この対の句型はようにも〜ない。","example":"忘れようが、覚えようが、同じだ。","zh":"忘也好記也好，都一樣。"},{"text":"ようでは","meaning":"要是這樣下去就糟了。","connection":"忘れるようでは。","why":"忘れようでは忘れられないと二回重ねない。","example":"忘れるようでは、仕事にならない。","zh":"要是會忘，工作就做不成。"}],"level":"N3"},{"id":"n680","kind":"grammar","point":"何も","group":"degree","difficulty":2,"stem":"冷蔵庫（れいぞうこ）に＿＿入（はい）っていない。","gloss":"冰箱裡什麼都沒有。","answer":"何も","options":[{"text":"何も","meaning":"什麼都。後面必須否定。","connection":"何も＋ない。何も入っていない。","why":"完全是空的。何も入っていない。","example":"何も食べていない。","zh":"什麼都沒吃。"},{"text":"何か","meaning":"某樣東西。肯定。","connection":"何か＋ある。","why":"何か入っていないは「並非有某樣東西」，空の強調にならない。","example":"何か入っている。","zh":"裡面有點東西。"},{"text":"何でも","meaning":"什麼都可以。","connection":"何でも＋肯定が多い。","why":"何でも入っていないは「不是什麼都能放」，全部否定の何もではない。","example":"何でも入れていい。","zh":"什麼都可以放。"},{"text":"何が","meaning":"什麼（疑問）。","connection":"何が＋入っていないか。","why":"何が入っていないは「哪一樣沒放」，質問になる。平叙の全部否定は何も。","example":"何が入っていますか。","zh":"裡面有什麼？"}],"level":"N4"},{"id":"n681","kind":"grammar","point":"ね","group":"speech","difficulty":1,"stem":"あなたも知（し）っているでしょう。この店（みせ）、おいしい＿＿。","gloss":"你也知道吧。這家店很好吃呢。徵求同意。","answer":"ですね","options":[{"text":"ですね","meaning":"對吧。對方也知道，徵求同意。","connection":"丁寧形＋ね。おいしいですね。","why":"前句說你也知道，所以不是通知新情報。おいしいですね。","example":"きれいですね。","zh":"真好看呢。"},{"text":"ですよ","meaning":"告訴不知道的人。","connection":"です＋よ。","why":"ですよ是我來告訴你。可是相手は知っている。同意を求めるね。","example":"この店、おいしいですよ。","zh":"這家店很好吃喔。對方還不知道時。"},{"text":"ですか","meaning":"疑問。","connection":"ですか。","why":"おいしいですかは質問。前に「知っているでしょう」があるので、確認のね。","example":"おいしいですか。","zh":"好吃嗎？"},{"text":"です","meaning":"只判斷，不向對方確認。","connection":"おいしいです。","why":"ですだけだと相手を会話に入れない。ねで同意を求める。","example":"この店はおいしいです。","zh":"這家店很好吃。"}],"level":"N5"},{"id":"n682","kind":"grammar","point":"よ","group":"speech","difficulty":1,"stem":"まだ知（し）らない人（ひと）に伝（つた）える。明日（あした）は休（やす）み＿＿。","gloss":"告訴還不知道的人：明天休息喔。","answer":"ですよ","options":[{"text":"ですよ","meaning":"通知對方不知道的事。","connection":"丁寧形＋よ。休みですよ。","why":"對方還不知道，所以用よ，不是徵求同意。休みですよ。","example":"ここに名前を書くんですよ。","zh":"是要在這裡寫名字喔。"},{"text":"ですね","meaning":"徵求同意。對方也該知道。","connection":"ですね。","why":"まだ知らない人にですねは、相手が知っている前提になる。合わない。","example":"明日は休みですね。","zh":"明天休息呢。雙方都知道時。"},{"text":"ですか","meaning":"疑問。","connection":"ですか。","why":"休みですかは在問。這句是告訴對方。","example":"明日は休みですか。","zh":"明天休息嗎？"},{"text":"です","meaning":"判斷，語氣平。","connection":"です。","why":"ですだけでも伝わるが、未知の相手に押し出すときはよが付く。この文は「伝える」と書いてある。","example":"明日は休みです。","zh":"明天休息。"}],"level":"N5"},{"id":"n683","kind":"grammar","point":"割れる","group":"v-verb","difficulty":2,"stem":"コップが床（ゆか）に落（お）ちて、＿＿。","gloss":"杯子掉到地上，碎了。杯子自己碎。","answer":"割れた","options":[{"text":"割れた","meaning":"破碎。自動詞。玻璃、杯子。","connection":"が＋割れる。コップが割れた。","why":"沒有人做主語。杯子自己碎了。割れた。","example":"窓ガラスが割れた。","zh":"窗玻璃碎了。"},{"text":"割った","meaning":"人打碎。他動詞。","connection":"を＋割る。","why":"コップが割った會變成杯子去打碎別的東西。","example":"私はコップを割った。","zh":"我把杯子打碎了。"},{"text":"破れた","meaning":"紙、布破了。","connection":"紙が破れる。","why":"杯子不是紙。玻璃の割れは割れる。","example":"紙が破れた。","zh":"紙破了。"},{"text":"折れた","meaning":"細長的東西折斷。","connection":"枝が折れる。","why":"杯子不是被折斷。砕け散るのは割れる。","example":"鉛筆が折れた。","zh":"鉛筆折了。"}],"level":"N4"},{"id":"n684","kind":"grammar","point":"決まる","group":"voice","difficulty":2,"stem":"旅行（りょこう）の日程（にってい）が＿＿。","gloss":"旅行的日程定下來了。日程自己成為確定狀態。","answer":"決まった","options":[{"text":"決まった","meaning":"定下來。自動詞。","connection":"が＋決まる。日程が決まった。","why":"沒有說誰決定，只說日程定了。決まった。","example":"会議の場所が決まった。","zh":"會議地點定了。"},{"text":"決めた","meaning":"人決定。他動詞。","connection":"を＋決める。","why":"日程が決めた不成立。人は日程を決めた。","example":"私たちが日程を決めた。","zh":"我們決定了日程。"},{"text":"決めてある","meaning":"被人決定好并留著。","connection":"を＋決めてある。","why":"日程が決めてあるはをがないと不自然。主語がの自動詞は決まった。","example":"日程はすでに決めてある。","zh":"日程已經定好了。這是人為狀態。"},{"text":"決まりだった","meaning":"以前的規則。","connection":"決まりは名詞。","why":"日程が決まりだったは「日程是規定」，不是這次定下來。","example":"それが会社の決まりだった。","zh":"那曾是公司的規定。"}],"level":"N4"},{"id":"n685","kind":"grammar","point":"変わる","group":"change","difficulty":2,"stem":"予定（よてい）が＿＿ので、連絡（れんらく）します。","gloss":"預定改了，所以我來聯絡。預定本身變化。","answer":"変わった","options":[{"text":"変わった","meaning":"改變。自動詞。","connection":"が＋変わる。予定が変わった。","why":"預定自己變成另一個。変わったので。","example":"天気が変わった。","zh":"天氣變了。"},{"text":"変えた","meaning":"人改變。他動詞。","connection":"を＋変える。","why":"予定が変えた不成立。私が予定を変えた。","example":"予定を変えました。","zh":"我改了預定。"},{"text":"代わった","meaning":"由別人代替。","connection":"が＋代わる。人に使う。","why":"予定が代わったは、人の交代と漢字も意味も違う。変化は変わる。","example":"部長が代わった。","zh":"部長換人了。"},{"text":"代えた","meaning":"人用別的替換。他動詞。","connection":"を＋代える。","why":"予定が代えた不成立。","example":"砂糖を塩で代えた。","zh":"用鹽代替了糖。"}],"level":"N4"},{"id":"n686","kind":"grammar","point":"直す","group":"v-verb","difficulty":3,"stem":"壊（こわ）れた時計（とけい）を自分（じぶん）で＿＿。","gloss":"我自己把壞掉的鐘修好了。修理物品。","answer":"直した","options":[{"text":"直した","meaning":"修理物品、改正。他動詞。","connection":"を＋直す。時計を直した。","why":"鐘是物品，修好用直す。直した。","example":"間違った字を直した。","zh":"改了寫錯的字。"},{"text":"治した","meaning":"治病。","connection":"病気を治す。","why":"時計を治したは病気の治。機械の修理は直す。","example":"風邪を治した。","zh":"把感冒治好了。"},{"text":"直った","meaning":"物品恢復正常。自動詞。","connection":"時計が直った。","why":"時計を直ったはを和他動詞の位置が合わない。自分が直したなら直した。","example":"時計が直った。","zh":"鐘修好了。沒有說是誰修的。"},{"text":"治った","meaning":"病好了。自動詞。","connection":"風邪が治った。","why":"鐘不是病。時計を治った也不接を。","example":"風邪が治った。","zh":"感冒好了。"}],"level":"N4"},{"id":"n687","kind":"grammar","point":"中（ちゅう）","group":"time","difficulty":3,"stem":"今（いま）、会議＿＿なので、後（あと）で電話（でんわ）します。","gloss":"現在正在開會，所以晚點再打電話。","answer":"中","options":[{"text":"中","meaning":"正在那段期間。讀ちゅう。","connection":"名詞＋中。会議中。","why":"現在正處於開會這段時間。会議中なので。","example":"仕事中は席を外さない。","zh":"工作中不離開座位。"},{"text":"間","meaning":"在……期間。","connection":"名詞＋の＋間。会議の間。","why":"会議間なので少了の。期間の間はのが要る。","example":"会議の間、待ってください。","zh":"開會期間請等一下。"},{"text":"うち","meaning":"趁著。","connection":"名詞＋の＋うち。","why":"会議うちなので不成立。","example":"会議のうちに、決める。","zh":"趁開會定下來。要の。"},{"text":"最中","meaning":"正中央。","connection":"名詞＋の＋最中。","why":"会議最中なので少了の。会議の最中。","example":"会議の最中に、電話が鳴った。","zh":"正在開會的時候，電話響了。"}],"level":"N4"},{"id":"n688","kind":"grammar","point":"中（じゅう）","group":"degree","difficulty":3,"stem":"日本＿＿を旅行（りょこう）した。","gloss":"走遍了日本。整個範圍。","answer":"中","options":[{"text":"中","meaning":"整個範圍都。讀じゅう。","connection":"名詞＋中＋を。日本中を。","why":"不是某一部分，是日本全境。日本中を旅行した。","example":"一日中雨だった。","zh":"下了一整天雨。"},{"text":"内","meaning":"內部。","connection":"国内、室内。","why":"日本内を旅行したとは言わない。國內是国内。全範圍は中。","example":"国内を旅行した。","zh":"在國內旅行。"},{"text":"間","meaning":"期間、中間。","connection":"日本間を不成立。","why":"間は時間の長さや二者のあいだ。国の全体ではない。","example":"三時間の間。","zh":"三小時的期間。"},{"text":"上","meaning":"上面、方面。","connection":"日本上を不成立。","why":"上は表面や方面。全土を回る意味にならない。","example":"地図の上で探す。","zh":"在地圖上找。"}],"level":"N4"},{"id":"v01","kind":"vocab","point":"やっと","group":"v-adv","difficulty":3,"stem":"三時間（じかん）も並（なら）んで、＿＿チケットが買（か）えた。ほっとした。","gloss":"排了三小時，總算買到票。鬆了一口氣。","answer":"やっと","options":[{"text":"やっと","meaning":"總算、好不容易。經過辛苦之後的正面結果，說話人感到解脫。","connection":"副詞。常和可能形、た形一起：やっと買えた。","why":"排了三小時是辛苦，買到是好事，後面還有「鬆一口氣」。這是やっと的解脫感。","example":"やっと仕事が終わった。","zh":"總算把工作做完了。"},{"text":"ついに","meaning":"終於。長時間之後到達高潮，可以是好事或壞事，重點是結局降臨。","connection":"副詞。ついに別れた、ついに完成した。","why":"ついに買えた不是不能說，但它強調最終結局，不帶「鬆了一口氣」。句尾有ほっとした，要用やっと。","example":"ついに夢がかなった。","zh":"夢想終於實現了。"},{"text":"とうとう","meaning":"到底還是。結果多是不想看到的、或無可避免的。","connection":"副詞。とうとう雨が降り出した。","why":"買到票是高興的事。とうとう會帶「最終還是發生了（常不好）」的語氣。","example":"とうとう電車に遅れた。","zh":"到底還是沒趕上電車。"},{"text":"いきなり","meaning":"冷不防、沒有前步驟。","connection":"副詞。いきなり怒り出した。","why":"排了三小時才買到，不是突然買到。いきなり沒有「經過漫長努力」的意思。","example":"いきなり大きな音がした。","zh":"冷不防發出巨大聲響。"}],"level":"N3"},{"id":"v02","kind":"vocab","point":"ますます","group":"v-adv","difficulty":3,"stem":"道（みち）がわからず、＿＿不安（ふあん）になった。","gloss":"路也不認識，越來越不安。","answer":"ますます","options":[{"text":"ますます","meaning":"越來越。原本已有的狀態程度加深。","connection":"副詞＋形容詞・動詞。ますます忙しくなる。","why":"不安已經有了，迷路之後程度再加深。用ますます。","example":"説明を聞いて、ますます迷った。","zh":"聽了說明，反而更迷糊了。"},{"text":"だんだん","meaning":"漸漸地。從少到多的緩慢變化，起點可以是零。","connection":"副詞。だんだん暖かくなる。","why":"だんだん是平穩地逐漸變，不強調「本來就不安、現在更甚」。","example":"空がだんだん暗くなった。","zh":"天漸漸黑了。"},{"text":"どんどん","meaning":"迅速、一個接一個地推進。","connection":"副詞。どんどん売れる。","why":"不安不是快速連續地被賣掉那種推進，而是程度加深。","example":"客がどんどん入ってきた。","zh":"客人一個接一個進來。"},{"text":"やっと","meaning":"總算。","connection":"副詞。正面的解脫。","why":"變得不安不是辛苦之後的好結果。","example":"やっと安心した。","zh":"總算放心了。"}],"level":"N3"},{"id":"v03","kind":"vocab","point":"わざわざ","group":"v-adv","difficulty":3,"stem":"遠いのに、＿＿迎えに来てくれて、ありがとう。","gloss":"明明很遠，還特地來接我，謝謝。","answer":"わざわざ","options":[{"text":"わざわざ","meaning":"特地。對方為你多花工夫，含感謝。","connection":"副詞＋為別人做的動作。わざわざ来る。","why":"遠道來接是特別花的工夫，而且在道謝。用わざわざ。","example":"わざわざ店まで取りに行った。","zh":"特地跑去店裡取。"},{"text":"わざと","meaning":"故意。常是明知不該還去做，負面。","connection":"副詞。わざと負ける、わざと踏む。","why":"故意來接和道謝矛盾。わざと沒有感謝別人費心的意思。","example":"わざと聞こえないふりをした。","zh":"故意裝作沒聽見。"},{"text":"せっかく","meaning":"難得、好不容易。後面常轉折：せっかく来たのに。","connection":"副詞。強調機會可惜或珍惜。","why":"せっかく會期待「難得你來了卻……」的轉折。本句是直接道謝，沒有浪費機會。","example":"せっかくの休みなのに、雨だ。","zh":"難得的假日，卻下雨。"},{"text":"つい","meaning":"不禁、沒留神就。","connection":"副詞＋無意識的動作。つい買ってしまう。","why":"遠道來接不是忍不住的無意識行為。","example":"太ってるのに、つい甘いものを食べる。","zh":"明明在發胖，還是忍不住吃甜的。"}],"level":"N3"},{"id":"v04","kind":"vocab","point":"いきなり","group":"v-adv","difficulty":3,"stem":"挨拶（あいさつ）もせず、＿＿用件（ようけん）を言い出した。","gloss":"連招呼都不打，冷不防就說起正事。","answer":"いきなり","options":[{"text":"いきなり","meaning":"沒有應有的步驟，唐突。人的做法常帶失禮。","connection":"副詞。いきなり本題に入る。","why":"沒打招呼就進入正事，省掉了應有步驟。用いきなり。","example":"いきなり肩を叩かれた。","zh":"冷不防被人拍了肩膀。"},{"text":"突然","meaning":"突然。事件或自然現象出乎意料，本身沒有「跳過應有步驟」的意思。","connection":"副詞。突然雨が降る、突然電気が消える。","why":"這裡重點是連招呼都沒有就進入正事，少了禮儀步驟。這種唐突用人的做法，用いきなり，不用突然。","example":"突然電気が消えた。","zh":"燈突然滅了。"},{"text":"急に","meaning":"忽然。狀態變化快。","connection":"副詞。急に寒くなる。","why":"急に是變化快，不是「缺了前面的步驟所以失禮」。","example":"急に立ち上がった。","zh":"忽然站了起來。"},{"text":"たまたま","meaning":"碰巧。","connection":"副詞。偶然。","why":"不是碰巧說到正事，而是做法唐突。","example":"たまたま同じ電車だった。","zh":"碰巧坐了同一班電車。"}],"level":"N3"},{"id":"v05","kind":"vocab","point":"あまり","group":"v-adv","difficulty":2,"stem":"この辺（へん）は夜（よる）＿＿人（ひと）が通（とお）らない。","gloss":"這一帶晚上不太有人經過。","answer":"あまり","options":[{"text":"あまり","meaning":"不太。後面必須接否定。","connection":"副詞＋否定。あまり〜ない。","why":"通らない是否定。不太有人走，用あまり。","example":"この料理はあまり辛くない。","zh":"這道菜不太辣。"},{"text":"かなり","meaning":"相當。程度高，後面是肯定。","connection":"副詞＋肯定。かなり難しい。","why":"かなり通らない會變成程度和否定打架。相當多人要用かなり人が通る。","example":"夜でもかなり人が通る。","zh":"就算晚上也有相當多的人走。"},{"text":"ずいぶん","meaning":"很、比想像中更。說話人的感受。","connection":"副詞。肯定偏多。","why":"ずいぶん通らない不自然。要說「少」會用ほとんど或あまり。","example":"ずいぶん歩いた。","zh":"走了不少路。"},{"text":"必ず","meaning":"一定。","connection":"副詞。必ず〜する，或必ず〜ない＝絕不會，語氣是100%。","why":"必ず通らない是「絕不會有人經過」，比「不太有人」強太多。","example":"鍵は必ずかける。","zh":"鎖一定要上。"}],"level":"N3"},{"id":"v06","kind":"vocab","point":"たいてい","group":"v-adv","difficulty":2,"stem":"父（ちち）は＿＿六時（ろくじ）に帰（かえ）ってくる。","gloss":"父親通常六點回來。","answer":"たいてい","options":[{"text":"たいてい","meaning":"通常、大半時候。習慣。","connection":"副詞＋習慣的動作。","why":"六點回家是日常習慣，不是幾乎全部，也不是大約六點的概數。用たいてい。","example":"日曜日はたいてい家にいる。","zh":"星期天通常在家。"},{"text":"ほとんど","meaning":"幾乎全部、幾乎。","connection":"副詞。ほとんど終わった、ほとんど来ない。","why":"ほとんど六時に帰ってくる會像「幾乎在六點這個事實的全部」，不如たいてい自然。ほとんど修飾比例，不是「通常的習慣時刻」。","example":"宿題はほとんど終わった。","zh":"作業幾乎做完了。"},{"text":"だいたい","meaning":"大致、大約。","connection":"副詞。だいたいわかった。概數。","why":"だいたい六時是「大約六點」，可以，但空格在父は後面、六時前面時，「父はだいたい六時」也常見。區別：たいてい是頻率「多半」，だいたい是粗略程度。本句沒有「大約」的概數標記，說的是回家的習慣頻率。","example":"内容はだいたい理解した。","zh":"內容大致理解了。"},{"text":"やっと","meaning":"總算。","connection":"副詞。一次的解脫。","why":"不是總算六點才回家的那一次。","example":"やっと帰ってきた。","zh":"總算回來了。"}],"level":"N3"},{"id":"v07","kind":"vocab","point":"かえって","group":"v-adv","difficulty":4,"stem":"謝（あやま）ったら、＿＿怒（おこ）られた。","gloss":"道了歉，反而被罵。","answer":"かえって","options":[{"text":"かえって","meaning":"反而。結果和期待相反，常更差。","connection":"副詞。期待的反效果。","why":"道歉本應緩和，結果被罵，和期待相反。用かえって。","example":"薬を飲んだら、かえって悪化した。","zh":"吃了藥，反而惡化了。"},{"text":"むしろ","meaning":"倒不如、寧可。說話人比較之後選擇另一邊。","connection":"副詞。バスよりむしろ歩く。","why":"不是在道歉和被罵之間做選擇，而是結果反了。","example":"夜よりむしろ朝のほうが集中できる。","zh":"比起晚上，早上反而更能集中。"},{"text":"やっぱり","meaning":"果然、還是。和預想一致。","connection":"副詞。","why":"果然被罵表示預想命中。本句是道歉後的意外反效果，不是果然。","example":"やっぱり雨だ。","zh":"果然下雨了。"},{"text":"わざわざ","meaning":"特地。","connection":"副詞。","why":"沒有人特地被罵。","example":"わざわざ謝りに来た。","zh":"特地來道歉。"}],"level":"N3"},{"id":"v08","kind":"vocab","point":"どうしても","group":"v-adv","difficulty":3,"stem":"このネジは＿＿回（まわ）らない。","gloss":"這顆螺絲怎麼樣都轉不動。","answer":"どうしても","options":[{"text":"どうしても","meaning":"無論如何也。後面常是否定：做不到。","connection":"副詞＋可能否定。どうしても〜ない。","why":"轉不動是否定的可能。怎麼試都不行，用どうしても。","example":"どうしても名前が思い出せない。","zh":"怎麼樣都想不起名字。"},{"text":"なんとか","meaning":"總算設法。後面是做成了。","connection":"副詞＋可能た形。なんとか回った。","why":"なんとか回らない會和「設法做成」的肯定方向相反。","example":"なんとか回った。","zh":"總算轉開了。"},{"text":"ぜひ","meaning":"務必、一定要。請求或強烈希望，肯定。","connection":"ぜひ＋てください／たい。","why":"ぜひ回らない不成立。ぜひ不接否定的做不到。","example":"ぜひ来てください。","zh":"請一定要來。"},{"text":"たいてい","meaning":"通常。","connection":"習慣頻率。","why":"螺絲轉不動不是習慣頻率。","example":"このネジはたいてい固い。","zh":"這顆螺絲通常很緊。"}],"level":"N3"},{"id":"v09","kind":"vocab","point":"とりあえず","group":"v-adv","difficulty":4,"stem":"原因（げんいん）はあとで調（しら）べます。＿＿応急処置（おうきゅうしょち）だけしておきます。","gloss":"原因稍後再查。先只做應急處理。","answer":"とりあえず","options":[{"text":"とりあえず","meaning":"暫時先。作為眼下的第一步，之後還有正式做法。","connection":"副詞。とりあえずこれで。","why":"先做應急、原因以後再查，正是「眼前先」。","example":"とりあえずお湯を飲んでください。","zh":"請先喝點熱水。"},{"text":"一応","meaning":"姑且、起碼做到某個程度。常是最低限度或以防萬一。","connection":"副詞。一応確認した。","why":"一応是「姑且做過、算是做了」，不是「正式調查之前的臨時第一步」。","example":"一応鍵はかけた。","zh":"姑且把鎖上了。"},{"text":"ひとまず","meaning":"暫且。告一段落、先鬆一口氣。","connection":"副詞。ひとまず安心。","why":"ひとまず多接安心、一段落，不接「只做應急處理」這個行動步驟。","example":"出血は止まったので、ひとまず安心だ。","zh":"血止住了，暫且放心。"},{"text":"やはり","meaning":"果然、還是。","connection":"副詞。","why":"沒有預想被證實。","example":"やはり専門家に頼もう。","zh":"還是找專家吧。"}],"level":"N3"},{"id":"v10","kind":"vocab","point":"増やす","group":"v-verb","difficulty":2,"stem":"店（みせ）はアルバイトの人数（にんずう）を＿＿つもりだ。","gloss":"店裡打算增加兼職的人數。","answer":"増やす","options":[{"text":"増やす","meaning":"增加。他動詞，人有意志地讓數量變多。","connection":"を＋増やす。ます語幹増やし。","why":"人数を是賓語，店是有意志的主語。要用他動詞増やす。","example":"生産量を増やす。","zh":"增加產量。"},{"text":"増える","meaning":"增加。自動詞，事物自己變多。","connection":"が＋増える。不能加を。","why":"人数を増える助詞錯。自動詞不能拿「を人数」當賓語。","example":"客が増えた。","zh":"客人增加了。"},{"text":"上げる","meaning":"提高。","connection":"を＋上げる。價格、水平、手。","why":"人数を上げる不自然。人數用増やす，薪水、溫度才常用上げる。","example":"給料を上げる。","zh":"加薪。"},{"text":"伸ばす","meaning":"延長、伸展。","connection":"を＋伸ばす。頭髮、時間、能力。","why":"人数を伸ばす不是增加人手。","example":"営業時間を伸ばす。","zh":"延長營業時間。"}],"level":"N3"},{"id":"v11","kind":"vocab","point":"届く","group":"v-verb","difficulty":2,"stem":"注文（ちゅうもん）した荷物（にもつ）が、まだ＿＿いない。","gloss":"訂的包裹還沒到。","answer":"届いて","options":[{"text":"届いて","meaning":"送到、到達接收者手邊。自動詞。","connection":"荷物が届く。て形届いて＋いる。","why":"包裹是主語，用が，還沒到達。自動詞の否定進行：届いていない。","example":"手紙が届いた。","zh":"信到了。"},{"text":"届けて","meaning":"送去。他動詞。","connection":"荷物を届ける。主語是人。","why":"届けていない要有人作主語和を。荷物が届けて不對。","example":"自分で荷物を届けた。","zh":"自己把包裹送去了。"},{"text":"着いて","meaning":"人到達某地。","connection":"人が着く。","why":"人到地方用着く。物品到收件人用届く。荷物が着く偶爾聽見，但標準搭配是届く。","example":"駅に着いた。","zh":"到車站了。"},{"text":"当たって","meaning":"命中、碰上。","connection":"くじに当たる。","why":"包裹不是中獎。","example":"宝くじに当たった。","zh":"彩票中了。"}],"level":"N3"},{"id":"v12","kind":"vocab","point":"預ける","group":"v-verb","difficulty":3,"stem":"旅行（りょこう）の間（あいだ）、猫（ねこ）を友人（ゆうじん）に＿＿。","gloss":"旅行期間把貓託給朋友。","answer":"預けた","options":[{"text":"預けた","meaning":"把東西託給別人保管。他動詞。","connection":"名詞を人に預ける。","why":"貓是被託付的對象，朋友是接受者。を＋に＋預ける。","example":"荷物をフロントに預けた。","zh":"把行李寄放在櫃檯。"},{"text":"預かった","meaning":"收下別人託付的東西。","connection":"名詞を預かる。主語是保管的人。","why":"預かった的主語應是朋友。句子主語是旅行的人，動作是交出貓，要用預ける。","example":"友達の猫を一週間預かった。","zh":"幫朋友保管了一週的貓。"},{"text":"渡した","meaning":"交給。物品從甲交到乙，交完就結束，不含幫你保管。","connection":"を人に渡す。","why":"渡した只是遞交。旅行期間請人照看要用預ける。","example":"鍵を渡した。","zh":"把鑰匙交給了對方。"},{"text":"貸した","meaning":"借出。","connection":"を人に貸す。對方暫時使用後歸還。","why":"貓不是借給朋友使用。照看用預ける。","example":"傘を貸した。","zh":"把傘借給了對方。"}],"level":"N3"},{"id":"v13","kind":"vocab","point":"見つかる","group":"v-verb","difficulty":2,"stem":"なくした鍵（かぎ）がソファの下（した）から＿＿。","gloss":"不見的鑰匙在沙發下面被找到了。","answer":"見つかった","options":[{"text":"見つかった","meaning":"被找到。自動詞。東西自己「出現在找到的結果」。","connection":"名詞が見つかる。","why":"鍵が是主語，沒有「我」去找的を。用見つかる。","example":"間違いが見つかった。","zh":"發現了錯誤。"},{"text":"見つけた","meaning":"找到。他動詞。人努力之後發現。","connection":"名詞を見つける。","why":"見つけた的主語必須是人。鍵が見つけた會把鑰匙當成找東西的人。","example":"鍵を見つけた。","zh":"我找到了鑰匙。"},{"text":"直した","meaning":"修理。","connection":"を直す。","why":"鑰匙不是被修好，是被找到。","example":"壊れた鍵を直した。","zh":"把壞掉的鎖修好了。"},{"text":"届いた","meaning":"送到。","connection":"が届く。","why":"鑰匙不是寄到，是在沙發下找到。","example":"小包が届いた。","zh":"包裹到了。"}],"level":"N3"},{"id":"v14","kind":"vocab","point":"治る","group":"v-verb","difficulty":3,"stem":"薬（くすり）を飲（の）んだら、頭痛（ずつう）が＿＿。","gloss":"吃了藥，頭痛好了。","answer":"治った","options":[{"text":"治った","meaning":"病、痛好了。自動詞。","connection":"病気・けがが治る。","why":"頭痛が是主語，症狀自己好轉。治る。","example":"風邪が治った。","zh":"感冒好了。"},{"text":"治した","meaning":"治好。他動詞。醫生或藥作主語時要を。","connection":"病気を治す。","why":"頭痛を治した才是他動詞。が＋治した不對。","example":"医者がけがを治した。","zh":"醫生把傷治好了。"},{"text":"直った","meaning":"故障修好了。自動詞，用於物品。","connection":"機械が直る。","why":"頭痛不是機器故障。病用治る，機器用直る。","example":"時計が直った。","zh":"鐘修好了。"},{"text":"直した","meaning":"修好物品。他動詞。","connection":"を直す。","why":"既是他動詞助詞不對，也不用於頭痛。","example":"時計を直した。","zh":"把鐘修好了。"}],"level":"N3"},{"id":"v15","kind":"vocab","point":"伝える","group":"v-verb","difficulty":3,"stem":"この注意（ちゅうい）を、全員（ぜんいん）に＿＿ください。","gloss":"請把這個注意事項轉告所有人。","answer":"伝えて","options":[{"text":"伝えて","meaning":"轉告、傳達。他動詞。人把資訊交給別人。","connection":"名詞を人に伝える。て形＋ください。","why":"注意を、全員に，請你去傳達。他動詞命令形用伝えて。","example":"都合を先生に伝えた。","zh":"把情況轉告了老師。"},{"text":"伝わって","meaning":"傳開、被理解。自動詞。","connection":"が伝わる。","why":"注意が伝わる才是自動詞。這裡有を和ください，要人去做，用伝える。","example":"気持ちが伝わった。","zh":"心意傳達到了。"},{"text":"教えて","meaning":"教導、告訴對方怎麼做。","connection":"を人に教える。","why":"教える偏教授或告知原本不知道的知識。把既定注意轉給全員，用伝える更準。","example":"使い方を教えた。","zh":"教了用法。"},{"text":"話して","meaning":"說、講述。","connection":"を話す可以，但是對聽眾說內容，不是「轉達給每個人」的傳遞。","why":"話してください會像「請你來講這段注意」，不一定是轉達任務。","example":"体験を話した。","zh":"講了親身經歷。"}],"level":"N3"},{"id":"v16","kind":"vocab","point":"経験","group":"v-noun","difficulty":3,"stem":"海外（かいがい）で働（はたら）いた＿＿が、今（いま）の仕事（しごと）に活（い）きている。","gloss":"在海外工作過的經驗，用在現在的工作上。","answer":"経験","options":[{"text":"経験","meaning":"累積下來的經驗。時間較長、之後能運用。","connection":"名詞。働く経験、経験を生かす。","why":"在海外工作是一段可被後來活用的經歷。経験が活きている。","example":"失敗の経験を次に生かす。","zh":"把失敗的經驗用到下一次。"},{"text":"体験","meaning":"一次具體的親身經歷、體驗活動。","connection":"名詞。職業体験、戦争体験。較單一事件。","why":"体験偏一次活動或衝撃性的經歷。長期工作後活用到現職，用経験。","example":"茶道を体験した。","zh":"體驗了茶道。"},{"text":"実験","meaning":"科學實驗。","connection":"名詞。","why":"在海外工作不是實驗。","example":"化学の実験。","zh":"化學實驗。"},{"text":"実行","meaning":"付諸實行。","connection":"計画を実行する。","why":"実行不是「經歷」這種名詞能作「活きている」的主語。","example":"計画を実行した。","zh":"把計劃執行了。"}],"level":"N3"},{"id":"v17","kind":"vocab","point":"きっかけ","group":"v-noun","difficulty":3,"stem":"友人（ゆうじん）の勧（すす）めが＿＿で、日本語（にほんご）を始（はじ）めた。","gloss":"因為朋友的勸說這個契機，開始學日語。","answer":"きっかけ","options":[{"text":"きっかけ","meaning":"事情開始的契機、導火線。","connection":"名詞。〜がきっかけで、動詞。","why":"勸說是開始學日語的開端。がきっかけで。","example":"旅行がきっかけで、写真を始めた。","zh":"旅行為契機，開始拍照。"},{"text":"原因","meaning":"原因。直接導致結果，偏不好的結果時更常見。","connection":"名詞。原因で、遅れた。","why":"原因可以說原因，但「開始一個新習慣」的開端用きっかけ。原因不太接「で、〜を始めた」這個正面向的開始。","example":"遅延の原因は雪だ。","zh":"延誤的原因是雪。"},{"text":"理由","meaning":"理由。說明為什麼合理。","connection":"名詞。理由は〜からだ。","why":"理由是解釋，不是引發新行動的那個契機。勧めが理由で始める比較生硬。","example":"欠席の理由を書いた。","zh":"寫了缺席理由。"},{"text":"結果","meaning":"結果。","connection":"名詞。","why":"勸說不是結果，學日語才是之後的事。","example":"努力の結果、合格した。","zh":"努力的結果是合格了。"}],"level":"N3"},{"id":"v18","kind":"vocab","point":"機会","group":"v-noun","difficulty":2,"stem":"日本（にほん）にいる＿＿に、各地（かくち）を旅（たび）したい。","gloss":"想趁在日本的機會，到各地旅行。","answer":"機会","options":[{"text":"機会","meaning":"機會、時機。","connection":"名詞。〜機会に。いる機会に＝趁有這個機會。","why":"人在日本是一個可利用的時機。機会に＋したい。","example":"話す機会がなかった。","zh":"沒有說話的機會。"},{"text":"場合","meaning":"場合、在……的情況下。","connection":"名詞。〜場合は。條件。","why":"場合是條件分類，不是「趁這個好時機」。いる場合に旅したい不自然。","example":"雨の場合は、中止だ。","zh":"如果下雨就取消。"},{"text":"都合","meaning":"方便、情況。","connection":"名詞。都合がいい。","why":"都合是方不方便，不是機會本身。","example":"都合がよければ、参加する。","zh":"如果方便就參加。"},{"text":"調子","meaning":"狀況、調子。","connection":"名詞。調子がいい。","why":"調子不表示可以把握的時機。","example":"体の調子が悪い。","zh":"身體狀況不好。"}],"level":"N3"},{"id":"v19","kind":"vocab","point":"影響","group":"v-noun","difficulty":3,"stem":"夜更（よふ）かしは、翌日（よくじつ）の仕事（しごと）に＿＿する。","gloss":"熬夜會影響第二天的工作。","answer":"影響","options":[{"text":"影響","meaning":"影響。對別的事物產生作用，可好可壞。","connection":"名詞。に影響する。影響を与える。","why":"熬夜對工作產生作用。に＋影響する。","example":"値上げが生活に影響した。","zh":"漲價影響了生活。"},{"text":"効果","meaning":"效果。做法帶來的預期成效，多是正面。","connection":"名詞。効果がある。","why":"熬夜沒有「對工作有效果」這種正面搭配。効果は薬や方法に使う。","example":"この薬はよく効く。効果がある。","zh":"這藥很有效。"},{"text":"結果","meaning":"結果。","connection":"名詞。を結果にする不說「に結果する」當影響。","why":"仕事に結果する不是「影響工作」。","example":"いい結果が出た。","zh":"出了好結果。"},{"text":"印象","meaning":"印象。","connection":"名詞。印象に残る。印象する不存在。","why":"に印象する接續不成立。","example":"強い印象を受けた。","zh":"留下了很深的印象。"}],"level":"N3"},{"id":"v20","kind":"vocab","point":"感想","group":"v-noun","difficulty":2,"stem":"映画（えいが）を見（み）た＿＿を、二百字（にひゃくじ）で書（か）いてください。","gloss":"請用二百字寫下看完電影的感想。","answer":"感想","options":[{"text":"感想","meaning":"看完、做完之後的個人感受。","connection":"名詞。感想を書く、感想を述べる。","why":"電影是已經看了的體驗，要寫的是之後的感受。見た感想。","example":"読んだ感想を話した。","zh":"說了讀後感。"},{"text":"印象","meaning":"第一眼或整體留下的印象。","connection":"名詞。印象が強い。","why":"印象可以是還沒消化完的整體感覺。老師叫你寫二百字，通常是感想，不是「印象」這個較靜態的名詞搭配「を書く」。","example":"第一印象がよかった。","zh":"第一印象很好。"},{"text":"意見","meaning":"意見、判斷。","connection":"名詞。意見を言う。","why":"意見是贊成反對之類的判斷，不是看完電影的感受作文。","example":"反対の意見を述べた。","zh":"陳述了反對意見。"},{"text":"意味","meaning":"意思。","connection":"名詞。意味が分かる。","why":"電影的意思不是「看了之後寫二百字」的常規搭配。","example":"この語の意味。","zh":"這個詞的意思。"}],"level":"N3"},{"id":"v21","kind":"vocab","point":"すっかり","group":"v-adv","difficulty":3,"stem":"十年（じゅうねん）会（あ）っていなくて、名前（なまえ）を＿＿忘（わす）れていた。","gloss":"十年沒見，名字完全忘了。","answer":"すっかり","options":[{"text":"すっかり","meaning":"完全、徹底。變化已經完成。","connection":"副詞＋てしまう／ていた。すっかり忘れた。","why":"名字忘得乾乾淨淨，不是部分忘記。すっかり忘れていた。","example":"街並みがすっかり変わった。","zh":"街道完全變了。"},{"text":"かなり","meaning":"相當。程度高但未到盡頭。","connection":"副詞。","why":"かなり忘れていた是忘了不少，還可能記得片段。句意是十年沒見的完全忘記。","example":"かなり前に会った。","zh":"在相當久之前見過。"},{"text":"つい","meaning":"不禁。","connection":"副詞＋無意識的瞬間動作。","why":"つい忘れていた偏「一時没留意」，不是十年造成的徹底忘記。","example":"つい名前を間違えた。","zh":"一時口誤把名字說錯。"},{"text":"やっと","meaning":"總算。","connection":"副詞。正面解脫。","why":"忘掉名字不是總算達成的好事。","example":"やっと名前を思い出した。","zh":"總算想起了名字。"}],"level":"N3"},{"id":"v22","kind":"vocab","point":"別に","group":"v-adv","difficulty":3,"stem":"＿＿困（こま）っていない。一人（ひとり）でできる。","gloss":"也不是特別困擾。我一個人做得來。","answer":"別に","options":[{"text":"別に","meaning":"並不特別。後面接否定，把程度往下壓。","connection":"副詞＋否定。別に〜ない。","why":"困っていない是否定。並沒有多困擾。別に。","example":"別に欲しくない。","zh":"也不是特別想要。"},{"text":"決して","meaning":"絕不會。強否定。","connection":"決して＋否定。","why":"決して困っていない是「絕不困擾」，語氣像發誓，比「也不是特別困擾」重。","example":"決して忘れない。","zh":"絕不會忘記。"},{"text":"ぜひ","meaning":"務必。請求或強烈希望，後面是肯定的邀請。","connection":"ぜひ＋てください／たい。不能用來表示「沒什麼」。","why":"對方在道歉，回答要把事情往輕裡說。ぜひ沒有「不打緊」的意思，也不能接「還沒開始所以沒關係」。","example":"ぜひまた来てください。","zh":"請一定再來。"},{"text":"必ず","meaning":"一定。","connection":"副詞。肯定的必然。","why":"必ず困っていない把「一定」和「不困擾」拧在一起，不像口語回應。","example":"必ず連絡する。","zh":"一定會聯絡。"}],"level":"N3"},{"id":"v23","kind":"vocab","point":"確認","group":"kanji","difficulty":2,"stem":"出発（しゅっぱつ）の前（まえ）に、切符（きっぷ）の時間（じかん）を＿＿してください。","gloss":"出發前請確認車票時間。讀音要選對。","answer":"かくにん","options":[{"text":"かくにん","meaning":"確認。核對、查清楚。","connection":"名詞・する動詞。確認する。讀音かくにん。","why":"空格是這個詞的讀音。確認是「かくにん」，不是「かくじん」。","example":"予約を確認する。","zh":"確認預約。"},{"text":"かくじん","meaning":"沒有這個讀音的常用詞。","connection":"確認的「認」音讀是にん。","why":"じん是「人」等字的音，確認不讀かくじん。","example":"確認（かくにん）。","zh":"確認。"},{"text":"かくねい","meaning":"不是確認的讀音。","connection":"認不讀ねい。","why":"把にん聽成ねい。正確是にん。","example":"確認はかくにん。","zh":"讀作かくにん。"},{"text":"きにん","meaning":"不是這個詞。","connection":"確是かく，不是き。","why":"確（かく）認（にん）。きにん對不上漢字。","example":"確か（たしか）は別の語。","zh":"確か是另一個詞。"}],"level":"N3"},{"id":"v24","kind":"vocab","point":"複雑","group":"kanji","difficulty":3,"stem":"手続き（てつづき）が＿＿で、窓口（まどぐち）を三回（さんかい）も回（まわ）った。","gloss":"手續很複雜，窗口跑了三次。","answer":"ふくざつ","options":[{"text":"ふくざつ","meaning":"複雜。","connection":"な形容詞。複雑だ。ふく＋ざつ。","why":"手續麻煩到跑三次，是複雜。讀音ふくざつ。","example":"複雑な問題。","zh":"複雜的問題。"},{"text":"ふくさつ","meaning":"把ざつ誤讀成さつ。","connection":"雑的音讀是ざつ（ざ行）。","why":"複雑不是ふくさつ。雜（ざつ）。","example":"雑用（ざつよう）。","zh":"雜務讀ざつ。"},{"text":"ふくそく","meaning":"這是規則、預測一類的音，不是複雜。","connection":"則（そく）、測（そく）。","why":"意思會變成別的詞，漢字也不對。","example":"規則（きそく）。","zh":"規則。"},{"text":"ふくざい","meaning":"不是複雜的讀音。","connection":"材（ざい）。","why":"ざい和ざつ不同。","example":"材料（ざいりょう）。","zh":"材料。"}],"level":"N3"},{"id":"v25","kind":"vocab","point":"比較","group":"kanji","difficulty":2,"stem":"二つの案（あん）を＿＿してから、決（き）めよう。","gloss":"先把兩個方案比較之後再決定。","answer":"ひかく","options":[{"text":"ひかく","meaning":"比較。","connection":"名詞・する。比較する。ひかく。","why":"兩個方案放在一起看，是比較。","example":"値段を比較する。","zh":"比較價格。"},{"text":"ひこう","meaning":"比の另一讀或飛行等，不是比較。","connection":"比較的較是かく。","why":"ひこう會聽成飛行。比較はひかく。","example":"飛行（ひこう）。","zh":"飛行。"},{"text":"ひきょう","meaning":"比較不讀ひきょう。","connection":"較不是きょう。","why":"きょう常見於強、教。較はかく。","example":"比較（ひかく）。","zh":"讀ひかく。"},{"text":"ひっかく","meaning":"多了一個促音。","connection":"比較沒有小つ。","why":"ひっかく不是這個詞的讀音。","example":"比較はひかく。","zh":"中間沒有促音。"}],"level":"N3"},{"id":"v26","kind":"vocab","point":"解決","group":"kanji","difficulty":3,"stem":"苦情（くじょう）は、その日（ひ）のうちに＿＿したほうがいい。","gloss":"客訴最好在當天解決。","answer":"かいけつ","options":[{"text":"かいけつ","meaning":"解決。","connection":"名詞・する。解決する。かいけつ。","why":"把投訴處理掉。解決（かいけつ）。","example":"問題を解決する。","zh":"解決問題。"},{"text":"かいけつう","meaning":"多了長音。","connection":"決是けつ，不延長。","why":"不是かいけつう。","example":"解決はかいけつ。","zh":"四個拍：か・い・け・つ。"},{"text":"かいこう","meaning":"這會像開口、海港的音。","connection":"決不是こう。","why":"解決不讀かいこう。","example":"解決（かいけつ）。","zh":"決（けつ）。"},{"text":"かいけい","meaning":"像会計的音。","connection":"会計はかいけい。","why":"和會計搞混。解決はけつ。","example":"会計（かいけい）。","zh":"會計是另一個詞。"}],"level":"N3"},{"id":"v27","kind":"vocab","point":"準備","group":"kanji","difficulty":2,"stem":"面接（めんせつ）の＿＿に、一週間（いっしゅうかん）かかった。","gloss":"面試的準備花了一星期。","answer":"じゅんび","options":[{"text":"じゅんび","meaning":"準備。","connection":"名詞。準備する。じゅんび。","why":"面試前要做的準備。讀じゅんび。","example":"旅行の準備。","zh":"旅行的準備。"},{"text":"じゅんぴ","meaning":"把び誤成ぴ。","connection":"備の音讀はび（濁音）。","why":"不是促音或半濁。準備はじゅんび。","example":"準備（じゅんび）。","zh":"び。"},{"text":"じゅんぺい","meaning":"像人名的讀法。","connection":"備不讀ぺい。","why":"じゅんぺい不是這個名詞。","example":"準備はじゅんび。","zh":"讀じゅんび。"},{"text":"ようい","meaning":"用意的讀音。","connection":"用意（ようい）は別語。意思接近，但漢字準備不讀ようい。","why":"題目空格對應的是準備這個詞的讀音，不能填同義詞用意的讀音。","example":"用意（ようい）は別の漢字。","zh":"用意是不同的漢字。"}],"level":"N3"},{"id":"v28","kind":"vocab","point":"説明","group":"kanji","difficulty":2,"stem":"係（かかり）の人（ひと）の＿＿がわかりやすかった。","gloss":"工作人員的說明很容易懂。","answer":"せつめい","options":[{"text":"せつめい","meaning":"說明。","connection":"名詞。説明。せつ＋めい。","why":"工作人員做的說明。せつめい。","example":"手順を説明する。","zh":"說明步驟。"},{"text":"せつみょう","meaning":"明不讀みょう在這個詞裡。","connection":"明（めい）。","why":"せつみょう不對。","example":"説明（せつめい）。","zh":"めい。"},{"text":"ときあかし","meaning":"「説き明かし」的訓讀，不是説明的音讀。","connection":"漢字語説明用音讀。","why":"題目是漢字詞的音讀。不用訓讀ときあかし。","example":"説明はせつめい。","zh":"音讀せつめい。"},{"text":"せつめ","meaning":"少了めい。","connection":"兩個漢字兩個音。","why":"せつめ只有一半。","example":"説明（せつめい）。","zh":"せつ＋めい。"}],"level":"N3"},{"id":"v29","kind":"vocab","point":"せっかく","group":"v-adv","difficulty":3,"stem":"＿＿京都（きょうと）まで来（き）たのだから、寺（てら）を見（み）ていこう。","gloss":"好不容易來到京都，就去看看寺廟吧。","answer":"せっかく","options":[{"text":"せっかく","meaning":"難得、好不容易。後面多是「不要浪費這次機會」。","connection":"副詞。せっかく来たのだから、せっかくの休み。","why":"人已經到了京都，這個努力或機會不該白費。用せっかく。","example":"せっかく作った料理だから、残さないで。","zh":"好不容易做的菜，別剩下。"},{"text":"わざと","meaning":"故意。","connection":"副詞。負面的意図。","why":"不是故意跑到京都。沒有「明知不該還去做」。","example":"わざと遠回りした。","zh":"故意繞遠路。"},{"text":"ついに","meaning":"終於。結果降臨。","connection":"副詞。ついに到着した。","why":"ついに京都まで来た可以說終於來到，但接「のだから、去看寺」是要珍惜這趟，不是宣布結局。","example":"ついに京都に着いた。","zh":"終於到了京都。"},{"text":"いきなり","meaning":"冷不防。","connection":"副詞。沒有前步驟。","why":"來到京都不是突然發生的失禮動作。","example":"いきなり寺に入った。","zh":"冷不防走進寺廟。"}],"level":"N3"},{"id":"v30","kind":"vocab","point":"つい","group":"v-adv","difficulty":3,"stem":"太（ふと）らないと決（き）めたのに、＿＿夜食（やしょく）を食（た）べてしまった。","gloss":"明明決定不發胖，還是忍不住吃了宵夜。","answer":"つい","options":[{"text":"つい","meaning":"忍不住、一沒留神就。自己也知道不該，卻控制不住。","connection":"副詞。常和てしまう一起。","why":"決定了還是吃了，是沒管住自己。つい食べてしまった。","example":"秘密だと分かっていて、つい話した。","zh":"明知是秘密，還是忍不住說了。"},{"text":"わざわざ","meaning":"特地。","connection":"副詞。為了某事多花工夫。","why":"特地去吃宵夜和「不該吃卻吃了」的後悔相反。","example":"わざわざ店まで買いに行った。","zh":"特地跑去店裡買。"},{"text":"ようやく","meaning":"總算。辛苦之後的正面結果。","connection":"副詞。ようやく終わった。","why":"吃宵夜不是辛苦之後的好結果。","example":"ようやく目標の体重になった。","zh":"總算到了目標體重。"},{"text":"ちゃんと","meaning":"好好地、按規矩。","connection":"副詞。肯定該做的事做得到位。","why":"ちゃんと食べてしまった不是「沒忍住」。好好吃和後悔矛盾。","example":"夜食はちゃんと野菜にする。","zh":"宵夜就好好吃蔬菜。"}],"level":"N3"},{"id":"v31","kind":"vocab","point":"むしろ","group":"v-adv","difficulty":4,"stem":"謝（あやま）るより、＿＿今（いま）からやり直（なお）したほうがいい。","gloss":"與其道歉，不如現在重做比較好。","answer":"むしろ","options":[{"text":"むしろ","meaning":"與其前面那樣，不如後面這個。說話人選擇後者。","connection":"副詞。Ａより、むしろＢ。","why":"空格在「より」後面的選擇上。比起道歉，重做更好。用むしろ。","example":"電車より、むしろバスのほうが空いている。","zh":"與其坐電車，巴士反而比較空。"},{"text":"やはり","meaning":"果然、還是。和原先想的一樣。","connection":"副詞。やはり行こう。","why":"不是驗證了原先的想法，是在兩個做法裡偏向後面那個。","example":"やはり、謝ったほうがいい。","zh":"果然還是道歉比較好。"},{"text":"せっかく","meaning":"難得。","connection":"副詞。","why":"せっかく今からやり直した沒有「比起道歉」的取捨。","example":"せっかくの機会だから、やり直そう。","zh":"難得的機會，重新做吧。"},{"text":"とりあえず","meaning":"總之先。臨時的第一步。","connection":"副詞。とりあえず謝る。","why":"總之先重做，少了「與其道歉」的比較。句子的骨架是ＡよりＢ。","example":"とりあえず、謝っておこう。","zh":"總之先道歉吧。"}],"level":"N3"},{"id":"v32","kind":"vocab","point":"やはり","group":"v-adv","difficulty":3,"stem":"天気予報（よほう）のとおり、＿＿午後（ごご）から雨（あめ）になった。","gloss":"正如天氣預報，下午果然下了雨。","answer":"やはり","options":[{"text":"やはり","meaning":"果然。結果和預期、傳聞、常理一致。","connection":"副詞。やはり〜だった。","why":"預報說過會下雨，結果一致。用やはり。","example":"彼はやはり来なかった。","zh":"他果然沒來。"},{"text":"むしろ","meaning":"不如、反而是。","connection":"副詞。和預期相反的選擇。","why":"下雨和預報一致，不是相反的選擇。","example":"晴れるかと思ったが、むしろ雨だ。","zh":"以為會放晴，反而是雨。"},{"text":"いきなり","meaning":"冷不防。","connection":"副詞。","why":"預報已經說過，就不是沒有預兆的突然。","example":"いきなり雷が鳴った。","zh":"冷不防打起雷。"},{"text":"つい","meaning":"忍不住。","connection":"副詞＋無意識的動作。","why":"下雨不是人忍不住做的事。","example":"傘を持つと決めたのに、つい忘れた。","zh":"決定帶傘，還是忍不住忘了。"}],"level":"N3"},{"id":"v33","kind":"vocab","point":"思わず","group":"v-adv","difficulty":4,"stem":"あまりにおかしくて、＿＿笑（わら）い出してしまった。","gloss":"實在太滑稽，不知不覺笑了出來。","answer":"思わず","options":[{"text":"思わず","meaning":"不由自主。身體比思考更快做出反應。","connection":"副詞＋瞬間的動作。思わず叫ぶ、思わず振り返る。","why":"太滑稽所以笑出來，不是計畫好的。思わず笑い出した。","example":"名前を呼ばれて、思わず振り返った。","zh":"被叫到名字，不由得回了頭。"},{"text":"わざと","meaning":"故意。","connection":"副詞。","why":"故意笑和「太滑稽所以笑出來」矛盾。","example":"わざと大声で笑った。","zh":"故意大聲笑。"},{"text":"ようやく","meaning":"總算。","connection":"副詞。辛苦之後。","why":"笑出來不是等待已久的成果。","example":"ようやく笑えるようになった。","zh":"總算能夠笑了。那是經過一段時間。"},{"text":"きちんと","meaning":"整整齊齊、按规矩。","connection":"副詞。","why":"規規矩矩地笑出來，不是這句的不由自主。","example":"きちんと席に着いた。","zh":"整整齊齊坐好。"}],"level":"N3"},{"id":"v34","kind":"vocab","point":"かなり","group":"v-adv","difficulty":2,"stem":"この坂（さか）は＿＿急（きゅう）なので、自転車（じてんしゃ）では危（あぶ）ない。","gloss":"這個坡相當陡，騎自行車危險。","answer":"かなり","options":[{"text":"かなり","meaning":"相當。程度高，說話人有把握，後面是肯定。","connection":"副詞＋肯定。かなり難しい、かなりの量。","why":"坡度高到危險，是肯定的高程度。かなり急だ。","example":"駅までかなり歩く。","zh":"到車站要走相當遠。"},{"text":"あまり","meaning":"不太。後面要否定。","connection":"副詞＋否定。あまり〜ない。","why":"あまり急なので少了否定。不太陡就不會說騎車危險。","example":"この坂はあまり急ではない。","zh":"這個坡不太陡。"},{"text":"やっと","meaning":"總算。","connection":"副詞。正面的解脫。","why":"陡不是辛苦之後的好結果。","example":"やっと坂を上りきった。","zh":"總算爬完坡。"},{"text":"めったに","meaning":"很少。後面要否定。","connection":"副詞＋否定。めったに〜ない。","why":"めったに急なので不成立。很少陡和「所以危險」接不上。","example":"この道はめったに通らない。","zh":"這條路很少走。"}],"level":"N3"},{"id":"v35","kind":"vocab","point":"ほとんど","group":"v-adv","difficulty":3,"stem":"この店（みせ）の席（せき）は、昼（ひる）は＿＿埋（う）まっている。","gloss":"這家店中午位子幾乎都滿了。接近全部。","answer":"ほとんど","options":[{"text":"ほとんど","meaning":"幾乎。接近全部，但留一點餘地。","connection":"副詞。ほとんど全部、ほとんど〜ない＝幾乎不。","why":"中午幾乎坐滿。不是剛好一半，也不是完全沒有。","example":"宿題はほとんど終わった。","zh":"功課幾乎做完了。"},{"text":"あまり","meaning":"不太。後面必須否定。","connection":"副詞＋否定。あまり〜ない。","why":"あまり埋まっている少了否定。不太滿就和中午幾乎坐滿相反。","example":"この店はあまり混まない。","zh":"這家店不太擠。"},{"text":"たまに","meaning":"偶爾。","connection":"副詞。頻度が低い。","why":"偶爾滿座和中午的常態相反。","example":"たまに空席がある。","zh":"偶爾有空位。"},{"text":"やっと","meaning":"總算。辛苦之後的正面結果。","connection":"副詞。やっと〜た。","why":"總算坐滿，不是「接近全部」這個比例，也沒有辛苦之後的解脫。","example":"やっと空席が見つかった。","zh":"總算找到空位。"}],"level":"N3"},{"id":"v36","kind":"vocab","point":"一旦","group":"v-adv","difficulty":4,"stem":"＿＿家（いえ）に戻（もど）って、傘（かさ）を取（と）ってから出（で）直（なお）す。","gloss":"先回家一趟拿傘，然後再出門。","answer":"一旦","options":[{"text":"一旦","meaning":"暫且、先……一次。後面還有下一步。","connection":"副詞。一旦〜てから、一旦〜た上で。","why":"回家不是結束，是為了拿傘再出門。先做一次，用一旦。","example":"一旦預かり、後で返します。","zh":"先暫收，之後還你。"},{"text":"ついに","meaning":"終於。結局。","connection":"副詞。","why":"終於回家就沒有「然後再出門」的暫且。","example":"ついに家に着いた。","zh":"終於到家了。"},{"text":"いきなり","meaning":"冷不防。","connection":"副詞。","why":"先回家拿傘是有步驟的，不是跳過步驟。","example":"いきなり家を出た。","zh":"冷不防出了家門。"},{"text":"やっと","meaning":"總算。","connection":"副詞。解脫。","why":"總算回家和「拿了再出門」的安排不同。","example":"やっと家に着いた。","zh":"總算到家。"}],"level":"N3"},{"id":"v37","kind":"vocab","point":"不足","group":"v-noun","difficulty":3,"stem":"睡眠（すいみん）が＿＿して、昼（ひる）も眠（ねむ）い。","gloss":"睡眠不足，白天也想睡。量不夠。","answer":"不足","options":[{"text":"不足","meaning":"不夠。數量或程度低於需要。","connection":"名詞。睡眠不足、人出不足。するを付けて「不足する」。","why":"睡得不夠所以白天睏。是量不足，不是心裡不滿意。","example":"この計画は予算が不足している。","zh":"這個計畫預算不夠。"},{"text":"不満","meaning":"不滿意。對人或做法心裡不舒服。","connection":"名詞・な形容詞。待遇に不満だ。","why":"睡眠に不満是「對睡眠這件事不滿」，不是睡眠時間不夠。白天想睡是因為沒睡夠。","example":"給料に不満がある。","zh":"對薪水不滿意。"},{"text":"不便","meaning":"不方便。","connection":"な形容詞。交通が不便だ。","why":"睡眠が不便不表示沒睡夠。不便是使用或生活不方便。","example":"この部屋は買い物に不便だ。","zh":"這個房間購物不方便。"},{"text":"不安","meaning":"不安。","connection":"な形容詞。将来が不安だ。","why":"睡眠が不安して不成立。不安不是「不夠」的量。","example":"試験の結果が不安だ。","zh":"擔心考試結果。"}],"level":"N3"},{"id":"vb01","kind":"vocab","point":"きっと","group":"v-adv","difficulty":2,"stem":"空（そら）が暗（くら）い。＿＿雨（あめ）が降（ふ）る。","gloss":"天黑了。一定會下雨。說話人有自信的推測。","answer":"きっと","options":[{"text":"きっと","meaning":"一定。說話人的推測，自信高，但不是自然法則。","connection":"副詞＋動詞。きっと来る、きっと大丈夫。","why":"天黑只是線索，說話人判斷會下雨。用きっと。","example":"彼はきっと合格する。","zh":"他一定會合格。"},{"text":"必ず","meaning":"必然、沒有例外。規則或習慣，不是推測。","connection":"副詞。必ず鍵をかける。","why":"天黑不保證每次都下雨。必ず太強，變成自然法則。","example":"このスイッチを押すと、必ず開く。","zh":"按這個開關，一定會開。"},{"text":"たぶん","meaning":"大概。把握比きっと低。","connection":"副詞。たぶん降る。","why":"たぶん可以說，但天色已經很暗、句子要的是較強的判斷。把握不足。","example":"たぶん夕方には着く。","zh":"大概傍晚會到。"},{"text":"たしか","meaning":"我記得、如果沒記錯。對記憶沒有完全把握。","connection":"副詞。たしか、明日は休みだ。","why":"下雨不是在回憶事實，是在看現在的天色做判斷。","example":"たしか、傘は持った。","zh":"我記得帶了傘。"}],"level":"N4"},{"id":"vb02","kind":"vocab","point":"見える","group":"v-verb","difficulty":2,"stem":"窓（まど）を開（あ）けると、海（うみ）が＿＿。","gloss":"打開窗，就看得見海。自然進入眼睛。","answer":"見える","options":[{"text":"見える","meaning":"看得見。自然能看到，無意志。","connection":"自動詞。海が見える。","why":"海自己進入視線。不是人有意地「看」。海が＋見える。","example":"眼鏡をかけると、字が見える。","zh":"戴上眼鏡就看得見字。"},{"text":"見る","meaning":"看。人有意地把視線放過去。","connection":"他動詞。海を見る。","why":"海が見る主語和助詞都不對。看這個動作的賓語要用を，主語是人。","example":"朝、海を見る。","zh":"早上看海。"},{"text":"見せる","meaning":"給別人看。","connection":"他動詞。海を見せる。","why":"沒有人把海拿給誰看。窗一開，海自然出現。","example":"子供に海を見せた。","zh":"給孩子看了海。"},{"text":"見つかる","meaning":"被找到。原本在找的東西出現。","connection":"自動詞。鍵が見つかる。","why":"海不是遺失後被找到的東西。","example":"落とした財布が見つかった。","zh":"掉了的錢包找到了。"}],"level":"N4"},{"id":"vb03","kind":"vocab","point":"聞こえる","group":"v-verb","difficulty":2,"stem":"隣（となり）の部屋（へや）から、ピアノの音（おと）が＿＿。","gloss":"從隔壁房間傳來鋼琴聲，聽得見。","answer":"聞こえる","options":[{"text":"聞こえる","meaning":"聽得見。聲音自然進到耳朵，無意志。","connection":"自動詞。音が聞こえる。","why":"鋼琴聲自己傳來。不是人特地去聽。音が＋聞こえる。","example":"名前を呼ばれたのが聞こえた。","zh":"聽見有人叫我的名字。"},{"text":"聞く","meaning":"聽。有意地聽。","connection":"他動詞。音を聞く。","why":"音が聞く不成立。聽的賓語用を，主語是人。","example":"毎晩、ピアノを聞く。","zh":"每天晚上聽鋼琴。"},{"text":"聞ける","meaning":"能聽。可能形，仍然是人的能力。","connection":"可能形。ピアノが聞ける。","why":"ピアノの音が聞ける可以說有能力聽，但「從房間傳來」是聲音到達，用聞こえる。","example":"この席なら、よく聞ける。","zh":"這個位子聽得清楚。人的能力。"},{"text":"聞かせる","meaning":"讓人聽。","connection":"使役。音を聞かせる。","why":"沒有人迫使誰聽鋼琴。","example":"子供に曲を聞かせた。","zh":"讓孩子聽了曲子。"}],"level":"N4"},{"id":"vb04","kind":"vocab","point":"分かる","group":"v-verb","difficulty":2,"stem":"先生（せんせい）の説明（せつめい）を聞いて、やっと問題（もんだい）が＿＿。","gloss":"聽了老師的說明，題目總算明白了。","answer":"分かった","options":[{"text":"分かった","meaning":"明白了。理解發生了。","connection":"自動詞。問題が分かる。た形は分かった。","why":"題目是理解的對象，用が。やっと呼應「總算明白」。問題が分かった。","example":"この漢字の意味が分かった。","zh":"這個漢字的意思明白了。"},{"text":"知った","meaning":"知道了。得到一則資訊。","connection":"他動詞。事実を知る。","why":"問題が知った主語不對。知る的主語是人：私が問題を知った是「我得知有這題」，不是「我懂了」。","example":"そのニュースを知った。","zh":"知道了那則新聞。"},{"text":"覚えた","meaning":"記住了。","connection":"他動詞。単語を覚える。","why":"問題が覚えた不成立。記住是人把內容放進記憶，賓語用を。","example":"公式を覚えた。","zh":"記住了公式。"},{"text":"見つけた","meaning":"找到了。","connection":"他動詞。間違いを見つける。","why":"不是把題目找出來，是聽懂了。","example":"誤りを見つけた。","zh":"找到了錯誤。"}],"level":"N4"},{"id":"vb05","kind":"vocab","point":"全然","group":"v-adv","difficulty":1,"stem":"この料理（りょうり）、＿＿辛（から）くない。","gloss":"這道菜一點也不辣。","answer":"全然","options":[{"text":"全然","meaning":"完全不。後面必須否定。程度是零。","connection":"副詞＋否定。全然〜ない。","why":"辛くない是否定。一點都不辣，用全然。","example":"昨日は全然寝ていない。","zh":"昨天完全沒睡。"},{"text":"かなり","meaning":"相當。肯定的高程度。","connection":"副詞＋肯定。","why":"かなり辛くない把高程度和否定接在一起，不成立。","example":"この料理はかなり辛い。","zh":"這道菜相當辣。"},{"text":"きっと","meaning":"一定。推測。","connection":"副詞。","why":"きっと辛くない是「一定不辣」的預測，句子是在形容眼前這道菜的程度為零。","example":"あの店はきっと辛くない。","zh":"那家店一定不辣。推測。"},{"text":"よく","meaning":"常常；很好地。","connection":"副詞。","why":"よく辛くない不表示「完全不辣」。","example":"この店によく来る。","zh":"常常來這家店。"}],"level":"N5"},{"id":"vb06","kind":"vocab","point":"もう","group":"v-adv","difficulty":1,"stem":"レポートは＿＿出（だ）しました。","gloss":"報告已經交了。","answer":"もう","options":[{"text":"もう","meaning":"已經。動作完成。","connection":"副詞＋た形。もう出した。","why":"交了是完成。もう出しました。","example":"もう昼ごはんを食べた。","zh":"已經吃過午飯。"},{"text":"まだ","meaning":"還。還沒有時要否定：まだ〜ない。","connection":"副詞。","why":"まだ出しました是肯定完成，和「還」矛盾。還沒交要說まだ出していません。","example":"まだ出していません。","zh":"還沒交。"},{"text":"いつも","meaning":"總是。","connection":"副詞。習慣。","why":"總是交了，不是這一次已經交了。","example":"レポートはいつも金曜日に出す。","zh":"報告總是星期五交。"},{"text":"あとで","meaning":"之後。","connection":"副詞。尚未做。","why":"之後交和「已交出」的た形矛盾。","example":"レポートはあとで出します。","zh":"報告之後再交。"}],"level":"N5"},{"id":"vb07","kind":"vocab","point":"それで","group":"v-adv","difficulty":2,"stem":"終電（しゅうでん）がなくなった。＿＿、タクシーで帰（かえ）った。","gloss":"末班車沒了。所以坐計程車回去。","answer":"それで","options":[{"text":"それで","meaning":"所以。承接前面的原因，說出結果。","connection":"接続詞。原因。それで結果。","why":"沒有末班車是原因，坐計程車是結果。用それで。","example":"熱があった。それで、学校を休んだ。","zh":"發燒了。所以向學校請假。"},{"text":"それから","meaning":"然後。時間上的下一件，不是原因。","connection":"接続詞。順序。","why":"坐計程車不是單純的下一項日程，是因為沒車才這樣做。","example":"食事をして、それから散歩した。","zh":"吃了飯，然後散步。"},{"text":"でも","meaning":"可是。轉折。","connection":"接続詞。","why":"坐計程車和沒有末班車不是相反的事。","example":"終電はない。でも、歩いて帰れる。","zh":"沒有末班車。不過可以走回去。"},{"text":"すると","meaning":"於是、這麼一來。多接意外的發現。","connection":"接続詞。","why":"すると後面常是沒想到的新情況。這裡是按原因採取的做法，用それで。","example":"ドアを開けた。すると、猫がいた。","zh":"打開門。結果貓在那裡。"}],"level":"N4"},{"id":"vb08","kind":"vocab","point":"なかなか","group":"v-adv","difficulty":2,"stem":"辞書（じしょ）で調（しら）べても、その言葉（ことば）が＿＿見（み）つからない。","gloss":"就算查字典，那個詞還是遲遲找不到。","answer":"なかなか","options":[{"text":"なかなか","meaning":"遲遲、很容易做不到。後面否定，表示比預期久。","connection":"副詞＋否定。なかなか〜ない。","why":"查了還找不到，過程比預期長。なかなか見つからない。","example":"バスがなかなか来ない。","zh":"巴士遲遲不來。"},{"text":"やっと","meaning":"總算。後面是完成的好事。","connection":"副詞＋可能・た形。","why":"見つからない是否定，和やっと的「總算找到」相反。","example":"やっとその言葉が見つかった。","zh":"總算找到那個詞。"},{"text":"すぐに","meaning":"馬上。","connection":"副詞＋肯定的速さ。","why":"馬上找不到，和「查了仍找不到」的拖延相反。","example":"すぐに見つかった。","zh":"馬上找到了。"},{"text":"かなり","meaning":"相當。肯定。","connection":"副詞。","why":"かなり見つからない不自然。相當是高程度的肯定。","example":"かなり時間がかかった。","zh":"花了相當多時間。"}],"level":"N4"},{"id":"vb09","kind":"vocab","point":"そろそろ","group":"v-adv","difficulty":2,"stem":"＿＿終電（しゅうでん）の時間（じかん）だ。帰（かえ）ろう。","gloss":"差不多是末班車的時間了。回去吧。","answer":"そろそろ","options":[{"text":"そろそろ","meaning":"差不多該……了。時間點接近，說話人準備行動。","connection":"副詞。そろそろ帰ろう、そろそろ時間だ。","why":"末班車時間接近，所以提議回去。用そろそろ。","example":"そろそろ店が閉まる。","zh":"店差不多要關門了。"},{"text":"やっと","meaning":"總算。辛苦之後。","connection":"副詞。","why":"總算到了末班車時間，少了「差不多該行動」的感覺，也不像解脫。","example":"やっと終電に間に合った。","zh":"總算趕上末班車。"},{"text":"いきなり","meaning":"冷不防。","connection":"副詞。","why":"時間到了不是突然發生的意外。","example":"いきなり電車が止まった。","zh":"電車突然停了。"},{"text":"まだ","meaning":"還。","connection":"副詞。","why":"還是末班車時間，就不會說「回去吧」這個正好的時機。","example":"まだ終電まで時間がある。","zh":"離末班車還有時間。"}],"level":"N4"},{"id":"vb10","kind":"vocab","point":"開ける","group":"v-verb","difficulty":2,"stem":"暑（あつ）いので、窓（まど）を＿＿ください。","gloss":"因為熱，請把窗打開。人作用在窗上。","answer":"開けて","options":[{"text":"開けて","meaning":"打開。人讓窗開。他動詞。","connection":"他動詞て形。開ける→開けてください。賓語用を。","why":"空格在「窓を」後面，是請對方對窗做動作。窓を開けてください。","example":"瓶のふたを開けた。","zh":"打開了瓶蓋。"},{"text":"開いて","meaning":"開着、開了。自動詞，窗自己的狀態。","connection":"自動詞。窓が開く。","why":"窓を開いてください助詞錯了。自動詞的主語是窗，用が，不能用を當賓語再加ください。","example":"風で窓が開いた。","zh":"窗被風吹開了。"},{"text":"閉めて","meaning":"關上。","connection":"他動詞。窓を閉める。","why":"熱了還請人關窗，和理由相反。","example":"出る前に窓を閉めてください。","zh":"出門前請關窗。"},{"text":"見えて","meaning":"看得見。","connection":"自動詞。","why":"窓を見えてください不成立。看得見不是打開的動作。","example":"ここから海が見える。","zh":"從這裡看得見海。"}],"level":"N4"},{"id":"vb11","kind":"vocab","point":"必ず","group":"v-adv","difficulty":2,"stem":"部屋（へや）を出（で）るときは、＿＿鍵（かぎ）をかけてください。","gloss":"離開房間時，一定要鎖門。沒有例外的規則。","answer":"必ず","options":[{"text":"必ず","meaning":"一定、沒有例外。規則或習慣。","connection":"副詞。必ず〜する。","why":"鎖門是每次都要做的規定，不是推測。必ず鍵をかける。","example":"薬は必ず食後に飲む。","zh":"藥一定要飯後吃。"},{"text":"きっと","meaning":"一定。說話人的推測。","connection":"副詞。","why":"請對方鎖門不是在猜「大概會鎖」。規則要用必ず。","example":"彼はきっと鍵をかけた。","zh":"他一定鎖了門。推測。"},{"text":"たぶん","meaning":"大概。","connection":"副詞。把握が低い。","why":"大概鎖門和「請務必鎖」的規定相反。","example":"たぶん鍵はかけた。","zh":"大概鎖了門。"},{"text":"たまに","meaning":"偶爾。","connection":"副詞。","why":"偶爾鎖門就不是離開時的規定。","example":"たまに鍵を忘れる。","zh":"偶爾會忘了鎖。"}],"level":"N4"},{"id":"v40","kind":"vocab","point":"ついに","group":"v-adv","difficulty":4,"stem":"何度（なんど）も直（なお）したが、＿＿壊（こわ）れてしまった。","gloss":"修了好多次，最後還是壞了。漫長過程之後的結局，這裡是不想看到的。","answer":"ついに","options":[{"text":"ついに","meaning":"終於、到底。經過很長的過程到達結局，好事壞事都可以，重點是結局降臨。","connection":"副詞。ついに完成した、ついに壊れた。","why":"修了很多次仍走到「壞了」這個結局。不是鬆一口氣，也不是突然壞。","example":"ついに夢がかなった。","zh":"夢想終於實現了。這是好的結局。"},{"text":"やっと","meaning":"總算。辛苦之後的好結果，說話人感到解脫。","connection":"副詞＋可能形・た形。やっと直った。","why":"壞掉不是解脫。やっと壊れた會把壞事說成鬆了一口氣，語氣不對。","example":"やっと直った。","zh":"總算修好了。"},{"text":"いきなり","meaning":"沒有前步驟，唐突。","connection":"副詞。人的做法或突然的事件。","why":"前面有「修了好多次」，不是沒有過程的突然壞掉。","example":"いきなり電源が切れた。","zh":"電源冷不防斷了。"},{"text":"わざわざ","meaning":"特地。為了別人多花工夫。","connection":"副詞＋為人做的動作。","why":"機器壞掉不是有人特地去弄壞。","example":"わざわざ見に来てくれた。","zh":"特地來看我。"}],"level":"N3"},{"id":"v41","kind":"vocab","point":"わざと","group":"v-adv","difficulty":3,"stem":"呼（よ）んでいるのに、＿＿聞（き）こえないふりをした。","gloss":"明明在叫他，他卻故意裝成沒聽見。","answer":"わざと","options":[{"text":"わざと","meaning":"故意。知道不該或知道事實，仍那樣做。常是負面。","connection":"副詞。わざと負ける、わざと聞こえないふりをする。","why":"裝聽不見是有意的。故意＋假裝。","example":"わざと遅い返事をした。","zh":"故意回得很慢。"},{"text":"わざわざ","meaning":"特地。多花工夫，常含感謝或「何必」。","connection":"副詞。わざわざ来る。","why":"裝聽不見不是費心為別人做一件事。わざわざ沒有「存心假裝」的意思。","example":"わざわざ駅まで来た。","zh":"特地來到車站。"},{"text":"つい","meaning":"不禁、没留神。","connection":"副詞＋無意識。つい言ってしまう。","why":"裝聽不見如果是つい，就是忍不住，不是存心。這句是有人在叫還裝，是故意。","example":"嘘だと知りつつ、つい笑ってしまった。","zh":"明知是謊，還是忍不住笑了。"},{"text":"思わず","meaning":"不由得。瞬間的無意識反應。","connection":"副詞。思わず叫んだ。","why":"不由得裝聽不見不自然。思わず是控制不住的反應，不是持續的假裝。","example":"大きな音に、思わず振り返った。","zh":"聽到巨響，不由得回了頭。"}],"level":"N3"},{"id":"v42","kind":"vocab","point":"急に","group":"v-adv","difficulty":3,"stem":"夕方（ゆうがた）から、気温（きおん）が＿＿下（さ）がった。","gloss":"從傍晚起，氣溫忽然下降。狀態變得很快。","answer":"急に","options":[{"text":"急に","meaning":"忽然。狀態變化快，自然現象、身體、天氣都常用。","connection":"副詞＋變化。急に寒くなる、急に降る。","why":"氣溫下降是狀態變快，不是有人跳過應有的步驟。急に下がった。","example":"急に空が暗くなった。","zh":"天忽然暗了。"},{"text":"いきなり","meaning":"唐突。省掉前面該有的步驟，人或事件的做法常帶失禮、意外。","connection":"副詞。いきなり怒鳴る、いきなり話しかける。","why":"氣溫沒有「該先做的步驟」可以跳過。這種天氣變化用急に，不用いきなり。","example":"いきなり肩を叩かれた。","zh":"冷不防被人拍了肩膀。"},{"text":"ますます","meaning":"越來越。原本已有的程度再加深。","connection":"副詞＋比較的變化。ますます寒くなる。","why":"ますます下がった沒有說出「本來就在降、現在更甚」的起點，句子是傍晚這一段忽然下降。","example":"夜になるほど、ますます冷える。","zh":"越到晚上越冷。"},{"text":"やっと","meaning":"總算。好結果的解脫。","connection":"副詞。やっと涼しくなった。","why":"氣溫下降如果是總算變涼，要有之前一直很熱、終於解脫的語感。這句只是傍晚忽然降，沒有那個過程。","example":"やっと暑さがおさまった。","zh":"熱總算退了。"}],"level":"N3"},{"id":"v43","kind":"vocab","point":"相変わらず","group":"v-adv","difficulty":4,"stem":"病気（びょうき）だと聞（き）いたのに、彼（かれ）は＿＿よく笑（わら）う。","gloss":"雖然聽說他生病了，他還是跟以前一樣常常笑。沒有改變。","answer":"相変わらず","options":[{"text":"相変わらず","meaning":"仍舊、跟以前一樣。強調經過時間或變故，狀態沒變。","connection":"副詞。相変わらず忙しい、相変わらず元気だ。","why":"生病了卻還是常常笑，是和過去相比沒有變。用相変わらず。","example":"十年ぶりだが、相変わらず明るい。","zh":"十年不見，還是一樣開朗。"},{"text":"やはり","meaning":"果然、還是。和說話人原本的預期一致。","connection":"副詞。やはり雨だ、やはり無理だ。","why":"やはりよく笑う會變成「果然他常常笑」，重點是預測命中。這句的「のに」是生病卻沒變，不是「我早就料到他會笑」。","example":"やはり彼は来なかった。","zh":"果然他沒來。"},{"text":"ますます","meaning":"越來越。","connection":"副詞。程度加深。","why":"越來越常笑和「跟病前一樣」不同。句子沒有說笑的程度在增加。","example":"薬を飲んでも、ますます咳が出る。","zh":"吃了藥，咳嗽反而更厲害。"},{"text":"たまたま","meaning":"碰巧。一次的偶然。","connection":"副詞。たまたま会った。","why":"碰巧常常笑不成立。よく笑う是習慣，不是一次碰巧。","example":"たまたま今日は笑っていた。","zh":"碰巧今天他在笑。那是一次。"}],"level":"N3"},{"id":"v44","kind":"vocab","point":"どうせ","group":"v-adv","difficulty":4,"stem":"＿＿間（ま）に合（あ）わないなら、もう走（はし）らなくていい。","gloss":"反正趕不上了的話，那就不用再跑了。認命、不抱期待。","answer":"どうせ","options":[{"text":"どうせ","meaning":"反正。說話人覺得結果已經註定，再努力也沒用。","connection":"副詞。どうせ〜なら。後ろに諦めが来ることが多い。","why":"趕不上被當成已經註定，所以停止奔跑。どうせ間に合わないなら。","example":"どうせ断られるなら、頼まない。","zh":"反正會被拒絕的話，就不求了。"},{"text":"まさか","meaning":"難道、怎麼可能。否定預料之外。","connection":"副詞。まさか〜ない、まさか〜とは。","why":"まさか間に合わないなら不表示認命。まさか要用在「想不到」。","example":"まさか間に合うとは思わなかった。","zh":"沒想到竟然趕得上。"},{"text":"ぜひ","meaning":"務必、請一定。請求或強烈希望。","connection":"副詞＋希望・依頼。ぜひ来てください。","why":"務必趕不上，和後面「不用跑」相反。","example":"ぜひ間に合わせてください。","zh":"請一定要趕上。"},{"text":"とりあえず","meaning":"總之先。臨時的第一步。","connection":"副詞。とりあえずやってみる。","why":"總之先趕不上，接不上。とりあえず是還要做點什麼，不是放棄。","example":"とりあえず走ってみよう。","zh":"總之先跑跑看。"}],"level":"N3"},{"id":"v45","kind":"vocab","point":"まさか","group":"v-adv","difficulty":4,"stem":"＿＿彼（かれ）が優勝（ゆうしょう）するとは思（おも）わなかった。","gloss":"萬萬沒想到他會得冠軍。","answer":"まさか","options":[{"text":"まさか","meaning":"萬萬沒想到。後面常是〜とは思わなかった、〜ないだろう。","connection":"副詞。まさか＋意外な事実＋とは。","why":"他得冠軍超出預料。まさか〜とは思わなかった是一組。","example":"まさか落ちるとは思わなかった。","zh":"没想到竟然會不及格。"},{"text":"どうせ","meaning":"反正。認命。","connection":"副詞。どうせ負ける。","why":"反正他會得冠軍，就不是驚訝。どうせ和「没想到」相反。","example":"どうせ彼が優勝する。","zh":"反正冠軍是他。那是認命，不是意外。"},{"text":"やはり","meaning":"果然。預期命中。","connection":"副詞。やはり優勝した。","why":"果然他會得冠軍，和「沒想到」相反。","example":"やはり彼が優勝した。","zh":"果然是他得了冠軍。"},{"text":"きっと","meaning":"一定。說話人有把握的預測。","connection":"副詞。きっと勝つ。","why":"一定會得冠軍，就不會說「沒想到」。","example":"きっと彼が優勝する。","zh":"他一定會得冠軍。"}],"level":"N3"},{"id":"v46","kind":"vocab","point":"だいぶ","group":"v-adv","difficulty":3,"stem":"薬（くすり）を飲（の）んだら、熱（ねつ）が＿＿下（さ）がった。","gloss":"吃了藥，燒退了不少。程度明顯，但不是完全退盡。","answer":"だいぶ","options":[{"text":"だいぶ","meaning":"相當程度。和之前比，變化明顯。","connection":"副詞＋變化。だいぶよくなった、だいぶ下がった。","why":"燒退了不少，是程度，不是「總算退了」的解脫，也不是「幾乎沒退」。だいぶ下がった。","example":"傷はだいぶよくなった。","zh":"傷好了不少。"},{"text":"ほとんど","meaning":"幾乎全部。","connection":"副詞。ほとんど下がった＝幾乎降光。","why":"ほとんど下がった會接近退盡。句子沒有「只剩一點點」或「幾乎退完」的意思，是明顯降了一截。","example":"熱はほとんどない。","zh":"幾乎沒有發燒了。那是接近零。"},{"text":"あまり","meaning":"不太。後面要否定。","connection":"副詞＋否定。あまり下がらない。","why":"あまり下がった少了否定。不太退要用あまり下がっていない。","example":"熱はあまり下がっていない。","zh":"燒不太退。"},{"text":"やっと","meaning":"總算。等待之後的解脫。","connection":"副詞。やっと下がった。","why":"やっと強調等了很久終於退，不是退了多少。這句吃了藥之後要說的是幅度。","example":"三日目で、やっと下がった。","zh":"第三天才總算退了。"}],"level":"N3"},{"id":"v50","kind":"vocab","point":"学生（読み）","group":"kanji","difficulty":1,"stem":"学生（＿＿）が教室（きょうしつ）で本（ほん）を読（よ）んでいます。","gloss":"學生在教室讀書。選這個漢字的讀音。","answer":"がくせい","options":[{"text":"がくせい","meaning":"學生。","connection":"學（がく）＋生（せい）。","why":"漢字是「學生」，讀がくせい。","example":"大学生（だいがくせい）。","zh":"大學生。"},{"text":"がくしょう","meaning":"把生讀成しょう。","connection":"生的音讀是せい。一生的しょう是另一個讀法。","why":"學生的生是せい，不是がくしょう。","example":"一生（いっしょう）。","zh":"一生。"},{"text":"がくせ","meaning":"少了一拍。","connection":"要讀到せい。","why":"がくせ少了最後的い。","example":"学生はがくせい。","zh":"四拍：が・く・せ・い。"},{"text":"がっこせい","meaning":"把學校的促音混進來。","connection":"學是がく，中間沒有小つ。","why":"不是がっこせい。促音在「學校」。","example":"学校（がっこう）。","zh":"學校才有促音。"}],"level":"N5"},{"id":"v51","kind":"vocab","point":"電車（読み）","group":"kanji","difficulty":1,"stem":"電車（＿＿）で会社（かいしゃ）へ行（い）きます。","gloss":"坐電車去公司。選讀音。","answer":"でんしゃ","options":[{"text":"でんしゃ","meaning":"電車。","connection":"電（でん）＋車（しゃ）。","why":"這個交通工具讀でんしゃ。","example":"電車を降りる。","zh":"下電車。"},{"text":"でんじゃ","meaning":"把車讀成濁音じゃ。","connection":"車的音讀是しゃ，清音。","why":"不是でんじゃ。","example":"車（しゃ）。","zh":"車。"},{"text":"てんしゃ","meaning":"把電讀成てん。","connection":"電是でん。てん是「點」。","why":"てんしゃ不是電車的讀音。","example":"点（てん）。","zh":"點是てん。"},{"text":"くるま","meaning":"車的訓讀。","connection":"單獨一個車才讀くるま。電車的車是音讀しゃ。","why":"電車不讀くるま。","example":"車（くるま）に乗る。","zh":"坐車。這是車一個字。"}],"level":"N5"},{"id":"v52","kind":"vocab","point":"友達（読み）","group":"kanji","difficulty":1,"stem":"友達（＿＿）と映画（えいが）を見（み）ました。","gloss":"和朋友看了電影。選讀音。","answer":"ともだち","options":[{"text":"ともだち","meaning":"朋友。","connection":"友（とも）＋達（だち），達要濁音。","why":"友達讀ともだち。","example":"友達が来た。","zh":"朋友來了。"},{"text":"ゆうだち","meaning":"把友的音讀ゆう混進來。","connection":"友人的友是ゆう。友達的友是とも。","why":"不是ゆうだち。","example":"友人（ゆうじん）。","zh":"友人是另一個詞。"},{"text":"ともたち","meaning":"達沒有變成濁音。","connection":"友達的達要讀だち。","why":"不說ともたち。","example":"友達はともだち。","zh":"要濁成だち。"},{"text":"ゆうじん","meaning":"這是「友人」的讀音。","connection":"漢字不同。友人是ゆうじん，友達是ともだち。","why":"空格的漢字是友達，不能填ゆうじん。","example":"友人（ゆうじん）。","zh":"友人。"}],"level":"N5"},{"id":"v53","kind":"vocab","point":"時間（読み）","group":"kanji","difficulty":2,"stem":"会議（かいぎ）の時間（＿＿）を確認（かくにん）してください。","gloss":"請確認會議的時間。不要讀成別的詞。","answer":"じかん","options":[{"text":"じかん","meaning":"時間。","connection":"時（じ）＋間（かん）。","why":"時刻或一段時間讀じかん。","example":"時間がない。","zh":"沒有時間。"},{"text":"じけん","meaning":"這是「事件」的讀音。","connection":"件是けん，不是間。","why":"時間若讀じけん，漢字就變成事件。","example":"事件（じけん）。","zh":"事件。"},{"text":"じげん","meaning":"接近「次元」的音。","connection":"間是かん，不是げん。","why":"時間不讀じげん。","example":"次元（じげん）。","zh":"次元。"},{"text":"ときかん","meaning":"把時的訓讀とき加進去。","connection":"時間的時是音讀じ。","why":"不是ときかん。單獨的時才讀とき。","example":"その時（とき）。","zh":"那個時候。"}],"level":"N5"},{"id":"v54","kind":"vocab","point":"会社（読み）","group":"kanji","difficulty":1,"stem":"父（ちち）は会社（＿＿）で働（はたら）いています。","gloss":"爸爸在公司工作。選讀音。","answer":"かいしゃ","options":[{"text":"かいしゃ","meaning":"公司。","connection":"會（かい）＋社（しゃ）。","why":"工作的公司讀かいしゃ。","example":"会社を休む。","zh":"向公司請假。"},{"text":"しゃかい","meaning":"社會。兩個字的次序反了。","connection":"社會是しゃかい。","why":"会社不讀しゃかい。","example":"社会（しゃかい）。","zh":"社會。"},{"text":"かいじゃ","meaning":"把社讀成濁音じゃ。","connection":"社是しゃ。","why":"不是かいじゃ。","example":"会社はかいしゃ。","zh":"社讀しゃ。"},{"text":"えしゃ","meaning":"把會的訓讀混進來。","connection":"会う讀あう。会社的會是かい。","why":"不是えしゃ。","example":"会（かい）。","zh":"會的音讀是かい。"}],"level":"N5"},{"id":"v55","kind":"vocab","point":"連絡（読み）","group":"kanji","difficulty":2,"stem":"遅（おく）れるときは、必ず連絡（＿＿）してください。","gloss":"要遲到時請一定聯絡。選讀音。","answer":"れんらく","options":[{"text":"れんらく","meaning":"聯絡。","connection":"連（れん）＋絡（らく）。","why":"通知對方是連絡，讀れんらく。","example":"電話で連絡する。","zh":"用電話聯絡。"},{"text":"れんぞく","meaning":"這是「連續」的讀音。","connection":"續是ぞく，不是絡。","why":"連絡讀成れんぞく就變成另一個詞。","example":"連続（れんぞく）。","zh":"連續。"},{"text":"れんどう","meaning":"接近「連動」的音。","connection":"絡是らく，不是どう。","why":"不是れんどう。","example":"連絡はれんらく。","zh":"絡讀らく。"},{"text":"れんら","meaning":"少了最後一拍。","connection":"要讀到らく。","why":"れんら不夠。","example":"連絡（れんらく）。","zh":"四拍。"}],"level":"N4"},{"id":"v56","kind":"vocab","point":"都合（読み）","group":"kanji","difficulty":3,"stem":"明日（あした）は都合（＿＿）が悪（わる）いので、別の日（ひ）にします。","gloss":"明天不方便，所以改另一天。選讀音。","answer":"つごう","options":[{"text":"つごう","meaning":"方便不方便、情況。","connection":"都（つ）＋合（ごう）。","why":"都合が悪い是不方便，讀つごう。","example":"都合のいい時間。","zh":"方便的時間。"},{"text":"とごう","meaning":"把都讀成と。","connection":"這個詞的都是つ。","why":"不是とごう。","example":"都合はつごう。","zh":"都讀つ。"},{"text":"つあい","meaning":"把合的訓讀混進來。","connection":"合う讀あう。都合的合是ごう。","why":"不是つあい。","example":"都合（つごう）。","zh":"合讀ごう。"},{"text":"つごうう","meaning":"多了一拍長音。","connection":"ごう不要再延長。","why":"つごう後面沒有再加一拍。","example":"都合はつごう。","zh":"三拍。"}],"level":"N4"},{"id":"v57","kind":"vocab","point":"必要（読み）","group":"kanji","difficulty":2,"stem":"申し込み（もうしこみ）には写真（しゃしん）が必要（＿＿）です。","gloss":"申請需要照片。選讀音。","answer":"ひつよう","options":[{"text":"ひつよう","meaning":"需要、必要。","connection":"必（ひつ）＋要（よう）。","why":"不可缺少的東西讀ひつよう。","example":"必要書類。","zh":"必要文件。"},{"text":"ひつう","meaning":"少了よう。","connection":"要讀よう。","why":"不是ひつう。","example":"必要はひつよう。","zh":"四拍。"},{"text":"びつよう","meaning":"把必讀成濁音。","connection":"必是ひつ，清音。","why":"不是びつよう。必ず的必讀法也不同。","example":"必ず（かならず）。","zh":"必要的必是ひつ。"},{"text":"ひつよ","meaning":"よう少了う。","connection":"要讀完整的よう。","why":"不是ひつよ。","example":"重要（じゅうよう）。","zh":"要讀よう。"}],"level":"N4"},{"id":"v58","kind":"vocab","point":"提案（読み）","group":"kanji","difficulty":3,"stem":"会議（かいぎ）で新しい案（あん）を提案（＿＿）した。","gloss":"在會議上提出了新方案。選讀音。","answer":"ていあん","options":[{"text":"ていあん","meaning":"提案。提出方案。","connection":"提（てい）＋案（あん）。","why":"把方案提出來讀ていあん。","example":"提案に賛成する。","zh":"贊成提案。"},{"text":"ていがん","meaning":"把案讀成がん。","connection":"案是あん。がん是「願」。","why":"不是ていがん。","example":"願い（ねがい）。","zh":"願的音是がん，但這個字是案。"},{"text":"だいあん","meaning":"把提讀成だい。","connection":"提是てい。だい是「題」。","why":"不是だいあん。","example":"題（だい）。","zh":"題讀だい。"},{"text":"ていあんん","meaning":"ん多了一拍。","connection":"あん後面不再加拍。","why":"ていあん是四拍。","example":"提案（ていあん）。","zh":"て・い・あ・ん。"}],"level":"N3"},{"id":"v59","kind":"vocab","point":"状況（読み）","group":"kanji","difficulty":3,"stem":"現場（げんば）の状況（＿＿）を報告（ほうこく）した。","gloss":"報告了現場的情況。選讀音。","answer":"じょうきょう","options":[{"text":"じょうきょう","meaning":"狀況。","connection":"状（じょう）＋況（きょう）。","why":"その時の様子は状況（じょうきょう）。","example":"状況が変わる。","zh":"情況改變。"},{"text":"じょうけい","meaning":"情景の読みに近い。","connection":"況はきょう。景（けい）ではない。","why":"じょうけいではない。","example":"情景（じょうけい）。","zh":"情景是另一個詞。"},{"text":"ばいきょう","meaning":"場の音を混ぜた形。","connection":"状はじょう。","why":"ばいきょうではない。","example":"状況はじょうきょう。","zh":"じょう。"},{"text":"じょうごう","meaning":"況をごうと読んだ形。","connection":"況はきょう。","why":"じょうごうではない。","example":"状況（じょうきょう）。","zh":"きょう。"}],"level":"N3"},{"id":"v60","kind":"vocab","point":"責任（読み）","group":"kanji","difficulty":3,"stem":"この失敗（しっぱい）の責任（＿＿）は私（わたし）にあります。","gloss":"這次失敗的責任在我。選讀音。","answer":"せきにん","options":[{"text":"せきにん","meaning":"責任。","connection":"責（せき）＋任（にん）。","why":"引き受けて負うものは責任（せきにん）。","example":"責任を取る。","zh":"負起責任。"},{"text":"せきじん","meaning":"任をじんと読んだ形。","connection":"任はにん。人（じん）ではない。","why":"せきじんではない。","example":"人（じん）。","zh":"人的音讀常是じん，任是にん。"},{"text":"せめにん","meaning":"責の訓読みを混ぜた形。","connection":"責める（せめる）。責任の責はせき。","why":"せめにんではない。","example":"責（せき）。","zh":"音讀せき。"},{"text":"せきめい","meaning":"任をめいと読んだ形。","connection":"命（めい）。任ではない。","why":"せきめいではない。","example":"責任はせきにん。","zh":"にん。"}],"level":"N3"},{"id":"v61","kind":"vocab","point":"判断（読み）","group":"kanji","difficulty":3,"stem":"急（いそ）いで判断（＿＿）しないでください。","gloss":"請不要急着判斷。選讀音。","answer":"はんだん","options":[{"text":"はんだん","meaning":"判斷。","connection":"判（はん）＋断（だん）。","why":"決めること・見極めることは判断（はんだん）。","example":"判断を誤る。","zh":"判斷錯誤。"},{"text":"はんたん","meaning":"断の濁点を落とした形。","connection":"断はだん。たんではない。","why":"はんたんではない。","example":"判断ははんだん。","zh":"だん。"},{"text":"ばんだん","meaning":"判を濁った形。","connection":"判ははん。清音。","why":"ばんだんではない。","example":"判（はん）。","zh":"はん。"},{"text":"はんばん","meaning":"断をばんと読んだ形。","connection":"番（ばん）。断はだん。","why":"はんばんではない。","example":"番号（ばんごう）。","zh":"番讀ばん。"}],"level":"N3"},{"id":"v62","kind":"vocab","point":"節約（読み）","group":"kanji","difficulty":4,"stem":"電気（でんき）を節約（＿＿）するために、明かりを消（け）した。","gloss":"為了省電，把燈關了。不要讀成「制約」。","answer":"せつやく","options":[{"text":"せつやく","meaning":"節約。省著用。","connection":"節（せつ）＋約（やく）。","why":"むだを減らすのは節約（せつやく）。","example":"水を節約する。","zh":"節約用水。"},{"text":"せいやく","meaning":"制約の読み。","connection":"制（せい）＋約（やく）。節ではない。","why":"節約をせいやくと読むと「制約」になる。意味も漢字も違う。","example":"制約（せいやく）がある。","zh":"有制約。"},{"text":"しょうやく","meaning":"節をしょうと読んだ形。","connection":"この語の節はせつ。","why":"しょうやくではない。","example":"節約はせつやく。","zh":"せつ。"},{"text":"せつえき","meaning":"約をえきと読んだ形。","connection":"約はやく。益（えき）ではない。","why":"せつえきではない。","example":"利益（りえき）。","zh":"益讀えき。"}],"level":"N3"},{"id":"v63","kind":"vocab","point":"応援（読み）","group":"kanji","difficulty":3,"stem":"試合（しあい）で友達（ともだち）を応援（＿＿）した。","gloss":"在比賽中為朋友打氣。選讀音。","answer":"おうえん","options":[{"text":"おうえん","meaning":"応援。打氣、支援。","connection":"応（おう）＋援（えん）。","why":"味方を励ますのは応援（おうえん）。","example":"家族が応援に来た。","zh":"家人來打氣。"},{"text":"おうえい","meaning":"援をえいと読んだ形。","connection":"援はえん。","why":"おうえいではない。","example":"応援はおうえん。","zh":"えん。"},{"text":"おうたい","meaning":"応対の読み。","connection":"対（たい）。援ではない。","why":"おうえんをおうたいとは読まない。","example":"応対（おうたい）。","zh":"應接、接待。"},{"text":"こたえん","meaning":"応の訓読みを混ぜた形。","connection":"応える（こたえる）。応援の応はおう。","why":"こたえんではない。","example":"期待に応（こた）える。","zh":"回應期待時，應才讀こた。"}],"level":"N3"},{"id":"v64","kind":"vocab","point":"確認（漢字）","group":"kanji","difficulty":2,"stem":"出発前（しゅっぱつまえ）に、切符（きっぷ）の時間（じかん）を＿＿（かくにん）してください。","gloss":"出發前請確認車票時間。括號裡是讀音，選漢字。","answer":"確認","options":[{"text":"確認","meaning":"核對清楚。","connection":"かくにん。確（かく）＋認（にん）。","why":"時間を調べるのは確認。讀音もちょうどかくにん。","example":"予約を確認する。","zh":"確認預約。"},{"text":"確信","meaning":"深深相信。","connection":"かくしん。信はしん。","why":"かくにんではない。確信は「間違いないと思う」こと。","example":"勝利を確信する。","zh":"確信會贏。"},{"text":"各人","meaning":"每個人。","conne
