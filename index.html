<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日檢 N3 題庫</title>
<meta name="description" content="JLPT N3 文法同語彙練習。答完先睇每個選項點解啱、點解唔啱。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f3eee6;
  --card: #faf7f2;
  --ink: #1e1a16;
  --muted: #6b6158;
  --line: #e4d9cc;
  --seal: #b8432f;
  --seal-soft: #f8ebe6;
  --moss: #2f6b52;
  --moss-soft: #e5f2eb;
  --night: #243044;
  --radius: 1.1rem;
}
* { box-sizing: border-box; }
html { -webkit-font-smoothing: antialiased; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Noto Sans TC", "PingFang TC", "Noto Sans CJK TC", sans-serif;
  line-height: 1.55;
}
button { font: inherit; }
button:not(:disabled) { cursor: pointer; }
.wrap { max-width: 46rem; margin: 0 auto; padding: 2rem 1rem 3rem; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
.kicker { margin: 0; color: var(--seal); font-size: 0.9rem; font-weight: 500; letter-spacing: 0.04em; }
h1 { margin: 0; font-family: "Shippori Mincho", serif; font-size: 2.4rem; font-weight: 600; }
h2 { margin: 0 0 0.6rem; }
.serif { font-family: "Shippori Mincho", serif; font-size: 1.6rem; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1.1rem 1.15rem;
}
.lead { margin: 0; max-width: 38rem; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-top: 1rem; }
.primary, .ghost {
  min-height: 3rem;
  border-radius: 999px;
  padding: 0.55rem 1.15rem;
}
.primary { border: 0; background: var(--night); color: var(--paper); font-weight: 500; }
.primary:disabled { opacity: 0.4; }
.ghost { border: 1px solid var(--line); background: var(--card); color: var(--muted); }
.wide { width: 100%; margin-top: 0.8rem; }
.muted { color: var(--muted); }
.grid { display: grid; gap: 0.75rem; margin: 0.9rem 0; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
.stat { padding: 0.8rem 1rem; }
.num { margin: 0.15rem 0; font-family: "Shippori Mincho", serif; font-size: 1.8rem; }
.levels { margin: 0 0 1.2rem; color: var(--muted); font-size: 0.92rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.45rem; list-style: none; margin: 0.7rem 0 0; padding: 0; }
.chip { border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.88rem; }
.chip.paper { background: var(--paper); color: var(--muted); }
.chip.seal { background: var(--seal-soft); color: var(--seal); }
.chip.moss { background: var(--moss-soft); color: var(--moss); }
.fold { margin-bottom: 0.5rem; }
summary { display: flex; justify-content: space-between; gap: 0.8rem; min-height: 2.6rem; align-items: center; cursor: pointer; font-weight: 500; }
summary::-webkit-details-marker { display: none; }
.meta { display: flex; justify-content: space-between; gap: 0.6rem; color: var(--muted); font-size: 0.9rem; }
.bar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 0.45rem 0 0.8rem; }
.fill { height: 100%; background: var(--seal); }
.stem { font-family: "Shippori Mincho", serif; font-size: 1.55rem; line-height: 1.7; font-weight: 600; }
ruby rt { font-family: "Noto Sans TC", sans-serif; font-size: 0.42em; color: var(--muted); }
.opt {
  display: flex; align-items: center; gap: 0.75rem;
  width: 100%; text-align: left; min-height: 3.4rem;
  margin: 0.45rem 0; padding: 0.7rem 0.9rem;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--card); color: var(--ink); font-size: 1.05rem;
}
.letter { width: 1.4rem; color: var(--muted); font-weight: 500; }
.opt.pick { border-color: var(--night); }
.opt.good, .card.good { border-color: var(--moss); background: var(--moss-soft); }
.opt.bad { border-color: var(--seal); background: var(--seal-soft); }
.ok { color: var(--moss); font-weight: 600; }
.no { color: var(--seal); font-weight: 600; }
.ex-head { display: flex; gap: 0.6rem; align-items: baseline; margin-bottom: 0.4rem; }
.ex-head strong { font-family: "Shippori Mincho", serif; font-size: 1.2rem; }
.dl { display: flex; gap: 0.7rem; margin: 0.35rem 0; font-size: 0.92rem; }
.term { width: 4.2rem; flex: none; color: var(--muted); }
.score { margin: 0.2rem 0; font-family: "Shippori Mincho", serif; font-size: 3rem; }
.score span { font-size: 1.3rem; color: var(--muted); }
.miss { margin: 0.4rem 0; }
main { display: grid; gap: 0.75rem; }
@media (max-width: 640px) {
  h1 { font-size: 2rem; }
  .stem { font-size: 1.3rem; }
}

</style>
</head>

<script id="bank" type="application/json">[{"id":"g01","kind":"grammar","point":"のに","group":"contrast","difficulty":2,"stem":"彼（かれ）は約束（やくそく）の時間（じかん）に遅（おく）れた＿＿、謝（あやま）らなかった。","gloss":"他明明遲到了，卻沒有道歉。","answer":"のに","options":[{"text":"のに","meaning":"明明……卻……，帶說話人意外或不滿。","connection":"普通形＋のに。な形容詞・名詞要加「な」：静かなのに、学生なのに。い形容詞・動詞直接接普通形。","why":"前句「遲到」和後句「不道歉」相反，而且說話人覺得不合理。逆接＋不滿，用のに。","example":"知っているのに、教えてくれない。","zh":"明明知道，卻不告訴我。"},{"text":"ので","meaning":"因為，客觀原因，語氣較柔。","connection":"普通形＋ので。な形容詞・名詞＋な＋ので。後面多是自然的結果，不是逆接。","why":"「不道歉」不是「遲到」造成的結果。ので要接原因→結果，這裡前後是相反的，接不上。","example":"雨が降っているので、試合は中止だ。","zh":"因為下雨，比賽取消。"},{"text":"おかげで","meaning":"多虧……，原因帶來好結果，含感謝。","connection":"普通形＋おかげで。名詞＋の＋おかげで。結果必須是正面的。","why":"後句「沒道歉」不是好事，也不能說成多虧遲到。感謝語感完全不合。","example":"先生のおかげで、合格できた。","zh":"多虧老師，才能合格。"},{"text":"せいで","meaning":"都怪……，原因帶來不好的結果，含責備。","connection":"普通形＋せいで。名詞＋の＋せいで。後句是負面結果，而且是前句造成的。","why":"せいで要求後句是前句引起的壞結果。這裡「不道歉」不是「遲到」引起的，只是另一件相反的事。","example":"寝坊したせいで、電車に乗り遅れた。","zh":"都怪睡過頭，沒趕上電車。"}],"level":"N3"},{"id":"g02","kind":"grammar","point":"わりに","group":"contrast","difficulty":3,"stem":"値段（ねだん）の＿＿、量（りょう）が少（すく）ない。","gloss":"以價錢來說，份量很少。","answer":"わりに","options":[{"text":"わりに","meaning":"以某標準來說，實際不成比例。","connection":"名詞＋の＋わりに。空格前已經有「の」，所以直接接わりに。","why":"價錢是標準，份量少是跟這個標準不成比例。値段のわりに。不是單純抱怨的逆接。","example":"年齢のわりに、若く見える。","zh":"以年齡來說，看起來年輕。"},{"text":"のに","meaning":"明明……卻……。","connection":"名詞要接「な＋のに」，不能接在「の」後面。","why":"値段ののに少了「な」，也多了不該有的「の」。名詞逆接是「値段なのに」，而且這句是比例，不是「明明是價錢卻」。","example":"高いのに、量は少ない。","zh":"明明很貴，份量卻少。這句才用のに，前面是形容詞。"},{"text":"おかげで","meaning":"多虧，好的因果。","connection":"名詞＋の＋おかげで。文法上「の」可以接，但結果必須是正面、值得感謝的。","why":"份量少不是多虧價錢的好結果。感謝語氣和事實都相反。","example":"割引のおかげで、安く買えた。","zh":"多虧打折，買得便宜。"},{"text":"うちに","meaning":"趁着某狀態還在。","connection":"名詞＋の＋うちに。後句應是趁那時做的動作。","why":"份量少不是「趁價錢的時候」做的一件事。うちに不表示比例。","example":"休みのうちに、読み終える。","zh":"趁休假讀完。"}],"level":"N3"},{"id":"g03","kind":"grammar","point":"にもかかわらず","group":"contrast","difficulty":4,"stem":"大雨（おおあめ）だった＿＿、試合（しあい）は予定（よてい）どおり行われた。","gloss":"儘管下大雨，比賽仍照計劃舉行。","answer":"にもかかわらず","options":[{"text":"にもかかわらず","meaning":"儘管……仍然……。書面、正式，強調事實不受前句影響。","connection":"普通形＋にもかかわらず。名詞可直接接，或用名詞＋である＋にもかかわらず。不用「な」。","why":"「大雨」與「照常比賽」正式對立，而且是客觀陳述，不是口語抱怨。にもかかわらず適合公告、新聞語氣。","example":"努力したにもかかわらず、結果は出なかった。","zh":"儘管努力了，還是沒有成果。"},{"text":"わりに","meaning":"跟預期相比有落差。","connection":"普通形／名詞＋の＋わりに。不能接在「だった」這種已完結判斷後面再當正式讓步。","why":"「大雨だったわりに」語感像「以大雨來說（意外地）」，較口語，也不如にもかかわらず能撐起「照預定舉行」這種正式事實。","example":"勉強しなかったわりに、点は悪くない。","zh":"以沒讀書來說，分數還不差。"},{"text":"せいで","meaning":"都怪，負面因果。","connection":"普通形＋せいで。後句應是前句造成的壞結果。","why":"比賽照常舉行不是大雨造成的壞結果。因果方向反了。","example":"停電のせいで、データが消えた。","zh":"都怪停電，資料沒了。"},{"text":"ように","meaning":"為了使某狀態實現；變得……。","connection":"目的時接無意志・可能・否定。後句才是主動作。不能拿來表讓步。","why":"這裡沒有「為了下大雨」或「變得下大雨」的意思。ように不表逆接。","example":"遅れないように、早く出た。","zh":"為了不遲到，很早出門。"}],"level":"N3"},{"id":"g04","kind":"grammar","point":"にしては","group":"contrast","difficulty":4,"stem":"彼（かれ）は高校生（こうこうせい）＿＿、政治（せいじ）の議論（ぎろん）がうまい。","gloss":"以高中生來說，他卻很會談政治。","answer":"にしては","options":[{"text":"にしては","meaning":"以該身份、年齡、經驗為標準，結果出乎預期。","connection":"名詞直接＋にしては。動詞普通形也可以接。標準與結果要有落差。","why":"「高校生」是身份標準，一般不預期很會談政治，實際卻很會。名詞直接接にしては，接續和語意都對。","example":"初心者にしては、発音がきれいだ。","zh":"以初學者來說，發音很乾淨。"},{"text":"わりに","meaning":"跟預期相比有落差。","connection":"名詞必須是「名詞＋の＋わりに」。不能名詞直接＋わりに。","why":"空格前是名詞「高校生」。要說「以高中生來說」得用「高校生のわりに」。少了「の」，高校生わりに不成立。","example":"年齢のわりに、体力がある。","zh":"以年齡來說，體力很好。"},{"text":"のに","meaning":"明明卻，帶不滿或意外。","connection":"名詞要「名詞＋な＋のに」。い形容詞・動詞才直接＋のに。","why":"高校生のに少了「な」。名詞逆接必須是「高校生なのに」。接續不完整，不能選。","example":"学生なのに、講義に出ない。","zh":"明明是學生，卻不上課。"},{"text":"として","meaning":"作為某種身份、資格。","connection":"名詞＋として。後面多是該身份應做的事或所處的角色，不是「出乎這身份的預期」。","why":"「作為高中生，政治討論很厲害」接的是角色，不是「以高中生的標準卻意外地厲害」。語意類型不同。","example":"代表として、会議に出た。","zh":"作為代表出席了會議。"}],"level":"N3"},{"id":"g05","kind":"grammar","point":"反面","group":"contrast","difficulty":4,"stem":"都会（とかい）の生活（せいかつ）は便利（べんり）な＿＿、忙（いそが）しくて休（やす）めない。","gloss":"都市生活很方便，另一面卻忙得無法休息。","answer":"反面","options":[{"text":"反面","meaning":"同一事物的正反兩面同時成立。","connection":"普通形＋反面。な形容詞多用「な反面」或「である反面」。兩面都是對同一主題的評價。","why":"便利和忙到不能休息，都是在說都市生活的兩面。不是單純轉折，而是一體兩面，用反面。","example":"この仕事は給料がいい反面、残業が多い。","zh":"這工作薪水好，另一方面加班多。"},{"text":"おかげで","meaning":"多虧，好的因果。","connection":"な形容詞＋な＋おかげで文法上可接，但後句必須是正面結果。","why":"「不能休息」不是「便利」帶來的好事。感謝因果不成立。","example":"薬のおかげで、熱が下がった。","zh":"多虧藥，退燒了。"},{"text":"ために","meaning":"因為；為了。","connection":"な形容詞表原因要用「なために」。後句應是結果或目的。","why":"不能休息不是便利的目的，也不宜說成單純因為便利所以不能休息。題目要的是兩面對照。","example":"健康のために、歩く。","zh":"為了健康而走路。"},{"text":"うちに","meaning":"趁著。","connection":"な形容詞＋な＋うちに。後句是在該狀態期間做的動作。","why":"後句「忙得不能休息」不是趁方便時做的一件事，而是另一個同時存在的性質。","example":"静かなうちに、本を読もう。","zh":"趁安靜時看書吧。"}],"level":"N3"},{"id":"g06","kind":"grammar","point":"一方で","group":"contrast","difficulty":3,"stem":"兄（あに）は外（そと）で働（はたら）いている。＿＿、弟（おとうと）は家（いえ）で勉強（べんきょう）している。","gloss":"哥哥在外面工作。另一方面，弟弟在家讀書。","answer":"一方で","options":[{"text":"一方で","meaning":"另一方面。並列兩個對照的情況，語氣中性。","connection":"句子開頭用「一方で」，或前句普通形＋一方（で）。不要求同一主語。","why":"哥哥在外工作、弟弟在家讀書，是兩件並列對照，沒有因果也沒有不滿。一方で用來換一個方面。","example":"夏は暑い。一方で、冬はとても寒い。","zh":"夏天熱。另一方面，冬天很冷。"},{"text":"そのせいで","meaning":"因此（負面）、都怪那個。","connection":"「その」指前句，せいで後面是壞結果。","why":"弟弟讀書不是哥哥工作造成的壞結果。兩句沒有因果。","example":"夜更かしした。そのせいで、今日は眠い。","zh":"熬夜了。所以今天很想睡。"},{"text":"そのために","meaning":"因此。正式的因果。","connection":"接在前句之後，後句是結果。","why":"弟弟讀書並不是因為哥哥工作。不是原因結果。","example":"予算が足りない。そのために、計画を変えた。","zh":"預算不足。因此改變了計劃。"},{"text":"それなのに","meaning":"儘管如此卻……，帶意外。","connection":"前文整句＋それなのに＋意外的後句。前後應是同一件事的逆接。","why":"弟弟在家讀書並不違反「哥哥在工作」，也沒有「明明却」的不滿。只是並列，不是逆接。","example":"何度も注意した。それなのに、また遅れた。","zh":"提醒過很多次。儘管如此又遲到了。"}],"level":"N3"},{"id":"g07","kind":"grammar","point":"一方だ","group":"contrast","difficulty":4,"stem":"工事（こうじ）の音（おと）は夜（よる）になるほど大きくなる＿＿。","gloss":"工程的聲音越到晚上越大，情況只往一個方向走。","answer":"一方だ","options":[{"text":"一方だ","meaning":"一直朝單一方向變化。","connection":"動詞辞書形＋一方だ。後面接變化的趨勢，不能再接命令或意志。","why":"「夜になるほど大きくなる」是持續往 louder 走。句尾用一方だ，表示只會越來越響、沒有轉回來。","example":"失業者は増える一方だ。","zh":"失業的人一個勁兒增加。"},{"text":"ところだ","meaning":"正要、正在或剛剛，看動詞形。","connection":"辞書形＋ところだ只表示「正要做」，是一個時間點，不是長期單向變化。","why":"「大きくなるところだ」＝正要變大（一下子）。不能表達「越到晚上越響、一路變大」。","example":"食事を始めるところだ。","zh":"正要開始吃飯。"},{"text":"ことになっている","meaning":"規定、事先決定好的安排。","connection":"動詞普通形＋ことになっている。主語多是規則、行程，不是自然趨勢。","why":"施工噪音變大不是規章規定「必須變大」。ことになっている不描述越發嚴重的變化。","example":"この部屋は食事禁止ということになっている。","zh":"規定這個房間不能吃東西。"},{"text":"はずがない","meaning":"按理不可能。","connection":"普通形＋はずがない。後面把前句否定掉。","why":"話說噪音會變大，卻用「不可能」收尾，和「なるほど大きくなる」的事實相反。極性錯了。","example":"彼が嘘をつくはずがない。","zh":"他不可能說謊。"}],"level":"N3"},{"id":"g08","kind":"grammar","point":"ながら","group":"contrast","difficulty":3,"stem":"その製品（せいひん）は小型（こがた）＿＿、性能（せいのう）はプロ用（よう）だ。","gloss":"那個產品雖然小型，性能卻是專業級。","answer":"ながら","options":[{"text":"ながら","meaning":"雖然……卻……。也可表示一邊做一邊做，但名詞後多是逆接。","connection":"名詞或形容詞語幹直接＋ながら（も）。動詞「一邊」才用ます語幹＋ながら。","why":"「小型」是名詞，直接接ながら表示逆接：雖然小，性能卻是專業級。不是「一邊小型」。","example":"未成年ながら、店を任されている。","zh":"雖然未成年，卻被託付店舖。"},{"text":"わりに","meaning":"跟預期相比。","connection":"名詞＋の＋わりに。名詞不能直接接わりに。","why":"小型わりに少了「の」。正確應是「小型のわりに」。接續不成立。","example":"見た目のわりに、軽い。","zh":"以外表來說，很輕。"},{"text":"のに","meaning":"明明卻。","connection":"名詞＋な＋のに。不能名詞直接＋のに。","why":"小型のに少了「な」。名詞要用「小型なのに」才是逆接。","example":"静かなのに、眠れない。","zh":"明明很安靜，卻睡不著。"},{"text":"まま","meaning":"保持原狀不做改變。","connection":"名詞＋の＋まま。後面多是「就那樣做了別的動作」。","why":"小型のまま才接得上，而且意思是「保持小型的狀態」，不是轉折到「性能卻很專業」。小型まま也少了の。","example":"昔のままの町並みだ。","zh":"仍是從前那樣的街道。"}],"level":"N3"},{"id":"g09","kind":"grammar","point":"おかげで","group":"cause","difficulty":2,"stem":"毎日練習（れんしゅう）した＿＿、発音（はつおん）がよくなった。","gloss":"因為每天練習，發音變好了。","answer":"おかげで","options":[{"text":"おかげで","meaning":"多虧、幸虧。原因帶來說話人認為好的結果。","connection":"動詞・い形容詞普通形＋おかげで。な形容詞＋な／名詞＋の＋おかげで。","why":"練習是原因，發音變好是正面結果，而且有感謝自己努力的語氣。用おかげで。","example":"友達が手伝ってくれたおかげで、終わった。","zh":"多虧朋友幫忙，做完了。"},{"text":"せいで","meaning":"都怪。原因帶來不好的結果。","connection":"普通形＋せいで。名詞＋の＋せいで。後句要是負面。","why":"發音變好是好事。せいで會把結果說成受害，語氣相反。","example":"騒音のせいで、眠れなかった。","zh":"都怪噪音，沒睡成。"},{"text":"わりに","meaning":"跟預期相比有落差。","connection":"普通形＋わりに。不是因果。","why":"後句是練習的結果，不是「以每天練習來說卻……」的對比。","example":"よく食べるわりに、太らない。","zh":"吃得不少，卻不胖。"},{"text":"うちに","meaning":"趁著某狀態。","connection":"普通形＋うちに。後句是在那段時間內做的動作。","why":"「發音變好」不是趁練習時順便做的另一件事，而是練習造成的變化。","example":"覚えているうちに、メモする。","zh":"趁還記得時記下來。"}],"level":"N3"},{"id":"g10","kind":"grammar","point":"せいで","group":"cause","difficulty":2,"stem":"隣（となり）の部屋（へや）がうるさかった＿＿、全然（ぜんぜん）眠れなかった。","gloss":"都怪隔壁很吵，完全沒睡着。","answer":"せいで","options":[{"text":"せいで","meaning":"都怪、因為（壞結果），含責備或不滿。","connection":"普通形＋せいで。い形容詞可直接接：うるさかったせいで。","why":"吵是原因，沒睡着是明確的壞結果，說話人在怪隔壁。せいで對。","example":"財布を忘れたせいで、昼ごはんが食べられなかった。","zh":"都怪忘了錢包，午飯沒吃成。"},{"text":"おかげで","meaning":"多虧，好結果。","connection":"普通形＋おかげで。","why":"完全沒睡不是值得感謝的好結果。おかげで的極性反了。","example":"天気のおかげで、花見ができた。","zh":"多虧天氣好，賞了花。"},{"text":"ように","meaning":"為了達成某狀態；變得。","connection":"目的用法接無意志、可能或否定，後句才是為該目的做的行動。","why":"不是「為了隔壁吵」或「變得吵」而沒睡。因果方向和接續位置都不對。","example":"通るように、道を広げた。","zh":"為了能通過，加寬了路。"},{"text":"のに","meaning":"明明卻。逆接，不是原因。","connection":"普通形＋のに。後句應和前句相反。","why":"沒睡着是吵的結果，不是和吵相反的事。用のに會變成「明明很吵卻完全沒睡」，邏輯不成立。","example":"疲れていたのに、眠れなかった。","zh":"明明很累，卻睡不着。那句才是逆接。"}],"level":"N3"},{"id":"g11","kind":"grammar","point":"せいか","group":"cause","difficulty":4,"stem":"年（とし）の＿＿、近（ちか）ごろ物忘（ものわす）れがひどい。","gloss":"也許是因為年紀，最近健忘得厲害。","answer":"せいか","options":[{"text":"せいか","meaning":"也許是因為……。原因只是說話人的推測，沒有十足把握。","connection":"普通形＋せいか。名詞＋の＋せいか。句尾常是現在的狀態，語氣不確定。","why":"空格前是名詞「年」，要用「年のせいか」。說話人不敢肯定健忘就是年齡造成的，所以用推測的せいか，而不是斷定的せいで。","example":"熱があるせいか、体がだるい。","zh":"也許是因為發燒，身子發沉。"},{"text":"せいで","meaning":"都怪，斷定的負面原因。","connection":"名詞＋の＋せいで。原因當事實說。","why":"年のせいで文法可成立，但會斷定「就是因為年紀」。題目的「近ごろ」搭配不確定的自評，せいか才留有「也許」。若選せいで，語氣過死。","example":"準備不足のせいで、失敗した。","zh":"都怪準備不足，失敗了。"},{"text":"おかげか","meaning":"也許是多虧。好的、感謝的推測。","connection":"名詞＋の＋おかげか。結果應偏正面。","why":"健忘厲害不是好事。不能用感謝系列的おかげ。","example":"運動のおかげか、よく眠れる。","zh":"也許是多虧運動，睡得很好。"},{"text":"ために","meaning":"因為；為了。原因用法語氣較正式、較斷定。","connection":"名詞＋の＋ために。","why":"「年のために物忘れがひどい」很不自然。年齡原因的口語推測不用ために，而且為了／因為兩讀都會怪。","example":"事故のために、道が込んでいる。","zh":"因為事故，路很堵。"}],"level":"N3"},{"id":"g12","kind":"grammar","point":"だけに","group":"cause","difficulty":5,"stem":"予選（よせん）を勝ち抜（ぬ）いただけ＿＿、決勝（けっしょう）への期待（きたい）が大きい。","gloss":"正因为一路贏過預賽，對決賽的期待更大。","answer":"だけに","options":[{"text":"だけに","meaning":"恰恰因為……所以更……。結果符合從原因推出的份量，常是程度加深。","connection":"普通形＋だけに。名詞＋だけに也可以。","why":"贏過預賽這件事，理所當然讓決賽期待變大。結果和原因的份量一致，用だけに。","example":"ベテランだけに、仕事が速い。","zh":"正因为是老手，工作才快。"},{"text":"ばかりに","meaning":"就因為……才（落得壞結果）。後悔。","connection":"普通形＋ばかりに。後句幾乎都是負面、說話人後悔的結果。","why":"期待大不是壞事，也不是後悔。ばかりに的「不幸結果」對不上。","example":"正直に言ったばかりに、嫌われた。","zh":"就因為說了實話，才被討厭。"},{"text":"わりに","meaning":"跟預期相反或不成比例。","connection":"普通形＋わりに。","why":"期待大是贏過預賽後的合理結果，不是和預期相反。","example":"安いわりに、おいしい。","zh":"便宜，卻很好吃。"},{"text":"ものの","meaning":"雖然……但是……。書面逆接。","connection":"普通形＋ものの。後句多是不充分、保留。","why":"後句不是轉折，而是原因所強化的期待。ものの接不上。","example":"招待されたものの、行く時間がない。","zh":"雖然被邀請了，卻沒有時間去。"}],"level":"N3"},{"id":"g13","kind":"grammar","point":"ばかりに","group":"cause","difficulty":5,"stem":"パスワードを簡単（かんたん）にした＿＿、アカウントが盗（ぬす）まれた。","gloss":"就因為把密碼設得太簡單，帳戶才被盜。","answer":"ばかりに","options":[{"text":"ばかりに","meaning":"就因為做了那件事，才落得不好的下場。含後悔。","connection":"動詞普通形（多是た形）＋ばかりに。後句是負面結果。","why":"把密碼設簡單是前因，被盜是後悔的壞結果。這正是ばかりに，不是客觀說明。","example":"一言言ったばかりに、喧嘩になった。","zh":"就因為多說一句，才吵起來。"},{"text":"だけに","meaning":"恰恰因為，結果與原因的份量相符，可以是正面。","connection":"普通形＋だけに。","why":"だけに不強調「都怪自己多此一舉」。被盜雖是壞結果，但後悔「就不該把密碼設那麼簡單」要用ばかりに。","example":"高価な品だけに、扱いが慎重だ。","zh":"正因为是貴的東西，處理得很小心。"},{"text":"おかげで","meaning":"多虧，好結果。","connection":"た形＋おかげで。","why":"被盜不是好事。感謝語氣相反。","example":"復習したおかげで、満点が取れた。","zh":"多虧複習了，拿到滿分。"},{"text":"ところに","meaning":"在那個時間點碰上。","connection":"動詞た／ている＋ところに。後面多是人來了、意外發生的時間重合。","why":"不是「剛把密碼設簡單的時候被人盜」，而是原因結果。ところに不表後悔因果。","example":"寝ているところに、電話が来た。","zh":"正睡着時，電話來了。"}],"level":"N3"},{"id":"g14","kind":"grammar","point":"からといって","group":"cause","difficulty":4,"stem":"安（やす）い＿＿、品質（ひんしつ）が悪（わる）いとは限（かぎ）らない。","gloss":"並不是說便宜，品質就一定差。","answer":"からといって","options":[{"text":"からといって","meaning":"雖說……也不能就此認為……。後面常有否定：とは限らない、わけではない。","connection":"普通形＋からといって。名詞・な形用「だ＋からといって」。","why":"前句「便宜」不能直接推出「品質一定差」，後面已有「とは限らない」。整句就是からといって的句型。","example":"好きだからといって、毎日食べるわけにはいかない。","zh":"雖說喜歡，也不能天天吃。"},{"text":"からには","meaning":"既然……就該……。後句是決心、義務、建議。","connection":"普通形＋からには。後句不能是否定推測「とは限らない」。","why":"「既然便宜就品質不一定差」邏輯不通。からには後面要意志或責任，不是「未必」。","example":"やると言ったからには、最後までやる。","zh":"既然說了要做，就做到底。"},{"text":"ばかりに","meaning":"就因為才倒霉。","connection":"普通形＋ばかりに＋壞結果。","why":"後句「未必差」不是壞結果的斷定。ばかりに接不上とは限らない。","example":"油断したばかりに、けがをした。","zh":"就因為大意，才受傷。"},{"text":"せいで","meaning":"都怪，斷定壞因果。","connection":"普通形＋せいで＋負面結果。","why":"句子不是在怪便宜導致品質差，而是在否定這個因果。せいで會把原因說死。","example":"高いせいで、買えなかった。","zh":"都怪太貴，沒買成。"}],"level":"N3"},{"id":"g15","kind":"grammar","point":"からには","group":"cause","difficulty":4,"stem":"留学（りゅうがく）する＿＿、現地（げんち）の言葉（ことば）を使えるようになりたい。","gloss":"既然要去留學，就想把當地語言學會到能用。","answer":"からには","options":[{"text":"からには","meaning":"既然已經決定或既然如此，後句就該有相應的決心。","connection":"動詞辞書形・た形＋からには。後句是意志、希望、義務、建議，不能是純過去的意外。","why":"「要留學」是已定的前提，後句「想學會能用」是相應決心。からには把前提和責任接起來。","example":"日本に来たからには、富士山に登りたい。","zh":"既然來了日本，就想爬富士山。"},{"text":"からといって","meaning":"不能因為……就……。後面要否定。","connection":"普通形＋からといって＋否定。","why":"後句是肯定的希望「なりたい」，沒有否定。不能用「雖說留學也不能」。","example":"有名だからといって、入れるとは限らない。","zh":"雖說有名，也不一定進得去。"},{"text":"ものの","meaning":"雖然……但是……。","connection":"普通形＋ものの＋保留、不足的後句。","why":"後句不是轉折，而是順着留學這件事提出的目標。","example":"応募したものの、自信がない。","zh":"雖然申請了，卻沒有信心。"},{"text":"うちに","meaning":"趁着。","connection":"辞書形＋うちに＋趁狀態還在時的動作。","why":"不是「趁留學時」的時間窗（那多說「留学しているうちに」），而是「既然決定留學」的前提。","example":"日本にいるうちに、各地を回りたい。","zh":"趁還在日本時，想各處走走。"}],"level":"N3"},{"id":"g16","kind":"grammar","point":"ものだから","group":"cause","difficulty":3,"stem":"電車（でんしゃ）が止（と）まってしまった＿＿、遅（おく）れてしまって、すみません。","gloss":"因為電車停了，所以遲到了，對不起。","answer":"ものだから","options":[{"text":"ものだから","meaning":"因為……（個人理由、略帶辯解）。對方面前解釋自己為何如此。","connection":"普通形＋ものだから。な形・名詞＋な＋ものだから。口語可說もんだから。後句多是請求原諒或個人行動。","why":"向對方道歉並解釋遲到，理由是自己控制不了的電車。辯解語氣用ものだから，比ので更像在請對方體諒。","example":"子供が熱を出したものだから、休ませてください。","zh":"因為孩子發燒了，請讓我請假。"},{"text":"ものなら","meaning":"如果真能……的話（多半很難）。","connection":"可能動詞＋ものなら。後句是希望或挑戰。不表原因。","why":"「止まってしまったものなら」不是原因，而且ものなら通常接可能形，不接しまった。","example":"戻れるものなら、戻りたい。","zh":"要是真能回去，我想回去。"},{"text":"ことだから","meaning":"因為是某人所為，就可想而知。","connection":"人物名詞＋の＋ことだから。不接動詞句。","why":"空格前是動詞「止まってしまった」，不是「人＋のことだから」。接續不對，而且沒有「某人一貫的性格」。","example":"時間に厳しい田中さんのことだから、もう着いているだろう。","zh":"田中對時間很嚴，想必已經到了。"},{"text":"おかげで","meaning":"多虧，好結果。","connection":"普通形＋おかげで。","why":"遲到並道歉不是好結果。不能感謝電車停駛。","example":"教えてもらったおかげで、間に合った。","zh":"多虧有人教，趕上了。"}],"level":"N3"},{"id":"g17","kind":"grammar","point":"と（必然）","group":"condition","difficulty":3,"stem":"このボタンを押（お）す＿＿、電源（でんげん）が切（き）れる。","gloss":"一按這個按鈕，電源就會斷。","answer":"と","options":[{"text":"と","meaning":"一……就……。恆常、自動的結果，說話人控制不了後句。","connection":"動詞辞書形＋と。後句不能是意志、命令、依頼、希望。","why":"按按鈕就斷電，是機械的必然結果，不是說話人的決定。用と。","example":"春になると、桜が咲く。","zh":"一到春天，櫻花就開。"},{"text":"ば","meaning":"如果……就……。一般條件，後句可以是意志。","connection":"仮定形＋ば。動詞：押す→押せば。","why":"選項只有「ば」，接在「押すば」不成立。ば必須用仮定形「押せば」，不能接辞書形。","example":"押せば、電源が切れる。","zh":"如果按，電源會斷。這句要先變成押せ。"},{"text":"なら","meaning":"如果是……的情況。多接對方的話，後句是建議。","connection":"普通形＋なら。名詞・な形可直接＋なら。後句常是說話人的判斷或建議。","why":"按鈕斷電不是「假如你要按的話我建議」，而是每次按都會發生的事實。なら的話題條件不適合。","example":"買うなら、今月が安い。","zh":"要買的話，這個月便宜。"},{"text":"ても","meaning":"即使……也……。逆接條件。","connection":"て形＋も。押しても。不能辞書形＋ても。","why":"「押すても」接續錯。而且語意會變成「即使按也不斷電」，和事實相反。","example":"押しても、切れないことがある。","zh":"即使按，有時也不斷。"}],"level":"N3"},{"id":"g18","kind":"grammar","point":"ば","group":"condition","difficulty":2,"stem":"もう少（すこ）し安（やす）けれ＿＿、この靴（くつ）を買（か）うのに。","gloss":"要是再便宜一點，我就買這雙鞋了。","answer":"ば","options":[{"text":"ば","meaning":"如果。仮定條件，後句可以是遺憾（のに）。","connection":"い形容詞：把い改成けれ＋ば。安い→安ければ。","why":"空格在「安けれ」後面，形容詞仮定形已經變好，只缺ば。後句「買うのに」是「就好了」的遺憾，ば條件成立。","example":"時間があれば、行くのに。","zh":"要是有時間，我就去了。"},{"text":"と","meaning":"一……就……，恆常結果。","connection":"辞書形＋と。不接「安けれ」這種仮定形。","why":"安けれと接續不成立。と也不能表達「如果便宜我就會買」這種個人假設。","example":"夜になると、冷える。","zh":"一到晚上就變冷。"},{"text":"たら","meaning":"如果；……之後。","connection":"た形＋ら。安い→安かったら。不接けれ。","why":"安けれたら不存在。たら要接在た形後，這裡前面已是仮定形安けれ。","example":"安かったら、買うのに。","zh":"要是便宜，就買了。"},{"text":"なら","meaning":"如果是。","connection":"普通形＋なら。安いなら。不接けれ。","why":"安けれなら接不上。なら直接接辞書・普通形「安いなら」。","example":"必要なら、貸すよ。","zh":"需要的話，我借你。"}],"level":"N3"},{"id":"g19","kind":"grammar","point":"なら","group":"condition","difficulty":3,"stem":"北海道（ほっかいどう）へ行（い）く＿＿、六月（ろくがつ）がいいですよ。","gloss":"要是去北海道的話，六月比較好哦。","answer":"なら","options":[{"text":"なら","meaning":"如果是（對方提到的）那件事的話。後句多是建議、判斷。","connection":"動詞辞書形＋なら。話題是「去北海道」這件事，還不一定發生。","why":"對方可能要去北海道，說話人針對這件事建議六月。這是話題條件，用なら，不是時間順序。","example":"使うなら、説明書を先に読んで。","zh":"要用的話，先看說明書。"},{"text":"と","meaning":"一……就……。必然結果。","connection":"辞書形＋と。後句不能是建議「がいいですよ」這種說話人的勸告。","why":"「去就六月比較好」不是自動發生的自然結果。と禁止後句出現建議、意志。","example":"この道を行くと、駅に出る。","zh":"走這條路就會到車站。"},{"text":"たびに","meaning":"每次……都……。","connection":"辞書形＋たびに。後句是反覆發生的事。","why":"不是「每次去北海道，六月都好」。六月是對這次計劃的建議。","example":"出張のたびに、その店による。","zh":"每次出差都去那家店。"},{"text":"ついでに","meaning":"順便。","connection":"動詞辞書・た形＋ついでに。後句是順便做的第二件事。","why":"「六月比較好」不是去北海道時順便做的事。","example":"銀行へ行くついでに、郵便局にも寄る。","zh":"去銀行時順便去郵局。"}],"level":"N3"},{"id":"g20","kind":"grammar","point":"たら","group":"condition","difficulty":2,"stem":"駅（えき）に着（つ）い＿＿、電話（でんわ）してください。","gloss":"到了車站就請打電話。","answer":"たら","options":[{"text":"たら","meaning":"如果；一……之後就（個別、一次的事）。後句可以是請求。","connection":"動詞た形＋ら。着く→着いたら。空格前是「着い」，加上たら就是着いたら。","why":"到站之後請打電話。後句是請求，たら可以接請求；と的後句不能用ください。","example":"終わったら、戻ってきてください。","zh":"做完了請回來。"},{"text":"ても","meaning":"即使。","connection":"て形＋も。着いても。不接在「着い」後。","why":"着いても是て形。空格前是「着い」不是「着い」+て。着いても的話句子應是「着いても」。而且「即使到了請打電話」意思怪。","example":"雨が降っても、行きます。","zh":"即使下雨也去。"},{"text":"ば","meaning":"如果，仮定形。","connection":"着く→着けば。不接在た形語幹「着い」後面。","why":"着いば不存在。ば要仮定形着けば。","example":"着ければ、電話する。","zh":"要是能到，就打電話。"},{"text":"と","meaning":"一……就，恆常。","connection":"辞書形＋と。句子應是「着くと」，不能「着いと」。後句也不能是ください。","why":"着いと接續錯。就算改成着くと，後句「してください」是請求，と的後句不能用。","example":"着くと、すぐに見える。","zh":"一到就立刻看見。"}],"level":"N3"},{"id":"g21","kind":"grammar","point":"ても","group":"condition","difficulty":2,"stem":"何回（なんかい）読（よ）ん＿＿、意味（いみ）が分（わ）からない。","gloss":"就算讀了好幾次，還是不懂意思。","answer":"でも","options":[{"text":"でも","meaning":"即使……也……。て形＋も，撥音便後常寫でも。","connection":"読む的て形是読んて→読んで，＋も＝読んでも。空格在「読ん」後，所以是でも。","why":"「讀了也不懂」是逆接條件。読んでも：ん後面用でも，不是ても。","example":"検索しても、出てこない。","zh":"即使搜尋，也找不到。"},{"text":"ても","meaning":"即使。","connection":"て形若是「って」「いて」「して」後用ても：書いても、見ても。撥音便「んで」要用でも。","why":"読んでも才對。読んても把て形寫錯了，ん不能直接接ても。","example":"高くても、買いたい。","zh":"即使貴也想買。"},{"text":"たら","meaning":"如果、之後。","connection":"た形＋ら。読んだら。","why":"空格前是読ん，不是読んだ。「読んたら」不對。語意上「讀了之後不懂」也不如逆接「即使讀」。","example":"読んだら、感想を書いてください。","zh":"讀了之後請寫感想。"},{"text":"ば","meaning":"如果。","connection":"読めば。仮定形，不接読ん。","why":"読んば不存在。而且ば是順接條件，不是「即使也不」。","example":"読めば、分かる。","zh":"讀了就會懂。"}],"level":"N3"},{"id":"g22","kind":"grammar","point":"ば〜ほど","group":"condition","difficulty":4,"stem":"この本（ほん）は読（よ）め＿＿読（よ）むほど、面白（おもしろ）くなる。","gloss":"這本書越讀越有意思。","answer":"ば","options":[{"text":"ば","meaning":"越……越……。","connection":"仮定形＋ば＋同一動詞辞書形＋ほど。読む→読めば読むほど。","why":"句型已有後半「読むほど」。空格在読め後面，只缺ば，構成読めば読むほど。","example":"考えれば考えるほど、分からなくなる。","zh":"越想越不明白。"},{"text":"ばほど","meaning":"沒有這個接續。","connection":"ば和ほど要分開放：仮定形＋ば，再重複辞書形＋ほど。","why":"読めばほど會少掉第二個動詞。正確是読めば読むほど，不能把ばほど黏在一起。","example":"練習すればするほど、上達する。","zh":"越練越進步。"},{"text":"たら","meaning":"如果。","connection":"読めたら。可能形或た形，不接在仮定形「読め」後。","why":"読めたら不是「越讀」。しかも空格前已是読め，再加たら不成詞。","example":"時間があったら、読む。","zh":"有時間的話就讀。"},{"text":"ても","meaning":"即使。","connection":"読んでも。て形。","why":"読めても不成立。逆接也不能構成「越……越」。","example":"読んでも、面白くない。","zh":"即使讀也不有趣。"}],"level":"N3"},{"id":"g23","kind":"grammar","point":"ない限り","group":"condition","difficulty":4,"stem":"許可（きょか）が＿＿限（かぎ）り、この部屋（へや）には入（はい）れない。","gloss":"除非得到許可，否則不能進這個房間。","answer":"ない","options":[{"text":"ない","meaning":"除非……否則就……。","connection":"動詞ない形＋限り。許可が出ない限り＝除非下許可。ない＋限り中的限り已在空格後。","why":"句子是「得不到許可就不能進」。空格要否定「出る／下りる」類。此題空格是「許可が＿＿限り」，答案ない，即「許可がない限り」。名詞＋が＋ない＋限り。","example":"雨が降らない限り、試合は行う。","zh":"除非下雨，比賽照常。"},{"text":"ある","meaning":"有。","connection":"名詞＋が＋ある＋限り＝只要有……就（正面條件）。","why":"「只要有許可就不能進」意思反了。有許可才該能進。","example":"希望がある限り、続ける。","zh":"只要還有希望就繼續。"},{"text":"あった","meaning":"曾經有。","connection":"た形＋限り多表示「在……的範圍內曾經」。","why":"過去「曾經有過許可」不能當現在的進入條件。而且意思會和後句「不能進」打架。","example":"私の知っている限り、その話は本当だ。","zh":"就我所知，那件事是真的。這是另一個限り。"},{"text":"なくて","meaning":"沒有，中頓或原因。","connection":"ない形＋て＝なくて，後面通常直接接結果，不再加限り。","why":"なくて限り把「没有」和「限り」重複接錯。除非句型是ない限り，中間不加て。","example":"許可がなくて、入れなかった。","zh":"因為沒有許可，沒能進去。那是原因，不是除非。"}],"level":"N3"},{"id":"g24","kind":"grammar","point":"さえ〜ば","group":"condition","difficulty":5,"stem":"このボタンを押（お）し＿＿すれば、機械（きかい）は動（うご）く。","gloss":"只要按下這個按鈕，機器就會動。","answer":"さえ","options":[{"text":"さえ","meaning":"只要……就……。其他條件都不必，只差這一個。","connection":"動詞ます語幹＋さえ＋すれば。押します→押し＋さえすれば。","why":"空格在「押し」和「すれば」之間，正是さえ的位置。意思是只須按按鈕這一個條件。","example":"住所さえ分かれば、送れる。","zh":"只要知道地址就能寄。"},{"text":"こそ","meaning":"正是、才是。強調，不是條件。","connection":"名詞＋こそ。不插在ます語幹和すれば之間。","why":"押しこそすれば不是「只要按」。こそ不構成さえ〜ば的條件句型。","example":"今年こそ合格する。","zh":"今年一定要考上。"},{"text":"だけ","meaning":"只。","connection":"押しだけすれば不是標準句型。限定用「押すだけで」更自然，但仍不是空格這種接法。","why":"「押しだけすれば」語感生硬，N3的「只要」句型是ます語幹＋さえすれば，不是だけすれば。","example":"押すだけでいい。","zh":"只要按就行。這句用だけで，不放在すれば中間。"},{"text":"すら","meaning":"連……都。多帶吃驚，常後接否定。","connection":"名詞＋すら。不接ます語幹＋すれば。","why":"押しすらすれば不成立。すら不表示「最低條件就夠」。","example":"名前すら書けない。","zh":"連名字都不會寫。"}],"level":"N3"},{"id":"g25","kind":"grammar","point":"としても","group":"condition","difficulty":4,"stem":"たとえ反対（はんたい）された＿＿、この計画（けいかく）は変（か）えない。","gloss":"就算被反對，這個計劃也不改。","answer":"としても","options":[{"text":"としても","meaning":"即使假定那樣，也不……。常和たとえ一起。","connection":"普通形＋としても。動詞た形＋としても。たとえ呼應。","why":"句首有たとえ，後句是「不改變」的讓步。された＋としても＝即使被反對。","example":"失敗したとしても、後悔はしない。","zh":"就算失敗了，也不後悔。"},{"text":"としたら","meaning":"如果假定是那樣。順接假設，後句是在該前提下的判斷。","connection":"普通形＋としたら。後句不是「仍然不」。","why":"としたら會變成「假如被反對的話，（那我就）……」，後面不該是堅決不改的讓步。讓步用としても。","example":"反対されたとしたら、説明の仕方を変える。","zh":"假如被反對，就改變說明方式。"},{"text":"ものなら","meaning":"要是真能。","connection":"可能形＋ものなら。不接「された」。","why":"されたものなら接續和意思都不對。沒有「如果真的能被反對」。","example":"行けるものなら、行きたい。","zh":"要是真去得了，我想去。"},{"text":"ことから","meaning":"從……可知；因為這件事。","connection":"普通形＋ことから＋判斷或原因。","why":"不是從「被反對」推導出不改計劃，而是讓步。","example":"煙が出ていることから、火事だと分かった。","zh":"從冒煙知道是火災。"}],"level":"N3"},{"id":"g26","kind":"grammar","point":"うちに","group":"time","difficulty":3,"stem":"冷（さ）めない＿＿、ラーメンを食べたほうがいい。","gloss":"趁還沒涼，最好把拉麵吃了。","answer":"うちに","options":[{"text":"うちに","meaning":"趁某狀態還在、或趁它還沒發生時做。做了就能趕上。","connection":"ない形＋うちに＝趁還沒……。動詞辞書形・ている＋うちに＝趁還在……。","why":"拉麵會涼，要在「還沒涼」的窗口吃掉。ない形＋うちに正是這個「趁還沒」。","example":"忘れないうちに、書いておく。","zh":"趁還沒忘記，先寫下來。"},{"text":"あいだに","meaning":"在一整段期間內把另一件事做完。","connection":"ない形一般不接あいだに。あいだに前面多是「ている／名詞の／い形容詞」。","why":"冷めないあいだに不是標準接續。而且あいだに是「在某期間內完成」，不是「趁狀態消失前」的緊迫感。","example":"子供が寝ているあいだに、掃除した。","zh":"趁孩子睡着的那段時間打掃了。"},{"text":"うちは","meaning":"在某狀態持續的整段期間（一直如此）。","connection":"普通形＋うちは。後句多是持續的狀態，不是一次性建議。","why":"「最好吃掉」是趁窗口做一次，不是「在沒涼的整段時間一直吃」。うちは不適合。","example":"若いうちは、無理がきく。","zh":"年輕的時候還扛得住。"},{"text":"までに","meaning":"在期限之前。","connection":"時間名詞＋までに。不接動詞ない形。","why":"冷めないまでに接續不成立。までに前面要時間點，例如「三時までに」。","example":"五時までに、帰ってください。","zh":"請在五點前回來。"}],"level":"N3"},{"id":"g27","kind":"grammar","point":"あいだに","group":"time","difficulty":3,"stem":"私（わたし）が留守（るす）の＿＿、宅配便（たくはいびん）が届（とど）いた。","gloss":"我不在的那段時間，快遞到了。","answer":"あいだに","options":[{"text":"あいだに","meaning":"在某段期間之內發生另一件事。","connection":"名詞＋の＋あいだに。後句可以是無意志的事件。","why":"「留守」是一段不在的時間，快遞在這段裡到了。名詞要用「の＋あいだに」。","example":"休暇のあいだに、親戚が訪ねてきた。","zh":"休假那段時間，親戚來了。"},{"text":"うちに","meaning":"趁狀態改變之前，趕緊做一件事。","connection":"動詞ない形・辞書形＋うちに。名詞則是「名詞＋の＋うちに」，後句多是說話人的意志動作。","why":"快遞到了不是說話人趁機趕着做的事。「留守のうちに」不用來表示不在期間發生的無意志事件。","example":"日が暮れないうちに、下山しよう。","zh":"趁天還沒黑，下山吧。"},{"text":"最中に","meaning":"正做某事的當口被打斷。","connection":"動作性名詞＋の＋最中に，例如食事・会議。不接「留守」。","why":"留守不是正在進行的行為場面。「留守の最中に」不自然。","example":"食事の最中に、電話が鳴った。","zh":"正吃飯時，電話響了。"},{"text":"たびに","meaning":"每次都。","connection":"名詞＋の＋たびに，表示反覆。","why":"句子只說這一段不在的時間裡到了貨，沒有「每次留守都到」的反覆。","example":"出張のたびに、お土産を買う。","zh":"每次出差都買伴手禮。"}],"level":"N3"},{"id":"g28","kind":"grammar","point":"最中に","group":"time","difficulty":3,"stem":"会議（かいぎ）をしている＿＿、非常ベルが鳴（な）った。","gloss":"正在開會的時候，緊急鈴響了。","answer":"最中に","options":[{"text":"最中に","meaning":"正做某事的當口，另一件事插進來。","connection":"動詞ている＋最中に，或名詞＋の＋最中に。後句常是突發。","why":"開會進行到一半，鈴聲突然響起。這是最中に的典型：動作正濃時被打斷。","example":"スピーチの最中に、声が枯れた。","zh":"正演講時，嗓子啞了。"},{"text":"あいだに","meaning":"在期間內完成另一事。","connection":"ている＋あいだに。後句應是利用這段時間做成的事。","why":"鈴聲不是有人趁開會把一件事做完，而是突然插進來。","example":"待っているあいだに、資料を読んだ。","zh":"等待的時候把資料看了。"},{"text":"たびに","meaning":"每次都。","connection":"辞書形＋たびに。不接ている。","why":"しているたびに接續錯。也不是「每次開會鈴都響」的習慣。","example":"この曲を聞くたびに、涙が出る。","zh":"每次聽這首歌都想哭。"},{"text":"うちに","meaning":"趁着。","connection":"ている＋うちに＋要趁機完成的意志動作。","why":"鈴響了不是趁開會去做的事，而是突發。うちに的後句也不該是無意志的意外過去。","example":"明るいうちに、写真を撮ろう。","zh":"趁還亮，拍照吧。"}],"level":"N3"},{"id":"g29","kind":"grammar","point":"てからでないと","group":"time","difficulty":4,"stem":"内容（ないよう）を確認（かくにん）して＿＿、サインできない。","gloss":"不先確認內容，就不能簽名。","answer":"からでないと","options":[{"text":"からでないと","meaning":"如果不先做完前一件，後一件就不行。","connection":"動詞て形＋からでないと／からでなければ。後句是否定或表示困難。","why":"空格在「して」後面。必須先確認，否則不能簽。て＋からでないと＋できない，順序和否定都對。","example":"親に話してからでないと、決められない。","zh":"不先跟父母說，就決定不了。"},{"text":"からだと","meaning":"如果是在做完之後的話。","connection":"て＋からだと，後句多是那時會發生的不便，不是「否則不能」。","why":"「確認してからだとサインできない」會變成確認之後反而不能簽，意思反了。","example":"夜遅く来てからだと、店が閉まっている。","zh":"要是很晚才來，店就關了。"},{"text":"てから","meaning":"做完……之後。","connection":"て形＋から＋之後的動作。後句應是接下來做的事，通常肯定。","why":"若只選てから，句子是「確認しててから」重複て，而且「之後不能簽名」邏輯反了。空格前已有して，不能再來一個てから。","example":"手を洗ってから、食べる。","zh":"洗手之後再吃。"},{"text":"たところで","meaning":"就算做了也（白費）。","connection":"動詞た形＋ところで＋否定評價。不接て形。","why":"してたところで接續怪。語意是「即使確認了也不能簽」，和「必須先確認才能簽」相反。","example":"今さら謝ったところで、許されない。","zh":"事到如今就算道歉也不會被原諒。"}],"level":"N3"},{"id":"g30","kind":"grammar","point":"たところ","group":"time","difficulty":4,"stem":"窓口（まどぐち）で聞（き）いた＿＿、今日（きょう）は休みだと言（い）われた。","gloss":"我在窗口一問，對方說今天休息。","answer":"ところ","options":[{"text":"ところ","meaning":"做了某事，結果發現……。前動作引出一個發現。","connection":"動詞た形＋ところ。後句是因此得知的結果，不能是命令。","why":"空格前是「聞いた」，た形＋ところ：一問之下，得到「今天休息」。是發現，不是正要問。","example":"検索したところ、在庫がなかった。","zh":"搜了一下，發現沒有庫存。"},{"text":"ばかり","meaning":"剛剛做完。","connection":"動詞た形＋ばかり。後句多是「所以還……」的時間很近，不引出新資訊。","why":"聞いたばかり會停在「剛問完」，不能直接接「被說今天休息」當結果發現。發現用たところ。","example":"着いたばかりで、まだ荷物を開けていない。","zh":"剛到，行李還沒打開。"},{"text":"以来","meaning":"自……以來一直。","connection":"動詞て形＋以来，或名詞＋以来。不接た形。後句是持續到現在的狀態。","why":"聞いた以来接續不自然（應是聞いて以来）。而且後句是當時得到的回答，不是一直持續到現在。","example":"卒業して以来、会っていない。","zh":"畢業以後就沒見過。"},{"text":"とたん","meaning":"一……立刻就（意外、幾乎同時）。","connection":"動詞た形＋とたん。後句不能是說話人的意志，而且兩件事幾乎同一瞬間。","why":"問完到得到回答可以有一點過程，不是門一開那種瞬間意外。とたん也不接「と言われた」這種得知資訊的典型句，たところ才是。","example":"立ち上がったとたん、目まいがした。","zh":"一站起來就暈了。"}],"level":"N3"},{"id":"g31","kind":"grammar","point":"ところだ","group":"time","difficulty":2,"stem":"ただいま、駅（えき）に向（む）かっている＿＿です。あと十分（じゅっぷん）で着（つ）きます。","gloss":"我正在往車站去。再十分鐘就到。","answer":"ところ","options":[{"text":"ところ","meaning":"正好處於某階段。","connection":"ている＋ところだ＝正在。辞書形＋ところだ＝正要。た＋ところだ＝剛剛。","why":"向かっている是進行，加上ところ＝正在去車站的當口。後面「再十分鐘到」也符合還沒到。","example":"今、ご飯を食べているところです。","zh":"現在正在吃飯。"},{"text":"ばかり","meaning":"剛剛；淨是。","connection":"た形＋ばかり＝剛剛。ている＋ばかり不是「正在」的時間點。","why":"向かっているばかり會像「一個勁兒只顧去」，不是「正在前往」的階段報告。","example":"今、着いたばかりです。","zh":"現在剛到。"},{"text":"はず","meaning":"按理應該。","connection":"普通形＋はずだ。","why":"「正在前往應該」多此一舉。說話人是在報告自己的實際階段，不是推測。","example":"もう着いているはずだ。","zh":"按理已經到了。"},{"text":"わけ","meaning":"也就是說、難怪。","connection":"普通形＋わけだ。用來下結論。","why":"沒有前文需要解釋成「所以我正在去車站」。わけ不是進行階段。","example":"だから遅れたわけだ。","zh":"所以才遲到啊。"}],"level":"N3"},{"id":"g32","kind":"grammar","point":"たばかり","group":"time","difficulty":3,"stem":"このパソコンは買（か）った＿＿なのに、もう故障（こしょう）した。","gloss":"這台電腦明明才買，就壞了。","answer":"ばかり","options":[{"text":"ばかり","meaning":"主觀上覺得剛做完不久。可以是幾天前，重點是說話人覺得還很近。","connection":"動詞た形＋ばかり。後面常接なのに表示「才……就」。","why":"買了不久就壞，說話人覺得時間近得不合理。た＋ばかり＋なのに是固定的「才剛」。","example":"習ったばかりの単語を忘れた。","zh":"才學的生詞就忘了。"},{"text":"ところ","meaning":"剛剛做完的那一點，比ばかり更貼近「現在這一刻」。","connection":"た形＋ところだ。通常不加なのに當「才買就」。ところなのに不自然。","why":"買ったところなのに文法彆扭。要說「剛買完這一刻」用「買ったところだ」。這裡有なのに，要用ばかり。","example":"今、買ったところです。","zh":"現在剛買好。"},{"text":"以来","meaning":"自從……以來。","connection":"て形＋以来。買って以来。不接た形＋なのに。","why":"買った以来なのに接續錯。以来後面應是持續到現在的狀態，不是「就壞了」這種一次性意外的固定搭配。","example":"入社して以来、一度も休んでいない。","zh":"進公司以來一次都沒請假。"},{"text":"とたん","meaning":"一……就立刻。","connection":"た形＋とたん（に）。後面直接是意外結果，不加なのに。","why":"買ったとたんなのに把瞬間和逆接疊在一起，不成立。若用とたん應是「買ったとたんに故障した」，中間沒有なのに。","example":"使い始めたとたんに、壊れた。","zh":"一開始用就壞了。"}],"level":"N3"},{"id":"g33","kind":"grammar","point":"たとたん","group":"time","difficulty":4,"stem":"教室（きょうしつ）を出（で）た＿＿、名前（なまえ）を呼（よ）ばれた。","gloss":"一出教室，就被叫了名字。","answer":"とたん","options":[{"text":"とたん","meaning":"前一件剛發生，後一件幾乎同時、且出乎意料地發生。","connection":"動詞た形＋とたん（に）。後句不能是意志、命令、依頼。主語常常不同。","why":"出教室和被叫名字緊接着，而且被叫不是自己計劃的。た＋とたん，後句無意志，都符合。","example":"飛び出したとたん、車が来た。","zh":"一衝出去，車就來了。"},{"text":"ばかり","meaning":"剛剛。","connection":"た形＋ばかりだ／ばかりで。不直接接另一件意外當瞬間。","why":"出たばかり、名前を呼ばれた會像兩個斷句，不是「一……就」。時間近不等於瞬間意外。","example":"出たばかりで、まだ廊下にいる。","zh":"剛出來，還在走廊。"},{"text":"うちに","meaning":"趁着。","connection":"ない形或辞書形＋うちに。不接た形表示瞬間。","why":"出たうちに不是「一出去就」。うちに要狀態窗口。","example":"先生が来るうちに、質問しよう。","zh":"趁老師來的時候問吧。這句更自然是「来ないうちに」或「いるうちに」。"},{"text":"以来","meaning":"自……以來一直。","connection":"て形＋以来。後句是持續狀態，不是瞬間的下一個動作。","why":"出た以来接續不佳，而且被叫名字不是從那時一直持續到現在的狀態。","example":"別れて以来、連絡がない。","zh":"分開以後就沒聯絡。"}],"level":"N3"},{"id":"g34","kind":"grammar","point":"たびに","group":"time","difficulty":3,"stem":"父（ちち）はこの写真（しゃしん）を見（み）る＿＿、留学（りゅうがく）の話（はなし）をする。","gloss":"父親每次看這張照片，都會談起留學。","answer":"たびに","options":[{"text":"たびに","meaning":"每次……都……。反覆，不是只此一次。","connection":"動詞辞書形＋たびに。名詞＋の＋たびに。","why":"看照片和談留學是反覆配對。辞書形見る＋たびに。","example":"会うたびに、背が高くなっている。","zh":"每次見面都更高了。"},{"text":"うちに","meaning":"趁着；在過程中逐漸。","connection":"辞書形＋うちに可以是「在看的期間」，但不是「每一次」。","why":"見るうちに會變成看着看着（逐漸），後面「談留學」不是逐漸變化。次數對應要用たびに。","example":"話しているうちに、打ち解けた。","zh":"說着說着就熟了。"},{"text":"ところ","meaning":"剛剛、正要、結果發現。","connection":"見るところ不是「每次」。たところ才是發現。","why":"見るところ、話をする接不上次數。","example":"見たところ、異常はない。","zh":"看了一下，沒有異常。"},{"text":"につれて","meaning":"隨着……而逐漸。","connection":"動詞辞書形＋につれて。兩邊都要是變化，不是反覆的一對動作。","why":"看照片並不是變化動詞，談留學也不是隨之逐漸改變。","example":"年を取るにつれて、体力が落ちる。","zh":"隨着年紀增長，體力下降。"}],"level":"N3"},{"id":"g35","kind":"grammar","point":"て以来","group":"time","difficulty":3,"stem":"日本（にほん）に来（き）て＿＿、一度（いちど）も寿司（すし）を食（た）べていない。","gloss":"自從來了日本，一次壽司都還沒吃過。","answer":"以来","options":[{"text":"以来","meaning":"自……之後直到現在都一直如此。","connection":"動詞て形＋以来。後句是持續到現在的狀態，常有「一度も〜ない」。","why":"空格在「来て」後。從來日本到現在都沒吃過，狀態一直持續。て＋以来。","example":"卒業して以来、彼に会っていない。","zh":"畢業後就沒見過他。"},{"text":"からでないと","meaning":"不先……就不行。","connection":"て形＋からでないと＋否定可能。","why":"「来てからでないと食べていない」又重複又不成句。不是「必須先來日本才能沒吃」。","example":"予約してからでないと、入れない。","zh":"不先預約就不能進。"},{"text":"たびに","meaning":"每次。","connection":"辞書形＋たびに。不接て形。","why":"来てたびに若要說每次來，應是「来るたびに」。而且「一次都沒吃」不是每次都發生的動作。","example":"帰国するたびに、家族に会う。","zh":"每次回國都見家人。"},{"text":"ところ","meaning":"剛剛或發現。","connection":"た形＋ところ。来たところ＝剛來。不接て形。","why":"来てところ不成立。剛來的話也不會說「一次都沒吃過」這種長期狀態。","example":"来たところです。","zh":"剛到。"}],"level":"N3"},{"id":"g36","kind":"grammar","point":"までに","group":"time","difficulty":2,"stem":"レポートは金曜（きんよう）の五時＿＿出（だ）してください。","gloss":"報告請在星期五五點之前交。","answer":"までに","options":[{"text":"までに","meaning":"在期限到來之前的任一點做成。","connection":"時間名詞＋までに＋完成的動作。動作是瞬間完成（出す、着く）。","why":"交報告是在五點前的某個時刻做完即可，不是從現在一直交到五點。用までに。","example":"十時までに、空港に着く。","zh":"十點之前到機場。"},{"text":"まで","meaning":"一直持續到該時點。","connection":"時間＋まで＋持續動詞（いる、続ける、開いている）。","why":"「五時まで出してください」會像一直交到五點，交報告不是持續動作。期限完成要用までに。","example":"五時まで、事務所にいます。","zh":"我會在事務所待到五點。"},{"text":"以来","meaning":"自……以來。","connection":"時間名詞＋以来，方向是從那時到現在，不是期限。","why":"五時以来出してください不成「請在五點前交」。","example":"四月以来、雨が降っていない。","zh":"四月以來沒下過雨。"},{"text":"うちに","meaning":"趁着。","connection":"不直接接鐘點「五時うちに」。要說五時になるうちに也不自然，應是「五時にならないうちに」。","why":"五時うちに少了接續。期限請用までに。","example":"五時にならないうちに、出てください。","zh":"趁還沒到五點，請離開。"}],"level":"N3"},{"id":"g37","kind":"grammar","point":"につれて","group":"time","difficulty":3,"stem":"景気（けいき）が回復（かいふく）する＿＿、求人（きゅうじん）も増（ふ）えてきた。","gloss":"隨着景氣恢復，招聘也變多了。","answer":"につれて","options":[{"text":"につれて","meaning":"隨着一方變化，另一方也跟着變。","connection":"動詞辞書形＋につれて。兩邊都必須是變化，後句不能是一次性的意志。","why":"景氣恢復、招聘變多，都是逐漸變化，而且後者跟着前者。辞書形＋につれて。","example":"暗くなるにつれて、気温も下がった。","zh":"隨着天黑，氣溫也降了。"},{"text":"おかげで","meaning":"多虧，好的因果，多是一次的結果。","connection":"普通形＋おかげで。後句是值得感謝的結果，不是同步的連續變化。","why":"景氣恢復如果用おかげで，只是把前句當成帶來好結果的原因，後句卻是「増えてきた」這種跟着變的過程。兩邊同步變化要用につれて，不用感謝因果。","example":"紹介のおかげで、仕事が見つかった。","zh":"多虧介紹，找到了工作。"},{"text":"たびに","meaning":"每次。","connection":"辞書形＋たびに＋反覆動作，不是連續變化。","why":"景氣恢復不是一次次重複的動作，招聘增加也不是每次都做的一件事。","example":"失敗するたびに、原因をノートする。","zh":"每次失敗都把原因記下來。"},{"text":"一方で","meaning":"另一方面。","connection":"句子開頭或前句＋一方で，表示對照，不是隨着變化。","why":"「回復する一方で求人も増えた」會變成兩件對立或並列，不是連動變化。","example":"利益は増えた。一方で、負債も残っている。","zh":"利潤增加了。另一方面，負債還在。"}],"level":"N3"},{"id":"g38","kind":"grammar","point":"おきに","group":"time","difficulty":4,"stem":"この体操（たいそう）は一日＿＿やる。やる日と休む日が交互（こうご）だ。","gloss":"這個體操每隔一天做。做的日子和休息的日子交替。","answer":"おきに","options":[{"text":"おきに","meaning":"每隔一段，中間空一格。","connection":"數量詞＋おきに。一日おき＝隔一天（做一天、休一天）。","why":"後句寫明做和休交替，所以不是每天做。一日おきに才是隔日一次。","example":"二週間おきに、会議がある。","zh":"每隔兩週開一次會。"},{"text":"ごとに","meaning":"每一……都，沒有空掉下一格。","connection":"數量詞＋ごとに。一日ごとに＝每一天。","why":"一日ごとに會變成每天都做，和後句「做與休交替」矛盾。每隔要用おきに。","example":"一駅ごとに、景色が変わる。","zh":"每一站風景都不同。"},{"text":"までに","meaning":"在期限之前。","connection":"時間點＋までに。一日までに是「一日之前」，不是重複的間隔。","why":"沒有「在某月一日之前做體操」的期限，後句說的是交替的節奏。","example":"一日までに、申し込む。","zh":"請在一號之前申請。"},{"text":"うちに","meaning":"趁着。","connection":"不接數量詞表示每隔。一日うちに不成立。","why":"一日うちに既少接續，也沒有隔日交替的意思。","example":"休みのうちに、課題を終える。","zh":"趁休假把作業做完。"}],"level":"N3"},{"id":"g39","kind":"grammar","point":"ようになる","group":"change","difficulty":2,"stem":"毎日聞（き）いているので、日本語（にほんご）のニュースが分（わ）かる＿＿。","gloss":"因為每天聽，變得聽得懂日語新聞了。","answer":"ようになった","options":[{"text":"ようになった","meaning":"變得能夠，或變成一種習慣。以前不行，現在行。","connection":"動詞辞書形・ない形＋ようになる。可能形、無意志動詞常用。不能接意志動詞表示「決定要做」。","why":"「分かる」是無意志的能力變化。空格要收成「變得懂了」，所以是分かるようになった。","example":"一人で通えるようになった。","zh":"變得可以一個人通勤了。"},{"text":"ことになった","meaning":"（由環境、別人、組織）決定變成那樣。","connection":"動詞辞書形・ない形＋ことになる。重點是決定、安排，不是能力慢慢形成。","why":"聽懂新聞不是某項決定。ことになった會說成「規定變成聽得懂」，不合理。","example":"来月から大阪へ転勤することになった。","zh":"決定從下月調去大阪。"},{"text":"ことにした","meaning":"自己決定要做。","connection":"意志動詞辞書形＋ことにする。分かる這種無意志動詞不能用。","why":"「分かることにした」＝決定要懂，日語不這樣說能力的變化。自己的決定用意志動詞，如「毎日聞くことにした」。","example":"夜は甘いものを食べないことにした。","zh":"我決定晚上不吃甜的。"},{"text":"そうになった","meaning":"幾乎就要發生（多指差點的壞事）。","connection":"ます語幹＋そうになる。分かる→分かりそうになる。不接辞書形。","why":"空格前如果是「分かるそうになった」接續錯。幾乎懂了和已經變得懂，意思也不同。","example":"転びそうになった。","zh":"差點摔倒。"}],"level":"N3"},{"id":"g40","kind":"grammar","point":"ことになる","group":"change","difficulty":3,"stem":"来月（らいげつ）から、この窓口（まどぐち）は午後（ごご）五時に閉（し）まる＿＿。","gloss":"從下個月起，這個窗口決定改為下午五點關門。","answer":"ことになった","options":[{"text":"ことになった","meaning":"決定、安排成那樣。決定者常常不是說話人本人。","connection":"動詞辞書形＋ことになる。閉まる是無意志，但規章決定「改為五點關」仍用ことになる。","why":"窗口幾點關是機構的安排，不是說話人個人決心，也不是自然變成的能力。用ことになった。","example":"試合は中止ということになった。","zh":"比賽決定取消。"},{"text":"ことにした","meaning":"自己下決定。","connection":"意志動詞＋ことにする。說話人是決定主體。","why":"窗口關門時間不是「我決定去關」。對公眾的安排用ことになる，個人決心才用ことにする。","example":"私は五時に帰ることにした。","zh":"我決定五點回家。"},{"text":"ようになった","meaning":"變得（能力或習慣自然形成）。","connection":"辞書形＋ようになる。","why":"五點關門是從某月起的新規定，不是窗口「慢慢變得會在五點關」。","example":"早起きするようになった。","zh":"變得會早起了。"},{"text":"ものになった","meaning":"成器、變成出色的東西。不是安排。","connection":"名詞＋になる的慣用，不接動詞辞書形表示規定。","why":"閉まるものになった不表示新制度。","example":"数年で一人前のものになった。","zh":"幾年就成了能獨當一面的人。"}],"level":"N3"},{"id":"g41","kind":"grammar","point":"ことにする","group":"decision","difficulty":2,"stem":"健康（けんこう）のために、駅（えき）まで歩（ある）く＿＿。","gloss":"為了健康，我決定走到車站。","answer":"ことにした","options":[{"text":"ことにした","meaning":"自己決定今後這麼做。","connection":"意志動詞辞書形＋ことにする。決定者是主語自己。","why":"走路是自己的意志，為了健康而做的個人決定。歩くことにした。","example":"甘い飲み物はやめることにした。","zh":"我決定戒掉甜飲料。"},{"text":"ことになった","meaning":"被決定、客觀上變成那樣。","connection":"辞書形＋ことになる。","why":"沒有公司或別人規定他必須走到車站。是自己的選擇，不用ことになる。","example":"来年、支店を出すことになった。","zh":"決定明年開分店。"},{"text":"ものだ","meaning":"本來就會；回憶從前常常。","connection":"辞書形＋ものだ是常理。不表示個人的新決定。","why":"「歩くものだ」＝人本來就該走，變成說教，不是「我決定走到車站」。","example":"約束は守るものだ。","zh":"約定本來就該遵守。"},{"text":"わけだ","meaning":"難怪、也就是說。結論，不是決定。","connection":"普通形＋わけだ。","why":"句子沒有需要解釋的前文。わけだ不能拿來宣布自己的新決定。","example":"だから疲れているわけだ。","zh":"所以才這麼累啊。"}],"level":"N3"},{"id":"g42","kind":"grammar","point":"ことになっている","group":"decision","difficulty":3,"stem":"この図書館（としょかん）では、飲食（いんしょく）は＿＿。","gloss":"這間圖書館規定不可以飲食。","answer":"しないことになっている","options":[{"text":"しないことになっている","meaning":"規定上是這樣。規則事先就定了，不是某人此刻臨時決定。","connection":"動詞ない形／辞書形＋ことになっている。","why":"圖書館飲食是既定規則。否定要用しないことになっている，不是個人「決定不吃」。","example":"ここでは写真を撮らないことになっている。","zh":"這裡規定不能拍照。"},{"text":"しないことにした","meaning":"我（們）決定不做。個人或當下的決定。","connection":"ない形＋ことにする。","why":"告示、館規不是說話人自己剛剛決定的。規則用ことになっている。","example":"今日は外食しないことにした。","zh":"我決定今天不外食。"},{"text":"しないようになった","meaning":"變得不做了。習慣變化。","connection":"ない形＋ようになる。","why":"不是館方慢慢養成不飲食的習慣，而是規定。","example":"夜更かししないようになった。","zh":"變得不再熬夜了。"},{"text":"しないことだ","meaning":"最好不要。忠告。","connection":"辞書形・ない形＋ことだ＝應該／不該。是建議，不是已存在的規則。","why":"ことだ是說話人勸你，不是圖書館已經定下的制度。","example":"無理をしないことだ。","zh":"最好不要勉強。"}],"level":"N3"},{"id":"g43","kind":"grammar","point":"ことになっている vs ことだ","group":"decision","difficulty":4,"stem":"風邪（かぜ）を早く治（なお）したいなら、暖（あたた）かくして休（やす）む＿＿。","gloss":"想讓感冒快點好的話，就應該保暖休息。","answer":"ことだ","options":[{"text":"ことだ","meaning":"應該這麼做。說話人的忠告。","connection":"動詞辞書形・ない形＋ことだ。不接た形。後句是建議，不是規定或決定。","why":"這是對病人的建議：想快好就該休息。不是醫院規章，也不是病人已經決定。用ことだ。","example":"上達したければ、毎日声を出すことだ。","zh":"想進步的話，就該每天出聲。"},{"text":"ことになっている","meaning":"規定已是如此。","connection":"辞書形＋ことになっている。","why":"沒有一條規則寫着感冒就必須休息。這是忠告，不是既定制度。","example":"入場の際はチケットを見せることになっている。","zh":"入場時規定要出示票。"},{"text":"ことにした","meaning":"自己已經決定。","connection":"辞書形＋ことにした。主語是做決定的人。","why":"句子是在勸「你」，不是陳述「我已經決定休息」。","example":"今日は早く寝ることにした。","zh":"我決定今天早點睡。"},{"text":"ものか","meaning":"才不會。反問、強烈否定。","connection":"辞書形＋ものか。語氣是拒絕。","why":"「休息ものか」會變成「才不要休息」，和想快點好的建議相反。","example":"あんな店に二度と行くものか。","zh":"那種店才不會再去。"}],"level":"N3"},{"id":"g44","kind":"grammar","point":"わけだ","group":"modal","difficulty":4,"stem":"夜行列車（やこうれっしゃ）でほとんど眠（ねむ）っていない。それで今（いま）眠（ねむ）い＿＿。","gloss":"坐夜車幾乎沒睡。所以現在才這麼想睡。","answer":"わけだ","options":[{"text":"わけだ","meaning":"難怪、也就是說。從已知原因推出理所當然的結論。","connection":"普通形＋わけだ。い形容詞直接＋わけだ：眠いわけだ。","why":"前文已經給了沒睡的原因，後句是「所以當然想睡」。這是事後恍然，用わけだ，不是預測。","example":"十時間も歩いた。疲れるわけだ。","zh":"走了十個小時。難怪累。"},{"text":"はずだ","meaning":"按理應該（還沒親眼確認的推測）。","connection":"普通形＋はずだ。說話人根據證據預測，結論尚未被當下的感覺證實時用。","why":"「今眠い」是已經發生的感覺，不是「應該會想睡」的預測。原因已經說明、結果就在眼前，用わけだ。","example":"今ごろは着いているはずだ。","zh":"這時候按理已經到了。"},{"text":"ものだ","meaning":"一般本來就會；從前總是。","connection":"辞書形＋ものだ＝常理。た形＋ものだ＝從前常常。","why":"這不是「人本来就想睡」的常理，而是這個原因導致的這一次結論。","example":"人は誰でも間違えるものだ。","zh":"人本來就會犯錯。"},{"text":"ことだ","meaning":"應該做。忠告。","connection":"辞書形＋ことだ。","why":"眠いことだ不是「應該想睡」的自然說法，也不能解釋前文的因果。","example":"困ったときは、すぐ相談することだ。","zh":"為難的時候就該馬上商量。"}],"level":"N3"},{"id":"g45","kind":"grammar","point":"わけではない","group":"modal","difficulty":3,"stem":"肉（にく）が苦手（にがて）だが、全然（ぜんぜん）食べない＿＿。","gloss":"我不太能吃肉，但並不是完全不吃。","answer":"わけではない","options":[{"text":"わけではない","meaning":"並不是……。部分否定，否定別人可能有的過度理解。","connection":"普通形＋わけではない。ない形＋わけではない＝並不是不。","why":"前句容易讓人以為完全不吃肉，後句否定這個極端。食べない＋わけではない。","example":"嫌（きら）いなわけではないが、今日（きょう）は気分（きぶん）が乗（の）らない。","zh":"並不是討厭，只是今天沒心情。"},{"text":"わけがない","meaning":"絕不可能。完全否定。","connection":"普通形＋わけがない。","why":"「食べないわけがない」＝不可能不吃，也就是一定吃。和「並非完全不吃」的部分否定不同，語氣過滿。","example":"鍵がないのに、開くわけがない。","zh":"沒有鑰匙，不可能打得開。"},{"text":"はずがない","meaning":"按理不可能。","connection":"普通形＋はずがない。根據證據的強否定推測。","why":"不是在推測「他不可能不吃」，而是在修正「我完全不吃肉」這個理解。","example":"真面目な彼が嘘をつくはずがない。","zh":"認真的他不可能說謊。"},{"text":"ことはない","meaning":"不必、用不着。","connection":"動詞辞書形＋ことはない。不接ない形。","why":"食べないことはない若把ない放前面，就不是ことはない這個文法。ことはない要辞書形「食べることはない」＝不必吃，意思變成用不着吃，和原句相反。","example":"心配することはない。","zh":"不必擔心。"}],"level":"N3"},{"id":"g46","kind":"grammar","point":"わけがない","group":"modal","difficulty":4,"stem":"こんなに星（ほし）が出（で）ている。明日（あした）雨（あめ）が降（ふ）る＿＿。","gloss":"星星都出來了。明天不可能下雨。","answer":"わけがない","options":[{"text":"わけがない","meaning":"絕沒有道理會……。說話人覺得根本不可能。","connection":"普通形＋わけがない。降る＋わけがない。","why":"滿天星被說話人當成晴天的根據，所以下雨根本沒道理。主觀的「不可能」用わけがない。","example":"準備していないのに、合格するわけがない。","zh":"都沒準備，不可能合格。"},{"text":"わけではない","meaning":"並不是。部分否定。","connection":"普通形＋わけではない。","why":"「並不是明天下雨」太弱，也不符合看到星星後的強烈判斷。","example":"不可能というわけではない。","zh":"也不是說不可能。"},{"text":"はずだ","meaning":"按理應該會。肯定的推測。","connection":"普通形＋はずだ。","why":"はずだ會變成「按理明天會下雨」，和星星的證據方向相反。","example":"もう届いているはずだ。","zh":"按理已經送到了。"},{"text":"ことになっている","meaning":"規定如此。","connection":"辞書形＋ことになっている。","why":"天氣不是規章。降ることになっている不表示「不可能下雨」。","example":"九時に開くことになっている。","zh":"規定九點開門。"}],"level":"N3"},{"id":"g47","kind":"grammar","point":"わけにはいかない","group":"modal","difficulty":4,"stem":"明日（あした）試験（しけん）があるので、今夜（こんや）遊（あそ）びに行く＿＿。","gloss":"明天有考試，今晚不能去玩。","answer":"わけにはいかない","options":[{"text":"わけにはいかない","meaning":"從道理、責任、情況上不能做。不是物理上做不到。","connection":"動詞辞書形＋わけにはいかない。否定形是「ないわけにはいかない」＝不得不。","why":"去玩在物理上做得到，但因為考試，情理上不該去。辞書形＋わけにはいかない。","example":"上司の前で、その話をするわけにはいかない。","zh":"在上司面前不能說那件事。"},{"text":"ことはない","meaning":"不必做。","connection":"辞書形＋ことはない＝用不着。","why":"ことはない是「沒有必要去玩」，語氣太輕，不像考試前的「不能去」。責任上的不能用わけにはいかない。","example":"全部覚えることはない。","zh":"用不着全部記住。"},{"text":"わけがない","meaning":"絕不可能。","connection":"辞書形＋わけがない。","why":"わけがない否定的是可能性：「不可能去玩」像是事情不會發生。這裡是自己克制不能去，用わけにはいかない。","example":"そんな高い店に入れるわけがない。","zh":"那種貴店根本進不去。"},{"text":"ようになる","meaning":"變得會。","connection":"辞書形＋ようになる。","why":"不是「變得去玩」。和考試的約束無關。","example":"一人で行けるようになる。","zh":"變得可以自己去。"}],"level":"N3"},{"id":"g48","kind":"grammar","point":"ことはない","group":"modal","difficulty":3,"stem":"時間（じかん）はまだある。そんなに急（いそ）ぐ＿＿。","gloss":"時間還有，不必那麼趕。","answer":"ことはない","options":[{"text":"ことはない","meaning":"用不着、不必。","connection":"動詞辞書形＋ことはない。急ぐ＋ことはない。","why":"時間還夠，所以沒有必要趕。這是「不必」，不是「情理上絕對不能趕」。","example":"失敗しても、落ち込むことはない。","zh":"就算失敗，也不必消沉。"},{"text":"わけにはいかない","meaning":"情理上不能。","connection":"辞書形＋わけにはいかない。","why":"「不能趕」過重。句子是勸你不用趕，不是說趕這件事不被允許。","example":"ここで電話するわけにはいかない。","zh":"不能在這裡打電話。"},{"text":"ものではない","meaning":"不該做（常理、禁止的口吻）。","connection":"辞書形＋ものではない。","why":"急ぐものではない像在說「趕本來就是不該的行為」，沒有用到「時間還有所以不必」。","example":"人の失敗を笑うものではない。","zh":"不該笑別人的失敗。"},{"text":"はずがない","meaning":"不可能。","connection":"辞書形＋はずがない。","why":"「不可能趕」和「時間還有」的邏輯不是可能性，而是必要性。","example":"間に合うはずがない。","zh":"不可能趕得上。"}],"level":"N3"},{"id":"g49","kind":"grammar","point":"ないわけにはいかない","group":"modal","difficulty":5,"stem":"先輩（せんぱい）に頼（たの）まれたので、手伝（てつだ）わ＿＿。","gloss":"因為是學長拜託的，不得不幫忙。","answer":"ないわけにはいかない","options":[{"text":"ないわけにはいかない","meaning":"不得不做。從情理上不能拒絕。","connection":"動詞ない形＋わけにはいかない。手伝う→手伝わない＋わけにはいかない。空格在「手伝わ」後，所以是「ないわけにはいかない」。","why":"學長拜託，拒絕不了。二重否定：不幫忙是不行的。接在手伝わ後面。","example":"知っている以上、言わないわけにはいかない。","zh":"既然知道，就不得不說。"},{"text":"ないことはない","meaning":"也不是不能。消極的肯定。","connection":"ない形＋ことはない。","why":"「也不是不能幫忙」太弱，沒有「必須幫」的責任。而且空格要接完整「ないわけにはいかない」才對得上學長拜託。","example":"食べないことはないが、好みではない。","zh":"也不是不能吃，只是不合口味。"},{"text":"わけにはいかない","meaning":"不能做。","connection":"辞書形＋わけにはいかない。若接在手伝わ後面會重複否定。","why":"手伝わ＋わけにはいかない會變成「不幫忙是不行」缺了「ない」，或者讀成語意不完整。不能做的形式不能直接黏在ない語幹後。","example":"断るわけにはいかない。","zh":"不能拒絕。"},{"text":"ことはない","meaning":"不必。","connection":"辞書形＋ことはない。","why":"「不必幫忙」和學長拜託的義務相反。","example":"全部手伝うことはない。","zh":"用不着全部幫忙。"}],"level":"N3"},{"id":"g50","kind":"grammar","point":"そうだ（様態）","group":"modal","difficulty":3,"stem":"このケーキは甘（あま）＿＿。砂糖（さとう）を減（へ）らそう。","gloss":"這個蛋糕看起來會太甜。把糖減少吧。","answer":"そうだ","options":[{"text":"そうだ","meaning":"看起來即將、好像會。依據外觀或眼前的樣子。","connection":"い形容詞去い＋そうだ。甘い→甘そうだ。な形容詞去な。動詞用ます語幹。否定是なさそう。","why":"空格前是「甘」，い已經去掉，正是樣態そうだ的接續。說話人看蛋糕判斷會甜，所以要減糖。","example":"雨が降りそうだ。","zh":"看起來要下雨。"},{"text":"ようだ","meaning":"好像。根據觀察的推測，比そう稍全面。","connection":"い形容詞普通形＋ようだ：甘いようだ。不能接語幹「甘」。","why":"甘ようだ接續錯。ようだ要「甘いようだ」。","example":"このケーキは甘いようだ。","zh":"這個蛋糕好像很甜。"},{"text":"らしい","meaning":"聽起來、似乎（有根據的傳聞或典型）。","connection":"普通形＋らしい。甘いらしい。不接語幹甘。","why":"甘らしい若勉強像「帶甜味的典型」，但接在語幹上不成立。傳聞應是「甘いらしい」。","example":"あの店は甘いらしい。","zh":"聽說那家店很甜。"},{"text":"だろう","meaning":"大概吧。","connection":"普通形＋だろう。甘いだろう。","why":"甘だろう接不上。推量助動詞不接形容詞語幹。","example":"明日は暑いだろう。","zh":"明天大概很熱。"}],"level":"N3"},{"id":"g51","kind":"grammar","point":"そうだ（伝聞）","group":"modal","difficulty":3,"stem":"ニュースによると、今夜（こんや）台風（たいふう）が近（ちか）づく＿＿。","gloss":"據新聞說，今晚颱風會靠近。","answer":"そうだ","options":[{"text":"そうだ","meaning":"據說。傳聞，不是自己看到的樣子。","connection":"普通形＋そうだ。動詞辞書形直接接：近づくそうだ。常和「によると／によれば」一起。","why":"句首有「ニュースによると」，是消息來源。動詞用普通形近づく＋そうだ，這是伝聞，不是樣態。","example":"天気予報によると、明日は雪だそうだ。","zh":"據天氣預報，明天會下雪。"},{"text":"そうになっている","meaning":"沒有這個文法。","connection":"樣態そうだ不接辞書形。近づきそうだ才是「看起來要靠近」。","why":"空格前是辞書形「近づく」。若要樣態必須先變ます語幹「近づきそうだ」。而且有「によると」，必須用伝聞的普通形＋そうだ。","example":"台風が近づきそうだ。","zh":"颱風看起來要靠近了。這句沒有消息來源。"},{"text":"らしいだ","meaning":"らしい後面不再加だ。","connection":"普通形＋らしい。だらしい或らしいだ都不對。名詞直接＋らしい。","why":"近づくらしいだ多了一個だ。傳聞助動詞らしい的終止形就是らしい。","example":"台風が近づくらしい。","zh":"似乎颱風要靠近。"},{"text":"ようだそうだ","meaning":"把推測和傳聞疊在一起，本題空格只需要一個傳聞。","connection":"ようだ本身已是推測，再加そうだ才是「據說好像」。","why":"句子已經有明確的新聞來源，直接「近づくそうだ」即可。空格若放兩個助動詞，和「近づく」後只留一個位置的題目不合，也多餘。","example":"遅れるようだ。","zh":"好像會遲到。"}],"level":"N3"},{"id":"g52","kind":"grammar","point":"らしい","group":"modal","difficulty":4,"stem":"田中（たなか）さんは今日（きょう）は来（こ）ない＿＿。机（つくえ）の上（うえ）に欠席（けっせき）のメモがある。","gloss":"田中今天好像不來了。桌上有請假的字條。","answer":"らしい","options":[{"text":"らしい","meaning":"根據客觀線索作出的判斷，或典型特徵。","connection":"普通形＋らしい。ない形直接接：来ないらしい。","why":"字條是看得見的客觀根據，所以判斷他不來。来ない＋らしい。不是「看起來快不來」的樣態。","example":"電気が消えている。もう寝たらしい。","zh":"燈關了。好像已經睡了。"},{"text":"そうだ","meaning":"樣態要語幹；伝聞要消息來源。","connection":"來ない的樣態是「来なさそう」，不能「来ないそうだ」當樣態。伝聞的「来ないそうだ」需要「によると」。","why":"這裡的根據是字條，不是某人告訴你，也不是「他看起來即將不來」。用らしい。","example":"来なさそうな顔をしている。","zh":"一臉好像不會來的樣子。"},{"text":"みたいだ","meaning":"好像。口語，多憑感覺。","connection":"普通形＋みたいだ。文法上能接「来ないみたいだ」。","why":"桌上的欠席字條是客觀證據，不是「感覺好像」。有明確線索時用らしい。みたいだ缺少「根據客觀事實來判斷」這一條。","example":"夢を見ているみたいだ。","zh":"好像在做夢。"},{"text":"はずがない","meaning":"絕不可能。","connection":"普通形＋はずがない。","why":"「不可能不來」等於一定來，和字條相反。","example":"彼が欠席するはずがない。","zh":"他不可能缺席。"}],"level":"N3"},{"id":"g53","kind":"grammar","point":"ように（目的）","group":"purpose","difficulty":4,"stem":"後（うし）ろの人（ひと）にも聞（き）こえる＿＿、大きな声（こえ）で話（はな）した。","gloss":"為了讓後面的人也聽得見，用很大的聲音說。","answer":"ように","options":[{"text":"ように","meaning":"為了使某種狀態實現。後句才是為達此目的而做的動作。","connection":"無意志動詞、可能形、ない形＋ように。聞こえる是無意志，不能用ために。","why":"「聽得見」不是說話人的意志動詞，而是希望達成的狀態。聞こえる＋ように＋話した。","example":"忘れないように、メモした。","zh":"為了不忘，做了筆記。"},{"text":"ために","meaning":"為了。只接意志動詞或名詞。","connection":"意志動詞辞書形＋ために。聞こえる這種無意志／可能義不能接。","why":"聞こえるために話した不自然。為了「被聽見、聽得見」要用ように，不用ために。","example":"合格するために、勉強する。","zh":"為了合格而讀書。"},{"text":"のに","meaning":"明明卻；或為了做某事所需。","connection":"逆接是普通形＋のに。表「所需」時是辞書形＋のに＋時間／お金。","why":"後句是「用大聲說」，不是轉折，也不是「為了聽見所花的時間」。","example":"分かるのに、三日かかった。","zh":"為了弄懂，花了三天。"},{"text":"そうに","meaning":"看起來要……地。","connection":"語幹＋そうに＋動詞。聞こえる的語幹不是そのまま。","why":"聞こえるそうに接續錯。樣態要「聞こえそうに」，而且意思會變成「好像聽得見似的說」，不是目的。","example":"泣きそうに、話した。","zh":"像要哭出來那樣說。"}],"level":"N3"},{"id":"g54","kind":"grammar","point":"ために（目的）","group":"purpose","difficulty":3,"stem":"留学（りゅうがく）する＿＿、お金（かね）を貯（た）めている。","gloss":"為了去留學，正在存錢。","answer":"ために","options":[{"text":"ために","meaning":"為了做成某件有意志的事。","connection":"意志動詞辞書形＋ために。する＋ために。後句是為該目的做的行動。","why":"留學是意志動詞，存錢是為了它。する＋ために。不用ように。","example":"家を買うために、働いている。","zh":"為了買房而工作。"},{"text":"ように","meaning":"為了達成無意志的狀態。","connection":"無意志・可能・否定＋ように。","why":"「するように」會變成「為了變得會做／留意去做留學」，不表示目的地去留學這件事本身。意志目的用ために。","example":"遅れないように、早めに出る。","zh":"為了不遲到，提早出門。"},{"text":"せいで","meaning":"都怪，負面原因。","connection":"普通形＋せいで＋壞結果。","why":"存錢不是留學造成的壞事。方向是目的，不是責備。","example":"留学したせいで、借金が残った。","zh":"都怪留了學，還留着債。那才是せいで。"},{"text":"うちに","meaning":"趁着。","connection":"辞書形＋うちに。","why":"不是趁留學時存錢（人還沒去）。時間窗口不成立。","example":"日本にいるうちに、会っておきたい。","zh":"趁還在日本時想見一面。"}],"level":"N3"},{"id":"g55","kind":"grammar","point":"ておく","group":"aspect","difficulty":2,"stem":"客（きゃく）が来（く）る前（まえ）に、部屋（へや）を片付（かたづ）けて＿＿。","gloss":"客人來之前，先把房間收拾好。","answer":"おいた","options":[{"text":"おいた","meaning":"事先做好，以備之後。","connection":"動詞て形＋おく。片付ける→片付けておく。","why":"在客人來之前先收拾，是為之後做準備。て＋おく的た形おいた。","example":"資料は先にコピーしておいた。","zh":"資料事先影印好了。"},{"text":"みた","meaning":"試着做做看。","connection":"て形＋みる。","why":"不是試着收拾看看結果如何，而是為客人做準備。","example":"一度着てみた。","zh":"試穿了一次。"},{"text":"しまった","meaning":"做完了（完了）或後悔。","connection":"て形＋しまう。","why":"しまった只表示收拾這個動作結束或後悔，沒有「為了客人先做好」的準備義。","example":"宿題を全部やってしまった。","zh":"作業全部做完了。"},{"text":"あった","meaning":"某動作做完後的狀態還留着。","connection":"他動詞て形＋ある。片付けてある。主語多是東西，不是人去做的準備宣告。","why":"空格前已是片付けて，若加あった＝片付けてあった，表示房間處於已被收拾的狀態，句子卻是人在客人前做的準備行為，用おく。","example":"窓が開けてある。","zh":"窗戶開着（被人開好留着）。"}],"level":"N3"},{"id":"g56","kind":"grammar","point":"てある","group":"aspect","difficulty":3,"stem":"机（つくえ）の上（うえ）に資料（しりょう）が並（なら）べ＿＿。","gloss":"桌上資料已經擺好了（還保持那個狀態）。","answer":"てある","options":[{"text":"てある","meaning":"某人有意做的動作，結果現在還留着。","connection":"他動詞て形＋ある。並べる→並べてある。主語用が，是被準備好的東西。","why":"資料是被擺的對象，現在仍是擺好的狀態。他動詞＋てある，主語「資料が」。","example":"壁に地図が貼ってある。","zh":"牆上貼着地圖。"},{"text":"ている","meaning":"自動詞的結果狀態，或動作進行。","connection":"自動詞＋ている表狀態：開いている。他動詞ている多是人正在做，主語是人。","why":"並べる是他動詞。資料が並べている會把資料當成動作主體。人擺好後留下的狀態要用てある。","example":"窓が開いている。","zh":"窗戶開着。"},{"text":"ておく","meaning":"事先做。","connection":"て形＋おく。主語通常是做事的人，不是「資料が」。","why":"資料が並べておく主語不對。おく是人要去做準備，ある是狀態已經在。","example":"資料を並べておく。","zh":"我先把資料擺好。"},{"text":"てしまう","meaning":"完了或後悔。","connection":"て形＋しまう。","why":"並べてしまう表示擺完這一動作結束，不強調現在桌上仍保持被擺好的狀態。","example":"全部並べてしまった。","zh":"全部擺完了。"}],"level":"N3"},{"id":"g57","kind":"grammar","point":"てしまう","group":"aspect","difficulty":2,"stem":"バスに財布（さいふ）を忘（わす）れて＿＿。","gloss":"把錢包忘在公車上了（後悔）。","answer":"しまった","options":[{"text":"しまった","meaning":"不小心做成了，帶後悔。也可以只表完了。","connection":"動詞て形＋しまう。忘れる→忘れてしまう。","why":"忘在車上是不希望的結果，說話人後悔。て＋しまった。","example":"大事なファイルを消してしまった。","zh":"把重要檔案刪掉了。"},{"text":"おいた","meaning":"有意事先放好。","connection":"て形＋おく。","why":"忘れておいた會變成故意先忘好，和丢錢包的後悔相反。","example":"荷物を座席に置いておいた。","zh":"先把行李放在座位上。那是有意的。"},{"text":"みた","meaning":"試着。","connection":"て形＋みる。","why":"沒有人試着把錢包忘掉。","example":"探してみた。","zh":"試着找了找。"},{"text":"あった","meaning":"被做好留着的狀態。","connection":"他動詞＋てある，主語是物。","why":"財布を忘れてあった不是「我把它忘了」的後悔句。","example":"メモが置いてあった。","zh":"放着一張字條。"}],"level":"N3"},{"id":"g58","kind":"grammar","point":"っぱなし","group":"aspect","difficulty":4,"stem":"窓（まど）を開（あ）け＿＿出（で）かけたら、雨（あめ）が降（ふ）ってきた。","gloss":"窗開着就出門，結果下起雨來。","answer":"っぱなしで","options":[{"text":"っぱなしで","meaning":"做了之後就放着不管。常含不該如此。","connection":"動詞ます語幹＋っぱなし。開ける→開け＋っぱなし。","why":"空格在「開け」後。窗開了卻不關就出門，是放着不管。語幹＋っぱなしで。","example":"水を出しっぱなしにしないで。","zh":"別讓水一直開着。"},{"text":"きって","meaning":"做到底、完全。","connection":"ます語幹＋きる。開けきる＝完全打開。","why":"開けきって出かける只是開到最大後出門，沒有「不關就放着」的責備。","example":"読みきった。","zh":"全部讀完了。"},{"text":"かけて","meaning":"做到一半。","connection":"ます語幹＋かける。","why":"開けかけて是開始開、還沒開完，不是開着不管。","example":"書きかけの手紙。","zh":"寫到一半的信。"},{"text":"ぬいて","meaning":"拼命做到最後。","connection":"ます語幹＋ぬく。","why":"開けぬく不是「開着不管」，而是把開這個動作硬做完。","example":"走りぬいた。","zh":"堅持跑完了。"}],"level":"N3"},{"id":"g59","kind":"grammar","point":"きり","group":"aspect","difficulty":5,"stem":"彼（かれ）は「すぐ戻（もど）る」と言（い）った＿＿、帰（かえ）ってこない。","gloss":"他說了馬上回來之後，就再也沒回來。","answer":"きり","options":[{"text":"きり","meaning":"以那次為最後，之後就一直沒有下文。","connection":"動詞た形＋きり。後句常是否定：戻ったきり帰ってこない。","why":"空格前是「言った」。說了那句就沒再出現。た形＋きり＋否定，表示之後一直如此。","example":"寝たきり、起きてこない。","zh":"睡着之後就一直沒起來。"},{"text":"とたん","meaning":"一……立刻就。","connection":"た形＋とたん。後句是幾乎同時的意外，不是長時間不回來。","why":"說完馬上就「一直不回來」不是同一瞬間。長期沒下文用きり。","example":"言ったとたん、顔が赤くなった。","zh":"一說完，臉就紅了。"},{"text":"ばかり","meaning":"剛剛。","connection":"た形＋ばかり。","why":"言ったばかり是剛說完，不能直接接「不回來」表示從此失聯。","example":"今、言ったばかりだ。","zh":"現在剛說完。"},{"text":"以来","meaning":"自……以來。","connection":"て形＋以来。言って以来。不接た形。","why":"言った以来少了て形。自那以後的持續雖然接近，但「說了再也不……」的固定形式是たきり。","example":"出て以来、連絡がない。","zh":"出去以後就沒聯絡。"}],"level":"N3"},{"id":"g60","kind":"grammar","point":"かける","group":"aspect","difficulty":4,"stem":"読（よ）み＿＿の本（ほん）が机（つくえ）に残（のこ）っている。","gloss":"讀到一半的書還在桌上。","answer":"かけ","options":[{"text":"かけ","meaning":"做到一半、還沒做完。","connection":"ます語幹＋かけ＋の＋名詞，或＋かける。読む→読みかけ。","why":"書還在、沒讀完。語幹読み＋かけ＋の本。","example":"食べかけのパン。","zh":"吃到一半的麵包。"},{"text":"きり","meaning":"以此為最後。","connection":"た形＋きり。不接ます語幹＋の。","why":"読みきりの本不表示讀到一半。","example":"出たきり戻らない。","zh":"出去就沒回來。"},{"text":"ぬく","meaning":"做到底。","connection":"ます語幹＋ぬく。読みぬく＝讀完、堅持讀完。","why":"読みぬくの本會變成讀完的書，和「還留在桌上沒讀完」相反。而且ぬく後不加の當「一半」。","example":"最後まで読みぬいた。","zh":"堅持讀到了最後。"},{"text":"がち","meaning":"容易、往往（不好的傾向）。","connection":"ます語幹＋がち。読みがち＝往往會讀，不是「讀到一半的」。","why":"読みがちの本不是「讀了一半的書」。","example":"曇りがちの天気。","zh":"往往多雲的天氣。"}],"level":"N3"},{"id":"g61","kind":"grammar","point":"がち","group":"tendency","difficulty":3,"stem":"冬（ふゆ）は風邪（かぜ）を引（ひ）き＿＿なので、気（き）を付（つ）けている。","gloss":"冬天容易感冒，所以很注意。","answer":"がち","options":[{"text":"がち","meaning":"往往容易變成不好的情況。","connection":"ます語幹＋がち。引く→引きがち。名詞＋がち：病気がち。","why":"感冒是不希望的反覆傾向。引き＋がち＋なので。","example":"彼は最近、遅れがちだ。","zh":"他最近往往遲到。"},{"text":"っぽい","meaning":"帶有……的感覺，口語。","connection":"名詞或語幹＋っぽい。引きっぽい不自然。","why":"っぽい多是「看起來像」，不是「容易反覆感冒」的傾向。引きっぽい不像日語。","example":"子供っぽい言い方。","zh":"孩子氣的說法。"},{"text":"気味","meaning":"略有一點……（已有的輕微狀態）。","connection":"ます語幹＋気味。疲れ気味＝有點累。","why":"引き気味會像「已經有點在感冒」，不是「冬天容易患上」的傾向。容易發生用がち。","example":"今日は少し疲れ気味だ。","zh":"今天有點累。"},{"text":"うる","meaning":"有可能發生。","connection":"ます語幹＋うる。起こりうる。","why":"引きうる是「有可能感冒」的可能，不是季節性的不良傾向。","example":"その事故は起こりうる。","zh":"那種事故有可能發生。"}],"level":"N3"},{"id":"g62","kind":"grammar","point":"っぽい","group":"tendency","difficulty":3,"stem":"あの黒（くろ）い服（ふく）は、ちょっと安（やす）＿＿。","gloss":"那件黑衣服看起來有點廉價。","answer":"っぽい","options":[{"text":"っぽい","meaning":"看起來挺……、帶那種味道。口語，評價常不太客氣。","connection":"名詞或い形容詞語幹＋っぽい。安い→安っぽい。","why":"空格前是「安」，い已去掉。安っぽい＝看起來便宜、廉價感。","example":"この料理は油っぽい。","zh":"這道菜油膩膩的。"},{"text":"がち","meaning":"容易發生不好的事。","connection":"ます語幹・名詞＋がち。不接形容詞語幹安。","why":"安がち不成立。がち不表示外觀給人的感覺。","example":"忘れがちだ。","zh":"往往會忘。"},{"text":"そう","meaning":"看起來會。","connection":"形容詞語幹＋そう。安そう＝看起來便宜（較中性的外觀推測）。","why":"安そう是「好像便宜」。安っぽい多一層「廉價、不上檔」的評價。題目有「ちょっと」加黑衣服的負面品評，用っぽい。","example":"この靴は高そうだ。","zh":"這雙鞋看起來很貴。"},{"text":"気味","meaning":"略帶某狀態。","connection":"語幹＋気味。安気味不說。","why":"気味用於疲勞、感冒這種已有的輕微身心狀態，不用在衣服便宜的外觀。","example":"太り気味だ。","zh":"有點發胖。"}],"level":"N3"},{"id":"g63","kind":"grammar","point":"がたい","group":"tendency","difficulty":4,"stem":"彼（かれ）が嘘（うそ）をつくとは信（しん）じ＿＿。","gloss":"他會說謊這件事，難以相信。","answer":"がたい","options":[{"text":"がたい","meaning":"從心理上難以做到。書面。","connection":"ます語幹＋がたい。信じる→信じがたい。","why":"不是技術上難相信，而是情感上無法接受。信じ＋がたい。","example":"忘れがたい旅だった。","zh":"是一趟難忘的旅行。"},{"text":"にくい","meaning":"做起來困難。","connection":"ます語幹＋にくい。用在操作、理解上的困難，例如読みにくい、書きにくい。","why":"「他會說謊」不是技術上難做，而是情感上無法接受。這種心理上的「難以」用がたい，不用にくい。","example":"この字は読みにくい。","zh":"這個字不好讀。"},{"text":"やすい","meaning":"容易做。","connection":"ます語幹＋やすい。","why":"信じやすい是容易相信，和「難以」相反。","example":"このペンは書きやすい。","zh":"這支筆好寫。"},{"text":"っこない","meaning":"絕不會。","connection":"ます語幹＋っこない。信じっこない＝絕不會去相信，口語很強。","why":"っこない是「我才不會相信」的拒絕行動，不是「難以相信」的心理難度。","example":"そんな話、信じっこない。","zh":"那種話我才不信。"}],"level":"N3"},{"id":"g64","kind":"grammar","point":"受身","group":"voice","difficulty":3,"stem":"電車（でんしゃ）の中（なか）で足（あし）を踏（ふ）＿＿。","gloss":"在電車裡被人踩了腳。","answer":"まれた","options":[{"text":"まれた","meaning":"被動。受害或被做。","connection":"五段：踏む→踏まれる。語幹あ段＋れる，た形まれた。","why":"腳是被別人踩的。踏む的受身是踏まれる。空格在「踏」後，所以まれた。","example":"雨に降られた。","zh":"被雨淋了。"},{"text":"んだ","meaning":"踏む的た形踏んだ。主動。","connection":"五段撥音便＋だ：踏んだ。主語自己踩。","why":"踏んだ是自己踩了腳。在電車裡說「足を踏んだ」主語是自己去踩別人，和受害場面相反。","example":"知らない人の足を踏んだ。","zh":"我踩了陌生人的腳。"},{"text":"ませた","meaning":"使役。讓別人踩。","connection":"踏む→踏ませる。","why":"踏ませた是叫別人踩，不是自己的腳被踩。","example":"子供にボタンを押させた。","zh":"讓孩子按了按鈕。"},{"text":"めた","meaning":"可能形踏める的た形，或下一段。","connection":"可能：踏める。","why":"踏めた是「能夠踩到了」，不是被踩。","example":"やっとペダルを踏めた。","zh":"總算踩到踏板了。"}],"level":"N3"},{"id":"g65","kind":"grammar","point":"使役","group":"voice","difficulty":3,"stem":"先生（せんせい）は学生（がくせい）に作文（さくぶん）を書（か）＿＿。","gloss":"老師讓學生寫作文。","answer":"かせた","options":[{"text":"かせた","meaning":"讓別人做。","connection":"書く→書かせる。語幹か＋せる。た形書かせた。空格在「書」後是かせた。","why":"老師是使役者，學生用に，作文用を。書かせた。","example":"子供に野菜を食べさせた。","zh":"讓孩子吃了蔬菜。"},{"text":"かれた","meaning":"被動：被寫。","connection":"書く→書かれる。","why":"書かれた是作文被寫，或人受害。不能表示老師叫學生寫。學生前面的「に」在使役裡是被使役者。","example":"壁に名前を書かれた。","zh":"被人把名字寫在牆上了。"},{"text":"いた","meaning":"書く的た形書いた。","connection":"自己寫。","why":"老師自己寫的話，不該是「学生に作文を書いた」（に會怪）。讓學生寫要用使役。","example":"先生が作文を書いた。","zh":"老師寫了作文。"},{"text":"けた","meaning":"不是寫的活用。","connection":"下一段書ける才是可能。書＋けた不對。","why":"書けた要先有「書ける」。空格前只有「書」，不能接けた。可能形也不表「讓別人寫」。","example":"漢字が書けた。","zh":"漢字寫出來了。"}],"level":"N3"},{"id":"g66","kind":"grammar","point":"使役受身","group":"voice","difficulty":5,"stem":"週末（しゅうまつ）なのに、部長（ぶちょう）に出勤（しゅっきん）＿＿。","gloss":"明明是週末，卻被部長叫去上班。","answer":"させられた","options":[{"text":"させられた","meaning":"被迫做。使役再受身，含不情願。","connection":"する→させられる。出勤する→出勤させられる。","why":"部長用に，自己被要求出勤，而且週末所以不情願。させられた。","example":"苦手な歌を歌わせられた。","zh":"被迫唱了不擅長的歌。"},{"text":"させた","meaning":"自己叫別人做。","connection":"する→させる。","why":"主語若是「我」，させた是我叫別人出勤。這裡是自己被部長叫去，要用被動。","example":"部下を出勤させた。","zh":"叫部下出勤了。"},{"text":"された","meaning":"する的受身された。","connection":"する→される。","why":"出勤された是「被人出勤」的受害用法（例如客人突然來上班打擾），不是自己被命令去上班。被命令用させられる。","example":"休日に来られた。","zh":"假日被人跑來（覺得困擾）。"},{"text":"させてもらった","meaning":"承蒙允許我做。謙讓、感謝。","connection":"させてもらう。","why":"週末被叫去上班不是值得感謝的「請讓我上班」。語氣相反。","example":"見学させてもらった。","zh":"承蒙讓我參觀了。"}],"level":"N3"},{"id":"g67","kind":"grammar","point":"お〜になる","group":"voice","difficulty":4,"stem":"先生（せんせい）はもうお帰（かえ）り＿＿か。","gloss":"老師已經回去了嗎？（尊敬）","answer":"になりました","options":[{"text":"になりました","meaning":"尊敬。抬高對方的動作。","connection":"お＋ます語幹＋になる。帰る→お帰りになる。","why":"空格前已有「お帰り」。問老師的動作要用尊敬お＋語幹＋になる，不用謙讓。","example":"社長はいつお着きになりますか。","zh":"社長什麼時候到呢？"},{"text":"します","meaning":"謙讓或一般。","connection":"お＋語幹＋する是謙讓，動作是自己為對方做。","why":"お帰りします是自己回去（謙讓），不能用來問老師回了沒有。","example":"お先にお帰りします。","zh":"我先告辭了。"},{"text":"されます","meaning":"する的尊敬される，不和お語幹疊成標準敬語。","connection":"尊敬也可以是語幹＋れる：帰られる。お帰りされる不是標準。","why":"お帰りされます把お〜になる和れる混在一起，不自然。","example":"先生はもう帰られましたか。","zh":"老師已經回去了嗎？這句用れる，前面不加お帰り。"},{"text":"います","meaning":"正在。","connection":"て形＋いる。","why":"お帰りいます接續不成立。","example":"先生は研究室にいらっしゃいます。","zh":"老師在研究室。"}],"level":"N3"},{"id":"g68","kind":"grammar","point":"にとって","group":"stance","difficulty":3,"stem":"この奨学金（しょうがくきん）は留学生（りゅうがくせい）＿＿、本当（ほんとう）に助（たす）かる。","gloss":"這筆獎學金對留學生來說，真的很有幫助。","answer":"にとって","options":[{"text":"にとって","meaning":"對某人而言的評價。","connection":"名詞＋にとって。後面多是「難しい、大切だ、助かる」這類評價。","why":"留學生是評價的立場，後面是「很有幫助」。用にとって，不是手段。","example":"子供にとって、この階段は急だ。","zh":"對孩子來說，這樓梯很陡。"},{"text":"によって","meaning":"由於；靠；視……而定。","connection":"名詞＋によって。表原因、手段或差異，不表「對誰而言的價值」。","why":"「靠留學生所以有幫助」或「因留學生」都不是句子的意思。立場評價不用によって。","example":"人によって、感じ方が違う。","zh":"因人而異，感受不同。"},{"text":"に対して","meaning":"針對；與……相對。","connection":"名詞＋に対して。對象或對比。","why":"可以說對留學生的態度，但「對留學生而言很有幫助」的評價立場是にとって，不是對他們做出動作。","example":"客に対して、丁寧に話す。","zh":"對客人說話很有禮貌。"},{"text":"として","meaning":"作為某種身份。","connection":"名詞＋として。","why":"「作為留學生，獎學金很有幫助」語意偏了。不是身份職責，是對他們的價值。","example":"趣味として、写真を撮っている。","zh":"作為興趣在拍照。"}],"level":"N3"},{"id":"g69","kind":"grammar","point":"によって","group":"stance","difficulty":3,"stem":"この書類（しょるい）は担当者（たんとうしゃ）＿＿、書（か）き方（かた）が違（ちが）う。","gloss":"這份文件視負責人不同，寫法也不一樣。","answer":"によって","options":[{"text":"によって","meaning":"視……而定；因……而不同。","connection":"名詞＋によって。後句常有「違う、さまざまな」。也可以表原因或手段。","why":"寫法隨負責人改變。人＋によって＋違う。","example":"国によって、マナーが違う。","zh":"不同國家，禮儀不同。"},{"text":"にとって","meaning":"對……而言。","connection":"名詞＋にとって＋評價。","why":"不是「對負責人來說寫法很……」的評價，而是寫法因人而異。","example":"担当者にとって、この作業は簡単だ。","zh":"對負責人來說，這項工作簡單。"},{"text":"にかけて","meaning":"在某方面（很擅長）。","connection":"名詞＋にかけては。","why":"不表示差異。担当者にかけて書き方が違う不成立。","example":"料理にかけては、彼が一番だ。","zh":"論做菜，他是第一。"},{"text":"をもとに","meaning":"以……為材料、根據。","connection":"名詞＋をもとに。","why":"不是根據負責人來創作，而是因負責人不同而不同。","example":"体験談をもとに、記事を書いた。","zh":"根據親身經歷寫了報導。"}],"level":"N3"},{"id":"g70","kind":"grammar","point":"によると","group":"stance","difficulty":2,"stem":"天気予報（てんきよほう）＿＿、週末（しゅうまつ）は晴（は）れるそうだ。","gloss":"據天氣預報說，週末會放晴。","answer":"によると","options":[{"text":"によると","meaning":"根據某消息來源。後面常是そうだ、らしい。","connection":"名詞＋によると／によれば。必須有傳聞的句尾。","why":"天氣預報是來源，句尾有「晴れるそうだ」。によると配伝聞。","example":"兄によると、その店はもうないそうだ。","zh":"據哥哥說，那家店已經沒了。"},{"text":"にとって","meaning":"對……而言。","connection":"名詞＋にとって。","why":"不是「對天氣預報而言週末會晴」。","example":"農家にとって、雨はありがたい。","zh":"對農家來說，下雨是好事。"},{"text":"によって","meaning":"由於；視情況。","connection":"名詞＋によって。","why":"によって不引出「そうだ」的消息來源。來源用によると。","example":"大雪によって、電車が止まった。","zh":"由於大雪，電車停了。"},{"text":"に対して","meaning":"針對。","connection":"名詞＋に対して。","why":"不是針對天氣預報這件事做動作。","example":"質問に対して、答えた。","zh":"針對問題作了回答。"}],"level":"N3"},{"id":"g71","kind":"grammar","point":"として","group":"stance","difficulty":2,"stem":"彼（かれ）はこのチームに通訳（つうやく）＿＿参加（さんか）している。","gloss":"他以翻譯的身份參加這個隊伍。","answer":"として","options":[{"text":"として","meaning":"作為某種資格、身份。","connection":"名詞＋として。","why":"翻譯是他參加時的角色。通訳＋として。","example":"観光客として、城を見学した。","zh":"作為遊客參觀了城。"},{"text":"にとって","meaning":"對……而言。","connection":"名詞＋にとって＋評價，不接「參加している」表示身份。","why":"通訳にとって參加している不是「以翻譯身份參加」。","example":"通訳にとって、この仕事は難しい。","zh":"對翻譯來說，這工作很難。"},{"text":"によって","meaning":"被；由於。","connection":"名詞＋によって＋受身時是動作主體。","why":"「被翻譯參加」不成。身份用として。","example":"この絵は無名の作家によって描かれた。","zh":"這幅畫是由不知名的畫家畫的。"},{"text":"に対して","meaning":"對某人。","connection":"名詞＋に対して。","why":"不是對翻譯這個人做參加。","example":"通訳に対して、お礼を言った。","zh":"向翻譯道了謝。"}],"level":"N3"},{"id":"g72","kind":"grammar","point":"をもとに","group":"stance","difficulty":3,"stem":"実際（じっさい）にあった話（はなし）＿＿、この小説（しょうせつ）は書（か）かれた。","gloss":"這部小說是根據真實發生的事寫成的。","answer":"をもとに","options":[{"text":"をもとに","meaning":"以……為原材料、依據來做。","connection":"名詞＋をもとに（して）。後面是創作、製作。","why":"真實的事是寫小說的材料。話＋をもとに＋書かれた。","example":"調査結果をもとに、報告書をまとめた。","zh":"根據調查結果整理了報告。"},{"text":"をめぐって","meaning":"圍繞某爭議。","connection":"名詞＋をめぐって。後面多是議論、對立。","why":"不是圍繞真實故事在爭論，而是用它來寫。","example":"予算をめぐって、議論が続いた。","zh":"圍繞預算，討論持續着。"},{"text":"にこたえて","meaning":"回應期待、要求。","connection":"名詞＋にこたえて。","why":"話にこたえて書かれた會變成回應那段話的要求，不是「以它為素材」。","example":"要望にこたえて、時間を延長した。","zh":"應要求延長了時間。"},{"text":"につれて","meaning":"隨着變化。","connection":"變化性名詞／動詞＋につれて。","why":"話不是變化，後面也不是隨之改變。","example":"経験を積むにつれて、上手になる。","zh":"隨着經驗增加，變得更好。"}],"level":"N3"},{"id":"g73","kind":"grammar","point":"をきっかけに","group":"stance","difficulty":3,"stem":"転校（てんこう）＿＿、近所（きんじょ）の友達（ともだち）ができた。","gloss":"以轉學為契機，認識了附近的朋友。","answer":"をきっかけに","options":[{"text":"をきっかけに","meaning":"以某事為開端，之後開始了新的情況。","connection":"名詞＋をきっかけに（して）。動詞是「たの＋の＋をきっかけに」。","why":"轉學是交到朋友的契機，不是原因責備，也不是目的。","example":"旅行をきっかけに、写真を始めた。","zh":"以旅行為契機，開始拍照。"},{"text":"せいで","meaning":"都怪。","connection":"名詞＋の＋せいで。空格前沒有の，且結果要是負面。","why":"交到朋友是好事。轉校せいで少了の，極性也不對。","example":"病気のせいで、行けなかった。","zh":"都怪生病，没去成。"},{"text":"最中に","meaning":"正在進行時。","connection":"名詞＋の＋最中に。","why":"転校最中に少了の。交到朋友也不一定是轉學進行的那一刻被打斷。","example":"引越しの最中に、雨が降った。","zh":"正搬家時下了雨。"},{"text":"に対して","meaning":"針對。","connection":"名詞＋に対して。","why":"不是針對轉學這個對象做動作。","example":"転校に対して、不安がある。","zh":"對轉學感到不安。那是態度，不是契機。"}],"level":"N3"},{"id":"g74","kind":"grammar","point":"だけでなく","group":"addition","difficulty":2,"stem":"この店（みせ）は安い＿＿、サービスもいい。","gloss":"這家店不僅便宜，服務也好。","answer":"だけでなく","options":[{"text":"だけでなく","meaning":"不僅……而且……。後項是追加的同類資訊。","connection":"い形容詞普通形＋だけでなく。な形＋な／名詞直接或である＋だけでなく。","why":"便宜之外還追加服務好，兩邊都是優點。安い＋だけでなく。","example":"日本語だけでなく、英語も話せる。","zh":"不僅會日語，也會說英語。"},{"text":"わりに","meaning":"跟預期相比。","connection":"普通形＋わりに。","why":"服務好不是和便宜相反的意外對比句尾，後面有「も」，是追加。","example":"安いわりに、おいしくない。","zh":"便宜，卻不好吃。那才是對比。"},{"text":"せいで","meaning":"都怪。","connection":"普通形＋せいで。","why":"服務好不是便宜造成的壞結果。","example":"安すぎるせいで、すぐ壊れた。","zh":"都怪太便宜，很快壞了。"},{"text":"うちに","meaning":"趁着。","connection":"普通形＋うちに。","why":"沒有趁便宜時做某事的時間關係。","example":"安いうちに、買っておこう。","zh":"趁還便宜時買吧。"}],"level":"N3"},{"id":"g75","kind":"grammar","point":"どころか","group":"addition","difficulty":5,"stem":"宿題（しゅくだい）が減（へ）る＿＿、倍（ばい）に増（ふ）えた。","gloss":"作業哪裡是減少，反而增加了一倍。","answer":"どころか","options":[{"text":"どころか","meaning":"別說……了，事實是更相反的一邊。","connection":"普通形＋どころか。名詞可直接。後句比前句更甚，而且方向相反或差距大。","why":"人家以為會減少，結果不僅沒減少，還加倍。減る＋どころか。","example":"静かなどころか、うるさい。","zh":"哪裡安靜，吵得很。"},{"text":"だけでなく","meaning":"不僅而且。後項是追加，方向通常相同。","connection":"辞書形＋だけでなく＋も。","why":"加倍增加不是「減少」的同類追加。方向相反，要用どころか。","example":"減るだけでなく、なくなる。","zh":"不僅變少，還會消失。那是同一方向。"},{"text":"おかげで","meaning":"多虧。","connection":"普通形＋おかげで＋好結果。","why":"增加一倍的作業不是好結果。","example":"手伝ってくれたおかげで、減った。","zh":"多虧有人幫忙，變少了。"},{"text":"一方で","meaning":"另一方面。中性並列。","connection":"普通形＋一方で。","why":"一方で只是換一面，沒有「與預期完全相反、更嚴重」的力量。","example":"宿題は減った。一方で、試験が増えた。","zh":"作業少了。另一方面，考試變多了。"}],"level":"N3"},{"id":"g76","kind":"grammar","point":"というより","group":"addition","difficulty":4,"stem":"あの人（ひと）は慎重（しんちょう）＿＿、怖（こわ）がりなだけだ。","gloss":"那個人與其說是慎重，不如說只是膽小。","answer":"というより","options":[{"text":"というより","meaning":"與其說是 A，不如說是 B。B 才是說話人認為更準的說法。","connection":"普通形・名詞・な形語幹＋というより。慎重是な形容詞語幹，可直接＋というより。","why":"說話人否定「慎重」這個說法，改口成膽小。語幹＋というより。","example":"上手というより、運がよかっただけだ。","zh":"與其說厲害，不如說只是運氣好。"},{"text":"どころか","meaning":"別說了，根本是相反。","connection":"語幹＋どころか後面常是否定或更極端，不太接「なだけだ」這種改口。","why":"慎重どころか會期待後面是完全相反的批評句，但「只是膽小」是重新定義，不是徹底否定後再追加。改口用というより。","example":"慎重などころか、無謀だ。","zh":"哪裡慎重，魯莽得很。"},{"text":"わりに","meaning":"相對預期。","connection":"な形＋な＋わりに。慎重わりに少了な，而且不表示改口。","why":"不是「以慎重來說卻很膽小」的比例，而是兩個名稱哪一個更準。","example":"慎重なわりに、失敗が多い。","zh":"挺慎重的，失敗卻很多。"},{"text":"として","meaning":"作為。","connection":"名詞＋として。慎重不是以身份參加。","why":"慎重として怖がり不成立。","example":"リーダーとして、決める。","zh":"作為領導來做決定。"}],"level":"N3"},{"id":"g77","kind":"grammar","point":"かわりに","group":"addition","difficulty":3,"stem":"日曜（にちよう）に出勤（しゅっきん）する＿＿、月曜（げつよう）は休（やす）みだ。","gloss":"星期日出勤，作為交換星期一休息。","answer":"かわりに","options":[{"text":"かわりに","meaning":"作為交換；代替。","connection":"普通形＋かわりに。名詞＋の＋かわりに＝代替某人事物。","why":"週日出勤，用星期一的休息來交換。する＋かわりに。","example":"私が料理するかわりに、あなたは掃除して。","zh":"我來做菜，換你打掃。"},{"text":"せいで","meaning":"都怪。","connection":"普通形＋せいで。","why":"星期一休息不是星期日出勤的壞結果責備，而是補償。","example":"出勤したせいで、疲れた。","zh":"都怪出勤，累了。"},{"text":"うちに","meaning":"趁着。","connection":"辞書形＋うちに。","why":"不是趁出勤時星期一休息。","example":"休めるうちに、旅行する。","zh":"趁還能休息時去旅行。"},{"text":"とともに","meaning":"隨着；和……一起。","connection":"辞書形＋とともに＋變化。","why":"星期一休息不是和出勤一起變化。","example":"出発するとともに、雨が降り出した。","zh":"剛出發，雨就下起來了。"}],"level":"N3"},{"id":"g78","kind":"grammar","point":"はもちろん","group":"addition","difficulty":3,"stem":"漢字（かんじ）＿＿、ひらがなもまだ覚（おぼ）えられない。","gloss":"漢字就不用說了，連平假名都還沒記住。","answer":"はもちろん","options":[{"text":"はもちろん","meaning":"A 自不必說，B 也……。A 是更明顯的一項。","connection":"名詞＋はもちろん。後面常有も。","why":"漢字比平假名更難，所以漢字不用說，平假名也還不會。難的在前時，是「連簡單的都不會」的強調，はもちろん可以；若要「連……都」有時用どころか。此句漢字在前、ひらがなも，是前者更不用說。","example":"東京はもちろん、地方にも支店がある。","zh":"東京自不必說，地方也有分店。"},{"text":"をきっかけに","meaning":"以……為契機。","connection":"名詞＋をきっかけに＋新的開始。","why":"沒有開始新事情。漢字をきっかけに平假名不會，因果不成立。","example":"失敗をきっかけに、やり方を変えた。","zh":"以失敗為契機，改變了做法。"},{"text":"にとって","meaning":"對……而言。","connection":"名詞＋にとって。","why":"不是對漢字而言平假名不會。","example":"初心者にとって、漢字は壁だ。","zh":"對初學者來說，漢字是一堵牆。"},{"text":"おきに","meaning":"每隔。","connection":"數量＋おきに。","why":"漢字不是時間間隔。","example":"一週間おきに、試験がある。","zh":"每隔一週有考試。"}],"level":"N3"},{"id":"g79","kind":"grammar","point":"を問わず","group":"addition","difficulty":4,"stem":"この講座（こうざ）は、年齢（ねんれい）＿＿、誰（だれ）でも申（もう）し込（こ）める。","gloss":"這個講座不論年齡，誰都可以申請。","answer":"を問わず","options":[{"text":"を問わず","meaning":"不論、不管該差異。","connection":"名詞＋を問わず。常是年齡、性別、経験、季節這種對立範圍。","why":"年齡不是條件。年齢＋を問わず＋誰でも。","example":"経験の有無を問わず、参加できる。","zh":"不論有沒有經驗都能參加。"},{"text":"に応じて","meaning":"按照、視程度而。","connection":"名詞＋に応じて。後面應是隨之改變的做法，不是「誰都可以、沒有差別」。","why":"若按年齡，做法應該不同。句子是誰都能申請，沒有差別，不能用に応じて。","example":"人数に応じて、材料を用意する。","zh":"按照人數準備材料。"},{"text":"をはじめ","meaning":"以……為首。","connection":"名詞＋をはじめ（として）。表示代表例子加上其他。","why":"年齡開頭並不表示還有其他年齡以外的條件列舉。","example":"東京をはじめ、五つの都市で開催する。","zh":"以東京為首，在五個城市舉辦。"},{"text":"によって","meaning":"視……而定（因而不同）。","connection":"名詞＋によって＋違う。","why":"によって會暗示因年齡而不同，和「誰でも」矛盾。","example":"年齢によって、料金が違う。","zh":"依年齡，費用不同。"}],"level":"N3"},{"id":"g80","kind":"grammar","point":"にわたって","group":"addition","difficulty":4,"stem":"その地方（ちほう）では、三時間（じかん）＿＿雨（あめ）が降（ふ）り続（つづ）いた。","gloss":"那個地方雨連續下了長達三小時。","answer":"にわたって","options":[{"text":"にわたって","meaning":"涵蓋一整段時間或範圍，強調又長又廣。","connection":"期間・範圍名詞＋にわたって。","why":"三小時是一段持續範圍，雨一直下、覆蓋整段。用にわたって。","example":"十年にわたって、調査を続けた。","zh":"調查持續了長達十年。"},{"text":"おきに","meaning":"每隔。","connection":"數量＋おきに。","why":"每隔三小時下雨，不是連續下了三小時。","example":"三時間おきに、薬を飲む。","zh":"每隔三小時吃藥。"},{"text":"ごとに","meaning":"每一。","connection":"數量＋ごとに。","why":"三時間ごとに是每三小時發生一次，不是連續覆蓋三小時。","example":"三時間ごとに、休憩する。","zh":"每三小時休息一次。"},{"text":"までに","meaning":"在……之前。","connection":"時間＋までに是期限。","why":"三時間までに降り続いた會變成三小時之前就一直下，期限點不對。","example":"三時間までに、着く。","zh":"三小時之內到達。"}],"level":"N3"},{"id":"g81","kind":"grammar","point":"とおり","group":"aspect","difficulty":2,"stem":"説明書（せつめいしょ）＿＿組み立てれば、誰（だれ）でもできる。","gloss":"只要照說明書組裝，誰都可以。","answer":"のとおりに","options":[{"text":"のとおりに","meaning":"按照、正如。","connection":"名詞＋の＋とおりに。動詞辞書・た形＋とおりに。","why":"說明書是名詞，要「の＋とおりに」。照着它做。","example":"先生が言ったとおりに、書いた。","zh":"照老師說的寫了。"},{"text":"のとおりで","meaning":"どおり的中頓，後面不接動詞命令式條件。","connection":"のとおりだ是終止。接「組み立てれば」要用とおりに。","why":"のとおりで組み立てれば把判斷中頓和做法接錯。做法是「のとおりに＋動詞」。","example":"結果は予想のとおりだ。","zh":"結果正如所料。"},{"text":"にとって","meaning":"對……而言。","connection":"名詞＋にとって。","why":"不是對說明書而言誰都能組。","example":"初心者にとって、この説明書は難しい。","zh":"對初學者來說，這份說明書很難。"},{"text":"かわりに","meaning":"代替。","connection":"名詞＋の＋かわりに。","why":"不是用別的東西代替說明書。照着做用とおり。","example":"説明書のかわりに、動画を見た。","zh":"沒看說明書，改看了影片。"}],"level":"N3"},{"id":"g82","kind":"grammar","point":"まま","group":"aspect","difficulty":2,"stem":"靴（くつ）を履（は）いた＿＿、部屋（へや）に上（あ）がってしまった。","gloss":"穿着鞋就進到房間裡了。","answer":"まま","options":[{"text":"まま","meaning":"保持該狀態不變，就做了下一件事。","connection":"動詞た形＋まま。ない形＋まま。名詞＋の＋まま。","why":"鞋穿上的狀態沒有改變就進了房間。履いた＋まま。","example":"窓を開けたまま、寝た。","zh":"窗開着就睡着了。"},{"text":"とおり","meaning":"按照。","connection":"た形＋とおり＝如所做的那樣。","why":"「如穿着鞋那樣進房間」不是原句。原句是狀態沒改。","example":"履いたとおり、サイズが合った。","zh":"如試穿那樣，尺寸合適。"},{"text":"きり","meaning":"之後就一直沒有下文。","connection":"た形＋きり＋否定的長期狀態。","why":"履いたきり上がってしまった不是「穿上之後就再也不」。後句是進了房間，不是失聯式的否定。","example":"履いたきり、脱がない。","zh":"穿上之後就一直不脫。"},{"text":"とたん","meaning":"一……立刻。","connection":"た形＋とたん。","why":"不是一穿上鞋就立刻意外進房間的瞬間連鎖，而是帶着穿鞋的狀態進去。","example":"履いたとたん、紐が切れた。","zh":"一穿上，鞋帶就斷了。"}],"level":"N3"},{"id":"g83","kind":"grammar","point":"向け","group":"stance","difficulty":4,"stem":"これは初心者（しょしんしゃ）＿＿に書（か）かれた文法書（ぶんぽうしょ）だ。","gloss":"這是寫給初學者的文法書。","answer":"向け","options":[{"text":"向け","meaning":"專為某對象而做的。","connection":"名詞＋向け。初心者向けの本。","why":"書是為初學者這個對象設計的。向け。","example":"子供向けの番組。","zh":"兒童向的節目。"},{"text":"向き","meaning":"適合某類人。","connection":"名詞＋向き。適合，不一定是專為他們製作。","why":"向き是「適合初學者」，向け是「為初學者而寫」。句中「書かれた」表示創作時的對象，用向け。","example":"この靴は山歩き向きだ。","zh":"這雙鞋適合爬山。"},{"text":"相手","meaning":"對象、對方。","connection":"名詞＋を相手に。不直接「初心者相手に書かれた」當產品定位的固定後綴。","why":"相手是「把某人當交往對象」：子供を相手に。產品「寫給誰」的後綴是向け，不說初心者相手に書かれた。","example":"子供を相手に、芝居をした。","zh":"以孩子為對象演了戲。"},{"text":"通り","meaning":"按照。","connection":"名詞＋の＋通り。","why":"不是照初學者來寫的意思（那也怪），而是給他們用。","example":"計画通りに進んだ。","zh":"按計劃進行了。"}],"level":"N3"},{"id":"g84","kind":"grammar","point":"しか〜ない","group":"degree","difficulty":2,"stem":"財布（さいふ）には千円（せんえん）＿＿残（のこ）っていない。","gloss":"錢包裡只剩一千日圓。","answer":"しか","options":[{"text":"しか","meaning":"只有。後面必須是否定，語感是少。","connection":"名詞＋しか＋動詞ない形。肯定形不能接。","why":"残っていない是否定，前面千円しか，表示少到只剩這些。","example":"今日は水しか飲んでいない。","zh":"今天只喝了水。"},{"text":"だけ","meaning":"只。後面用肯定。","connection":"名詞＋だけ＋肯定動詞。","why":"だけ後面若接残っていない，會變成「只是沒剩下一千」，不是「只剩一千」。只剩要用しか＋否定，或「千円だけ残っている」。","example":"千円だけ残っている。","zh":"只剩着一千日圓。這句是肯定。"},{"text":"ほど","meaning":"程度；沒有……那麼。","connection":"名詞＋ほど＋否定＝沒那麼。","why":"千円ほど残っていない是「連一千都沒剩下」或程度，不是「只剩一千」。","example":"期待したほど残っていない。","zh":"沒有預期剩得多。"},{"text":"まで","meaning":"直到、甚至。","connection":"名詞＋まで。","why":"千円まで残っていない不表示僅剩的限定。","example":"最後の一円まで使った。","zh":"連最後一日圓都用掉了。"}],"level":"N3"},{"id":"g85","kind":"grammar","point":"ほど〜ない","group":"degree","difficulty":3,"stem":"今年（ことし）の夏（なつ）は、去年（きょねん）＿＿暑（あつ）くない。","gloss":"今年夏天沒有去年那麼熱。","answer":"ほど","options":[{"text":"ほど","meaning":"沒有……那麼。","connection":"名詞＋ほど＋否定。比較的基準放在ほど前。","why":"去年是基準，今年沒有它熱。去年＋ほど＋暑くない。","example":"想像したほど難しくない。","zh":"沒有想像中那麼難。"},{"text":"だけ","meaning":"只。後面多接肯定。","connection":"名詞＋だけ＋肯定。要說「只有……不」時，限定加否定要用しか，不用だけ。","why":"去年だけ暑くない會變成「只有去年不熱」，不是拿去年當「沒有那麼熱」的比較基準。","example":"今年だけ暑い。","zh":"只有今年熱。"},{"text":"しか","meaning":"只有＋否定。","connection":"名詞＋しか＋否定。","why":"去年しか暑くない是「只有去年熱」，比較對象和意思都錯。","example":"去年しか行っていない。","zh":"只有去年去了。"},{"text":"まで","meaning":"直到。","connection":"名詞＋まで。","why":"去年まで暑くない不構成「沒有去年那麼熱」。","example":"去年まで、この仕事をしていた。","zh":"直到去年都在做這工作。"}],"level":"N3"},{"id":"g86","kind":"grammar","point":"すぎる","group":"degree","difficulty":2,"stem":"このスープは塩辛（しおから）＿＿て、全部（ぜんぶ）は飲（の）めない。","gloss":"這湯太鹹了，沒辦法全部喝完。","answer":"すぎ","options":[{"text":"すぎ","meaning":"過於。超過合適的程度。","connection":"い形容詞去い＋すぎる。塩辛い→塩辛すぎる。動詞ます語幹＋すぎる。","why":"空格在「塩辛」後、て之前。語幹＋すぎ＋て。太鹹所以喝不完。","example":"働きすぎて、倒れた。","zh":"工作過度，倒下了。"},{"text":"そう","meaning":"看起來。","connection":"語幹＋そう。塩辛そうで，て的話是そうで。","why":"塩辛そうて接續不對，樣態中頓是塩辛そうで。而且句子是真的太鹹喝不完，不是看起來鹹。","example":"塩辛そうだ。","zh":"看起來很鹹。"},{"text":"がち","meaning":"容易。","connection":"動詞語幹＋がち。不接形容詞語幹再加て表示過度。","why":"塩辛がちて不成立。","example":"遅くまで起きがちだ。","zh":"往往會熬到很晚。"},{"text":"っぽく","meaning":"帶……感，副詞形。","connection":"語幹＋っぽい。中頓っぽくて。","why":"塩辛っぽくて可以說「有點鹹味」，但程度是「帶鹹」，不是「過於鹹到喝不完」。過度用すぎる。","example":"油っぽくて、重い。","zh":"油膩，而且厚重。"}],"level":"N3"},{"id":"g87","kind":"grammar","point":"ものだ","group":"modal","difficulty":3,"stem":"人間（にんげん）は誰（だれ）でも年（とし）を取（と）る＿＿。","gloss":"人無論是誰都會變老。這是常理。","answer":"ものだ","options":[{"text":"ものだ","meaning":"本來就會如此。普遍常理、道理。","connection":"動詞辞書形＋ものだ。","why":"變老是人的常理，不是某一次的推測，也不是建議。取る＋ものだ。","example":"赤ちゃんは泣くものだ。","zh":"嬰兒本來就會哭。"},{"text":"ことだ","meaning":"應該做。忠告。","connection":"辞書形＋ことだ。","why":"不能勸人「應該變老」。ことだ是建議行動。","example":"よく寝ることだ。","zh":"應該好好睡。"},{"text":"わけにはいかない","meaning":"情理上不能。","connection":"辞書形＋わけにはいかない。","why":"「不能變老」和常理相反。","example":"年を取らないわけにはいかない。","zh":"不可能不變老。那是另一句。"},{"text":"ところだ","meaning":"正要、正在、剛剛。","connection":"辞書形＋ところだ＝正要。","why":"人不是「正要變老」這一個時間點的常理說明。","example":"今、年を取るところだ。","zh":"這句不自然。正要出門：出かけるところだ。"}],"level":"N3"},{"id":"g88","kind":"grammar","point":"たものだ","group":"modal","difficulty":4,"stem":"学生（がくせい）のころは、よくこの店（みせ）に通（かよ）った＿＿。","gloss":"學生時代，以前常常去這家店。","answer":"ものだ","options":[{"text":"ものだ","meaning":"以前常常。帶懷念。","connection":"動詞た形＋ものだ。よく＋た形＋ものだ。","why":"學生時代＋よく＋通った＋ものだ，是懷念從前的習慣。","example":"子供のころは、川で泳いだものだ。","zh":"小時候常常在河裡游泳。"},{"text":"ことだ","meaning":"應該。","connection":"辞書形＋ことだ，不接た形表回憶。","why":"通ったことだ不是「應該去過」。經驗是「たことがある」，懷念習慣是たものだ。","example":"もっと早く寝ることだ。","zh":"應該更早睡。"},{"text":"ばかりだ","meaning":"剛剛；淨是。","connection":"た形＋ばかり＝剛剛。","why":"學生時代不是剛剛。通ったばかり會把時間拉到現在剛去完。","example":"昨日、通ったばかりだ。","zh":"昨天剛去過。"},{"text":"わけだ","meaning":"難怪。","connection":"普通形＋わけだ。","why":"沒有原因推出「所以去了」。是懷念，不是恍然大悟。","example":"近いから、よく通うわけ
