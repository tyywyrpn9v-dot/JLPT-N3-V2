,"answer":"と","options":[{"text":"と","meaning":"引用別人的話。","connection":"普通形＋と＋言う。来ない＋と＋言っていた。","why":"「明天不來」是田中的原話。来ないと言っていた。","example":"母は、早く寝ろと言った。","zh":"媽媽說快去睡。"},{"text":"か","meaning":"是否。","connection":"普通形＋か。","why":"来ないか言っていた會變成「是否不來」，不是引用肯定的內容。","example":"来るかと聞いた。","zh":"問了來不來。"},{"text":"を","meaning":"賓語助詞。","connection":"名詞＋を。不接動詞普通形。","why":"来ないを言っていた不成立。引用用と。","example":"理由を言っていた。","zh":"說着理由。"},{"text":"に","meaning":"方向、對象。","connection":"名詞＋に。","why":"来ないに言っていた不成立。","example":"田中さんに言っていた。","zh":"對田中說了。"}],"level":"N4"},{"id":"n413","kind":"grammar","point":"てくれる","group":"giving","difficulty":2,"stem":"道（みち）が分（わ）からなかったので、知（し）らない人（ひと）が教（おし）えて＿＿。","gloss":"我不認識路，一個陌生人教了我。對方的動作對我有好處。","answer":"くれた","options":[{"text":"くれた","meaning":"別人為我（自己一方）做。","connection":"動詞て形＋くれる。教える→教えてくれる。","why":"陌生人是外人，教的受益者是我。教えてくれた。","example":"友だちが荷物を持ってくれた。","zh":"朋友幫我拿了行李。"},{"text":"あげた","meaning":"我為別人做。","connection":"て形＋あげる。","why":"あげた的方向是我給別人。主語卻是陌生人，不能用あげる。","example":"私は弟に教えてあげた。","zh":"我教了弟弟。"},{"text":"もらった","meaning":"我得到別人為我做。主語是接受的一方。","connection":"て形＋もらう。主語は私。","why":"句子主語是知らない人が。人做主語時用くれる，不是もらう。","example":"知らない人に教えてもらった。","zh":"我請陌生人教了。主語是我。"},{"text":"いただいた","meaning":"もらった的謙讓。","connection":"て形＋いただく。主語仍是接受方。","why":"いただいた同樣要求主語是我。這裡主語是陌生人。","example":"先生に教えていただいた。","zh":"承蒙老師教我。"}],"level":"N4"},{"id":"n414","kind":"grammar","point":"てもらう","group":"giving","difficulty":2,"stem":"私（わたし）は友（とも）だち＿＿、荷物（にもつ）を持（も）ってもらった。","gloss":"我請朋友幫我拿了行李。","answer":"に","options":[{"text":"に","meaning":"請某人做時，做事的人用に。","connection":"人に＋動詞て形＋もらう。主語は依賴的一方。","why":"我是主語，朋友是被請的人。友だちに持ってもらった。","example":"先生に見てもらった。","zh":"請老師看了。"},{"text":"が","meaning":"主語標記。","connection":"人が＋てくれる時，對方做主語。","why":"友だちが持ってもらった會把朋友當主語，和もらう的「我請人」相反。朋友做主語要用くれる。","example":"友だちが持ってくれた。","zh":"朋友幫我拿了。"},{"text":"を","meaning":"賓語。","connection":"荷物を已經在後面。人を持ってもらった不對。","why":"人不是被拿的東西。人用に。","example":"荷物を持った。","zh":"拿了行李。"},{"text":"から","meaning":"從某人那裡得到物品時可用から。","connection":"物をもらう時は人から。動作は人にが基本。","why":"動作的てもらう，對方用に，不用から。","example":"友だちから手紙をもらった。","zh":"從朋友那裡收到信。那是物品。"}],"level":"N4"},{"id":"n415","kind":"grammar","point":"ようと思う","group":"decision","difficulty":2,"stem":"週末（しゅうまつ）は、家（いえ）で映画（えいが）を見＿＿と思（おも）っている。","gloss":"週末想在家看電影。","answer":"よう","options":[{"text":"よう","meaning":"想要做。說話人的意志。","connection":"動詞意向形＋と思う。見る→見よう＋と思う。","why":"空格在「見」後面。想看是自己的打算。見ようと思っている。","example":"来年、留学しようと思う。","zh":"我想明年留學。"},{"text":"る","meaning":"辞書形。","connection":"見ると＋思う＝我認為會看。","why":"見ると思っている是「我覺得（某人）會看」，不是自己想看。意志要用意向形。","example":"彼は見ると思う。","zh":"我覺得他會看。"},{"text":"ない","meaning":"否定。","connection":"見ない＋と思う＝我認為不會看。","why":"見ないと思っている是否定判斷，不是「想看」的意志。意志要用意向形よう。","example":"彼は見ないと思う。","zh":"我覺得他不會看。"},{"text":"て","meaning":"て形。","connection":"見て＋もらう等。","why":"見てと思っている中間少了ほしい或みる。不能直接見てあると思っている表示打算。","example":"映画を見て、寝る。","zh":"看完電影睡覺。"}],"level":"N4"},{"id":"n416","kind":"grammar","point":"ので","group":"cause","difficulty":2,"stem":"電車（でんしゃ）が遅（おく）れた＿＿、会議（かいぎ）に間（ま）に合（あ）わなかった。","gloss":"因為電車晚點，沒趕上會議。","answer":"ので","options":[{"text":"ので","meaning":"因為。原因，語氣比から客觀、柔和。","connection":"普通形＋ので。た形＋ので。な形容詞・名詞＋なので。","why":"晚點是沒趕上的原因。遅れたので。","example":"雨が降っているので、出かけない。","zh":"因為下着雨，不出門。"},{"text":"のに","meaning":"明明卻。","connection":"普通形＋のに。","why":"沒趕上不是和晚點相反的事，是結果。逆接用不上。","example":"遅れたのに、間に合った。","zh":"雖然晚了，卻趕上了。"},{"text":"くせに","meaning":"明明卻，帶責備。多用於人。","connection":"普通形＋くせに。","why":"電車が遅れたくせに不自然。くせに的主語應是本該做到卻沒做到的人，不是電車晚點這個原因。","example":"知っているくせに、教えない。","zh":"明明知道卻不教。"},{"text":"ように","meaning":"為了使某狀態實現。","connection":"普通形＋ように。","why":"不是為了晚點才沒趕上。","example":"遅れないように、早く出た。","zh":"為了不遲到，早出門了。"}],"level":"N4"},{"id":"n417","kind":"grammar","point":"たり","group":"time","difficulty":2,"stem":"日曜日（にちようび）は、洗濯（せんたく）をしたり、部屋（へや）を片付（かたづ）け＿＿して、休（やす）んだ。","gloss":"星期天又洗衣服，又收拾房間，休息了。","answer":"たり","options":[{"text":"たり","meaning":"又做這個又做那個。列舉。","connection":"動詞た形＋り。片付ける→片付けたり。句尾常用〜たりする。","why":"兩件家務並列。したり……片付けたりして。","example":"見たり聞いたりした。","zh":"又看又聽。"},{"text":"ながら","meaning":"一邊。","connection":"ます語幹＋ながら。","why":"片付けながらして重複。同時不是列舉兩件做完的事。","example":"音楽を聞きながら片付けた。","zh":"一邊聽音樂一邊收拾。"},{"text":"て","meaning":"做完一件接一件。","connection":"て形。片付けて。","why":"片付けてして不成立。て形不再加する。","example":"洗濯をして、片付けた。","zh":"洗了衣服，又收拾了。"},{"text":"ても","meaning":"即使。","connection":"て形＋も。","why":"片付けてもして不自然，而且不是讓步。","example":"片付けても、まだ狭い。","zh":"即使收拾了，還是窄。"}],"level":"N4"},{"id":"n418","kind":"grammar","point":"可能形","group":"voice","difficulty":2,"stem":"この瓶（びん）のふたが固（かた）くて、私（わたし）には開（あ）け＿＿。","gloss":"這個瓶蓋太緊，我打不開。","answer":"られない","options":[{"text":"られない","meaning":"打不開。一段動詞的可能是否定。","connection":"開ける是一段。可能形：開けられる。否定：開けられない。空格在開け後面。","why":"蓋太緊所以不能開。可能的否定。","example":"この字は読めない。","zh":"這個字讀不出來。"},{"text":"ない","meaning":"一段動詞的一般否定：不開。","connection":"開けない＝不開，不是「開不了」。","why":"開けない只是不做這個動作。打不開要用可能形られない。","example":"危ないので、開けない。","zh":"因為危險，所以不開。"},{"text":"させない","meaning":"不讓人開。使役否定。","connection":"開けさせない。","why":"不是誰禁止我開，是我自己開不了。","example":"子供に開けさせない。","zh":"不讓孩子開。"},{"text":"てください","meaning":"請做。請求。","connection":"て形＋ください。","why":"開けてください是請別人開，不是自己打不開。","example":"この瓶を開けてください。","zh":"請打開這個瓶子。"}],"level":"N4"},{"id":"n419","kind":"grammar","point":"あいだ","group":"time","difficulty":2,"stem":"子供（こども）が寝（ね）ている＿＿、私（わたし）は本（ほん）を読（よ）んでいた。","gloss":"孩子睡着的那段時間，我一直在看書。","answer":"あいだ","options":[{"text":"あいだ","meaning":"在整段期間裡，後句是持續的狀態。","connection":"動詞ている＋あいだ。後句如果是持續，用あいだ，不用あいだに。","why":"看書是一直持續，和孩子睡着的整段重疊。ている＋あいだ。","example":"夏休みのあいだ、田舎にいた。","zh":"暑假那段時間一直在鄉下。"},{"text":"あいだに","meaning":"在那段期間裡把另一件一次的事做完。","connection":"ている＋あいだに。後句多是完成的瞬間動作。","why":"読んでいた是持續，不是在期間內做完一件事。持續要用あいだ。","example":"寝ているあいだに、洗濯を終えた。","zh":"在睡着的時候把衣服洗完了。"},{"text":"うちに","meaning":"趁狀態改變之前趕緊做。","connection":"ている＋うちに＋意志的一次動作。","why":"不是趁孩子還沒醒趕緊做完，是整段時間都在看。","example":"起きないうちに、出かける。","zh":"趁還沒醒就出門。"},{"text":"時","meaning":"……的時候。一個時間點。","connection":"ている＋時。","why":"時可以是某個時候，不一定是整段期間一直如此。整段持續用あいだ。","example":"寝ている時、電話が鳴った。","zh":"睡着的時候電話響了。"}],"level":"N4"},{"id":"n501","kind":"grammar","point":"たい","group":"advice","difficulty":1,"stem":"暑（あつ）いので、冷（つめ）たいものを飲（の）み＿＿です。","gloss":"因為熱，想喝冷的東西。","answer":"たい","options":[{"text":"たい","meaning":"想做。說話人自己的希望。","connection":"ます語幹＋たい。飲む→飲み＋たい。","why":"想喝的人是說話人。飲みたいです。","example":"日本へ行きたいです。","zh":"想去日本。"},{"text":"たがる","meaning":"別人想做。從外面看第三者的欲望。","connection":"ます語幹＋たがる。","why":"たがる不用在自己說「我想」。主語是我時用たい。","example":"弟はジュースを飲みたがっている。","zh":"弟弟想喝果汁。"},{"text":"てほしい","meaning":"希望別人做。","connection":"て形＋ほしい。飲んでほしい。","why":"飲みてほしい不成立。而且是自己想喝，不是希望別人喝。","example":"水を飲んでほしい。","zh":"希望你喝水。"},{"text":"つもり","meaning":"打算。","connection":"辞書形＋つもり。飲むつもり。","why":"飲みつもり不成立。打算要用飲むつもり，不是語幹。","example":"水を飲むつもりです。","zh":"打算喝水。"}],"level":"N5"},{"id":"n502","kind":"grammar","point":"ている","group":"aspect","difficulty":1,"stem":"今（いま）、雨（あめ）が降（ふ）っ＿＿。","gloss":"現在正下着雨。","answer":"ている","options":[{"text":"ている","meaning":"正在做，或結果還在。","connection":"動詞て形＋いる。降る→降って＋いる。","why":"現在正在下雨。降っている。","example":"父は新聞を読んでいる。","zh":"爸爸正在看報。"},{"text":"てある","meaning":"被人做完後留下的狀態。他動詞。","connection":"他動詞て形＋ある。","why":"降る是自動詞，雨不是被人降下後留着。降ってある不說。","example":"窓が開けてある。","zh":"窗被人開着。"},{"text":"ておく","meaning":"事先做。","connection":"て形＋おく。","why":"雨不能事先下好。","example":"傘を買っておく。","zh":"事先買傘。"},{"text":"た","meaning":"過去。","connection":"た形。降った。","why":"降った是下過了。句首有今，要的是現在進行。","example":"昨夜、雨が降った。","zh":"昨晚下了雨。"}],"level":"N5"},{"id":"n503","kind":"grammar","point":"ないでください","group":"advice","difficulty":1,"stem":"この部屋（へや）では、靴（くつ）を脱（ぬ）が＿＿ください。","gloss":"在這個房間請不要脫鞋。","answer":"ないで","options":[{"text":"ないで","meaning":"請不要做。","connection":"ない形＋で＋ください。脱ぐ→脱がないでください。","why":"空格在脱が後面。禁止請求用ないでください。","example":"ここで写真を撮らないでください。","zh":"請不要在這裡拍照。"},{"text":"ずに","meaning":"書面的不做。","connection":"ない stem＋ずに。","why":"脱がずにください不成立。ずに不能加ください。","example":"靴を脱がずに、入った。","zh":"沒脫鞋就進去了。"},{"text":"なくて","meaning":"因為不。","connection":"なくてください不成立。","why":"脱がなくてください把原因形拿來下命令。","example":"脱がなくて、汚れた。","zh":"因為沒脫，弄髒了。"},{"text":"ない","meaning":"請不要的口語有時用ないで，只加ない不夠。","connection":"脱がないください不成立。","why":"ください前面必須是て形或ないで，不能是ない。","example":"脱がない。","zh":"不脫。"}],"level":"N5"},{"id":"n504","kind":"grammar","point":"より","group":"degree","difficulty":1,"stem":"バス＿＿、電車（でんしゃ）のほうが速（はや）い。","gloss":"比起巴士，電車更快。","answer":"より","options":[{"text":"より","meaning":"比。比較的基準。","connection":"名詞＋より。後ろに「〜のほうが」が来ることが多い。","why":"巴士是比較基準，電車更快。バスより電車のほうが。","example":"昨日より、今日は涼しい。","zh":"今天比昨天涼。"},{"text":"ほど","meaning":"沒有……那麼。後面多否定。","connection":"名詞＋ほど＋否定。","why":"ほど後面這句是肯定的「速い」。肯定比較用より。","example":"バスほど速くない。","zh":"沒有巴士那麼快。"},{"text":"から","meaning":"從、因為。","connection":"名詞＋から。","why":"巴士から電車のほうが速い不表示比較。","example":"バスから電車に乗り換える。","zh":"從巴士換乘電車。"},{"text":"まで","meaning":"直到。","connection":"名詞＋まで。","why":"巴士まで不是比較基準。","example":"駅まで、バスで行く。","zh":"到車站坐巴士。"}],"level":"N5"},{"id":"n505","kind":"grammar","point":"ましょうか","group":"advice","difficulty":1,"stem":"荷物（にもつ）、重（おも）そうですね。持（も）ち＿＿。","gloss":"行李看起來很重。我來拿吧？","answer":"ましょうか","options":[{"text":"ましょうか","meaning":"我來做吧？主動幫忙。","connection":"ます語幹＋ましょうか。持つ→持ちましょうか。","why":"看到對方行李重，提議自己來拿。持ちましょうか。","example":"窓を開けましょうか。","zh":"我來開窗吧？"},{"text":"ませんか","meaning":"要不要一起做？邀請對方。","connection":"ます語幹＋ませんか。","why":"持ちませんか是邀請對方拿，不是我幫你拿。","example":"一緒に持ちませんか。","zh":"要不要一起拿？"},{"text":"たいですか","meaning":"你想做嗎。","connection":"たい＋ですか。","why":"持ったいですか不成立。問對方想不想，不是幫忙。","example":"持ちたいですか。","zh":"你想拿嗎？"},{"text":"なさい","meaning":"命令晚輩做。","connection":"ます語幹＋なさい。","why":"持ちなさい是命令對方拿，對客人很失禮，也不是提議。","example":"自分で持ちなさい。","zh":"自己拿。"}],"level":"N5"},{"id":"n506","kind":"grammar","point":"まだ〜ない","group":"time","difficulty":1,"stem":"レポートは、まだ出（だ）して＿＿。","gloss":"報告還沒交。","answer":"いません","options":[{"text":"いません","meaning":"還沒做完該做的事。","connection":"て形＋いない。まだ呼應否定。出す→出して＋いません。","why":"まだ和ていない一起，表示該交的還沒交。","example":"まだ食べていません。","zh":"還沒吃。"},{"text":"います","meaning":"已經在做或做完狀態還在。肯定。","connection":"て形＋いる。","why":"出しています會像正在交或已經交了的狀態，和まだ矛盾。","example":"もう出しています。","zh":"已經交了。"},{"text":"ありました","meaning":"曾經有。","connection":"ある的過去。","why":"出してありました是被人交好留着的狀態，過去。和まだ未完成相反。","example":"レポートはもう出してありました。","zh":"報告已經交在那裡了。"},{"text":"おきました","meaning":"事先做好了。","connection":"て形＋おいた。","why":"出しておきました是已經事先交了，肯定完成。","example":"昨日、出しておきました。","zh":"昨天先交了。"}],"level":"N5"},{"id":"n507","kind":"grammar","point":"あとで","group":"time","difficulty":1,"stem":"宿題（しゅくだい）を終（お）わらせた＿＿、ゲームをしてもいいよ。","gloss":"做完功課之後，可以玩遊戲。","answer":"あとで","options":[{"text":"あとで","meaning":"在……之後。","connection":"動詞た形＋あとで。終わらせた＋あとで。","why":"先完成功課，之後才可以玩。た形＋あとで。","example":"食事のあとで、散歩する。","zh":"飯後散步。"},{"text":"前に","meaning":"在……之前。","connection":"辞書形＋前に。終わらせる前に。","why":"終わらせた前に不接た形。而且玩遊戲若在做完之前，就和條件反了。","example":"終わる前に、遊んではいけない。","zh":"做完之前不准玩。"},{"text":"ながら","meaning":"一邊。","connection":"ます語幹＋ながら。","why":"終わらせながら不是做完之後。","example":"音楽を聞きながら、宿題をする。","zh":"一邊聽音樂一邊做功課。"},{"text":"までに","meaning":"在期限之前。","connection":"時間＋までに。不接た形。","why":"終わらせたまでに不成立。","example":"八時までに、終わらせなさい。","zh":"請在八點前做完。"}],"level":"N5"},{"id":"n420","kind":"grammar","point":"てあげる","group":"giving","difficulty":2,"stem":"弟（おとうと）が困（こま）っていたので、私（わたし）が宿題（しゅくだい）を教（おし）えて＿＿。","gloss":"弟弟正為難，所以我教了他功課。好處給弟弟。","answer":"あげた","options":[{"text":"あげた","meaning":"我為別人做。說話人的動作對對方有好處。","connection":"動詞て形＋あげる。教える→教えてあげる。主語是給出好處的人。","why":"教的人是我，收到好處的是弟弟。教えてあげた。","example":"母に傘を貸してあげた。","zh":"我把傘借給了媽媽。"},{"text":"くれた","meaning":"別人為我做。","connection":"て形＋くれる。主語是對方。","why":"句子主語是私が。自己為自己用くれる不成立。弟弟受益時，我要用あげる。","example":"弟が教えてくれた。","zh":"弟弟教了我。"},{"text":"もらった","meaning":"我請別人為我做。主語是接受的一方。","connection":"て形＋もらう。","why":"教えてもらった的主語應是得到幫助的人。這裡是我教弟弟，方向反了。","example":"弟に教えてもらった。","zh":"我請弟弟教我。"},{"text":"いただいた","meaning":"もらった的謙讓。","connection":"て形＋いただく。主語仍是接受方。","why":"いただいた同樣是我得到好處。教弟弟不能用。","example":"先生に教えていただいた。","zh":"承蒙老師教我。"}],"level":"N4"},{"id":"n421","kind":"grammar","point":"と思う","group":"speech","difficulty":2,"stem":"明日（あした）は雨（あめ）が降（ふ）る＿＿思（おも）う。","gloss":"我想明天會下雨。","answer":"と","options":[{"text":"と","meaning":"引用想法或判斷的內容。","connection":"普通形＋と＋思う。降る＋と思う。","why":"「明天下雨」是我想的內容。降ると＋思う。","example":"この店が一番やすいと思う。","zh":"我覺得這家店最便宜。"},{"text":"を","meaning":"賓語助詞。","connection":"名詞＋を。不接動詞普通形。","why":"降るを思う不成立。思考的內容用と，不用を。","example":"明日のことを思う。","zh":"想着明天的事。"},{"text":"か","meaning":"是否。","connection":"普通形＋か＋と思う＝是不是呢。","why":"降るか思う少了と，而且「是否下雨」是疑問，句子是我的判斷「會下雨」。","example":"降るかどうか、まだ分からない。","zh":"下不下還不知道。"},{"text":"に","meaning":"對象、方向。","connection":"名詞＋に。","why":"降るに思う不成立。","example":"家族に思うことを伝えた。","zh":"把想到的事告訴了家人。"}],"level":"N4"},{"id":"n422","kind":"grammar","point":"けど","group":"contrast","difficulty":1,"stem":"この店（みせ）は安（やす）い＿＿、あまりおいしくない。","gloss":"這家店雖然便宜，但不太好吃。口語的逆接。","answer":"けど","options":[{"text":"けど","meaning":"雖然。口語的逆接，語氣比のに柔。","connection":"普通形＋けど。い形容詞はそのまま：安いけど。","why":"便宜和好吃相反。口語的轉折用けど。","example":"読みたいけど、時間がない。","zh":"雖然想讀，但沒有時間。"},{"text":"から","meaning":"因為。","connection":"普通形＋から。","why":"不好吃不是因為便宜的自然結果。前後是相反的評價。","example":"安いから、よく買う。","zh":"因為便宜，所以常買。"},{"text":"ので","meaning":"因為。較柔的原因。","connection":"普通形＋ので。","why":"同樣是原因，不是轉折。便宜不能推出不好吃。","example":"近いので、歩いていく。","zh":"因為近，所以走去。"},{"text":"し","meaning":"而且。列舉理由，同一方向。","connection":"普通形＋し。","why":"安いし、おいしい才是兩個優點並列。這裡第二項是否定，方向相反，用けど。","example":"安いし、近いし、よく行く。","zh":"又便宜又近，所以常去。"}],"level":"N5"},{"id":"n423","kind":"grammar","point":"とき","group":"time","difficulty":1,"stem":"分（わ）からない単語（たんご）があっ＿＿、辞書（じしょ）を引（ひ）く。","gloss":"有不懂的詞的時候，就查字典。","answer":"たとき","options":[{"text":"たとき","meaning":"……的時候。","connection":"動詞た形＋とき，表示那個情況成立時。ある→あった＋とき。","why":"空格在「あっ」後面。出現不懂的詞那個時候才查。あったとき。","example":"疲れたとき、早く寝る。","zh":"累了的時候就早睡。"},{"text":"ている","meaning":"正在。","connection":"て形＋いる。あっている不是「有」。","why":"単語があっている會變成詞是對的，不是「有不懂的詞時」。","example":"食事をしているとき、電話が来た。","zh":"正在吃飯的時候，電話來了。"},{"text":"のに","meaning":"明明卻。","connection":"た形＋のに。あった＋のに。","why":"あっのに少了た。しかも「有不懂的詞卻去查字典」不是轉折，是在那個時候的習慣。","example":"単語があったのに、調べなかった。","zh":"明明有不懂的詞，卻沒查。"},{"text":"ながら","meaning":"一邊。","connection":"ます語幹＋ながら。ありながら。","why":"あっながら不成立。查字典和「有不懂的詞」不是兩個同時進行的動作。","example":"音楽を聞きながら、辞書を引く。","zh":"一邊聽音樂一邊查字典。"}],"level":"N5"},{"id":"n424","kind":"grammar","point":"でしょう","group":"modal","difficulty":1,"stem":"明日（あした）の朝（あさ）は、寒（さむ）い＿＿。","gloss":"明天早上大概會冷。推測。","answer":"でしょう","options":[{"text":"でしょう","meaning":"大概。說話人的推測，降調時把握較高。","connection":"普通形＋でしょう。い形容詞はそのまま：寒いでしょう。名詞・な形容詞＋でしょう。","why":"明天還沒到，是預測冷。寒いでしょう。","example":"この問題は難しいでしょう。","zh":"這題大概很難。"},{"text":"かった","meaning":"過去。","connection":"い形容詞去掉い＋かった。寒い→寒かった。","why":"寒かった是已經冷過了。句子說的是明天早上，還沒到，不能用過去。推測用でしょう。","example":"今朝は寒かった。","zh":"今早很冷。"},{"text":"たいです","meaning":"想做。","connection":"動詞ます語幹＋たいです。","why":"寒いたいです不成立。たい只接動詞語幹，不接い形容詞。天氣也沒有「想冷」。","example":"温かいものが飲みたいです。","zh":"想喝熱的東西。"},{"text":"つもりです","meaning":"打算。","connection":"動詞辞書形＋つもりです。","why":"寒いつもりです不成立。天氣沒有打算。つもり接在動詞。","example":"明日は早く出るつもりです。","zh":"明天打算早出門。"}],"level":"N5"},{"id":"n425","kind":"grammar","point":"な（禁止）","group":"advice","difficulty":2,"stem":"芝生（しばふ）に入（はい）る＿＿。","gloss":"禁止進入草坪。告示的禁止。","answer":"な","options":[{"text":"な","meaning":"不准做。告示、口頭的簡短禁止。","connection":"動詞辞書形＋な。入る＋な。","why":"告示直接禁止進入。辞書形＋な。","example":"ここにごみを捨てるな。","zh":"不准在這裡丟垃圾。"},{"text":"ない","meaning":"否定。","connection":"入らない。","why":"入るない不成立。五段動詞的否定是入らない，不是辞書形加ない。告示的禁止也不是入るない。","example":"芝生には入らない。","zh":"不進入草坪。"},{"text":"ません","meaning":"禮貌否定。","connection":"入りません。","why":"入るません不成立。ます形才加ません。","example":"ここでは食べません。","zh":"不在這裡吃。"},{"text":"ください","meaning":"請做。","connection":"て形＋ください。入ってください。","why":"入るください不成立。而且請進入和禁止相反。","example":"こちらに入ってください。","zh":"請從這邊進。"}],"level":"N4"},{"id":"n426","kind":"grammar","point":"もう〜た","group":"time","difficulty":1,"stem":"Ａ：昼（ひる）ごはんは？　Ｂ：＿＿食べたよ。","gloss":"Ａ：午飯呢？Ｂ：已經吃了。","answer":"もう","options":[{"text":"もう","meaning":"已經。和た形一起，表示做完了。","connection":"もう＋動詞た形。もう食べた。","why":"對方問午飯，回答是吃過了這件完成的事。もう食べた。","example":"もう宿題は終わった。","zh":"功課已經做完了。"},{"text":"まだ","meaning":"還。完成要用否定：まだ食べていない。","connection":"まだ＋否定，或まだ＋肯定＝仍然。","why":"まだ食べた把「還」和「吃完了」接在一起，矛盾。還沒吃要說まだ食べていない。","example":"まだ食べていない。","zh":"還沒吃。"},{"text":"これから","meaning":"從現在起。","connection":"副詞。尚未開始。","why":"これから食べた時態矛盾。從現在起要用現在或未來。","example":"これから食べる。","zh":"現在要吃。"},{"text":"あとで","meaning":"稍後。","connection":"副詞＋未來。","why":"あとで食べた是過去，時間矛盾。","example":"あとで食べる。","zh":"等等再吃。"}],"level":"N5"},{"id":"n427","kind":"grammar","point":"てください","group":"advice","difficulty":1,"stem":"お客様（きゃくさま）、お名前（なまえ）をここに書（か）い＿＿。","gloss":"客人，請把名字寫在這裡。","answer":"てください","options":[{"text":"てください","meaning":"請對方做。禮貌的請求。","connection":"動詞て形＋ください。書く→書いてください。空格在書い後面。","why":"前面叫了客人，是請對方寫。書いてください。","example":"こちらに座ってください。","zh":"請坐在這邊。"},{"text":"ないでください","meaning":"請不要做。","connection":"ない形＋でください。書かないでください。","why":"書いないでください不成立。否定請求要接在書か後面，不是書い。而且這句是請寫，不是請別寫。","example":"ここには書かないでください。","zh":"請不要寫在這裡。"},{"text":"てもいい","meaning":"可以做。許可。","connection":"て形＋もいい。書いてもいい。","why":"書いてもいい是允許，句尾沒有ですか的提問，也不是「請你寫」的請求。","example":"鉛筆で書いてもいいです。","zh":"用鉛筆寫也可以。"},{"text":"ます","meaning":"禮貌的陳述。","connection":"動詞ます形。書く→書きます。","why":"書います是「我來寫」的陳述。對客人說這句，寫的人會變成自己，不是請客人寫。請求要用て形＋ください。","example":"私がここに書きます。","zh":"我寫在這裡。"}],"level":"N5"},{"id":"n510","kind":"grammar","point":"は（主題）","group":"particle","difficulty":1,"stem":"私（わたし）＿＿学生（がくせい）です。","gloss":"我是學生。","answer":"は","options":[{"text":"は","meaning":"主題。先把「我」提出來，再說明是學生。","connection":"名詞＋は＋述語。私は学生です。","why":"這句是自我介紹，把「我」當主題。用は。","example":"田中さんは会社員です。","zh":"田中是公司職員。"},{"text":"を","meaning":"賓語。","connection":"名詞＋を＋他動詞。","why":"学生です沒有他動詞，「我」不是被做的對象。私を学生です不成立。","example":"水を飲みます。","zh":"喝水。"},{"text":"で","meaning":"動作場所、手段。","connection":"場所＋で＋動作。","why":"私で学生です不能表示「我是學生」。で不拿來標主題。","example":"図書館で勉強します。","zh":"在圖書館學習。"},{"text":"へ","meaning":"方向。","connection":"名詞＋へ＋移動動詞。","why":"後面是です，不是去某地。私へ学生です接不上。","example":"学校へ行きます。","zh":"去學校。"}],"level":"N5"},{"id":"n511","kind":"grammar","point":"が（疑問詞）","group":"particle","difficulty":2,"stem":"この中（なか）で、誰（だれ）＿＿田中（たなか）さんですか。","gloss":"這裡面誰是田中？","answer":"が","options":[{"text":"が","meaning":"疑問詞做主語時用が，問的是未知的人。","connection":"疑問詞＋が＋述語。誰が田中さんですか。","why":"還不知道是誰，所以用が來問。誰が。","example":"どれがあなたの傘ですか。","zh":"哪一把是你的傘？"},{"text":"は","meaning":"已知的主題。","connection":"名詞＋は。疑問詞通常不做は的主題。","why":"誰は田中さんですか不自然。問「是哪一個」要用が。","example":"田中さんは学生です。","zh":"田中是學生。這是已知主題。"},{"text":"を","meaning":"賓語。","connection":"を＋他動詞。","why":"ですか不是他動詞。誰を田中さんですか不成立。","example":"誰を呼びますか。","zh":"叫誰？"},{"text":"も","meaning":"全部、也。和否定或「誰も〜ない」一起。","connection":"誰も＋否定。","why":"誰も田中さんですか不是問句。要說「誰都不是」才是誰も田中さんではありません。","example":"誰も知りません。","zh":"誰都不知道。"}],"level":"N5"},{"id":"n512","kind":"grammar","point":"を（賓語）","group":"particle","difficulty":1,"stem":"毎朝（まいあさ）、水（みず）＿＿飲（の）みます。","gloss":"每天早上喝水。","answer":"を","options":[{"text":"を","meaning":"他動詞的對象。","connection":"名詞＋を＋他動詞。水を飲みます。","why":"飲む是他動詞，喝的東西用水を。","example":"パンを食べます。","zh":"吃麵包。"},{"text":"が","meaning":"主語，或對象的自動詞。","connection":"名詞＋が＋自動詞・形容詞。","why":"水が飲みます會把水當成喝東西的人。喝這個動作的對象要用を。","example":"水が冷たいです。","zh":"水是涼的。"},{"text":"に","meaning":"時間、存在地點、對象。","connection":"名詞＋に。","why":"水に飲みます不是「喝水」。に不標他動詞的賓語。","example":"七時に起きます。","zh":"七點起身。"},{"text":"で","meaning":"場所或手段。","connection":"名詞＋で＋動作。","why":"水で飲みます會變成用水來喝別的東西，不是把水喝掉。","example":"コップで飲みます。","zh":"用杯子喝。"}],"level":"N5"},{"id":"n513","kind":"grammar","point":"に（時間）","group":"particle","difficulty":1,"stem":"夜（よる）七時（しちじ）＿＿食事（しょくじ）をします。","gloss":"晚上七點吃飯。","answer":"に","options":[{"text":"に","meaning":"具體時刻。","connection":"時刻＋に＋動作。七時に。","why":"七點是一個定點，用餐發生在那個時刻。七時に食事をします。","example":"三時に会いましょう。","zh":"三點見。"},{"text":"で","meaning":"動作的場所或手段，不標鐘點。","connection":"場所＋で。","why":"七時で食事をします不表示「在七點吃」。時段的終點才用まで，定點用に。","example":"食堂で食事をします。","zh":"在食堂吃飯。"},{"text":"を","meaning":"賓語。","connection":"名詞＋を＋他動詞。","why":"七時不是吃的東西。食事を已經有を。","example":"ご飯を食べます。","zh":"吃飯。"},{"text":"へ","meaning":"移動方向。","connection":"場所＋へ＋移動。","why":"七時へ行かない。時間不是目的地。","example":"食堂へ行きます。","zh":"去食堂。"}],"level":"N5"},{"id":"n514","kind":"grammar","point":"に（存在）","group":"particle","difficulty":2,"stem":"机（つくえ）の上（うえ）＿＿猫（ねこ）がいます。","gloss":"桌上有貓。","answer":"に","options":[{"text":"に","meaning":"存在的地點。","connection":"場所＋に＋がいる／がある。","why":"貓存在於桌上。存在句的場所用に，不用で。","example":"部屋に人がいます。","zh":"房間裡有人。"},{"text":"で","meaning":"動作進行的場所。","connection":"場所＋で＋動作動詞。","why":"猫がいます是「有貓」，不是貓在桌上做某個動作。存在不用で。","example":"机の上で本を読みます。","zh":"在桌上讀書。"},{"text":"を","meaning":"賓語。","connection":"を＋他動詞。","why":"います不需要賓語。上を猫がいます不成立。","example":"猫を見ます。","zh":"看貓。"},{"text":"へ","meaning":"移動的方向。","connection":"場所＋へ＋行く等。","why":"這句沒有移動，只是貓在那裡。上へ猫がいます不成立。","example":"外へ出ます。","zh":"到外面去。"}],"level":"N5"},{"id":"n515","kind":"grammar","point":"で（動作の場所）","group":"particle","difficulty":2,"stem":"図書館（としょかん）＿＿勉強（べんきょう）します。","gloss":"在圖書館學習。","answer":"で","options":[{"text":"で","meaning":"做某件事的場所。","connection":"場所＋で＋動作。図書館で勉強します。","why":"學習這個動作發生在圖書館。場所用で。","example":"食堂で昼ごはんを食べます。","zh":"在食堂吃午飯。"},{"text":"に","meaning":"存在的場所，或移動的終點。","connection":"場所＋に＋いる／行く。","why":"勉強します是動作，不是「人存在於圖書館」。圖書館に勉強します不成立。","example":"図書館に学生がいます。","zh":"圖書館裡有學生。"},{"text":"を","meaning":"賓語，或經過的場所。","connection":"を＋他動詞。","why":"図書館不是學習的對象。図書館を勉強します不成立。","example":"日本語を勉強します。","zh":"學日語。"},{"text":"へ","meaning":"方向。","connection":"場所＋へ＋移動動詞。","why":"後面是勉強します，不是行きます。図書館へ勉強します不成立。","example":"図書館へ行きます。","zh":"去圖書館。"}],"level":"N5"},{"id":"n516","kind":"grammar","point":"と（一緒）","group":"particle","difficulty":1,"stem":"週末（しゅうまつ）は家族（かぞく）＿＿出（で）かけます。","gloss":"週末和家人出去。","answer":"と","options":[{"text":"と","meaning":"和誰一起。","connection":"人＋と＋動作。家族と出かけます。","why":"一起出去的同伴是家人。用と。","example":"友達と映画を見ます。","zh":"和朋友看電影。"},{"text":"に","meaning":"動作的對象、方向。","connection":"人＋に＋あげる等。","why":"家族に出かけます會變成往家人那裡出門，不是和家人一起。","example":"母に手紙を書きます。","zh":"給媽媽寫信。"},{"text":"を","meaning":"賓語。","connection":"を＋他動詞。","why":"出かけます的同伴不是賓語。家族を出かけます不成立。","example":"荷物を持ち出します。","zh":"把行李拿出去。"},{"text":"へ","meaning":"方向。","connection":"場所＋へ。","why":"家族不是地點。家族へ出かけます不像「和家人出外」。","example":"公園へ出かけます。","zh":"去公園。"}],"level":"N5"},{"id":"n517","kind":"grammar","point":"も（同樣）","group":"particle","difficulty":1,"stem":"父（ちち）は医者（いしゃ）です。母（はは）＿＿医者です。","gloss":"爸爸是醫生。媽媽也是醫生。","answer":"も","options":[{"text":"も","meaning":"同樣。前句的性質也適合後句。","connection":"名詞＋も＋同じ述語。母も医者です。","why":"兩句述語都是「是醫生」，第二句用も表示也是。","example":"兄も学生です。","zh":"哥哥也是學生。"},{"text":"の","meaning":"連體，屬於。","connection":"名詞＋の＋名詞。","why":"母の医者です會變成「媽媽的醫生」，多了一個所有，和前句的並列不同。","example":"母の仕事は医者です。","zh":"媽媽的工作是醫生。這句才用の。"},{"text":"を","meaning":"賓語。","connection":"を＋他動詞。","why":"医者です沒有他動詞。母を医者です不成立。","example":"母を呼びます。","zh":"叫媽媽。"},{"text":"で","meaning":"場所、手段、身份的手段。","connection":"名詞＋で。","why":"母で医者です不能接成「也是醫生」。","example":"医者で、教師でもあります。","zh":"是醫生，同時也是教師。這要另一個句型。"}],"level":"N5"},{"id":"n518","kind":"grammar","point":"や（列舉）","group":"particle","difficulty":2,"stem":"かばんに本（ほん）＿＿ノートなどがあります。","gloss":"袋子裡有書、筆記本之類的東西。","answer":"や","options":[{"text":"や","meaning":"舉出幾個例子，後面常接など，表示還有別的。","connection":"名詞＋や＋名詞＋など。本やノートなど。","why":"書和筆記本只是例子，不是全部。本やノートなど。","example":"机にペンや消しゴムなどがあります。","zh":"桌上有筆、橡皮之類。"},{"text":"を","meaning":"賓語。","connection":"を＋他動詞。","why":"あります是存在，不是他動詞把書當作對象。本をノートなどがあります不成立。","example":"本を入れます。","zh":"把書放進去。"},{"text":"が","meaning":"主語。","connection":"が＋あります，主語只能有一個位置。","why":"本がノートなどがあります兩個主語標記疊在一起，不成立。","example":"本があります。","zh":"有書。"},{"text":"も","meaning":"也。","connection":"名詞＋も。","why":"本もノートなどがあります，も不能和など組成「舉例還有別的」。舉不完全的例子用や。","example":"本もあります。ノートもあります。","zh":"也有書。也有筆記本。這是兩句。"}],"level":"N5"},{"id":"n519","kind":"grammar","point":"から（原因）","group":"particle","difficulty":2,"stem":"寒（さむ）い＿＿、窓（まど）を閉（し）めました。","gloss":"因為冷，所以把窗關上了。","answer":"から","options":[{"text":"から","meaning":"因為。原因在前，結果在後。","connection":"普通形＋から。い形容詞直接接：寒いから。","why":"冷是關窗的原因。寒いから、閉めました。","example":"忙しいから、今日は行けません。","zh":"因為忙，今天不能去。"},{"text":"のに","meaning":"明明卻。","connection":"普通形＋のに。","why":"關窗是因為冷的結果，不是和冷相反的事。逆接用不上。","example":"寒いのに、窓を開けた。","zh":"明明很冷，卻開了窗。"},{"text":"まで","meaning":"直到。","connection":"時間・場所＋まで。","why":"寒いまで、窓を閉めました不表示原因。まで不接在い形容詞後面當理由。","example":"夜まで働いた。","zh":"工作到晚上。"},{"text":"より","meaning":"比較。","connection":"名詞＋より。","why":"寒いより不接在い形容詞停止形後面來比較。也推不出關窗。","example":"今日は昨日より寒い。","zh":"今天比昨天冷。"}],"level":"N5"},{"id":"n520","kind":"grammar","point":"てもいい","group":"advice","difficulty":2,"stem":"試験中（しけんちゅう）、辞書（じしょ）を見（み）＿＿。先生（せんせい）がそう言（い）いました。","gloss":"老師說了：考試時可以看字典。","answer":"てもいい","options":[{"text":"てもいい","meaning":"可以做。許可。","connection":"動詞て形＋もいい。見る→見て＋もいい。","why":"老師允許看字典。見てもいい。","example":"ここに座ってもいいです。","zh":"可以坐在這裡。"},{"text":"てはいけない","meaning":"禁止。","connection":"て形＋はいけない。","why":"見てはいけない是不准看。和老師允許相反。","example":"試験中、話してはいけない。","zh":"考試時不准說話。"},{"text":"なければならない","meaning":"必須。","connection":"ない形＋なければならない。見ない＋なければならない。","why":"見てなければならない接不上。必須看也不是這句的許可。","example":"名前を書かなければならない。","zh":"必須寫名字。"},{"text":"たことがある","meaning":"做過。經驗。","connection":"た形＋ことがある。見たことがある。","why":"見てたことがある不成立。老師說的是規則，不是自己的經驗。","example":"辞書を使ったことがある。","zh":"用過字典。"}],"level":"N5"},{"id":"n521","kind":"grammar","point":"ませんか","group":"advice","difficulty":1,"stem":"一緒（いっしょ）に昼（ひる）ごはんを食（た）べ＿＿。","gloss":"要不要一起吃午飯？邀約。","answer":"ませんか","options":[{"text":"ませんか","meaning":"邀約。用否定疑問，語氣柔和。","connection":"ます形の語幹＋ませんか。食べる→食べ＋ませんか。","why":"邀請對方一起吃。食べませんか。","example":"映画を見ませんか。","zh":"要不要看電影？"},{"text":"なければなりません","meaning":"必須。","connection":"ない形＋なければなりません。","why":"食べなければなりません是義務，不是邀請。而且接在食べ後面少了ない。","example":"薬を飲まなければなりません。","zh":"必須吃藥。"},{"text":"ないでください","meaning":"請不要。","connection":"ない形＋でください。食べないでください。","why":"食べないでください才是請別吃。空格在食べ後面，不能直接加ないでください。","example":"ここで食べないでください。","zh":"請不要在這裡吃。"},{"text":"たことがあります","meaning":"經驗。","connection":"た形＋ことがあります。食べたことがあります。","why":"食べたことがあります不接在語幹食べ後面。這句也不是在問經驗。","example":"寿司を食べたことがあります。","zh":"吃過壽司。"}],"level":"N5"},{"id":"n522","kind":"grammar","point":"ある（無生物）","group":"aspect","difficulty":1,"stem":"庭（にわ）に木（き）が＿＿。","gloss":"院子裡有樹。","answer":"あります","options":[{"text":"あります","meaning":"無生物、植物的存在。","connection":"場所に＋無生物が＋ある。","why":"樹不屬於「いる」的人或動物。木があります。","example":"机の上に本があります。","zh":"桌上有書。"},{"text":"います","meaning":"人或動物的存在。","connection":"場所に＋人・動物が＋いる。","why":"樹不是動物。木がいます不說。","example":"庭に犬がいます。","zh":"院子裡有狗。"},{"text":"します","meaning":"做。","connection":"名詞＋をします，或する。","why":"木がします沒有動作內容。存在不用する。","example":"勉強をします。","zh":"學習。"},{"text":"です","meaning":"是。判斷。","connection":"名詞＋です。","why":"木がです不成立。存在用ある，不是です。","example":"これは木です。","zh":"這是樹。"}],"level":"N5"},{"id":"n523","kind":"grammar","point":"に行く（目的）","group":"purpose","difficulty":2,"stem":"明日（あした）、靴（くつ）を買（か）＿＿行（い）きます。","gloss":"明天去買鞋。","answer":"いに","options":[{"text":"いに","meaning":"去、來的目的。","connection":"ます語幹＋に＋行く／来る。買う→買い＋に行く。","why":"去的目的是買鞋。買いに行きます。","example":"映画を見に行きます。","zh":"去看電影。"},{"text":"くて","meaning":"い形容詞的て形，或錯誤的動詞連接。","connection":"動詞不能用くて連接目的。","why":"買くて行きます不存在。目的要用語幹＋に。","example":"安くて、買いました。","zh":"因為便宜，所以買了。這是形容詞。"},{"text":"ない","meaning":"否定。","connection":"ない形。買わない。","why":"買ない行きます不成立。否定目的也不是這句。","example":"買わないで帰った。","zh":"沒買就回去了。"},{"text":"ます","meaning":"丁寧形。","connection":"買い＋ます。","why":"買ます行きます少了い，而且ます形不能直接再加行きます表示目的。","example":"靴を買います。","zh":"買鞋。這句沒有「去」。"}],"level":"N5"},{"id":"n524","kind":"grammar","point":"くなる","group":"change","difficulty":2,"stem":"冬（ふゆ）になって、日（ひ）が短（みじか）＿＿。","gloss":"到了冬天，白天變短了。","answer":"くなりました","options":[{"text":"くなりました","meaning":"い形容詞的變化。變得。","connection":"い形容詞去い＋くなる。短い→短く＋なる。","why":"冬になって表示變化。短くなりました。","example":"空が暗くなりました。","zh":"天變暗了。"},{"text":"になりました","meaning":"な形容詞・名詞的變化。","connection":"な形容詞語幹・名詞＋になる。","why":"短い是い形容詞，不能短になりました。","example":"静かになりました。","zh":"變安靜了。"},{"text":"くしました","meaning":"人為地弄成。","connection":"い形容詞去い＋くする。主語是做事的人。","why":"日が短くしました會把「白天」當成弄短白天的人。自然變化用なる，不用する。","example":"文を短くしました。","zh":"我把文章改短了。"},{"text":"かったです","meaning":"い形容詞的過去，只是狀態。","connection":"い形容詞去い＋かった。短かったです。","why":"短かった只說那時短，沒有「變成」。句首冬になって要的是變化。","example":"昨日は日が短かったです。","zh":"昨天白天很短。"}],"level":"N5"},{"id":"n525","kind":"grammar","point":"のほうが","group":"degree","difficulty":2,"stem":"電車（でんしゃ）より、バス＿＿安（やす）いです。","gloss":"比起電車，巴士更便宜。","answer":"のほうが","options":[{"text":"のほうが","meaning":"兩者比較時，較強的那一邊。","connection":"名詞＋のほうが＋形容詞。比較的基準用より。","why":"電車是比較基準，巴士這一邊更便宜。バスのほうが。","example":"コーヒーより、紅茶のほうが好きです。","zh":"比起咖啡，更喜歡紅茶。"},{"text":"より","meaning":"比較的基準，已經用在電車上。","connection":"ＡよりＢ。","why":"電車よりバスより會有兩個基準，沒有被比較的一方。","example":"電車よりバスが安いです。","zh":"巴士比電車便宜。這句用が，不再加より。"},{"text":"しか","meaning":"只有。後面要否定。","connection":"名詞＋しか＋否定。","why":"バスしか安いです少了否定，也不表示比較。","example":"バスしかありません。","zh":"只有巴士。"},{"text":"こそ","meaning":"正是。強調。","connection":"名詞＋こそ。","why":"バスこそ安い是強調「正是巴士便宜」，沒有和電車比較的結構。前句已經有より，要的是のほうが。","example":"今年こそ合格したい。","zh":"今年一定要合格。"}],"level":"N5"},{"id":"n526","kind":"grammar","point":"て形（順序）","group":"time","difficulty":1,"stem":"手（て）を洗（あら）っ＿＿ご飯（はん）を食（た）べます。","gloss":"洗完手再吃飯。","answer":"て","options":[{"text":"て","meaning":"做完一件，再做下一件。","connection":"動詞て形。洗う→洗って。","why":"先洗手，然後吃飯。洗って、食べます。","example":"歯を磨いて、寝ます。","zh":"刷牙，然後睡覺。"},{"text":"た","meaning":"過去。","connection":"た形。洗った。","why":"洗ったご飯を食べます會把「洗過的飯」連在一起，不能表示先後兩個動作。中間缺て。","example":"手を洗った。","zh":"洗了手。這是單獨的過去。"},{"text":"ます","meaning":"丁寧形，一句的結尾。","connection":"洗い＋ます。","why":"洗いますご飯を食べます兩個述語黏在一起，不成立。","example":"手を洗います。","zh":"洗手。"},{"text":"ない","meaning":"否定。","connection":"洗わない。","why":"洗わないご飯を食べます不是「洗完再吃」。空格在洗っ後面，也不接ない。","example":"手を洗わないで食べる。","zh":"不洗手就吃。"}],"level":"N5"},{"id":"n460","kind":"grammar","point":"んです","group":"speech","difficulty":2,"stem":"傘（かさ）を差（さ）していますね。雨（あめ）が降（ふ）っている＿＿。","gloss":"你打着傘呢。是在下雨嗎？想確認理由。","answer":"んですか","options":[{"text":"んですか","meaning":"向對方確認、追問說明。","connection":"普通形＋んですか。ている＋んですか：降っているんですか。","why":"看見傘，想確認是不是因為下雨。降っているんですか。","example":"遅れたんですか。","zh":"是遲到了嗎？"},{"text":"ますか","meaning":"丁寧形的疑問。","connection":"ます語幹＋ますか。降りますか。","why":"降っているますか把ている和ます疊在一起，不成立。","example":"雨が降りますか。","zh":"會下雨嗎？這句沒有ている。"},{"text":"ですか","meaning":"名詞・な形容詞的疑問。","connection":"名詞＋ですか。","why":"動詞普通形後面不能直接ですか。降っているですか不成立。說明疑問要用んですか。","example":"雨ですか。","zh":"是雨嗎？"},{"text":"からです","meaning":"因為。陳述原因，不是疑問。","connection":"普通形＋からです。","why":"降っているからです是「是因為下着雨」的斷言。前句是看著傘在確認，要的是問句んですか。","example":"遅れたのは、電車が止まったからです。","zh":"遲到是因為電車停了。"}],"level":"N4"},{"id":"n461","kind":"grammar","point":"だけ","group":"degree","difficulty":2,"stem":"この部屋（へや）に入れるのは、社員（しゃいん）＿＿です。","gloss":"能進這房間的只有社員。","answer":"だけ","options":[{"text":"だけ","meaning":"限定。只有這個，沒有別的。","connection":"名詞＋だけ。社員だけです。","why":"能進的範圍只限社員。社員だけです。","example":"見るだけです。買いません。","zh":"只看。不買。"},{"text":"しか","meaning":"只有。必須和否定一起。","connection":"名詞＋しか＋ない。","why":"社員しかです少了否定。要說「只有社員」的否定形是社員しか入れません。","example":"社員しか入れません。","zh":"只有社員能進。"},{"text":"こそ","meaning":"正是。強調，不表示排除其他。","connection":"名詞＋こそ。","why":"社員こそです沒有「只有」的意思，也接得不自然。","example":"今年こそ頑張ります。","zh":"今年一定好好努力。"},{"text":"さえ","meaning":"連……都。舉出極端。","connection":"名詞＋さえ。","why":"社員さえです不是限定「只有社員」。さえ是「甚至社員也」。","example":"子供さえ知っている。","zh":"連小孩都知道。"}],"level":"N4"},{"id":"n462","kind":"grammar","point":"し","group":"cause","difficulty":2,"stem":"頭（あたま）も痛（いた）い＿＿、熱（ねつ）もあるので、今日（きょう）は休（やす）みます。","gloss":"又頭痛，又發燒，所以今天休息。","answer":"し","options":[{"text":"し","meaning":"列舉兩個以上同一方向的理由。","connection":"普通形＋し。い形容詞直接接：痛いし。常和も一起。","why":"頭痛和發燒都是休息的理由。痛いし、熱もある。","example":"安いし、近いし、よく行く。","zh":"又便宜又近，所以常去。"},{"text":"のに","meaning":"明明卻。","connection":"普通形＋のに。","why":"頭痛和發燒不是相反的事。痛いのに、熱もある接不上後面的休息理由。","example":"痛いのに、会社へ行った。","zh":"明明頭痛，還是去了公司。"},{"text":"ても","meaning":"即使。","connection":"て形＋も。痛くても。","why":"痛いても少了く。即使頭痛，也推不出「又發燒所以休息」。","example":"痛くても、行きます。","zh":"即使痛也去。"},{"text":"ば","meaning":"如果。","connection":"仮定形＋ば。痛ければ。","why":"痛いば不成立。這句是兩個已經存在的理由，不是假設。","example":"痛ければ、休みます。","zh":"如果痛，就休息。"}],"level":"N4"},{"id":"n463","kind":"grammar","point":"ない方がいい","group":"advice","difficulty":2,"stem":"この水（みず）は汚（よご）れている。飲（の）ま＿＿。","gloss":"這水髒了。最好不要喝。","answer":"ない方がいい","options":[{"text":"ない方がいい","meaning":"最好不要做。勸阻。","connection":"動詞ない形＋方がいい。飲む→飲ま＋ない方がいい。","why":"水髒，所以勸人別喝。飲まない方がいい。","example":"夜更かししない方がいい。","zh":"最好不要熬夜。"},{"text":"た方がいい","meaning":"最好做。","connection":"動詞た形＋方がいい。飲んだ方がいい。","why":"飲また方がいい接不上。而且「最好喝」和水髒相反。","example":"水を飲んだ方がいい。","zh":"最好把水喝了。這是乾淨的水才會這樣說。"},{"text":"なくてもいい","meaning":"不做也可以。","connection":"ない形＋なくてもいい。飲まなくてもいい。","why":"飲まなくてもいい是「可以不喝」，沒有「髒了別喝」的勸阻。許可和忠告不同。","example":"無理に飲まなくてもいい。","zh":"不必勉強喝。"},{"text":"なければならない","meaning":"必須做。","connection":"ない形＋なければならない。","why":"飲まなければならない是必須喝。和髒水的忠告相反。","example":"薬は飲まなければならない。","zh":"藥必須喝。"}],"level":"N4"},{"id":"n464","kind":"grammar","point":"たらどうですか","group":"advice","difficulty":3,"stem":"疲（つか）れたなら、少（すこ）し休（やす）んだ＿＿。","gloss":"既然累了，休息一下怎麼樣？","answer":"らどうですか","options":[{"text":"らどうですか","meaning":"建議對方做某事。","connection":"動詞た形＋らどうですか。休む→休んだらどうですか。空格在休んだ後面。","why":"對方累了，你建議他休息。休んだらどうですか。","example":"先生に聞いてみたらどうですか。","zh":"問問老師怎麼樣？"},{"text":"のでしょうか","meaning":"是不是呢。確認，不是建議。","connection":"普通形＋のでしょうか。","why":"休んだのでしょうか是「是不是已經休息了」的推測，不是叫對方去休息。","example":"もう休んだのでしょうか。","zh":"是不是已經休息了？"},{"text":"ことにします","meaning":"說話人自己決定。","connection":"辞書形・た形＋ことにする。","why":"休んだことにします是「就當作休息過了」的決定，不是向對方提議。","example":"今日は休むことにします。","zh":"我決定今天休息。"},{"text":"てください","meaning":"請求。","connection":"て形＋ください。休んでください。","why":"休んだてください不成立。請求要用休んでください，不接在た形後面。","example":"少し休んでください。","zh":"請休息一下。"}],"level":"N4"},{"id":"n465","kind":"grammar","point":"なさい","group":"advice","difficulty":2,"stem":"先生（せんせい）が学生（がくせい）に「教科書（きょうかしょ）を開（ひら）き＿＿」と言（い）いました。","gloss":"老師對學生說：「把課本打開。」","answer":"なさい","options":[{"text":"なさい","meaning":"命令。長輩對晚輩。","connection":"ます語幹＋なさい。開く→開き＋なさい。","why":"老師命令學生。開きなさい。","example":"早く来なさい。","zh":"快點來。"},{"text":"ません","meaning":"丁寧的否定。","connection":"語幹＋ません。開きません。","why":"開きません是「不打開」的說明，不是命令學生打開。","example":"今日は教科書を開きません。","zh":"今天不打開課本。"},{"text":"たいです","meaning":"想做。","connection":"語幹＋たいです。","why":"開きたいです是希望，放進老師的命令引號裡，變成老師說自己想打開，不是叫學生做。","example":"教科書を開きたいです。","zh":"想打開課本。"},{"text":"ないでください","meaning":"請不要。","connection":"ない形＋でください。開かないでください。","why":"開きないでください接不上。而且意思是請別打開，和命令打開相反。","example":"教科書を開かないでください。","zh":"請不要打開課本。"}],"level":"N4"},{"id":"n466","kind":"grammar","point":"方","group":"aspect","difficulty":2,"stem":"この漢字（かんじ）の読（よ）み＿＿が分（わ）かりません。","gloss":"不知道這個漢字怎麼讀。","answer":"方","options":[{"text":"方","meaning":"做的方法。","connection":"ます語幹＋方。読む→読み＋方。読み方が分かりません。","why":"問的是讀法。読み方。","example":"この漢字の書き方を教えてください。","zh":"請教我這個漢字的寫法。"},{"text":"こと","meaning":"事情。形式名詞。","connection":"辞書形＋こと。読むこと。","why":"読みことが分かりません接不上。方法要用語幹＋方，不是読みこと。","example":"読むことができます。","zh":"能夠讀。"},{"text":"の","meaning":"連體。","connection":"動詞普通形＋の，或名詞＋の。","why":"読みのが分かりません不成立。讀法不是読みの。","example":"読むのは難しい。","zh":"讀這件事很難。"},{"text":"さ","meaning":"程度名詞。","connection":"い形容詞語幹＋さ。高さ、長さ。","why":"読み是動詞語幹，不能加さ變成讀法。読みさが分かりません不存在。","example":"この山の高さが分かりません。","zh":"不知道這座山的高度。"}],"level":"N4"},{"id":"n467","kind":"grammar","point":"始める","group":"aspect","difficulty":3,"stem":"さっきまで晴（は）れていた。今（いま）、雨（あめ）が降（ふ）り＿＿。","gloss":"剛才還是晴的。現在開始下雨了。","answer":"始めた","options":[{"text":"始めた","meaning":"開始做。","connection":"ます語幹＋始める。降る→降り＋始めた。","why":"剛才還晴，現在雨開始下。降り始めた。","example":"急に泣き始めた。","zh":"忽然哭起來。"},{"text":"てある","meaning":"人為留下的狀態。他動詞。","connection":"他動詞て形＋ある。","why":"降ってある不接在語幹降り後面，雨也不是被人放著的狀態。","example":"窓が開けてある。","zh":"窗被人開著。"},{"text":"なければならない","meaning":"必須。","connection":"ない形＋なければならない。","why":"降りなければならない不接在語幹上。雨沒有「必須下」。","example":"薬を飲まなければならない。","zh":"必須吃藥。"},{"text":"られる","meaning":"受身或可能。","connection":"ない形語幹＋られる，五段はあ段＋れる。","why":"降りられる不是「開始下」。空格在降り後面，開始要用始める。","example":"雨に降られた。","zh":"被雨淋了。"}],"level":"N4"},{"id":"n468","kind":"grammar","point":"そうにない","group":"modal","difficulty":3,"stem":"この様子（ようす）では、今日中（きょうじゅう）には終（お）わり＿＿。","gloss":"照這個樣子，今天之內好像完不了。","answer":"そうにない","options":[{"text":"そうにない","meaning":"看起來不會發生。負面的樣態。","connection":"ます語幹＋そうにない。終わる→終わり＋そうにない。","why":"照現在的進度，完成這件事看起來不會發生。終わりそうにない。","example":"間に合いそうにない。","zh":"看起來來不及。"},{"text":"そうだ","meaning":"看起來會發生。正面的樣態。","connection":"ます語幹＋そうだ。終わりそうだ。","why":"終わりそうだ是看起來會做完。和「照這個樣子完不了」相反。","example":"もうすぐ終わりそうだ。","zh":"看起來快做完了。"},{"text":"なければならない","meaning":"必須。","connection":"ない形＋なければならない。終わらなければならない。","why":"終わりなければならない接不上。必須做完也不是「看起來完不了」。","example":"今日中に終わらせなければならない。","zh":"必須在今天之內做完。"},{"text":"たばかりだ","meaning":"剛剛做完。","connection":"た形＋ばかりだ。終わったばかりだ。","why":"終わりたばかりだ不成立。剛剛做完和「完不了」相反。","example":"今、終わったばかりだ。","zh":"現在剛剛做完。"}],"level":"N4"},{"id":"n469","kind":"grammar","point":"ていただく","group":"giving","difficulty":3,"stem":"先生（せんせい）に論文（ろんぶん）を見（み）て＿＿。","gloss":"請老師看了論文（自己受惠，謙讓）。","answer":"いただきました","options":[{"text":"いただきました","meaning":"對方為自己做了某事。謙讓，抬高對方。","connection":"て形＋いただく。見ていただきました。給惠的人用に。","why":"老師是上位，自己受惠。見ていただきました。","example":"部長に説明していただきました。","zh":"請部長說明了。"},{"text":"あげました","meaning":"自己為別人做。方向相反。","connection":"て形＋あげる。主語是給出的一方。","why":"見てあげました會變成我幫老師看。和「老師看我的論文」相反。","example":"友達に見てあげました。","zh":"我幫朋友看了。"},{"text":"やりました","meaning":"為同輩或晚輩做。更隨便，方向仍是自己給出。","connection":"て形＋やる。","why":"先生に見てやりました既不尊敬，方向也反了。","example":"弟に教えてやりました。","zh":"我教了弟弟。"},{"text":"くださいました","meaning":"上位者為自己做。給惠的人用が，不用に。","connection":"が＋て形＋くださる。","why":"先生に見てくださいました助詞錯了。くださる的主語要用が：先生が見てくださいました。","example":"先生が論文を見てくださいました。","zh":"老師看了我的論文。"}],"level":"N4"},{"id":"n470","kind":"grammar","point":"いくら〜ても","group":"condition","difficulty":3,"stem":"＿＿練習（れんしゅう）しても、うまくならない。","gloss":"無論怎麼練習，都變不好。","answer":"いくら","options":[{"text":"いくら","meaning":"無論怎麼……也。程度再高，結果仍不變。","connection":"いくら＋動詞て形＋も。いくら練習しても。","why":"練習了很多仍然不行。いくら練習しても。","example":"いくら待っても、来ない。","zh":"無論怎麼等，都不來。"},{"text":"もし","meaning":"如果。和たら、ば一起。","connection":"もし＋条件。","why":"もし練習しても不是「無論多少」。もし不和ても組成「怎麼做都」。","example":"もし雨が降ったら、中止です。","zh":"如果下雨就取消。"},{"text":"たぶん","meaning":"大概。推量副詞。","connection":"たぶん＋だろう／でしょう。","why":"たぶん練習しても不能表示程度達到極點仍無效。","example":"たぶん雨だろう。","zh":"大概會下雨。"},{"text":"きっと","meaning":"一定。","connection":"きっと＋だろう／はず。","why":"きっと練習しても是「一定即使練習」，沒有「再多也沒用」的量。","example":"きっと来るでしょう。","zh":"一定會來。"}],"level":"N4"},{"id":"n471","kind":"grammar","point":"予定だ","group":"decision","difficulty":2,"stem":"時刻表（じこくひょう）によると、この電車（でんしゃ）は十時（じゅうじ）に出（で）る＿＿。","gloss":"根據時刻表，這班電車預定十點開出。","answer":"予定だ","options":[{"text":"予定だ","meaning":"預定、日程上的計劃。","connection":"辞書形＋予定だ。出る予定だ。常和時刻表、日程一起。","why":"時刻表寫的是預定開出的時間。出る予定だ。","example":"会議は三時に始まる予定だ。","zh":"會議預定三點開始。"},{"text":"たことがある","meaning":"經驗。","connection":"た形＋ことがある。出たことがある。","why":"出るたことがある接不上。時刻表不是過去的經驗。","example":"この電車に乗ったことがある。","zh":"坐過這班電車。"},{"text":"ものではない","meaning":"不該做。常識上的禁止。","connection":"辞書形＋ものではない。","why":"出るものではない會變成「不該開出」。時刻表不是在禁止開車。","example":"人の秘密を話すものではない。","zh":"不該說別人的秘密。"},{"text":"わけにはいかない","meaning":"礙於情理不能做。","connection":"辞書形＋わけにはいかない。","why":"出るわけにはいかない是不能開出。和時刻表上的發車時間相反。","example":"約束したので、行かないわけにはいかない。","zh":"約好了，不能不去。"}],"level":"N4"},{"id":"n472","kind":"grammar","point":"でも（疑問詞）","group":"degree","difficulty":2,"stem":"疲（つか）れているときは、何（なん）＿＿いいから食（た）べてください。","gloss":"累的時候，什麼都好，先吃點東西。","answer":"でも","options":[{"text":"でも","meaning":"任何一個都可以。自由選擇。","connection":"疑問詞＋でも。何でもいい。","why":"吃什麼都行。何でもいいから。","example":"だれでも参加できます。","zh":"誰都可以參加。"},{"text":"か","meaning":"某個不確定的東西。","connection":"疑問詞＋か。何か。","why":"何かいいから是「因為有點什麼好」，不是「什麼都可以」。","example":"何か食べましょう。","zh":"吃點東西吧。"},{"text":"も","meaning":"全部，常和否定一起。","connection":"疑問詞＋も＋否定。何も食べない。","why":"何もいいから後面不是否定。何も吃不到「什麼都行」。","example":"何も食べていません。","zh":"什麼都沒吃。"},{"text":"が","meaning":"主語。","connection":"何がいい。","why":"何がいい是「哪一個好」的選擇疑問，不是「隨便哪個都行」。","example":"何がいいですか。","zh":"哪個好？"}],"level":"N4"},{"id":"n473","kind":"grammar","point":"自動詞","group":"voice","difficulty":3,"stem":"窓（まど）が開（あ）＿＿。風（かぜ）が入（はい）ってくる。","gloss":"窗開著。風吹進來。","answer":"いている","options":[{"text":"いている","meaning":"自動詞的結果狀態。窗自己處於開的狀態。","connection":"自動詞て形＋いる。開く→開いて＋いる。","why":"沒有人在句子裡做動作，只說窗開著。開いている。","example":"ドアが閉まっている。","zh":"門關著。"},{"text":"けている","meaning":"他動詞開けている。人正在開。","connection":"他動詞て形＋いる。主語是人，賓語用を。","why":"窓が開けている會把窗當成開窗的人。窗的狀態要用自動詞開く。","example":"兄が窓を開けている。","zh":"哥哥正在開窗。"},{"text":"きている","meaning":"開く沒有「開きている」這個形。","connection":"五段開く的て形是開いて，不是開きて。","why":"開きている不存在。","example":"ドアが開いている。","zh":"門開著。"},{"text":"かせている","meaning":"使役。讓別人開。","connection":"開く→開かせる。","why":"開かせている是使人開著，主語不該是窗が。這句只說狀態。","example":"子供に窓を開かせている。","zh":"讓小孩開著窗。"}],"level":"N4"},{"id":"n474","kind":"grammar","point":"こと（形式名詞）","group":"speech","difficulty":2,"stem":"私（わたし）の趣味（しゅみ）は、絵（え）を描（か）く＿＿です。","gloss":"我的興趣是畫畫。","answer":"こと","options":[{"text":"こと","meaning":"把動詞變成名詞，表示那件事。","connection":"辞書形＋こと＋です。描くことです。","why":"興趣的內容是「畫畫這件事」。描くことです。","example":"夢は世界を旅行することです。","zh":"夢想是去世界旅行。"},{"text":"もの","meaning":"具體的東西，或應該如此的道理。","connection":"辞書形＋もの。","why":"描くものです會變成「是用來畫的東西」，不是把興趣說成一件事。","example":"これは絵を描くものです。","zh":"這是用來畫畫的。"},{"text":"わけ","meaning":"道理、緣故。","connection":"辞書形＋わけだ。","why":"描くわけです是「當然就是畫」的結論，不是給興趣下定義。","example":"だから、絵を描くわけだ。","zh":"所以才畫畫。"},{"text":"はず","meaning":"按理應該。","connection":"辞書形＋はずだ。","why":"描くはずです是按理會畫，不是「興趣是畫畫」。","example":"上手なはずです。","zh":"按理應該很行。"}],"level":"N4"},{"id":"n391","kind":"grammar","point":"かねない","group":"modal","difficulty":4,"stem":"彼（かれ）は口（くち）が軽（かる）い。秘密（ひみつ）でも話（はな）し＿＿。","gloss":"他嘴不嚴。連秘密都有可能說出去。","answer":"かねない","options":[{"text":"かねない","meaning":"有可能做出不好的事。負面的可能。","connection":"ます語幹＋かねない。話す→話し＋かねない。","why":"口が軽い表示他會說漏。秘密でも話しかねない。","example":"このままだと、事故になりかねない。","zh":"這樣下去，有可能出事。"},{"text":"かねる","meaning":"難以做、不好意思做。婉拒。","connection":"ます語幹＋かねる。話しかねる。","why":"話しかねる是他難以開口。和「嘴不嚴、會說出去」相反。","example":"その依頼はお受けしかねます。","zh":"那個委託我難以接受。"},{"text":"えない","meaning":"不可能。","connection":"ます語幹＋える的否定是えない。ありえない。","why":"話しえない不是「有可能說」。接法也不自然，不可能要用話し得ない。","example":"そんなことはありえない。","zh":"不可能有那種事。"},{"text":"っこない","meaning":"絕不會。口語，很強的否定。","connection":"ます語幹＋っこない。話しっこない。","why":"話しっこない是絕不會說。和嘴不嚴的負面可能相反。","example":"秘密は話しっこない。","zh":"秘密我絕不會說。"}],"level":"N3"},{"id":"n392","kind":"grammar","point":"おそれがある","group":"modal","difficulty":4,"stem":"台風（たいふう）が近（ちか）づいている。川（かわ）が氾濫（はんらん）する＿＿。","gloss":"颱風靠近。河有氾濫的危險。","answer":"おそれがある","options":[{"text":"おそれがある","meaning":"有發生壞事的危險。書面的可能。","connection":"辞書形＋おそれがある。する＋おそれがある。","why":"氾濫是不想發生的事，現在有這個危險。氾濫するおそれがある。","example":"地震で津波の発生するおそれがある。","zh":"地震可能引發海嘯。"},{"text":"ことにしている","meaning":"自己定下的習慣。","connection":"辞書形＋ことにしている。","why":"氾濫することにしている會變成河自己決定要氾濫。不是危險。","example":"毎朝走ることにしている。","zh":"我習慣每天早上跑步。"},{"text":"ふりだ","meaning":"假裝。","connection":"ふりをする，不是ふりだ直接接動詞。","why":"氾濫するふりだ不成立。河不會裝出氾濫的樣子。","example":"寝ているふりをした。","zh":"假裝睡著。"},{"text":"たところだ","meaning":"剛剛做完。","connection":"た形＋ところだ。したところだ。","why":"するたところだ接不上。颱風還在靠近，不是剛剛氾濫完。","example":"今、着いたところだ。","zh":"現在剛剛到。"}],"level":"N3"},{"id":"n393","kind":"grammar","point":"まい","group":"modal","difficulty":5,"stem":"あんな失敗（しっぱい）は二度（にど）とする＿＿。","gloss":"那種失敗再也不會做了。說話人的否定決心。","answer":"まい","options":[{"text":"まい","meaning":"不會做了。否定的意志，或很強的否定推量。","connection":"辞書形＋まい。する＋まい。一段動詞也可以用ます語幹＋まい。","why":"自己決定不再犯。するまい。","example":"もう遅れるまい。","zh":"再也不遲到了。"},{"text":"ない","meaning":"否定。","connection":"ない形。しない。","why":"するない不成立。否定意志不能把ない直接接在辞書形後面。","example":"失敗はしない。","zh":"不會失敗。"},{"text":"ません","meaning":"丁寧的否定。","connection":"ます形。しません。","why":"するません不成立。丁寧否定是しません，不接辞書形。","example":"失敗はしません。","zh":"不會失敗。"},{"text":"ず","meaning":"書面的否定て形。","connection":"ない形語幹＋ず。せず。","why":"するず不成立。要說せず。這句是決心，不是「不去做地」。","example":"何も言わずに帰った。","zh":"什麼都沒說就回去了。"}],"level":"N3"},{"id":"n394","kind":"grammar","point":"にきまっている","group":"modal","difficulty":4,"stem":"毎日（まいにち）練習（れんしゅう）しているのだから、上手（じょうず）＿＿。","gloss":"既然每天練習，一定很行。","answer":"にきまっている","options":[{"text":"にきまっている","meaning":"按照常理，肯定是這樣。語氣很強。","connection":"な形容詞語幹・名詞直接＋にきまっている。上手にきまっている。動詞・い形容詞用普通形。","why":"每天練習，所以好是理所當然。上手にきまっている。","example":"この値段なら、高いにきまっている。","zh":"這個價錢，一定貴。"},{"text":"わけがない","meaning":"不可能。","connection":"な形容詞＋な＋わけがない。上手なわけがない。","why":"上手わけがない少了な，而且意思是不可能好。和每天練習相反。","example":"毎日休んでいて、上手なわけがない。","zh":"天天休息，不可能好。"},{"text":"ものか","meaning":"哪有可能。強烈否定。","connection":"普通形＋ものか。","why":"上手ものか接不上，也不是否定。","example":"あんな人に頼むものか。","zh":"怎麼會拜託那種人。"},{"text":"っこない","meaning":"絕不會。","connection":"ます語幹＋っこない。動詞用。","why":"上手っこない不接在な形容詞上。","example":"負けるっこない。","zh":"絕不會輸。"}],"level":"N3"},{"id":"n395","kind":"grammar","point":"しかない","group":"modal","difficulty":3,"stem":"終電（しゅうでん）がない。歩（ある）く＿＿。","gloss":"沒有末班車了。只好走。","answer":"しかない","options":[{"text":"しかない","meaning":"除此之外沒有別的辦法。","connection":"辞書形＋しかない。歩くしかない。","why":"沒車，唯一的辦法是走。歩くしかない。","example":"謝るしかない。","zh":"只好道歉。"},{"text":"わけがない","meaning":"不可能。","connection":"辞書形＋わけがない。","why":"歩くわけがない是不可能走。和「只好走」相反。","example":"彼が歩くわけがない。車がある。","zh":"他不可能走路。他有車。"},{"text":"ことはない","meaning":"不必做。","connection":"辞書形＋ことはない。","why":"歩くことはない是不必走。但沒有末班車，不是不必。","example":"心配することはない。","zh":"不必擔心。"},{"text":"はずがない","meaning":"按理不會。","connection":"辞書形＋はずがない。","why":"歩くはずがない是否定走路。和只好走相反。","example":"こんなに近くて、タクシーに乗るはずがない。","zh":"這麼近，按理不會坐計程車。"}],"level":"N3"},{"id":"n396","kind":"grammar","point":"かねる","group":"modal","difficulty":4,"stem":"申し訳（もうしわけ）ありませんが、そのご依頼（いらい）はお受（う）けし＿＿。","gloss":"很抱歉，那個委託我難以接受。","answer":"かねます","options":[{"text":"かねます","meaning":"難以做。婉轉拒絕。","connection":"ます語幹＋かねる。お受けし＋かねます。","why":"前面有道歉，是婉拒。お受けしかねます。","example":"個人的なご質問にはお答えしかねます。","zh":"個人問題我難以回答。"},{"text":"かねません","meaning":"不是「難以」，否定後變成做得到。","connection":"かねる的丁寧否定。","why":"お受けしかねません會變成並非不能接受，也就是可以接受。和道歉拒絕相反。","example":"お受けできないわけではありません。","zh":"並不是不能接受。這才接近否定。"},{"text":"てしまいます","meaning":"做完、或後悔做了。","connection":"て形＋しまう。受けてしまう。","why":"お受けしてしまいます才接得上，空格在し後面不能直接てしまいます。而且意思是接受了，不是拒絕。","example":"頼まれて、引き受けてしまった。","zh":"被人拜託，就接了下來。"},{"text":"っぽいです","meaning":"看起來像。","connection":"名詞・語幹＋っぽい。","why":"しっぽいです不成立。婉拒不用っぽい。","example":"子供っぽいです。","zh":"孩子氣。"}],"level":"N3"},{"id":"n397","kind":"grammar","point":"ふりをする","group":"modal","difficulty":3,"stem":"本当（ほんとう）は怒（おこ）っているのに、笑（わら）っている＿＿をした。","gloss":"其實在生氣，卻裝出在笑的樣子。","answer":"ふり","options":[{"text":"ふり","meaning":"假裝成那個樣子。外表和真實不同。","connection":"動詞ている形＋ふりをする。笑っているふり。","why":"心裡生氣，外表在笑。笑っているふりをした。","example":"知っているのに、知らないふりをした。","zh":"明明知道，卻裝不知道。"},{"text":"こと","meaning":"事情。","connection":"ている＋こと。","why":"笑っていることをした不是「裝笑」。こと不表示假裝。","example":"笑っていることを注意された。","zh":"被提醒自己在笑。"},{"text":"わけ","meaning":"道理。","connection":"わけだ／わけがない。","why":"笑っているわけをした不成立。","example":"怒っているわけだ。","zh":"怪不得在生氣。"},{"text":"はず","meaning":"按理。","connection":"はずだ。","why":"笑っているはずをした不成立。按理會笑，不是裝出來。","example":"笑っているはずだ。","zh":"按理應該在笑。"}],"level":"N3"},{"id":"n398","kind":"grammar","point":"げ","group":"modal","difficulty":4,"stem":"彼女（かのじょ）は悲（かな）し＿＿な様子（ようす）で座（すわ）っていた。","gloss":"她帶著悲傷的神情坐著。","answer":"げ","options":[{"text":"げ","meaning":"從外面看得出的樣子。","connection":"い形容詞・な形容詞的語幹＋げ。悲しい→悲し＋げ。後面接な＋名詞：悲しげな様子。","why":"看得出她悲傷。悲しげな様子。","example":"子供は楽しげに遊んでいる。","zh":"小孩玩得很開心的樣子。"},{"text":"み","meaning":"把形容詞變成名詞的「味、感覺」。","connection":"い形容詞語幹＋み。悲しみ。","why":"悲しみな様子少了「の」。悲しみの様子才行，而且み不是「看起來」。空格要的是げ。","example":"悲しみの色がある。","zh":"帶著悲傷的神色。這用名詞悲しみ。"},{"text":"く","meaning":"い形容詞連用，或く＋なる。","connection":"悲しく＋動詞。","why":"悲しくな様子不成立。修飾様子要用な，不是く。","example":"悲しく座っていた。","zh":"悲傷地坐著。這句不再加な様子。"},{"text":"がる","meaning":"第三者把內心顯出來。","connection":"語幹＋がる。悲しがる。","why":"悲しがるな様子不成立。がる後面不接な修飾名詞。","example":"子供が悲しがっている。","zh":"小孩顯得很傷心。"}],"level":"N3"},{"id":"n399","kind":"grammar","point":"づらい","group":"tendency","difficulty":4,"stem":"靴（くつ）が小（ちい）さすぎて、歩（ある）き＿＿。","gloss":"鞋太小，走起來吃力。","answer":"づらい","options":[{"text":"づらい","meaning":"做起來身體或心理吃力。","connection":"ます語幹＋づらい。歩く→歩き＋づらい。","why":"鞋小是身體上的吃力。歩きづらい。","example":"この文は長すぎて、読みづらい。","zh":"這篇文章太長，很難讀。"},{"text":"がたい","meaning":"從情理上難以做。","connection":"ます語幹＋がたい。歩きがたい。","why":"歩きがたい是心理上難以迈步，例如不忍離開。不是鞋小的身體負擔。","example":"信じがたい話だ。","zh":"難以置信的事。"},{"text":"よい","meaning":"容易做。古一點的說法，和やすい接近。","connection":"ます語幹＋よい。歩きよい。","why":"歩きよい是好走。和鞋太小相反。","example":"この道は歩きよい。","zh":"這條路好走。"},{"text":"っぽい","meaning":"看起來像。","connection":"名詞・語幹＋っぽい。","why":"歩きっぽい不表示難走。っぽい不是難易。","example":"子供っぽい歩き方だ。","zh":"走路的樣子很孩子氣。"}],"level":"N3"},{"id":"n400","kind":"grammar","point":"ばかりだ","group":"change","difficulty":4,"stem":"景気（けいき）は悪（わる）くなる＿＿で、よくならない。","gloss":"景氣一個勁地變差，好不起來。","answer":"ばかりだ","options":[{"text":"ばかりだ","meaning":"只朝壞的方向變化。","connection":"動詞辞書形＋ばかりだ。悪くなるばかりだ。","why":"後面說好不起來，變化只有變差。悪くなるばかりだ。","example":"病気は重くなるばかりだ。","zh":"病一個勁地加重。"},{"text":"ことにした","meaning":"自己決定。","connection":"辞書形＋ことにする。","why":"悪くなることにした會變成決定讓景氣變差。不是單向惡化。","example":"転勤することにした。","zh":"決定調職。"},{"text":"たばかりだ","meaning":"剛剛。","connection":"た形＋ばかりだ。悪くなったばかりだ。","why":"なるたばかりだ接不上。剛剛變差和「一直變差、好不了」不同。","example":"悪くなったばかりだ。","zh":"剛剛變差。"},{"text":"ふりだ","meaning":"假裝。","connection":"ふりをする。","why":"悪くなるふりだ不成立。景氣不會裝變差。","example":"元気なふりをした。","zh":"裝出健康的樣子。"}],"level":"N3"},{"id":"n440","kind":"grammar","point":"ところだった","group":"time","difficulty":4,"stem":"もう少（すこ）しで車（くるま）にひかれる＿＿。","gloss":"差點被車撞到。","answer":"ところだった","options":[{"text":"ところだった","meaning":"差點發生，其實沒發生。","connection":"辞書形＋ところだった。常和もう少しで一起。ひかれるところだった。","why":"もう少しで表示就差一點。ひかれるところだった。","example":"もう少しで忘れるところだった。","zh":"差點忘了。"},{"text":"ばかりだった","meaning":"淨是、一個勁。不是差點。","connection":"辞書形＋ばかりだ。","why":"ひかれるばかりだった不是「差點被撞」。もう少しで不和ばかり搭配。","example":"悪くなるばかりだった。","zh":"一個勁地變差。"},{"text":"ことにした","meaning":"自己決定。","connection":"辞書形＋ことにする。","why":"ひかれることにした會變成決定被車撞。荒謬。","example":"歩くことにした。","zh":"決定走路。"},{"text":"おそれがある","meaning":"有危險，事情尚未成為差點發生的過去。","connection":"辞書形＋おそれがある。","why":"もう少しで〜おそれがある不是差點已經發生的句型。おそれは앞으로の危険。","example":"ひかれるおそれがある。","zh":"有被撞的危險。這句沒有もう少しで。"}],"level":"N3"},{"id":"n441","kind":"grammar","point":"たところで","group":"condition","difficulty":4,"stem":"今さら謝（あやま）っ＿＿、許（ゆる）してはもらえないだろう。","gloss":"事到如今才道歉，也不會被原諒吧。","answer":"たところで","options":[{"text":"たところで","meaning":"即使現在做了，結果也不會改變。","connection":"動詞た形＋ところで。謝る→謝ったところで。常和今さら、どうせ一起。","why":"現在道歉也晚了，原諒這個結果不變。謝ったところで。","example":"今さら急いだところで、間に合わない。","zh":"事到如今才趕，也來不及。"},{"text":"たばかりに","meaning":"正因為做了，才引起不好的結果。","connection":"た形＋ばかりに。","why":"謝ったばかりに是因為道了歉才得不到原諒，把道歉當成已經發生的原因。句首今さら是假設還没用。","example":"言ったばかりに、怒られた。","zh":"就因為說了，被罵了。"},{"text":"たとたん","meaning":"一……就。剛做完立刻發生意外。","connection":"た形＋とたん。","why":"謝ったとたん、許してはもらえないだろう時間不對。とたん後面多是已發生的意外，不用だろう的推測。","example":"謝ったとたん、泣き出した。","zh":"一道歉就哭了。"},{"text":"たところ","meaning":"做了之後，結果發現。","connection":"た形＋ところ。","why":"謝ったところ是道歉了之後的實際結果。今さら加上だろう，是即使道歉也不會，還沒做。","example":"謝ったところ、許してくれた。","zh":"道了歉，結果被原諒了。"}],"level":"N3"},{"id":"n442","kind":"grammar","point":"とはいえ","group":"contrast","difficulty":4,"stem":"春（はる）になった＿＿、まだ寒（さむ）い。","gloss":"雖說已經到了春天，還是冷。","answer":"とはいえ","options":[{"text":"とはいえ","meaning":"雖說如此，後面仍和預期不同。書面。","connection":"普通形＋とはいえ。なった＋とはいえ。","why":"到了春天按理該暖，實際還冷。なったとはいえ。","example":"簡単だとはいえ、時間はかかる。","zh":"雖說簡單，還是花時間。"},{"text":"からには","meaning":"既然……就該。","connection":"普通形＋からには。後面是義務或決心。","why":"春になったからには後面應是「就該做某事」，不是「還冷」這個相反的事實。","example":"春になったからには、片付けよう。","zh":"既然到了春天，就收拾一下。"},{"text":"せいで","meaning":"都怪。負面原因。","connection":"普通形＋せいで。","why":"還冷不是春天到來造成的壞結果。因果方向錯了。","example":"遅れたせいで、怒られた。","zh":"都怪遲到，被罵了。"},{"text":"おかげで","meaning":"多虧。正面結果。","connection":"普通形＋おかげで。","why":"還冷不是值得感謝的好結果。","example":"暖かくなったおかげで、桜が咲いた。","zh":"多虧變暖，櫻花開了。"}],"level":"N3"},{"id":"n443","kind":"grammar","point":"としたら","group":"condition","difficulty":4,"stem":"もし一人（ひとり）で行（い）く＿＿、私（わたし）が心配（しんぱい）する。","gloss":"如果是一個人去的話，我會擔心。","answer":"としたら","options":[{"text":"としたら","meaning":"假如是那種情況。假設。","connection":"普通形＋としたら。行く＋としたら。常和もし一起。","why":"還不知道會不會一個人去，先假設那種情況。行くとしたら。","example":"もし断るとしたら、早めに言ってください。","zh":"如果要拒絕的話，請早點說。"},{"text":"ものなら","meaning":"如果真能做到的話。多接可能形，後句常是強烈的話。","connection":"可能形＋ものなら。","why":"行くものなら是「若是去得成」，這句只是普通假設一個人去，沒有做不到的意思。","example":"戻れるものなら、戻りたい。","zh":"要是回得去，我想回去。"},{"text":"たびに","meaning":"每次。","connection":"辞書形＋たびに。","why":"もし和たびに不搭配。不是每次一個人去。","example":"行くたびに、心配する。","zh":"每次去都擔心。這句沒有もし。"},{"text":"ものの","meaning":"雖然。","connection":"普通形＋ものの。","why":"行くものの是雖然去，不是如果去。和もし矛盾。","example":"行くものの、自信はない。","zh":"雖說要去，但沒信心。"}],"level":"N3"},{"id":"n444","kind":"grammar","point":"なしに","group":"aspect","difficulty":4,"stem":"断（ことわ）り＿＿、会社（かいしゃ）を休（やす）んだ。","gloss":"沒有請假就沒去公司。","answer":"なしに","options":[{"text":"なしに","meaning":"沒有做某事就……。書面。","connection":"名詞＋なしに。動詞ならない形語幹＋ことなしに。断りは名詞。断りなしに。","why":"沒有事先打招呼就休息。断りなしに。","example":"許可なしに入ってはいけない。","zh":"未經許可不准進入。"},{"text":"ぬくに","meaning":"做到底。不表示「沒有」。","connection":"ます語幹＋ぬく。","why":"断りぬくに休んだ不成立。","example":"走りぬいた。","zh":"跑到了底。"},{"text":"ながら","meaning":"一邊，或逆接。","connection":"名詞＋ながらは逆接。断りながら。","why":"断りながら休んだ會變成一邊拒絕一邊休息，不是「沒有拒絕／沒有請假」。","example":"文句を言いながら働いた。","zh":"一邊抱怨一邊工作。"},{"text":"うえで","meaning":"在做完的基礎上。","connection":"た形＋うえで，或名詞＋のうえで。","why":"断りうえで少了の或た形。也不是「沒有請假」。","example":"断ったうえで、休んだ。","zh":"先說好了再休息。那是有打招呼。"}],"level":"N3"},{"id":"n445","kind":"grammar","point":"に限らず","group":"addition","difficulty":4,"stem":"この店（みせ）は平日（へいじつ）＿＿、週末（しゅうまつ）も込（こ）んでいる。","gloss":"這家店不只平日，週末也擠。","answer":"に限らず","options":[{"text":"に限らず","meaning":"不限於。後面還有同樣的情況。","connection":"名詞＋に限らず。後面常有も。平日に限らず、週末も。","why":"平日和週末都擠。平日に限らず。","example":"東京に限らず、全国で売れている。","zh":"不只東京，全國都賣。"},{"text":"に限り","meaning":"只限於。公告式的限定。","connection":"名詞＋に限り。","why":"平日に限り會變成只有平日，和後面「週末也擠」矛盾。","example":"本日に限り、半額です。","zh":"僅限今天半價。"},{"text":"に限って","meaning":"偏偏是這個時候、只有這種情況例外。","connection":"名詞＋に限って。","why":"平日に限って是偏偏平日才這樣。後面週末も就不能再說同樣擠。","example":"大切な日に限って、雨が降る。","zh":"偏偏重要的日子下雨。"},{"text":"に反して","meaning":"與預期相反。","connection":"名詞＋に反して。","why":"平日に反して週末も沒有「和預期相反」的兩面，兩段都是擠。","example":"予想に反して、空いていた。","zh":"和預期相反，很空。"}],"level":"N3"},{"id":"n446","kind":"grammar","point":"に伴って","group":"change","difficulty":4,"stem":"人口（じんこう）が増（ふ）える＿＿、ゴミも増えた。","gloss":"隨著人口增加，垃圾也增加了。","answer":"に伴って","options":[{"text":"に伴って","meaning":"隨著一方變化，另一方也跟著變。書面。","connection":"辞書形・名詞＋に伴って。増えるに伴って。","why":"人口和垃圾一起增加。増えるに伴って。","example":"成長に伴って、考えも変わった。","zh":"隨著成長，想法也變了。"},{"text":"に反して","meaning":"相反。","connection":"名詞＋に反して。動詞要のに反して。","why":"増えるに反して會變成垃圾和人口增加相反。這句是一起增加。","example":"予想に反して、減った。","zh":"和預期相反，減少了。"},{"text":"に比べて","meaning":"和……相比。","connection":"名詞＋に比べて。","why":"増えるに比べて接續不自然，也沒有比較的基準，是連動的變化。","example":"去年に比べて、人口が増えた。","zh":"和去年比，人口增加了。"},{"text":"をこめて","meaning":"充滿情感。","connection":"名詞＋をこめて。","why":"増えるをこめて不成立。垃圾增加不是把情感放進人口。","example":"感謝をこめて、手紙を書いた。","zh":"充滿感謝地寫了信。"}],"level":"N3"},{"id":"n447","kind":"grammar","point":"において","group":"stance","difficulty":4,"stem":"正式（せいしき）な式（しき）＿＿、その発表（はっぴょう）が行われた。","gloss":"在正式的儀式上，做了那個發表。","answer":"において","options":[{"text":"において","meaning":"在某個場合、地點。書面。","connection":"名詞＋において。式において。","why":"發表發生在儀式這個場合。式において。","example":"会議において、意見を述べた。","zh":"在會議上陳述了意見。"},{"text":"に対して","meaning":"針對。","connection":"名詞＋に対して。","why":"式に対して発表する會變成針對儀式做發表，不是在儀式上進行。","example":"質問に対して答えた。","zh":"針對問題做了回答。"},{"text":"にとって","meaning":"對某人來說。","connection":"人＋にとって。","why":"式にとって不是「在儀式上」。にとって的前面多是人。","example":"学生にとって、試験は大切だ。","zh":"對學生來說，考試重要。"},{"text":"にこたえて","meaning":"回應期待、要求。","connection":"名詞＋にこたえて。","why":"式にこたえて不是在儀式這個場面上。沒有人向儀式提出要求。","example":"期待にこたえて、優勝した。","zh":"回應期待，拿到冠軍。"}],"level":"N3"},{"id":"n448","kind":"grammar","point":"からして","group":"stance","difficulty":5,"stem":"彼（かれ）は言葉（ことば）づかい＿＿、感（かん）じが悪（わる）い。","gloss":"他光是用詞，給人的感覺就差。","answer":"からして","options":[{"text":"からして","meaning":"從這一點看就已经如此，其他更不必說。","connection":"名詞＋からして。言葉づかいからして。","why":"用詞只是其中一點，已經感覺差。言葉づかいからして。","example":"あいさつからして、失礼だ。","zh":"光是打招呼就不禮貌。"},{"text":"からには","meaning":"既然。","connection":"普通形＋からには。後面是應該做的事。","why":"言葉づかいからには不接名詞。既然用詞，後面也不是「感覺差」這種評價。","example":"言うからには、やる。","zh":"既然說了，就要做。"},{"text":"といっても","meaning":"雖說。","connection":"普通形＋といっても。","why":"言葉づかいといっても後面通常要縮小程度，不是直接「感覺差」的起點。名詞也不直接加。","example":"安いといっても、一万円はする。","zh":"雖說便宜，也要一萬日元。"},{"text":"としたら","meaning":"如果。","connection":"普通形＋としたら。","why":"言葉づかいとしたら不是「從用詞這一點就」。","example":"失礼だとしたら、謝る。","zh":"如果是失禮的話，就道歉。"}],"level":"N3"},{"id":"n449","kind":"grammar","point":"ことだから","group":"modal","difficulty":4,"stem":"時間（じかん）に厳（きび）しい田中（たなか）さんの＿＿、遅（おく）れるはずがない。","gloss":"田中一向守時，不可能遲到。","answer":"ことだから","options":[{"text":"ことだから","meaning":"因為這個人一向如此，所以可以預測。","connection":"名詞＋の＋ことだから。田中さんのことだから。","why":"守時是他的一貫作風，所以預測不會遲到。ことだから。","example":"優しい母のことだから、許してくれるだろう。","zh":"媽媽一向溫柔，應該會原諒。"},{"text":"せいで","meaning":"都怪。負面原因。","connection":"名詞＋の＋せいで。","why":"田中さんのせいで遅れるはずがない因果反了。せいで引出的是不好的結果，不是「不會遲到」。","example":"寝坊のせいで、遅れた。","zh":"都怪睡過頭，遲到了。"},{"text":"くせに","meaning":"明明卻。責備。","connection":"名詞＋の＋くせに。","why":"田中さんのくせに是責備他，後面「不會遲到」不是轉折。","example":"学生のくせに、勉強しない。","zh":"明明是學生，卻不學習。"},{"text":"わりに","meaning":"以某標準來說不成比例。","connection":"名詞＋の＋わりに。","why":"田中さんのわりに遲れるはずがない不是從性格做預測。わりに要的是和標準不符的結果。","example":"年齢のわりに、しっかりしている。","zh":"以年齡來說，很穩重。"}],"level":"N3"},{"id":"n450","kind":"grammar","point":"ということだ","group":"speech","difficulty":4,"stem":"部長（ぶちょう）の話（はなし）では、来週（らいしゅう）出張（しゅっちょう）する＿＿。","gloss":"據部長所說，下週要出差。","answer":"ということだ","options":[{"text":"ということだ","meaning":"把聽到的內容傳出來。傳聞。","connection":"普通形＋ということだ。する＋ということだ。常和〜の話では、〜によると一起。","why":"消息來自部長。出張するということだ。","example":"ニュースによると、中止だということだ。","zh":"據新聞說，是取消了。"},{"text":"ことにする","meaning":"說話人自己決定。","connection":"辞書形＋ことにする。","why":"部長の話では不是自己決定出差。ことにする的決定者應是說話人。","example":"来週出張することにした。","zh":"我決定下週出差。"},{"text":"ものか","meaning":"哪會。強烈否定。","connection":"普通形＋ものか。","why":"出張するものか會變成我才不會出差。和轉述部長的話相反。","example":"一人で行くものか。","zh":"我才不會一個人去。"},{"text":"ようがない","meaning":"沒有辦法做。","connection":"ます語幹＋ようがない。","why":"するようがない不接在辞書形出張する後面。也沒有「無法出差」的意思。","example":"行きようがない。","zh":"沒辦法去。"}],"level":"N3"},{"id":"n451","kind":"grammar","point":"ぬく","group":"aspect","difficulty":4,"stem":"苦（くる）しくても、最後（さいご）まで走（はし）り＿＿。","gloss":"即使辛苦，也跑到了最後。","answer":"ぬいた","options":[{"text":"ぬいた","meaning":"把辛苦的事做到底。","connection":"ます語幹＋ぬく。走る→走り＋ぬいた。","why":"最後まで表示貫徹。走りぬいた。","example":"悩みぬいて、決めた。","zh":"煩惱到底，才決定。"},{"text":"かけた","meaning":"做到一半、剛開始。","connection":"ます語幹＋かける。走りかけた。","why":"走りかけた是沒跑完。和最後まで相反。","example":"走りかけたところで、転んだ。","zh":"剛跑起來就摔倒了。"},{"text":"そこなった","meaning":"沒做成。","connection":"ます語幹＋そこなう。走りそこなった。","why":"走りそこなった是沒跑成。和做到最後相反。","example":"電車に乗りそこなった。","zh":"沒趕上電車。"},{"text":"出した","meaning":"開始做。","connection":"ます語幹＋出す。走り出した。","why":"走り出した是剛剛開始跑。和最後まで做到底相反。","example":"信号が変わると、走り出した。","zh":"燈一變，就跑起來了。"}],"level":"N3"},{"id":"n452","kind":"grammar","point":"限り","group":"degree","difficulty":4,"stem":"私（わたし）の見（み）る＿＿、問題（もんだい）はなさそうだ。","gloss":"就我所能看到的範圍，好像沒有問題。","answer":"限り","options":[{"text":"限り","meaning":"在這個範圍之內。判斷不超出看到的部分。","connection":"動詞辞書形＋限り。見る限り。","why":"判斷只限於自己看到的。見る限り。","example":"私の知る限り、その話は本当だ。","zh":"就我所知，那件事是真的。"},{"text":"うちに","meaning":"趁著。","connection":"辞書形・ている＋うちに。後面是在那段時間裡做的動作。","why":"見るうちに問題はなさそうだ不是趁看的時候下判斷的句型。うちに後面多是變化或要趁早做的事。","example":"見ているうちに、暗くなった。","zh":"看著看著，天黑了。"},{"text":"たびに","meaning":"每次。","connection":"辞書形＋たびに。","why":"見るたびに是每次看都怎樣。這句是一次範圍內的判斷，不是反覆。","example":"見るたびに、上手になっている。","zh":"每次看，都變得更行。"},{"text":"最中に","meaning":"正在進行的正中間。","connection":"ている＋最中に，或名詞＋の最中に。","why":"見る最中に不接辞書形那麼自然，而且「好像沒問題」不是發生在觀看途中的事件。","example":"食事の最中に、電話が来た。","zh":"正吃飯的時候，電話來了。"}],"level":"N3"},{"id":"n610","kind":"grammar","point":"のに（名詞）","group":"contrast","difficulty":3,"stem":"まだ高校生（こうこうせい）＿＿、夜中（よなか）まで働（はたら）いている。","gloss":"還是高中生，卻工作到半夜。","answer":"なのに","options":[{"text":"なのに","meaning":"明明是……卻。名詞、な形容詞要加な。","connection":"名詞＋な＋のに。高校生なのに。","why":"まだ表示和「高中生」的身分相反，覺得意外。高校生なのに。","example":"学生なのに、夜遅くまで起きている。","zh":"明明是學生，卻熬到很晚。"},{"text":"のに","meaning":"動詞、い形容詞後面的逆接。","connection":"普通形＋のに。名詞不能直接加のに。","why":"高校生のに少了な。名詞要高校生なのに。","example":"若いのに、夜中まで働いている。","zh":"明明年輕，卻工作到半夜。前面是い形容詞。"},{"text":"だのに","meaning":"沒有「だのに」這個接法。","connection":"名詞的逆接不是だ＋のに。","why":"高校生だのに不成立。要用なのに，或であるのに。","example":"高校生であるのに、働いている。","zh":"雖然是高中生，卻在工作。書面可以用であるのに。"},{"text":"くせに","meaning":"明明卻，帶責備。","connection":"名詞＋の＋くせに。高校生のくせに。","why":"高校生くせに少了の。空格若只用くせに，接在名詞後面不成立。","example":"高校生のくせに、勉強しない。","zh":"明明是高中生，卻不學習。"}],"level":"N3"},{"id":"n611","kind":"grammar","point":"ので（い形容詞）","group":"cause","difficulty":3,"stem":"この道（みち）は暗（くら）＿＿、気（き）をつけてください。","gloss":"這條路很暗，請小心。","answer":"いので","options":[{"text":"いので","meaning":"い形容詞的原因。","connection":"い形容詞是語幹＋い＋ので。暗い→暗いので。空格前是語幹暗。","why":"路暗是要小心的原因。暗いので。","example":"暑いので、窓を開けた。","zh":"因為熱，開了窗。"},{"text":"なので","meaning":"な形容詞・名詞的原因。","connection":"語幹＋なので。静かなので。","why":"暗い是い形容詞，不能暗なので。","example":"静かなので、眠れます。","zh":"因為安靜，睡得著。"},{"text":"ので","meaning":"接在已經完成的普通形後面。","connection":"動詞た形・ている、或すでに「暗い」のあと＋ので。","why":"暗ので少了い。い形容詞要先恢復い，才是暗いので。","example":"道が暗いので、気をつけてください。","zh":"因為路暗，請小心。這句い已經在。"},{"text":"だので","meaning":"不存在。","connection":"名詞ならなので，不是だので。","why":"暗だので不成立。い形容詞不加だ。","example":"夜なので、暗い。","zh":"因為是晚上，所以暗。前面是名詞。"}],"level":"N3"},{"id":"n612","kind":"grammar","point":"らしい（典型）","group":"modal","difficulty":4,"stem":"この子（こ）は好奇心（こうきしん）が強（つよ）くて、本当（ほんとう）に子供（こども）＿＿。","gloss":"這孩子好奇心很強，真有孩子的樣子。","answer":"らしい","options":[{"text":"らしい","meaning":"具備該名詞應有的典型。正面的評價時常用。","connection":"名詞直接＋らしい。子供らしい。中間不加の、不加だ。","why":"這個孩子正有孩子該有的好奇心。子供らしい。","example":"学生らしい服装だ。","zh":"很有學生樣子的服裝。"},{"text":"そうだ","meaning":"樣態或傳聞。","connection":"樣態は語幹＋そうだ。名詞の伝聞はだそうだ。","why":"子供そうだ接不上。若是傳聞要子供だそうだ。這句不是聽說他是孩子，他本來就是孩子。","example":"子供だそうだ。","zh":"聽說是個孩子。"},{"text":"だろう","meaning":"大概是。對事實不確定。","connection":"名詞＋だろう。子供だろう。","why":"この子は子供だろう會變成「大概是個孩子」，在懷疑身分。句子要的是典型的樣子，不是不確定。","example":"たぶん子供だろう。","zh":"大概是孩子吧。"},{"text":"はずだ","meaning":"按理應該是。","connection":"名詞＋の＋はずだ。子供のはずだ。","why":"子供はずだ少了の。而且句中沒有「按理應是孩子」的根據，是在誇典型。","example":"名簿にあるから、子供のはずだ。","zh":"名冊上有，按理應該是孩子。"}],"level":"N3"},{"id":"n613","kind":"grammar","point":"ている（結果）","group":"aspect","difficulty":3,"stem":"窓（まど）が開（あ）い＿＿。鍵（かぎ）もかかっていない。","gloss":"窗開著。鎖也沒扣上。","answer":"ている","options":[{"text":"ている","meaning":"自動詞做完後，狀態還留着。","connection":"て形＋いる。開く→開いて＋いる。","why":"現在看得到窗開著，不是正在做「開」這個動作。開いている。","example":"電気がついている。","zh":"燈亮著。"},{"text":"てしまう","meaning":"做完，或覺得可惜。","connection":"て形＋しまう。開いてしまう。","why":"開いてしまう是窗會被打開這件事發生了，不描述現在仍然開著、鎖也没扣的狀態。","example":"窓が開いてしまった。","zh":"窗開了（覺得不妙）。"},{"text":"ておく","meaning":"事先做。主語是人。","connection":"て形＋おく。","why":"窓が開いておく主語不對。おく是人先把窗打開留著，不說窓が。","example":"窓を開けておく。","zh":"事先把窗打開。"},{"text":"てみる","meaning":"試著做。","connection":"て形＋みる。","why":"窓が開いてみる不自然。窗不會自己試著開。","example":"窓を開けてみた。","zh":"試著開了窗。"}],"level":"N3"},{"id":"n614","kind":"grammar","point":"とき（辞書形）","group":"time","difficulty":3,"stem":"国（くに）へ帰（かえ）る＿＿、空港（くうこう）でお土（みやげ）産を買（か）う。","gloss":"回國的時候，在機場買特產。還沒完成「回到國」這個動作。","answer":"とき","options":[{"text":"とき","meaning":"做那件事的時候。辞書形表示動作尚未完成、正要做的場合。","connection":"辞書形＋とき。帰る＋とき。","why":"在回國這趟、還沒到家的時候於機場買。帰るとき。","example":"寝るとき、電気を消します。","zh":"睡覺的時候關燈。"},{"text":"たとき","meaning":"做完之後的時候。","connection":"た形＋とき。帰ったとき。","why":"帰るたとき多了一個た的位置，辞書形後面不能再加たとき。回國之後才買，就不在機場。","example":"国へ帰ったとき、家族に会った。","zh":"回到國以後，見了家人。"},{"text":"たら","meaning":"如果、之後。","connection":"た形＋ら。帰ったら。","why":"帰るたら接不上。","example":"国へ帰ったら、電話します。","zh":"回到國之後打電話。"},{"text":"てから","meaning":"做完再做。","connection":"て形＋から。帰ってから。","why":"帰るてから不成立。","example":"国へ帰ってから、働きます。","zh":"回國之後工作。"}],"level":"N4"},{"id":"n615","kind":"grammar","point":"たら（発見）","group":"condition","difficulty":3,"stem":"窓（まど）を開（あ）け＿＿、山（やま）が見（み）えた。","gloss":"一打開窗，就看見了山。過去的一次性發現。","answer":"たら","options":[{"text":"たら","meaning":"做了之後，發現了某事。個別的過去。","connection":"動詞た形＋ら。開ける→開け＋たら，空格在開け後面。開けたら。","why":"打開的結果是看見山，這是一次過去的發現。開けたら、見えた。","example":"箱を開けたら、手紙が入っていた。","zh":"打開盒子，發現裡面有信。"},{"text":"ば","meaning":"一般的假設。","connection":"仮定形＋ば。開ければ。","why":"開けば是「要是開的話」。後句見えた是過去的一次發現，不用ば的一般條件。空格在開け後面也不直接是ば。","example":"窓を開ければ、山が見える。","zh":"一開窗就看得見山。這是一般情況。"},{"text":"ても","meaning":"即使。","connection":"て形＋も。開けても。","why":"開けても是即使打開。看見山不是讓步。","example":"窓を開けても、何も見えなかった。","zh":"即使開了窗，什麼也沒看見。"},{"text":"なら","meaning":"如果是那種情況。","connection":"辞書形＋なら。開けるなら。","why":"開けなら少了る。なら多用於對方的打算，不是自己打開後的發現。","example":"開けるなら、私が手伝う。","zh":"要開的話，我來幫。"}],"level":"N3"},{"id":"n616","kind":"grammar","point":"ば（助言）","group":"advice","difficulty":3,"stem":"分（わ）からなければ、先生（せんせい）に聞（き）け＿＿。","gloss":"如果不懂，問老師就好了。","answer":"ばいい","options":[{"text":"ばいい","meaning":"那樣做就可以。建議。","connection":"仮定形＋ば＋いい。聞く→聞け＋ばいい。","why":"給對方一個夠用的做法。先生に聞けばいい。","example":"分からなければ、聞けばいい。","zh":"不懂的話，問就好了。"},{"text":"ばならない","meaning":"不是「必須」的正確形。","connection":"必須是なければ＋ならない。","why":"聞けばならない不存在。必須問是聞かなければならない。","example":"分からなければ、聞かなければならない。","zh":"不懂的話就必須問。這是義務，不是「問就好」。"},{"text":"ばいけない","meaning":"禁止的一部分，接法不對。","connection":"てはいけない才是禁止。","why":"聞けばいけない不成立。不准問是聞いてはいけない。","example":"試験中に聞いてはいけない。","zh":"考試時不准問。"},{"text":"ばよかった","meaning":"當時那樣做就好了。後悔。","connection":"仮定形＋ばよかった。","why":"聞けばよかった是「當時問就好了」，事情已經過去。這句分からなければ是現在給的建議，不是後悔。","example":"先生に聞けばよかった。","zh":"當時問老師就好了。"}],"level":"N3"},{"id":"n617","kind":"grammar","point":"てしまう（完了）","group":"aspect","difficulty":3,"stem":"この本（ほん）は面白（おもしろ）いので、一日（いちにち）で読（よ）んで＿＿。","gloss":"這本書有趣，一天就讀完了。","answer":"しまった","options":[{"text":"しまった","meaning":"把動作做完。這裡強調在一天之內完成，不一定是後悔。","connection":"て形＋しまう。読んで＋しまった。","why":"面白い是原因，一天讀完是完成。読んでしまった。","example":"宿題を一時間でやってしまった。","zh":"功課一個小時就做完了。"},{"text":"おいた","meaning":"事先做，留著以後用。","connection":"て形＋おく。読んでおいた。","why":"読んでおいた是先讀好備用。句子強調一天就讀完，不是預先準備。","example":"明日のために、読んでおいた。","zh":"為了明天，先讀了。"},{"text":"みた","meaning":"試著做。","connection":"て形＋みる。読んでみた。","why":"読んでみた是試著讀。原因「因為有趣所以一天讀完」不是嘗試。","example":"少し読んでみた。","zh":"試著讀了一點。"},{"text":"あった","meaning":"人為留下的狀態。","connection":"他動詞て形＋ある。読んである。","why":"本を読んである少見，主語通常不是把「讀完這一天」當完成，而是東西被人處理好留著。這句要的是讀這個動作結束。","example":"資料はすでに読んである。","zh":"資料已經被人讀好了。"}],"level":"N3"},{"id":"n618","kind":"grammar","point":"ように（依頼）","group":"speech","difficulty":4,"stem":"先生（せんせい）は学生（がくせい）に、静（しず）かに歩（ある）く＿＿言（い）った。","gloss":"老師叫學生輕聲走路。間接命令。","answer":"ように","options":[{"text":"ように","meaning":"叫別人做到某個狀態或動作。間接引用命令、請求。","connection":"辞書形・ない形＋ように＋言う。歩く＋ように言った。","why":"老師的話是要求學生走路的方式。歩くように言った。","example":"先生は学生に、遅れないように言った。","zh":"叫人不要遲到。"},{"text":"ために","meaning":"為了目的。","connection":"辞書形＋ために。","why":"歩くために言った會變成老師為了走路才說。不是把命令轉述出來。","example":"静かに歩くために、靴を脱いだ。","zh":"為了安靜走路，脫了鞋。"},{"text":"とおりに","meaning":"按照。","connection":"辞書形＋とおりに。","why":"歩くとおりに言った是照走路的方式來說，不是命令別人那樣走。","example":"先生が歩くとおりに、歩いた。","zh":"照老師走路的樣子走。"},{"text":"そうに","meaning":"樣態的連用。","connection":"ます語幹＋そうに。歩きそうに。","why":"歩くそうに言った不成立。樣態要歩きそうに，而且不是間接命令。","example":"泣きそうに言った。","zh":"像要哭出來那樣說。"}],"level":"N3"},{"id":"n619","kind":"grammar","point":"受身（物が主語）","group":"voice","difficulty":4,"stem":"この小説（しょうせつ）は世界中（せかいじゅう）で読（よ）＿＿。","gloss":"這本小說在全世界被人讀。","answer":"まれている","options":[{"text":"まれている","meaning":"物做主語的受身。被人讀這個狀態持續。","connection":"五段：読む→読まれる。あ段＋れている。空格在読後面。","why":"小說自己不會讀，是被人讀。読まれている。","example":"この歌は多くの人に歌われている。","zh":"這首歌被很多人唱。"},{"text":"せている","meaning":"使役的一部分，接法不對。","connection":"読む的使役是読ませる。","why":"読せている不存在。","example":"学生に読ませている。","zh":"讓學生讀。"},{"text":"させている","meaning":"使役進行。","connection":"語幹＋させている，一段・するに使う。","why":"読させている不接在読後面。五段要使役是読ませている。主語也不該是小說。","example":"子供に本を読ませている。","zh":"讓小孩讀書。"},{"text":"っている","meaning":"ている的一部分，主動。","connection":"て形＋いる。読んで＋いる。","why":"読っている不成立。主動「正在讀」的主語應是人：人が読んでいる。","example":"弟がこの小説を読んでいる。","zh":"弟弟正在讀這本小說。"}],"level":"N3"},{"id":"n620","kind":"grammar","point":"なくても（たとえ）","group":"condition","difficulty":3,"stem":"たとえ結果（けっか）が出（で）＿＿、最後（さいご）までやる。","gloss":"即使出不了成果，也要做到最後。","answer":"なくても","options":[{"text":"なくても","meaning":"即使不做、即使不發生，後面仍成立。","connection":"ない形＋ても。出る→出＋なくても。たとえ和ても、なくても一起。","why":"沒有成果也繼續。出なくても。","example":"たとえ雨が降らなくても、行きます。","zh":"即使不下雨也去。"},{"text":"なければ","meaning":"如果不發生，後面才成立。條件。","connection":"ない形語幹＋なければ。出なければ。","why":"たとえ不和なければ一起。出なければ會變成「如果沒成果才做到最後」，和讓步相反。","example":"結果が出なければ、方法を変える。","zh":"如果沒有成果，就換方法。"},{"text":"ないので","meaning":"因為不發生。","connection":"ない形＋ので。出ないので。","why":"出ないので是因為沒有成果。たとえ表示讓步，不是原因。","example":"結果が出ないので、困っている。","zh":"因為沒有成果，很困擾。"},{"text":"ないなら","meaning":"如果是不發生的情況。","connection":"ない形＋なら。出ないなら。","why":"たとえ＋ないなら不是一組。なら是假設對方的情況，不是「即使也要做」。","example":"結果が出ないなら、やめよう。","zh":"如果沒有成果，就停吧。"}],"level":"N3"},{"id":"n621","kind":"grammar","point":"そうだ（様態・動詞）","group":"modal","difficulty":3,"stem":"このドアは壊（こわ）れていて、今にも落（お）ち＿＿。","gloss":"這扇門壞了，眼看就要掉下來。","answer":"そうだ","options":[{"text":"そうだ","meaning":"看起來即將發生。","connection":"ます語幹＋そうだ。落ちる→落ち＋そうだ。今にも和そうだ一起。","why":"眼看要掉。落ちそうだ。","example":"今にも雨が降りそうだ。","zh":"眼看就要下雨。"},{"text":"ようだ","meaning":"根據觀察的推測。","connection":"普通形＋ようだ。落ちるようだ。","why":"落ちようだ接不上。ようだ不接ます語幹。今にも的「即將」用そうだ。","example":"落ちるようだ。","zh":"好像會掉。這要辞書形。"},{"text":"らしい","meaning":"有根據的判斷，或典型。","connection":"普通形＋らしい。落ちるらしい。","why":"落ちらしい不成立。也沒有今にもらしい這個搭配。","example":"落ちるらしい。","zh":"似乎會掉。"},{"text":"だろう","meaning":"大概。","connection":"普通形＋だろう。落ちるだろう。","why":"落ちだろう接不上。今にも的視覺緊急感用そうだ，不用だろう。","example":"落ちるだろう。","zh":"大概會掉吧。"}],"level":"N3"},{"id":"n622","kind":"grammar","point":"たい（否定）","group":"advice","difficulty":2,"stem":"今日（きょう）は何（なに）も食（た）べ＿＿。","gloss":"今天什麼都不想吃。","answer":"たくない","options":[{"text":"たくない","meaning":"不想做。","connection":"ます語幹＋たくない。食べる→食べ＋たくない。","why":"說話人自己沒有食欲。食べたくない。","example":"どこへも行きたくない。","zh":"哪裡都不想去。"},{"text":"たいない","meaning":"沒有この形。","connection":"たい的否定不是たい＋ない。","why":"食べたいない不成立。否定要たくない。","example":"食べたくない。","zh":"不想吃。"},{"text":"たくではない","meaning":"沒有この形。","connection":"い形容詞的否定是くない，たい也用たくない。","why":"食べたくではない不成立。","example":"食べたくありません。","zh":"不想吃。丁寧形才用ありません。"},{"text":"るたくない","meaning":"辞書形不能再加たくない。","connection":"たくないはます語幹に付く。","why":"食べるたくない不接在食べ後面。空格前已經是語幹食べ。","example":"食べることはしたくない。","zh":"不想做「吃」這件事。這要另一個構造。"}],"level":"N5"},{"id":"n623","kind":"grammar","point":"ために（原因）","group":"cause","difficulty":4,"stem":"大雪（おおゆき）の＿＿、飛行機（ひこうき）が遅（おく）れた。","gloss":"因為大雪，飛機誤點了。","answer":"ために","options":[{"text":"ために","meaning":"因為這個名詞所表示的原因。書面也可以是中性的原因。","connection":"名詞＋の＋ために。大雪のために。","why":"大雪是誤點的原因。大雪のために。","example":"工事のために、道が狭い。","zh":"因為施工，路很窄。"},{"text":"ように","meaning":"為了達到狀態。","connection":"普通形＋ように。名詞には付かない。","why":"大雪のように是「像大雪一樣」，但空格前是の，のように才比較。大雪のように飛機が遅れた不是原因。","example":"雪が積もらないように、急いだ。","zh":"為了不讓雪堆積，趕緊做了。"},{"text":"ことに","meaning":"在某事上。或感到。","connection":"名詞＋のことに，用法が限られる。","why":"大雪のことに飛機が遅れた不成立。原因不用ことに。","example":"遅れたことに、驚いた。","zh":"對誤點感到吃驚。"},{"text":"かわりに","meaning":"代替。","connection":"名詞＋の＋かわりに。","why":"大雪のかわりに是代替大雪，不是因為大雪。","example":"雨のかわりに、雪が降った。","zh":"沒下雨，改下了雪。"}],"level":"N3"},{"id":"n624","kind":"grammar","point":"はずだ（な形容詞）","group":"modal","difficulty":4,"stem":"鍵（かぎ）をかけたのだから、大丈夫（だいじょうぶ）＿＿。","gloss":"鎖已經鎖上了，所以應該沒問題。","answer":"なはずだ","options":[{"text":"なはずだ","meaning":"按理應該。な形容詞要加な。","connection":"な形容詞語幹＋な＋はずだ。大丈夫なはずだ。","why":"鎖了門，所以按理安全。大丈夫なはずだ。","example":"静かなはずだ。もう夜中だ。","zh":"按理應該很安靜。已經半夜了。"},{"text":"はずだ","meaning":"動詞、い形容詞後面可以直接接。","connection":"普通形＋はずだ。","why":"大丈夫はずだ少了な。な形容詞不能裸接はずだ。","example":"鍵をかけたのだから、安全なはずだ。","zh":"鎖了，按理應該安全。"},{"text":"のはずだ","meaning":"名詞要用の。","connection":"名詞＋の＋はずだ。","why":"大丈夫はな形容詞，不是名詞＋の。大丈夫のはずだ不說。","example":"鍵はかかっているはずだ。","zh":"鎖按理是鎖上的。前面是動詞。"},{"text":"だはずだ","meaning":"不存在。","connection":"名詞なら「だ」を「な」や「の」に変える。","why":"大丈夫だはずだ不成立。","example":"大丈夫だろう。","zh":"大概沒問題。這是另一個推量。"}],"level":"N3"},{"id":"n625","kind":"grammar","point":"でさえ","group":"degree","difficulty":4,"stem":"こんな問題（もんだい）、子供（こども）＿＿解（と）ける。","gloss":"這種題目，連小孩都解得出。","answer":"でさえ","options":[{"text":"でさえ","meaning":"連極端的例子都如此，其他更不必說。","connection":"名詞＋でさえ。子供でさえ解ける。","why":"小孩是最不會解的那一端，連他們都會。子供でさえ。","example":"専門家でさえ、間違えた。","zh":"連專家都錯了。"},{"text":"にそって","meaning":"沿著。","connection":"名詞＋にそって。","why":"子供にそって解ける不表示「連小孩都」。","example":"川にそって歩く。","zh":"沿著河走。"},{"text":"をめぐって","meaning":"圍繞某個題目。","connection":"名詞＋をめぐって。","why":"子供をめぐって解ける不成立。圍繞的是問題，不是小孩這個極端例子。","example":"この問題をめぐって、議論した。","zh":"圍繞這個問題討論了。"},{"text":"をはじめ","meaning":"以……為首。","connection":"名詞＋をはじめ。後面還要列出其他。","why":"子供をはじめ解ける少了後面的人。はじめは列舉的起點，不是「甚至」。","example":"子供をはじめ、大人も参加した。","zh":"以小孩為首，大人也參加了。"}],"level":"N3"},{"id":"n630","kind":"grammar","point":"たがる","group":"advice","difficulty":2,"stem":"弟（おとうと）は新（あたら）しいゲームをやり＿＿。","gloss":"弟弟想玩新遊戲。說的是別人的欲望。","answer":"たがっている","options":[{"text":"たがっている","meaning":"第三者想做。從外面看得出來。","connection":"ます語幹＋たがる。やる→やり＋たがっている。","why":"主語是弟弟，不是說話人自己。やりたがっている。","example":"子供は外で遊びたがっている。","zh":"小孩想在外面玩。"},{"text":"たい","meaning":"說話人自己想做。","connection":"ます語幹＋たい。やりたい。","why":"やりたい是「我想玩」。弟弟的希望不用たい。","example":"私は新しいゲームをやりたい。","zh":"我想玩新遊戲。"},{"text":"てほしい","meaning":"希望別人做。","connection":"て形＋ほしい。やってほしい。","why":"やりてほしい少了て。而且這句是弟弟自己想玩，不是我希望弟弟玩。","example":"弟にゲームをやってほしい。","zh":"希望弟弟玩遊戲。"},{"text":"つもりだ","meaning":"打算。","connection":"辞書形＋つもり。やるつもりだ。","why":"やりつもりだ接不上。打算要用やるつもり，不是語幹。","example":"弟はゲームをやるつもりだ。","zh":"弟弟打算玩遊戲。"}],"level":"N4"},{"id":"n631","kind":"grammar","point":"なくなる","group":"change","difficulty":2,"stem":"夏（なつ）が終（お）わって、暑（あつ）＿＿。","gloss":"夏天結束，不熱了。","answer":"くなくなった","options":[{"text":"くなくなった","meaning":"い形容詞變成否定。變得不……。","connection":"い形容詞去い＋くなくなる。暑い→暑く＋なくなった。","why":"夏天結束，熱的狀態消失。暑くなくなった。","example":"薬を飲んで、痛くなくなった。","zh":"吃了藥，不痛了。"},{"text":"くなった","meaning":"變得更……。肯定的變化。","connection":"語幹＋くなる。暑くなった。","why":"暑くなった是變熱。和夏天結束相反。","example":"夏になって、暑くなった。","zh":"到了夏天，變熱了。"},{"text":"じゃなくなった","meaning":"な形容詞・名詞的否定變化。","connection":"語幹＋じゃなくなる。静かじゃなくなった。","why":"暑い是い形容詞，不能暑じゃなくなった。","example":"静かじゃなくなった。","zh":"變得不安靜了。"},{"text":"くした","meaning":"人為地弄成。","connection":"語幹＋くする。","why":"暑くした是人把東西弄熱。夏天結束不是人為，而且否定消失要用なくなる。","example":"部屋を暖かくした。","zh":"我把房間弄暖了。"}],"level":"N4"},{"id":"n632","kind":"grammar","point":"くする","group":"change","difficulty":2,"stem":"客（きゃく）が来（く）るので、部屋（へや）を暖＿＿。","gloss":"客人要來，所以我把房間弄暖了。","answer":"かくした","options":[{"text":"かくした","meaning":"人為地使い形容詞的狀態成立。","connection":"い形容詞去い＋くする。暖かい→暖かく＋した。空格前是暖。","why":"我為了客人把房間弄暖。部屋を暖かくした。をがあるので、する。","example":"文を短くした。","zh":"我把文章改短了。"},{"text":"くなった","meaning":"自己變成。","connection":"語幹＋くなる。暖かくなった。","why":"部屋を暖かくなったは「を」和他動詞的對象標記打架。なるの主語はが。這句有を，要用する。","example":"部屋が暖かくなった。","zh":"房間變暖了。這句沒有を。"},{"text":"かにした","meaning":"な形容詞的弄成。","connection":"語幹＋にする。静かにする。","why":"暖かい是い形容詞，不是暖かにする。","example":"部屋を静かにした。","zh":"我讓房間安靜下來。"},{"text":"かかった","meaning":"過去。只是狀態。","connection":"暖かかった。","why":"暖かかった只說房間以前暖和，沒有「我把它弄暖」。賓語的を也接不上。","example":"昨日は暖かかった。","zh":"昨天很暖和。"}],"level":"N4"},{"id":"n633","kind":"grammar","point":"命令形","group":"advice","difficulty":3,"stem":"逃（に）げるのが遅（おく）れる！今（いま）すぐ走＿＿！","gloss":"要來不及逃了！現在馬上跑！","answer":"れ","options":[{"text":"れ","meaning":"命令。五段動詞是え段。","connection":"走る→走れ。語幹走＋れ。","why":"要對方立刻跑。走れ。","example":"止まれ！","zh":"站住！"},{"text":"ろ","meaning":"一段動詞的命令。","connection":"見る→見ろ。五段はれ。","why":"走ろ不是走る的命令。五段要用え段：走れ。","example":"見ろ！","zh":"看！"},{"text":"なさい","meaning":"ます語幹＋なさい。","connection":"走り＋なさい。","why":"走なさい少了り。命令的丁寧形是走りなさい。","example":"走りなさい。","zh":"跑。長輩對晚輩也可以這樣說。"},{"text":"るな","meaning":"禁止。","connection":"辞書形＋な。走るな。","why":"走るな是「不准跑」。和「要來不及逃了，馬上跑」相反。","example":"走るな！","zh":"不准跑！"}],"level":"N4"},{"id":"n634","kind":"grammar","point":"続ける","group":"aspect","difficulty":3,"stem":"三時間（さんじかん）、本（ほん）を読（よ）み＿＿。","gloss":"書連續讀了三小時。","answer":"続けた","options":[{"text":"続けた","meaning":"不停地做下去。","connection":"ます語幹＋続ける。読む→読み＋続けた。","why":"三小時是持續的長度。読み続けた。","example":"二時間歩き続けた。","zh":"連續走了兩小時。"},{"text":"始めた","meaning":"開始。只說起點。","connection":"ます語幹＋始める。読み始めた。","why":"読み始めた沒有「連續三小時」的持續。","example":"さっき読み始めた。","zh":"剛才開始讀。"},{"text":"出した","meaning":"突然開始。","connection":"ます語幹＋出す。読み出した。","why":"読み出した是一下子開始讀，不表示維持了三小時。","example":"急に泣き出した。","zh":"突然哭起來。"},{"text":"かけた","meaning":"做到一半，還沒完。","connection":"ます語幹＋かける。読みかけた。","why":"三時間読みかけた不表示一直讀滿三小時。かけた是中斷前的開始。","example":"読みかけたまま寝た。","zh":"讀到一半就睡了。"}],"level":"N4"},{"id":"n635","kind":"grammar","point":"出す（突然）","group":"aspect","difficulty":4,"stem":"赤ちゃんが急（きゅう）に泣（な）き＿＿。","gloss":"嬰兒忽然哭起來。","answer":"出した","options":[{"text":"出した","meaning":"突然、自然地開始。不是有計劃的開始。","connection":"ます語幹＋出す。泣く→泣き＋出した。","why":"急に和出す一起。泣き出した。","example":"急に雨が降り出した。","zh":"雨忽然下起來。"},{"text":"続けた","meaning":"持續。","connection":"ます語幹＋続ける。泣き続けた。","why":"泣き続けた是一直哭。急に要的是開始的那一下，不是持續。","example":"一時間泣き続けた。","zh":"連續哭了一小時。"},{"text":"ぬいた","meaning":"做到底。","connection":"ます語幹＋ぬく。泣きぬいた。","why":"泣きぬいた是哭到底。和急に的突然開始不同。","example":"悩みぬいた。","zh":"煩惱到底。"},{"text":"かけた","meaning":"正要開始，還沒完全開始。","connection":"ます語幹＋かける。泣きかけた。","why":"泣きかけた是快哭了或哭到一半。急に泣き出した才是已經哭出來。","example":"泣きかけたが、我慢した。","zh":"快哭了，但忍住了。"}],"level":"N3"},{"id":"n636","kind":"grammar","point":"ばよかった","group":"advice","difficulty":3,"stem":"あのとき買（か）＿＿。今（いま）はもう売（う）っていない。","gloss":"那時候買就好了。現在已經不賣了。後悔。","answer":"えばよかった","options":[{"text":"えばよかった","meaning":"當時那樣做就好了。後悔。","connection":"仮定形＋ばよかった。買う→買え＋ばよかった。空格在買後面。","why":"沒買，現在買不到，所以後悔。買えばよかった。","example":"聞いておけばよかった。","zh":"當時問一下就好了。"},{"text":"うとよかった","meaning":"と不是後悔的接法。","connection":"辞書形＋と。買うと。","why":"買うとよかった不成立。後悔用仮定形＋ばよかった。","example":"買うと、ポイントが付く。","zh":"一買就有積分。這是恆常結果。"},{"text":"ってはよかった","meaning":"ては是條件或禁止的一部分。","connection":"て形＋は。買っては。","why":"買ってはよかった不是「當時買就好了」。買ってはいけない才是不准買。","example":"今買ってはいけない。","zh":"現在不准買。"},{"text":"るならよかった","meaning":"なら接辞書形，不接語幹買。","connection":"買うなら。","why":"買るならよかった不存在。","example":"買うなら、今日のうちに。","zh":"要買的話，就在今天。"}],"level":"N4"},{"id":"n637","kind":"grammar","point":"てくださる","group":"giving","difficulty":3,"stem":"先生（せんせい）が私たち（わたしたち）に丁寧（ていねい）に教（おし）えて＿＿。","gloss":"老師很丁寧地教了我們。上位者給的恩惠。","answer":"くださいました","options":[{"text":"くださいました","meaning":"上位者為我方做。主語用が。","connection":"が＋て形＋くださる。教えてくださいました。","why":"老師是上位，主語用が。教えてくださいました。","example":"部長が説明してくださいました。","zh":"部長給我們說明了。"},{"text":"いただきました","meaning":"我方接受恩惠。主語是接受的一方。","connection":"に＋て形＋いただく。先生に教えていただきました。","why":"先生が教えていただきました會變成老師接受了別人的教導。給惠的人用が時，要用くださる。","example":"先生に教えていただきました。","zh":"承老師教了。主語是我。"},{"text":"もらいました","meaning":"接受。同樣是接受方做主語，語氣中性。","connection":"に＋てもらう。","why":"先生が教えてもらいました方向反了。老師變成接受的人。","example":"友達に教えてもらいました。","zh":"請朋友教了。"},{"text":"しまいました","meaning":"做完，或覺得不該做。","connection":"て形＋しまう。","why":"教えてしまいました只是教完了，沒有「上位者給我們恩惠」的方向。","example":"秘密を教えてしまった。","zh":"不小心把秘密說了。"}],"level":"N4"},{"id":"n638","kind":"grammar","point":"他動詞（を＋閉める）","group":"voice","difficulty":3,"stem":"風（かぜ）が入（はい）らないように、窓（まど）を閉＿＿。","gloss":"為了不讓風進來，我把窗關上了。","answer":"めた","options":[{"text":"めた","meaning":"他動詞。人把窗關上。","connection":"閉める→閉めた。賓語用を。","why":"有を，是人關閉窗子。閉めた。","example":"ドアを閉めてください。","zh":"請把門關上。"},{"text":"まった","meaning":"自動詞閉まる的過去。","connection":"閉まる→閉まった。主語用が。","why":"窓を閉まったはを和自動詞不合。窗自己關上是窓が閉まった。","example":"窓が閉まった。","zh":"窗關上了。"},{"text":"いた","meaning":"開く的過去是開いた，閉不是這個形。","connection":"閉じるなら閉じた。","why":"閉いた不存在。","example":"店が開いた。","zh":"店開了。"},{"text":"られた","meaning":"受身。","connection":"閉められる。","why":"閉られた不自然。風を防ぐ是自己去關，不是被關。","example":"窓が風で閉められた。","zh":"窗被風弄關上了。這才是受身。"}],"level":"N4"},{"id":"n639","kind":"grammar","point":"だろう","group":"modal","difficulty":2,"stem":"空（そら）が暗（くら）い。雨（あめ）が降（ふ）る＿＿。","gloss":"天很暗。大概會下雨吧。說話人的推測。","answer":"だろう","options":[{"text":"だろう","meaning":"大概。說話人的推量。","connection":"普通形＋だろう。降るだろう。","why":"看天色自己判斷。降るだろう。","example":"明日は晴れだろう。","zh":"明天大概會晴。"},{"text":"そうだ","meaning":"この形だと伝聞。","connection":"普通形＋そうだは「據說」。樣態なら降りそうだ。","why":"降るそうだ是聽說會下雨，但沒有消息來源。樣態要接語幹：降りそうだ，不接辞書形降る。","example":"ニュースによると、雨が降るそうだ。","zh":"據新聞說會下雨。"},{"text":"つもりだ","meaning":"打算。","connection":"辞書形＋つもり。","why":"雨が降るつもりだ會變成雨打算下。荒謬。","example":"傘を持っていくつもりだ。","zh":"打算帶傘。"},{"text":"ことだ","meaning":"建議，或吃惊。","connection":"辞書形＋ことだは「最好」。","why":"雨が降ることだ不是推測，也不像建議。","example":"疲れたら、休むことだ。","zh":"累了的話最好休息。"}],"level":"N4"},{"id":"n640","kind":"grammar","point":"何か","group":"degree","difficulty":2,"stem":"喉（のど）が渇（かわ）いた。＿＿飲（の）みたい。","gloss":"口渴了。想喝點東西。","answer":"何か","options":[{"text":"何か","meaning":"某樣不确定的東西。","connection":"疑問詞＋か。何か飲む。","why":"還沒決定喝什麼，只是想喝一點。何か飲みたい。","example":"何か質問がありますか。","zh":"有什麼問題嗎？"},{"text":"何も","meaning":"什麼都。後面要否定。","connection":"何も＋ない。","why":"何も飲みたい少了否定。什麼都不想喝是何も飲みたくない。","example":"何も飲みたくない。","zh":"什麼都不想喝。"},{"text":"何が","meaning":"問哪一個。","connection":"何が＋述語。","why":"何が飲みたい是「想喝的是什麼」，像在追問項目，不是「隨便喝點」。","example":"何が飲みたいですか。","zh":"你想喝什麼？"},{"text":"どれか","meaning":"在已經擺出來的選項裡的某一個。","connection":"どれか。","why":"面前沒有幾杯飲料可選。沒有範圍時用何か。","example":"この三つのうち、どれかにします。","zh":"這三個裡我選一個。"}],"level":"N4"},{"id":"n641","kind":"grammar","point":"尊敬（れる）","group":"voice","difficulty":4,"stem":"先生（せんせい）はもうこの本（ほん）を読＿＿。","gloss":"老師已經讀過這本書了。尊敬語。","answer":"まれました","options":[{"text":"まれました","meaning":"尊敬。抬高動作的人。","connection":"五段：読む→読まれる。あ段＋れます。先生は本を読まれました。","why":"主語是老師，賓語仍用を。これは受身ではなく尊敬。読まれました。","example":"社長が説明されました。","zh":"社長做了說明。尊敬。"},{"text":"ませました","meaning":"使役。叫別人做。","connection":"読む→読ませる。","why":"読ませました是老師叫別人讀。句子沒有被使役的人，也不是尊敬老師自己讀。","example":"学生に本を読ませました。","zh":"讓學生讀了書。"},{"text":"ませんでした","meaning":"否定。","connection":"読みませんでした。","why":"読ませんでした少了み。而且もう和「沒讀」相反。","example":"先生はまだ読みませんでした。","zh":"老師還沒讀。這句不用尊敬也可以，但是否定。"},{"text":"まれません","meaning":"尊敬的否定。","connection":"読まれません。","why":"読まれません是老師不讀。和もう「已經」相反。時制も現在否定で、過去の完了ではない。","example":"先生はその本を読まれません。","zh":"老師不讀那本書。"}],"level":"N3"},{"id":"n642","kind":"grammar","point":"ほかない","group":"modal","difficulty":4,"stem":"終電（しゅうでん）もない。歩（ある）く＿＿だろう。","gloss":"連末班車都沒有。大概只好走了。","answer":"ほかない","options":[{"text":"ほかない","meaning":"除此之外沒有別的辦法。","connection":"辞書形＋ほかない。歩くほかない。","why":"沒有車，只能走。歩くほかないだろう。","example":"謝るほかない。","zh":"只好道歉。"},{"text":"わけがない","meaning":"不可能。","connection":"辞書形＋わけがない。","why":"歩くわけがない是不可能走。和只好走相反。","example":"彼が歩くわけがない。","zh":"他不可能走路。"},{"text":"ことはない","meaning":"不必。","connectio
